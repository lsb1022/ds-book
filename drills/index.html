<meta charset="utf-8">
<title>빈칸 연습 모음</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap">
<style>
@font-face{font-family:'Pretendard Variable';font-weight:45 920;font-style:normal;font-display:swap;src:url(pretendard.woff2) format('woff2-variations'),url(pretendard.woff2) format('woff2')}
/* Layout: practice index — sticky top bar with language + filter controls, chapter groups of collapsible problem cards; each card lazily mounts the same drill widget the textbook uses. */
:root{
  --bg:#ffffff; --bg-muted:#f7f8f9; --bg-weak:#f3f4f5; --divider:#f3f4f5;
  --line:#eeeff1; --line-strong:#dcdee3;
  --fg:#1a1c20; --fg-muted:#555d6d; --fg-subtle:#868b94;
  --brand:#ff6600; --brand-fg:#e14d00; --brand-weak:#fff2ec; --brand-line:#ffd5c0;
  --pos:#079171; --pos-weak:#edfaf6;
  --crit:#fa342c; --crit-fg:#d92b24; --crit-weak:#fdf0f0;
  --purple:#7c3aed; --purple-weak:#f4effe;
  --info-fg:#135fcd; --info-weak:#eff6ff;
  --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"D2Coding",monospace;
  --r-s:8px; --r-m:12px; --r-l:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16171b; --bg-muted:#1d2025; --bg-weak:#2b2e35; --divider:#000000;
  --line:#2b2e35; --line-strong:#393d46;
  --fg:#f3f4f5; --fg-muted:#dcdee3; --fg-subtle:#b0b3ba;
  --brand:#ff6600; --brand-fg:#ff9e65; --brand-weak:#31241f; --brand-line:#6b311c;
  --pos:#22b27f; --pos-weak:#202926;
  --crit:#ff6e60; --crit-fg:#ff8a7e; --crit-weak:#322323;
  --purple:#b89cff; --purple-weak:#2a2340;
  --info-fg:#83bcf9; --info-weak:#202742;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16171b; --bg-muted:#1d2025; --bg-weak:#2b2e35; --divider:#000000;
  --line:#2b2e35; --line-strong:#393d46;
  --fg:#f3f4f5; --fg-muted:#dcdee3; --fg-subtle:#b0b3ba;
  --brand:#ff6600; --brand-fg:#ff9e65; --brand-weak:#31241f; --brand-line:#6b311c;
  --pos:#22b27f; --pos-weak:#202926;
  --crit:#ff6e60; --crit-fg:#ff8a7e; --crit-weak:#322323;
  --purple:#b89cff; --purple-weak:#2a2340;
  --info-fg:#83bcf9; --info-weak:#202742;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.7;letter-spacing:-0.01em;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
button,input{font:inherit;color:inherit;letter-spacing:inherit}
a{color:inherit}
.wrap{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;height:60px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;min-width:0}
.brand .mk{flex:none;width:28px;height:28px;border-radius:8px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:15px}
.brand .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp{flex:1}
.langs{flex:none;display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:var(--bg-weak)}
.langs button{font-family:var(--mono);font-size:12.5px;font-weight:700;padding:5px 10px;border:0;border-radius:999px;background:transparent;color:var(--fg-subtle);cursor:pointer;text-decoration:line-through;text-decoration-thickness:1.5px}
.langs button.on{background:var(--bg);color:var(--fg);text-decoration:none;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.langs button.on[data-lang="cpp"]{color:var(--brand-fg)}
.ext{flex:none;font-size:14px;font-weight:600;color:var(--fg-muted);text-decoration:none;padding:6px 8px;border-radius:8px;white-space:nowrap}
.ext:hover{background:var(--bg-weak);color:var(--fg)}
/* hero */
.sheet{background:var(--bg)}
.hero .wrap{padding-top:34px;padding-bottom:26px}
.eyebrow{font-size:13px;font-weight:700;color:var(--brand-fg)}
h1{font-size:clamp(26px,4.4vw,34px);line-height:1.25;margin:6px 0 8px;letter-spacing:-0.02em;text-wrap:balance}
.lead{margin:0;color:var(--fg-muted);max-width:64ch}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:18px;max-width:560px}
.stat{display:flex;flex-direction:column;min-width:0;padding:12px 14px;border-radius:var(--r-m);background:var(--bg-muted)}
.stat b{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:12.5px;color:var(--fg-subtle)}
.stat.brand{background:var(--brand-weak)} .stat.brand b{color:var(--brand-fg)}
.prog{display:flex;align-items:center;gap:12px;margin-top:14px;max-width:520px;font-size:14px;color:var(--fg-muted)}
.prog b{color:var(--fg);font-variant-numeric:tabular-nums}
.pn{flex:none}
.lnk{flex:none;border:0;background:none;padding:0;font:inherit;font-size:13px;color:var(--fg-subtle);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.bar{flex:1;height:6px;border-radius:99px;background:var(--bg-weak);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--pos);border-radius:99px;transition:width .3s}
.hero-act{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.btn{border:0;border-radius:10px;padding:9px 14px;font-size:14.5px;font-weight:700;cursor:pointer;background:var(--bg-weak);color:var(--fg)}
.btn.pri{background:var(--brand);color:#fff}
.btn:hover{filter:brightness(.97)}
/* filters */
.filters .wrap{padding-top:14px;padding-bottom:14px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.frow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search{flex:1 1 240px;display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:10px;background:var(--bg-weak)}
.search svg{width:18px;height:18px;flex:none;color:var(--fg-subtle)}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:15px}
.tog{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line-strong);background:var(--bg);font-size:14px;font-weight:600;cursor:pointer;color:var(--fg-muted);white-space:nowrap}
.tog[aria-pressed="true"]{border-color:var(--fg);color:var(--fg);background:var(--bg-weak)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line-strong);background:var(--bg);border-radius:999px;padding:5px 12px;font-size:13.5px;font-weight:600;color:var(--fg-muted);cursor:pointer;white-space:nowrap}
.chip .c{font-variant-numeric:tabular-nums;color:var(--fg-subtle);font-weight:500;margin-left:4px}
.chip.on{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.chip.on .c{color:inherit;opacity:.7}
/* groups */
main{padding-bottom:64px}
.grp .wrap{padding-top:26px;padding-bottom:22px}
.gh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.gh h2{margin:0;font-size:20px;letter-spacing:-0.02em}
.gh .meta{font-size:13px;color:var(--fg-subtle);font-variant-numeric:tabular-nums}
.badge{font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:6px;white-space:nowrap}
.badge.alg{background:var(--purple-weak);color:var(--purple)}
.badge.exam{background:var(--brand-weak);color:var(--brand-fg)}
.xt{flex:none;font-size:11px;font-weight:700;color:var(--brand-fg);background:var(--brand-weak);padding:1px 7px;border-radius:999px;margin-left:6px;vertical-align:2px}
.list{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
details.pc{border:1px solid var(--line);border-radius:var(--r-m);background:var(--bg)}
details.pc[open]{border-color:var(--line-strong);box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06)}
details.pc>summary{list-style:none;cursor:pointer;display:flex;align-items:flex-start;gap:12px;padding:13px 14px;border-radius:var(--r-m)}
details.pc>summary::-webkit-details-marker{display:none}
details.pc>summary:hover{background:var(--bg-muted)}
.lt{flex:none;font-family:var(--mono);font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:6px;margin-top:2px;background:var(--bg-weak);color:var(--fg-muted)}
.lt.cpp{background:var(--brand-weak);color:var(--brand-fg)}
.pm{flex:1;min-width:0}
.pt{font-weight:700;font-size:15.5px;line-height:1.45}
.pp{font-size:12.5px;color:var(--fg-subtle);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pf{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:6px;font-size:12.5px;color:var(--fg-muted)}
.pf code{font-family:var(--mono);font-size:12px;background:var(--bg-weak);border-radius:5px;padding:0 5px}
.okm{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:800;background:var(--bg-weak);color:transparent;margin-top:1px}
details.pc.done .okm{background:var(--pos);color:#fff}
.pb{padding:0 14px 14px;border-top:1px solid var(--line)}
.pb-top{display:flex;justify-content:flex-end;gap:10px;padding-top:10px;font-size:13px}
.pb-top a{color:var(--fg-muted);text-decoration:none;font-weight:600}
.pb-top a:hover{color:var(--brand-fg)}
.pb-top button{border:0;background:none;color:var(--fg-muted);font-weight:600;cursor:pointer;padding:0;font-size:13px}
.pb-top button:hover{color:var(--fg)}
.pb figure.code{display:none}
.pb details.drill{border:0;margin:0;background:transparent}
.pb details.drill>summary{display:none}
.pb details.drill .dr-body{border:0;padding:0}
.empty{padding:48px 0;text-align:center;color:var(--fg-subtle)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);font-size:14px;font-weight:600;padding:10px 16px;border-radius:999px;transition:.2s;z-index:50}
.toast.on{opacity:1;transform:translateX(-50%)}
@media (max-width:640px){
  .top .wrap{gap:8px;height:56px}
  .brand .t{font-size:16px}
  .ext{display:none}
  .stats{gap:6px}.stat{padding:10px}.stat b{font-size:18px}.stat span{font-size:11.5px}
  details.pc>summary{padding:12px}
  .pb{padding:0 10px 12px}
}

/* ---- fill-in-the-blank drill ---- */
details.drill{margin-top:10px;border:1px solid var(--line);border-radius:var(--r-m);background:var(--bg)}
details.drill>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:11px 14px;font-size:14.5px;border-radius:var(--r-m)}
details.drill>summary::-webkit-details-marker{display:none}
details.drill>summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid var(--fg-subtle);border-bottom:2px solid var(--fg-subtle);transform:rotate(45deg);transition:transform .15s}
details.drill[open]>summary::after{transform:rotate(-135deg)}
details.drill>summary:hover{background:var(--bg-muted)}
details.drill>summary b{color:var(--brand-fg)}
.dr-sub{color:var(--fg-muted);font-size:13px}
.dr-body{padding:4px 14px 16px;border-top:1px solid var(--line)}
.dr-tabs{display:flex;gap:6px;margin:12px 0 4px}
.dr-tabs button{font:inherit;font-size:13.5px;font-weight:700;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--fg-muted);cursor:pointer}
.dr-tabs button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.dr-tip{font-size:13.5px;color:var(--fg-muted);margin:10px 0 0}
.dr-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0}
.dbtn{font:inherit;font-size:13.5px;font-weight:700;padding:7px 13px;border-radius:10px;border:0;background:var(--bg-weak);color:var(--fg);cursor:pointer}
.dbtn:hover{filter:brightness(.97)}
.dbtn.pri{background:var(--brand);color:#fff}
.dr-score{font-weight:700;font-size:14px;color:var(--fg)}
.dr-sel{font-size:13.5px;color:var(--fg-muted);display:flex;align-items:center;gap:6px}
.dr-sel select{font:inherit;font-size:13.5px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
pre.dr-code{margin:0;padding:12px 14px;background:var(--bg-muted);border:1px solid var(--line);border-radius:10px;overflow-x:auto;font-family:var(--mono);font-size:13px;line-height:1.75;tab-size:4}
pre.dr-code.ctx{color:var(--fg-muted)}
pre.dr-code.ctx:empty{display:none}
.dl{white-space:pre;min-height:1.75em}
.dl.hit{background:var(--brand-weak);margin:0 -14px;padding:0 14px}
.bx{position:relative;display:inline-flex;align-items:center;gap:4px;vertical-align:baseline}
.bn{font-size:10.5px;font-weight:800;color:#fff;background:var(--brand);border-radius:6px;padding:0 5px;line-height:1.6;font-family:var(--font)}
.bi{font:inherit;font-family:var(--mono);font-size:13px;min-width:6ch;max-width:62ch;padding:1px 6px;border:0;border-bottom:2px solid var(--brand);border-radius:4px 4px 0 0;background:var(--bg);color:var(--fg);outline:none}
.bi:focus{box-shadow:0 0 0 2px var(--brand-line)}
.bx.ok .bi{border-color:var(--pos);background:var(--pos-weak)}
.bx.no .bi{border-color:var(--crit);background:var(--crit-weak)}
.bx.shown .bi{border-color:var(--fg-subtle);color:var(--fg-muted)}
.ans{font:inherit;font-family:var(--font);font-size:11.5px;font-weight:700;border:0;background:var(--crit-weak);color:var(--crit-fg);border-radius:6px;padding:1px 6px;cursor:pointer}
.ans-t{font-size:12.5px;color:var(--pos);font-weight:700;white-space:pre}
.dr-ta{display:block;width:100%;font-family:var(--mono);font-size:13px;line-height:1.75;padding:10px 14px;border:2px dashed var(--brand);border-radius:10px;margin:6px 0;background:var(--bg);color:var(--fg);resize:vertical;tab-size:4;white-space:pre;overflow-x:auto}
.dr-ta:focus{outline:none;border-style:solid}
.dr-cmp{margin:10px 0}
.dr-cmp-h{display:flex;justify-content:flex-start;flex-wrap:wrap;gap:4px 14px;max-width:100%;font-size:13px;font-weight:700;color:var(--fg-muted);margin-bottom:6px}
.dr-cmp-h .lg{display:inline-flex;flex:none;align-items:center;gap:6px;font-weight:500;white-space:nowrap}
.dr-cmp-h .sw{display:inline-block;width:10px;height:10px;border-radius:3px;flex:none}
.dr-cmp-h .sw.g{background:var(--pos)}.dr-cmp-h .sw.r{background:var(--crit);margin-left:6px}
.dl.m-ok{background:var(--pos-weak);margin:0 -14px;padding:0 14px}
.dl.m-no{background:var(--crit-weak);margin:0 -14px;padding:0 14px}
@media (max-width:600px){details.drill>summary{padding:10px 12px}.dr-body{padding:4px 10px 14px}pre.dr-code{font-size:12px}.bi{font-size:12px}}

.dr-tabs{flex-wrap:wrap}
.dr-m{margin:8px 0;padding:10px 12px;border:1px solid var(--brand-line);border-radius:12px;background:var(--brand-weak)}
.dr-m.ok{border-color:var(--pos);background:var(--pos-weak)}
.dr-m.no{border-color:var(--crit);background:var(--crit-weak)}
.dr-m-h{font-size:13px;color:var(--fg-muted);margin-bottom:2px}
.dr-m-h b{font-family:var(--mono);color:var(--fg)}
.dr-m-s{font-weight:700;color:var(--fg)}
.dr-m .dr-ta{margin:4px 0 0;background:var(--bg)}
.dr-m .dr-cmp{margin:8px 0 0}
.dr-all>pre.dr-code.ctx{margin:8px 0}
.dr-score2{font-weight:700;font-size:14px}

details.pc{scroll-margin-top:72px}
</style>

<script>
/* Drill: exam-style fill-in-the-blank practice under every implementation code block */
const Drill = (() => {
  const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const KEY = /\.(next|prev|left|right|head|tail|front|rear|top|data|parent|count|size|_size)\b|\b(head|tail|front|rear|top|visited|stack|queue|pq|heap|parent|rank|dist|distances|count|mid|low|high|left|right|pivot|min_idx|key|current|prev|succ|root|index|dp|memo|result|total)\b|%|\/\/|\* ?2|\+ ?1|- ?1|heappush|heappop|popleft|append|pop\(|\[i\]|\[j\]|\[mid\]|swap|return/;
  const SKIP_FN = /^(print|display|show|__str__|__repr__|main|print_\w*|test\w*)$/;

  function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  const indent = l => l.match(/^\s*/)[0].replace(/\t/g, '    ').length;

  /* ---------- function ranges ---------- */
  function pyFuncs(lines) {
    const out = [];
    lines.forEach((l, i) => {
      const m = l.match(/^(\s*)def\s+(\w+)\s*\(/); if (!m) return;
      const ind = m[1].length; let j = i + 1;
      // header may span lines until ':' at end
      while (j < lines.length && !/:\s*(#.*)?$/.test(lines[j - 1])) j++;
      const bodyStart = j; let end = bodyStart;
      for (let k = bodyStart; k < lines.length; k++) {
        if (!lines[k].trim()) continue;
        if (indent(lines[k]) <= ind) break;
        end = k + 1;
      }
      if (end > bodyStart) out.push({ name: m[2], head: i, start: bodyStart, end, ind });
    });
    return out;
  }
  function cppFuncs(lines) {
    const out = [];
    const re = /^\s*(?:template\s*<[^>]*>\s*)?(?:[\w:<>,\*&~]+\s+)*?([~\w]+(?:::[~\w]+)?)\s*\(([^;]*)\)\s*(?:const)?\s*(?:override)?\s*(?::[^{]*)?\{\s*(\/\/.*)?$/;
    lines.forEach((l, i) => {
      if (/^\s*(if|else|while|for|switch|do|catch|return)\b/.test(l)) return;
      const m = l.match(re); if (!m) return;
      let depth = 0, end = -1;
      for (let k = i; k < lines.length; k++) {
        const s = lines[k].replace(/\/\/.*$/, '').replace(/"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'/g, '');
        for (const ch of s) { if (ch === '{') depth++; else if (ch === '}') { depth--; if (depth === 0) { end = k; break; } } }

      if (end > i + 1) out.push({ name: m[1].split('::').pop(), head: i, start: i + 1, end, ind: indent(l) });

    return out;
  }

  /* ---------- blank target for a line ---------- */
  function splitAssign(s) {
    let d = 0, q = null;
    for (let i = 0; i < s.length; i++) {
      const c = s[i];
      if (q) { if (c === q && s[i - 1] !== '\\') q = null; continue; }
      if (c === '"' || c === "'") { q = c; continue; }
      if ('([{'.includes(c)) d++; else if (')]}'.includes(c)) d--;
      else if (c === '=' && d === 0) {

        if (n === '=' || p === '=' || p === '!' || p === '<' || p === '>') continue;
        const opStart = /[+\-*\/%&|^]/.test(p) ? i - 1 : i;
        return [s.slice(0, opStart), s.slice(opStart, i + 1), s.slice(i + 1)];
      }
    }

  }
  const TRIVIAL = /^\s*(None|True|False|nullptr|NULL|0|1|-1|\[\]|\{\}|""|''|0\.0)\s*$/;

  function targetPy(line) {
    const ind = line.match(/^\s*/)[0]; const body = line.slice(ind.length).replace(/\s+#.*$/, '');
    let m;
    if ((m = body.match(/^(if|elif|while)\s+(.+):\s*$/))) return { pre: ind + m[1] + ' ', ans: m[2], post: ':' };
    if ((m = body.match(/^for\s+(.+)\s+in\s+(.+):\s*$/))) return { pre: ind + 'for ' + m[1] + ' in ', ans: m[2], post: ':' };
    if ((m = body.match(/^return\s+(.+)$/))) return { pre: ind + 'return ', ans: m[1], post: '' };
    if (/^(else|try|finally|pass|break|continue|return|yield|except.*|import .*|from .*|raise .*|global .*|nonlocal .*|del .*|assert .*)\s*:?\s*$/.test(body)) return null;
    if (/^print\(|^"""|^'''|^@/.test(body)) return null;
    const a = splitAssign(body);
    if (a) {
      const [lhs, op, rhs] = a;
      if (TRIVIAL.test(rhs) && op.trim() === '=') return { pre: ind, ans: lhs.trim(), post: ' = ' + rhs.trim() };
      return { pre: ind + lhs.trimEnd() + ' ' + op + ' ', ans: rhs.trim(), post: '' };
    }
    if (/^[\w.\[\]]+\(.*\)$/.test(body) || /^[\w.]+\s*$/.test(body)) return { pre: ind, ans: body, post: '' };

  }
  function targetCpp(line) {
    const ind = line.match(/^\s*/)[0]; let body = line.slice(ind.length).replace(/\s*\/\/.*$/, '');

    if ((m = body.match(/^for\s*\((.*)\)\s*(\{?)\s*$/))) return { pre: ind + 'for (', ans: m[1], post: ')' + (m[2] ? ' {' : '') };
    if ((m = body.match(/^return\s+(.+);$/))) return { pre: ind + 'return ', ans: m[1], post: ';' };
    if (!body.endsWith(';')) return null;
    body = body.slice(0, -1);
    if (/^(break|continue|return)$/.test(body)) return null;
    const a = splitAssign(body);
    if (a) {
      const [lhs, op, rhs] = a;
      if (TRIVIAL.test(rhs) && op.trim() === '=') return { pre: ind, ans: lhs.trim(), post: ' = ' + rhs.trim() + ';' };
      return { pre: ind + lhs.trimEnd() + ' ' + op + ' ', ans: rhs.trim(), post: ';' };

  /* ---------- analyse a code block once ---------- */
  function analyse(code, lang) {
    const lines = code.replace(/\s+$/, '').split('\n');
    const py = lang === 'py';

    const onlyMain = !py && funcs.length > 0 && funcs.every(f => SKIP_FN.test(f.name)) && funcs.some(f => f.name === 'main');

    lines.forEach((l, i) => {

        if (inDoc) { if (tq % 2 === 1) inDoc = false; return; }
        if (tq % 2 === 1) { inDoc = true; return; }
        if (tq) return;
      }
      const f = inFn[i]; if (!f || skip(f.name)) return;
      if (!t || t.startsWith('#') || t.startsWith('//')) return;
      const tg = py ? targetPy(l) : targetCpp(l);
      if (!tg) return;
      tg.ans = (tg.ans || '').trim();
      if (!tg.ans || tg.ans.length > 90) return;
      let w = 1;
      if (KEY.test(l)) w += 2;
      if (/%|\/\/|\*\s*2|[+-]\s*1\b/.test(tg.ans)) w += 1;
      if (new RegExp('\\b' + f.name + '\\s*\\(').test(tg.ans)) w += 2; // recursive call
      if (f.name === '__init__' || /^[A-Z]\w*$/.test(f.name)) w *= 0.5;

  }

  function pick(cands, seed) {
    const r = rng(seed);
    const n = Math.max(2, Math.min(8, Math.round(cands.length * 0.35)));
    const pool = cands.map(c => ({ c, k: Math.pow(r(), 1 / c.w) }));
    pool.sort((a, b) => b.k - a.k);

  const norm = s => s.replace(/\s+/g, '').replace(/'/g, '"').replace(/;$/, '').replace(/:$/, '');
  const stripCmt = (s, py) => s.replace(py ? /\s*#.*$/ : /\s*\/\/.*$/, '');

  /* ---------- UI ---------- */
  function mount(fig) {

    function splitBody(f) {

      let keep = 0;
      if (py) { const t0 = (answer[0] || '').trim(); if (/^("""|''')/.test(t0)) { keep = 1; if (!(t0.length > 3 && /("""|''')$/.test(t0.slice(3)))) { while (keep < answer.length && !/("""|''')/.test(answer[keep])) keep++; keep++; } } }

    function setupTA(ta, ind) {

        else if (e.key === 'Enter') { const s = ta.selectionStart; const lineStart = ta.value.lastIndexOf('\n', s - 1) + 1; const cur = ta.value.slice(lineStart, s); let pad = cur.match(/^\s*/)[0]; if (py && /:\s*$/.test(cur)) pad += '    '; if (!py && /\{\s*$/.test(cur)) pad += '    '; if (!ta.value.trim()) pad = ind; e.preventDefault(); ta.setRangeText('\n' + pad, s, ta.selectionEnd, 'end'); }

      for (let a = W.length - 1; a >= 0; a--) for (let b = G.length - 1; b >= 0; b--) dp[a][b] = W[a] === G[b] ? dp[a + 1][b + 1] + 1 : Math.max(dp[a + 1][b], dp[a][b + 1]);

        <div class="dr-cmp" hidden></div>
        <pre class="dr-code ctx">${after.map(l => `<div class="dl">${esc(l) || ' '}</div>`).join('')}</pre>`;

      ta.addEventListener('keydown', e => {

        const act = (e.target.closest('[data-act]') || {}).dataset?.act; if (!act) return;

        if (act === 'reset') { ta.value = ''; cmp.hidden = true; pane.querySelector('.dr-score').textContent = ''; return; }

  }

  function mountAll(root) {
    (root || document).querySelectorAll('figure.code').forEach(f => { try { mount(f); } catch (e) { /* skip block */ } });

exError(\"Stack.top(): stack is empty\")\n        return self.elements[-1]\n\n    def empty(self):                # 스택이 비었는지 확인\n        return len(self.elements) == 0\n\ns = Stack()\ns.push(1)\nprint(s.top())", "nb": 7, "fns": ["__init__", "push", "pop", "top", "empty"], "lines": 23, "extra": 1}, {"ci": 2, "ch": "1. 프로그래밍 기초와 소프트웨어 공학", "kind": "ds", "sid": "p3b8713e35a7d8031ae9fdd6e88c50525", "path": ["[참고] 언어별 특징(보강 중)", "C++", "template"], "lang": "cpp", "code": "#include <iostream>\n#include \"Stack.hpp\" // 템플릿 정의가 포함된 헤더 파일 인클루드\n\nint main() {\n    // 컴파일러가 Stack<int> 코드를 생성 (인스턴스화)\n    Stack<int> int_stack;\n    int_stack.push(10);\n    int_stack.push(20);\n    std::cout << \"Int Stack Top: \" << int_stack.top() << std::endl; // 출력: 20\n\n    // 컴파일러가 Stack<double> 코드를 생성 (인스턴스화)\n    Stack<double> double_stack;\n    double_stack.push(3.14);\n    double_stack.push(5.55);\n    std::cout << \"Double Stack Top: \" << double_stack.top() << std::endl; // 출력: 5.55\n\n    return 0;\n}", "nb": 5, "fns": ["main"], "lines": 18}, {"ci": 2, "ch": "1. 프로그래밍 기초와 소프트웨어 공학", "kind": "ds", "sid": "p3b8713e35a7d8031ae9fdd6e88c50525", "path": ["[참고] 언어별 특징(보강 중)", "C++", "template"], "lang": "py", "code": "class Stack:\n    def __init__(self):\n        self.elements = []\n    def push(self, element):\n        self.elements.append(element)\n    def top(self):\n        return self.elements[-1]\n\nint_stack = Stack()            # Python은 Stack[int]처럼 타입을 지정하지 않아도 된다\nint_stack.push(10)\nint_stack.push(20)\nprint(\"Int Stack Top:\", int_stack.top())        # 출력: 20\n\ndouble_stack = Stack()\ndouble_stack.push(3.14)\ndouble_stack.push(5.55)\nprint(\"Double Stack Top:\", double_stack.top())  # 출력: 5.55", "nb": 3, "fns": ["__init__", "push", "top"], "lines": 17, "extra": 1}, {"ci": 3, "ch": "2. 자료 구조와 알고리즘의 본질 - 효율적인 문제 해결", "kind": "ds", "sid": "p04c7ad2e2ec448868d24c68e773d8b04", "path": ["2.6. 알고리즘 표현의 예제"], "lang": "cpp", "code": "#include <iostream>\nusing namespace std;\n\nin 25b0b5a18e49ca", "path": ["3.1. 돗수 분포표 만들기", "방법 #3: nested for 문 사용"], "lang": "cpp", "code": "#include <iostream>\n#include <vector>\n#include <random>\nusing namespace std;\n\nint main() {\n    mt19937 rng(random_device{}());\n    uniform_int_distribution<int> dist(0, 99);\n    vector<int> samples(100);\n    vector<int> graph(10, 0);\n\n    for (int i = 0; i < 100; i++) {\n        samples[i] = dist(rng);\n        // 규칙성이 있는 10개의 if 문을 반복문으로 대체\n        for (int j = 0; j < 10; j++) {\n            if (j * 10 <= samples[i] && samples[i] < (j + 1) * 10) {\n                graph[j]++;\n                break;\n            }\n        }\n    }\n\n    for (int value : graph) cout << value << ' ';\n    cout << \"\\n\";\n    return 0;\n}", "nb": 6, "fns": ["main"], "lines": 26, "extra": 1}, {"ci": 4, "ch": "3. 알고리즘의 성능 분석", "kind": "ds", "sid": "p3170ab8361914e67b988ab07dacaaad6", "path": ["3.4. [참고] amortized analysis", "[예제] 동적 배열의 amortized analysis"], "lang": "cpp", "code": "#include <iostream>\n#include <vector>\n#include <chrono>\nusing namespace std;\n\n// vector::push_back의 분할 상환(amortized) 분석:\n// 대부분은 O(1)이지만 용량(capacity)이 꽉 찰 때만 재할당 + 복사가 일어난다.\nint main() {\n    vector<int> test_list;\n    size_t last_cap = test_list.capacity();\n    for (int i = 0; i < 100000; i++) {\n        auto start = chrono::steady_clock::now();\n        test_list.push_back(i);\n        auto end = chrono::steady_clock::now();\n        if (test_list.capacity() != last_cap) {      // 재할당이 일어난 순간만 출력\n            long long ns = chrono::duration_cast<chrono::nanoseconds>(end - start).count();\n            cout << \"size \" << test_list.size() << \": capacity \" << last_cap\n                 << \" -> \" << test_list.capacity() << \" (\" << ns << \" ns)\\n\";\n            last_cap = test_list.capacity();\n        }\n    }\n    return 0;\n}", "nb": 9, "fns": ["main"], "lines": 23, "extra": 1}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "p3a0713e35a7d8006bb99f79adf1b98dc", "path": ["4.4. 재귀 함수(recursive function)란?", "재귀함수의 구조: 설계의 법칙"], "lang": "py", "code": "def factorial(n):\n    # base case: 1일 경우 1을 반환\n    if n <= 1:\n        return 1\n    # recursive case\n    else:\n        return n * factorial(n - 1)\n\n# 예시: 5의 팩토리얼 계산\nprint(factorial(5))  # 출력 결과는 120", "nb": 3, "fns": ["factorial"], "lines": 10}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "p3a0713e35a7d8006bb99f79adf1b98dc", "path": ["4.4. 재귀 함수(recursive function)란?", "재귀함수의 구조: 설계의 법칙"], "lang": "cpp", "code": "#include <iostream>\nusing namespace std;\n\nint factorial(int n) {\n    // base case: 1 이하이면 1을 반환\n    if (n <= 1)\n        return 1;\n    // recursive case\n    else\n        return n * factorial(n - 1);\n}\n\nint main() {\n    cout << factorial(5) << \"\\n\";  // 출력 결과는 120\n    return 0;\n}", "nb": 3, "fns": ["factorial"], "lines": 16, "extra": 1}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "p39e713e35a7d808e8bbdc25e8a92c8a4", "path": ["4.4. 재귀 함수(recursive function)란?", "재귀 함수 예제: Factorial", "[구현] Python: factorial"], "lang": "py", "code": "def factorial(n):\n    result = 1\n    for i in range(2, n + 1):\n        result *= i\n    return result\n\n# 예시: 5의 팩토리얼 계산\nprint(factorial(5))  # 출력 결과는 120", "nb": 4, "fns": ["factorial"], "lines": 8}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "p39e713e35a7d808e8bbdc25e8a92c8a4", "path": ["4.4. 재귀 함수(recursive function)란?", "재귀 함수 예제: Factorial", "[구현] Python: factorial"], "lang": "py", "code": "def factorial(n):\n    result = 1\n    i = 1\n    while i <= n:\n        result *= i\n        i += 1\n    return result\n\n# 예시: 5의 팩토리얼 계산\nprint(factorial(5))  # 출력 결과는 120", "nb": 6, "fns": ["factorial"], "lines": 10}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "p39e713e35a7d808e8bbdc25e8a92c8a4", "path": ["4.4. 재귀 함수(recursive function)란?", "재귀 함수 예제: Factorial", "[구현] Python: factorial"], "lang": "py", "code": "def factorial(n):\n    # base case: 1일 경우 1을 반환\n    if n == 0 or n == 1:\n        return 1\n    # recursive case\n    else:\n        return n * factorial(n - 1)\n\n# 예시: 5의 팩토리얼 계산\nprint(factorial(5))  # 출력 결과는 120", "nb": 3, "fns": ["factorial"], "lines": 10}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "p3a0713e35a7d80fa80e7ece7603507fd", "path": ["4.4. 재귀 함수(recursive function)란?", "재귀 함수 예제: Factorial", "[구현] C++: factorial"], "lang": "cpp", "code": "int factorial(int n){\n    // 1. Base Case: 탈출 조건\n    if (n <= 1) {\n        return 1;\n    }\n\n    // 2. Recursive Step: 하위 문제로 분해 및 수렴\n    return n * factorial(n - 1);\n}", "nb": 3, "fns": ["factorial"], "lines": 9}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "p3a7713e35a7d80e8a61dd4d8292abeb5", "path": ["4.4. 재귀 함수(recursive function)란?", "재귀 함수 예제: Factorial", "factorial 재귀 함수의 Time complexity"], "lang": "py", "code": "def factorial(n):\n    if n <= 1:  # 기저 조건 (Base Case)\n        return 1\n    return n * factorial(n - 1)  # 재귀 호출", "nb": 3, "fns": ["factorial"], "lines": 4}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "p3a7713e35a7d80e8a61dd4d8292abeb5", "path": ["4.4. 재귀 함수(recursive function)란?", "재귀 함수 예제: Factorial", "factorial 재귀 함수의 Time complexity"], "lang": "cpp", "code": "#include <iostream>\nusing namespace std;\n\nint factorial(int n) {\n    if (n <= 1)                    // 기저 조건 (Base Case)\n        return 1;\n    return n * factorial(n - 1);   // 재귀 호출: 호출 n번 -> O(n)\n}\n\nint main() {\n    cout << factorial(5) << \"\\n\";\n    return 0;\n}", "nb": 3, "fns": ["factorial"], "lines": 13, "extra": 1}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "p3a0713e35a7d8096a6bde58b914bd5d2", "path": ["4.4. 재귀 함수(recursive function)란?", "재귀적 사고 훈련법", "반복문과 재귀의 철학적 차이"], "lang": "py", "code": "# [예시] 1부터 N까지의 합을 구하는 두 가지 관점\n\n# 1. 반복문 관점: \"상자를 하나씩 열어 가며 누적해서 더하자.\"\ndef sum_iteration(n):\n    total = 0\n    for i in range(1, n + 1):\n        total += i\n    return total\n\n# 2. 재귀 관점: \"N까지의 합은, (N-1)까지의 합에 N을 더한 것과 같다.\"\ndef sum_recursion(n):\n    if n == 1:\n        return 1\n    return n + sum_recursion(n - 1)", "nb": 7, "fns": ["sum_iteration", "sum_recursion"], "lines": 14}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "p3a0713e35a7d8096a6bde58b914bd5d2", "path": ["4.4. 재귀 함수(recursive function)란?", "재귀적 사고 훈련법", "반복문과 재귀의 철학적 차이"], "lang": "cpp", "code": "#include <iostream>\nusing namespace std;\n\n// 1. 반복문 관점: \"상자를 하나씩 열어 가며 누적해서 더하자.\"\nint sum_iteration(int n) {\n    int total = 0;\n    for (int i = 1; i <= n; i++)\n        total += i;\n    return total;\n}\n\n// 2. 재귀 관점: \"N까지의 합은, (N-1)까지의 합에 N을 더한 것과 같다.\"\nint sum_recursion(int n) {\n    if (n == 1)\n        return 1;\n    return n + sum_recursion(n - 1);\n}\n\nint main() {\n    cout << sum_iteration(10) << \" \" << sum_recursion(10) << \"\\n\";  // 55 55\n    return 0;\n}", "nb": 7, "fns": ["sum_iteration", "sum_recursion"], "lines": 22, "extra": 1}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "p8bdac1dd64084837b8111da1a6d7371f", "path": ["4.4. 재귀 함수(recursive function)란?", "[참고] 함수 호출과 스택"], "lang": "py", "code": "def add(a, b):\n    return a + b\n\ndef subtract(a, b):\n    return a - b\n\ndef arithmetic_operation(a, b):\n    add(a, b)\n    subtract(a, b)\n\ndef main():\n    i = 1\n    j = 2\n    arithmetic_operation(i, j)\n    \n\nif __name__ == \"__main__\":\n\t\tmain()", "nb": 4, "fns": ["add", "subtract", "arithmetic_operation"], "lines": 18}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "p3cf713e35a7d801f8929cf65db1dff64", "path": ["4.5. 재귀와 반복의 성능 비교", "피보나치 순열", "반복문으로 구현"], "lang": "py", "code": "def fibonacci(n):\n    if n <= 0:\n        return 0\n    elif n == 1:\n        return 1\n\n    # 이전 두 항을 저장할 변수 (f(0)=0, f(1)=1)\n    prev, curr = 0, 1\n\n    # 2부터 n까지 순차적으로 계산\n    for _ in range(2, n + 1):\n        prev, curr = curr, prev + curr\n\n    return curr\n\n# 테스트\nprint(fibonacci(10)) # 출력: 55\nprint(fibonacci(50)) # 출력: 12586269025 (재귀와 달리 0.001초만에 계산)", "nb": 8, "fns": ["fibonacci"], "lines": 18}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "p3cf713e35a7d801f8929cf65db1dff64", "path": ["4.5. 재귀와 반복의 성능 비교", "피보나치 순열", "반복문으로 구현"], "lang": "cpp", "code": "#include <iostream>\n\nlong long fibonacci(int n){\n    if (n <= 0) return 0;\n    if (n == 1) return 1;\n\n    long long prev = 0;\n    long long curr = 1;\n\n    for (int i = 2; i <= n; ++i) {\n        long long next = prev + curr;\n        prev = curr;\n        curr = next;\n    }\n\n    return curr;\n}\n\nint main(){\n    std::cout << fibonacci(10) << std::endl; // 출력: 55\n    return 0;\n}", "nb": 7, "fns": ["fibonacci"], "lines": 22}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "p3a0713e35a7d80dfb874e2d79ec3ce8a", "path": ["4.5. 재귀와 반복의 성능 비교", "피보나치 순열", "재귀 함수 시간 복잡도 분석"], "lang": "py", "code": "call_count = 0\n\ndef fib(n):\n    \"\"\"그림의 호출 트리 그대로 동작하는 단순 재귀: O(2^n)\"\"\"\n    global call_count\n    call_count += 1\n    if n <= 1:\n        return n\n    return fib(n - 1) + fib(n - 2)\n\nprint(fib(5), \"호출 횟수:\", call_count)   # 5 호출 횟수: 15", "nb": 4, "fns": ["fib"], "lines": 11, "extra": 1}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "p3ab713e35a7d80818b2fdf4448332f73", "path": ["4.5. 재귀와 반복의 성능 비교", "피보나치 순열", "[참고] O(log n) 방법"], "lang": "py", "code": "# 2x2 행렬 곱셈 함수\ndef multiply(A, B):\n    return [\n        [A[0][0]*B[0][0] + A[0][1]*B[1][0], A[0][0]*B[0][1] + A[0][1]*B[1][1]],\n        [A[1][0]*B[0][0] + A[1][1]*B[1][0], A[1][0]*B[0][1] + A[1][1]*B[1][1]]\n    ]\n\n# 행렬 거듭제곱 함수 (분할 정복 적용)\ndef power(A, n):\n    if n == 1:\n        return A\n\n    # n/2 제곱을 먼저 구함 (재귀 호출 1번만 발생)\n    half = power(A, n // 2)\n    square = multiply(half, half)\n\n    # n이 홀수이면 A를 한 번 더 곱해줌\n    if n % 2 == 1:\n        return multiply(square, A)\n    else:\n        return square\n\ndef fibonacci_log_n(n):\n    if n <= 0:\n        return 0\n    if n == 1:\n        return 1\n\n    # 기본 변환 행렬 M\n    M = [[1, 1], [1, 0]]\n\n    # M^(n-1) 계산\n    result_matrix = power(M, n - 1)\n\n    # F(n)은 결과 행렬의 [0][0] 위치 값\n    return result_matrix[0][0]\n\n# 테스트\nprint(fibonacci_log_n(10))       # 출력: 55\nprint(fibonacci_log_n(1000000))  # 엄청나게 큰 n도 지연 없이 즉시 계산", "nb": 15, "fns": ["multiply", "power", "fibonacci_log_n"], "lines": 40}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "p3ab713e35a7d80818b2fdf4448332f73", "path": ["4.5. 재귀와 반복의 성능 비교", "피보나치 순열", "[참고] O(log n) 방법"], "lang": "cpp", "code": "#include <iostream>\n#include <array>\nusing namespace std;\n\ntypedef array<array<long long, 2>, 2> Mat;\nconst long long MOD = 1000000007;   // C++ 정수는 크기 제한이 있어 큰 n은 나머지로 계산\n\n// 2x2 행렬 곱셈 함수\nMat multiply(const Mat& A, const Mat& B) {\n    Mat C;\n    C[0][0] = (A[0][0] * B[0][0] + A[0][1] * B[1][0]) % MOD;\n    C[0][1] = (A[0][0] * B[0][1] + A[0][1] * B[1][1]) % MOD;\n    C[1][0] = (A[1][0] * B[0][0] + A[1][1] * B[1][0]) % MOD;\n    C[1][1] = (A[1][0] * B[0][1] + A[1][1] * B[1][1]) % MOD;\n    return C;\n}\n\n// 행렬 거듭제곱 함수 (분할 정복 적용)\nMat power(const Mat& A, long long n) {\n    if (n == 1) return A;\n    Mat half = power(A, n / 2);            // 재귀 호출 1번만 발생\n    Mat square = multiply(half, half);\n    if (n % 2 == 1) return multiply(square, A);\n    return square;\n}\n\nlong long fibonacci_log_n(long long n) {\n    if (n <= 0) return 0;\n    if (n == 1) return 1;\n    Mat M = {{{1, 1}, {1, 0}}};            // 기본 변환 행렬 M\n    Mat result_matrix = power(M, n - 1);   // M^(n-1)\n    return result_matrix[0][0];            // F(n)\n}\n\nint main() {\n    cout << fibonacci_log_n(10) << \"\\n\";        // 출력: 55\n    cout << fibonacci_log_n(1000000) << \"\\n\";   // F(1000000) mod 1,000,000,007\n    return 0;\n}", "nb": 11, "fns": ["multiply", "power", "fibonacci_log_n"], "lines": 39, "extra": 1}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "p3cf713e35a7d80e28dc0e50ad3a079cf", "path": ["4.5. 재귀와 반복의 성능 비교", "[참고] 꼬리 재귀(Tail Recursion)의 이해: 컴파일러의 반복문 최적화 원리", "일반 재귀 vs 꼬리 재귀 비교"], "lang": "py", "code": "def factorial(n):\n    if n <= 1:\n        return 1\n    return n * factorial(n - 1)   # 재귀 호출 후 'n을 곱하는 연산'이 남아 있음 (대기 필요)\n\nprint(factorial(5))   # 120", "nb": 3, "fns": ["factorial"], "lines": 6, "extra": 1}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "p3cf713e35a7d80e28dc0e50ad3a079cf", "path": ["4.5. 재귀와 반복의 성능 비교", "[참고] 꼬리 재귀(Tail Recursion)의 이해: 컴파일러의 반복문 최적화 원리", "일반 재귀 vs 꼬리 재귀 비교"], "lang": "py", "code": "def factorial_tail(n, accumulator=1):\n    if n <= 1:\n        return accumulator\n    return factorial_tail(n - 1, n * accumulator)   # 재귀 호출 결과 외에 아무 연산도 남기지 않음\n\nprint(factorial_tail(5))   # 120", "nb": 3, "fns": ["factorial_tail"], "lines": 6, "extra": 1}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "p3cf713e35a7d806a89b2eafa6bd22c37", "path": ["4.5. 재귀와 반복의 성능 비교", "[참고] 꼬리 재귀(Tail Recursion)의 이해: 컴파일러의 반복문 최적화 원리", "TCO가 적용된 컴파일러의 변환 동작 (개념적 이해)"], "lang": "cpp", "code": "// 컴파일러가 내부적으로 최적화한 형태 (메모리 스택을 더 이상 쓰지 않음!)\nint factorial_optimized(int n){\n    int accumulator = 1;\n    while (true) {\n        if (n <= 1) return accumulator;\n        accumulator = n * accumulator;\n        n = n - 1;\n    }\n}", "nb": 4, "fns": ["factorial_optimized"], "lines": 9}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "p3cf713e35a7d806a89b2eafa6bd22c37", "path": ["4.5. 재귀와 반복의 성능 비교", "[참고] 꼬리 재귀(Tail Recursion)의 이해: 컴파일러의 반복문 최적화 원리", "TCO가 적용된 컴파일러의 변환 동작 (개념적 이해)"], "lang": "py", "code": "def factorial_optimized(n):\n    \"\"\"꼬리 재귀를 반복문으로 바꾼 형태 (Python은 TCO를 하지 않으므로 직접 바꿔야 한다)\"\"\"\n    accumulator = 1\n    while True:\n        if n <= 1:\n            return accumulator\n        accumulator = n * accumulator\n        n = n - 1\n\nprint(factorial_optimized(5))   # 120", "nb": 6, "fns": ["factorial_optimized"], "lines": 10, "extra": 1}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "pb8d5f2af164947a3a72480459eeed83e", "path": ["4.5. 재귀와 반복의 성능 비교", "[참고] 재귀 함수의 유형", "indirect recursion(mutual recursion)"], "lang": "py", "code": "def is_even(n):\n    if n == 0:\n        return True\n    elif n == 1:\n        return False\n    else:\n        return is_even(n - 2)\n\nprint(is_even(4))  # True\nprint(is_even(5))  # False", "nb": 5, "fns": ["is_even"], "lines": 10}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "pb8d5f2af164947a3a72480459eeed83e", "path": ["4.5. 재귀와 반복의 성능 비교", "[참고] 재귀 함수의 유형", "indirect recursion(mutual recursion)"], "lang": "py", "code": "def is_even(n):\n    if n == 0:\n        return True\n    else:\n        return is_odd(n - 1)\n\ndef is_odd(n):\n    if n == 0:\n        return False\n    else:\n        return is_even(n - 1)\n\nprint(is_even(4))  # True\nprint(is_odd(5))   # True", "nb": 6, "fns": ["is_even", "is_odd"], "lines": 14}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "p3ab713e35a7d804a9d24c63553718567", "path": ["4.5. 재귀와 반복의 성능 비교", "[참고] 재귀 함수의 유형", "tail recursion(꼬리 재귀) 예제", "Sum of Array"], "lang": "py", "code": "def array_sum(arr):\n    if not arr: # 빈 배열인 경우\n        return 0\n    else:\n        return array_sum(arr[:-1]) + arr[-1]\n\n# 예시 사용\narr = [1, 2, 3, 4, 5]\nprint(array_sum(arr))  # 출력 결과는 15", "nb": 3, "fns": ["array_sum"], "lines": 9}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "p3ab713e35a7d804a9d24c63553718567", "path": ["4.5. 재귀와 반복의 성능 비교", "[참고] 재귀 함수의 유형", "tail recursion(꼬리 재귀) 예제", "Sum of Array"], "lang": "cpp", "code": "#include <iostream>\n#include <vector>\nusing namespace std;\n\n// arr[0..n-1]의 합 = arr[0..n-2]의 합 + arr[n-1]  (슬라이싱 대신 길이 n을 넘긴다)\nint array_sum(const vector<int>& arr, int n) {\n    if (n == 0)                       // 빈 배열인 경우\n        return 0;\n    else\n        return array_sum(arr, n - 1) + arr[n - 1];\n}\n\nint main() {\n    vector<int> arr = {1, 2, 3, 4, 5};\n    cout << array_sum(arr, arr.size()) << \"\\n\";  // 출력 결과는 15\n    return 0;\n}", "nb": 3, "fns": ["array_sum"], "lines": 17, "extra": 1}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "p3ab713e35a7d804a9d24c63553718567", "path": ["4.5. 재귀와 반복의 성능 비교", "[참고] 재귀 함수의 유형", "tail recursion(꼬리 재귀) 예제", "Sum of Array"], "lang": "py", "code": "def array_sum(arr, acc):\n    if not arr:  # 빈 배열인 경우\n        return acc\n    else:\n        return array_sum(arr[:-1], acc + arr[-1])\n\n# 예시 사용\narray = [1, 2, 3, 4, 5]\nprint(f\"배열 {array}의 합은 {array_sum(array, 0)}입니다.\")", "nb": 3, "fns": ["array_sum"], "lines": 9}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "p3ab713e35a7d804a9d24c63553718567", "path": ["4.5. 재귀와 반복의 성능 비교", "[참고] 재귀 함수의 유형", "tail recursion(꼬리 재귀) 예제", "Sum of Array"], "lang": "cpp", "code": "#include <iostream>\n#include <vector>\nusing namespace std;\n\nint array_sum(const vector<int>& arr, int n, int acc) {\n    if (n == 0)                       // 빈 배열인 경우\n        return acc;\n    else\n        return array_sum(arr, n - 1, acc + arr[n - 1]);   // 꼬리 재귀\n}\n\nint main() {\n    vector<int> array = {1, 2, 3, 4, 5};\n    cout << \"배열 [1, 2, 3, 4, 5]의 합은 \" << array_sum(array, array.size(), 0) << \"입니다.\\n\";\n    return 0;\n}", "nb": 3, "fns": ["array_sum"], "lines": 16, "extra": 1}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "p3ab713e35a7d80548d81e4b477e42453", "path": ["4.5. 재귀와 반복의 성능 비교", "[참고] 재귀 함수의 유형", "tail recursion(꼬리 재귀) 예제", "팩토리알"], "lang": "py", "code": "def fact(n):\n    if n < 1:\n        return 1\n    return n * fact(n-1)\n\nprint(fact(5)) ", "nb": 3, "fns": ["fact"], "lines": 6}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "p3ab713e35a7d80548d81e4b477e42453", "path": ["4.5. 재귀와 반복의 성능 비교", "[참고] 재귀 함수의 유형", "tail recursion(꼬리 재귀) 예제", "팩토리알"], "lang": "cpp", "code": "#include <iostream>\nusing namespace std;\n\nint fact(int n) {\n    if (n < 1)\n        return 1;\n    return n * fact(n - 1);\n}\n\nint main() {\n    cout << fact(5) << \"\\n\";   // 120\n    return 0;\n}", "nb": 3, "fns": ["fact"], "lines": 13, "extra": 1}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "p3ab713e35a7d80548d81e4b477e42453", "path": ["4.5. 재귀와 반복의 성능 비교", "[참고] 재귀 함수의 유형", "tail recursion(꼬리 재귀) 예제", "팩토리알"], "lang": "py", "code": "def fact_tail(n, result=1):\n    if n <= 1:\n        return result\n \n    return fact_tail(n - 1, n * result) \n \n# Driver code\nprint(fact(5))", "nb": 3, "fns": ["fact_tail"], "lines": 8}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "p3ab713e35a7d80548d81e4b477e42453", "path": ["4.5. 재귀와 반복의 성능 비교", "[참고] 재귀 함수의 유형", "tail recursion(꼬리 재귀) 예제", "팩토리알"], "lang": "cpp", "code": "#include <iostream>\nusing namespace std;\n\nint fact_tail(int n, int result = 1) {\n    if (n <= 1)\n        return result;\n    return fact_tail(n - 1, n * result);\n}\n\nint main() {\n    cout << fact_tail(5) << \"\\n\";   // 120\n    return 0;\n}", "nb": 3, "fns": ["fact_tail"], "lines": 13, "extra": 1}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "p3ab713e35a7d80339b0cc84ca23787a2", "path": ["4.5. 재귀와 반복의 성능 비교", "[참고] 재귀 함수의 유형", "tail recursion(꼬리 재귀) 예제", "피보나치 수열"], "lang": "py", "code": "def fibonacci_tail_recursive(position, prev_value=0, curr_value=1):\n    \"\"\"\n    Calculate the Fibonacci number at a given position using tail recursion.\n    \n    :param position: The position in the Fibonacci sequence to compute.\n    :param prev_value: The Fibonacci number at the previous position.\n    :param curr_value: The Fibonacci number at the current position.\n    :return: The Fibonacci number at the specified position.\n    \"\"\"\n    # Base cases\n    if position == 0:\n        return prev_value\n    if position == 1:\n        return curr_value\n    \n    # Tail recursion: move to the next position\n    return fibonacci_tail_recursive(position - 1, curr_value, prev_value + curr_value)\n\n# Driver code\nprint(fibonacci_tail_recursive(5))  # Output: 5\n", "nb": 5, "fns": ["fibonacci_tail_recursive"], "lines": 20}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "p6db02329e5a841f0b88f1d4e478f4fc4", "path": ["초급 문제", "Sum of natural numbers"], "lang": "py", "code": "def sum_of_natural_numbers(n):\n    total = 0\n    for i in range(1, n + 1):\n        total += i\n    return total\n\n# 예제: 자연수 1부터 5까지의 합을 구하기\nn = 5\nresult = sum_of_natural_numbers(n)\nprint(f\"Sum of first {n} natural numbers is: {result}\")\n", "nb": 4, "fns": ["sum_of_natural_numbers"], "lines": 10}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "p6db02329e5a841f0b88f1d4e478f4fc4", "path": ["초급 문제", "Sum of natural numbers"], "lang": "cpp", "code": "#include <iostream>\nusing namespace std;\n\nint sum_of_natural_numbers(int n) {\n    int total = 0;\n    for (int i = 1; i <= n; i++)\n        total += i;\n    return total;\n}\n\nint main() {\n    int n = 5;\n    int result = sum_of_natural_numbers(n);\n    cout << \"Sum of first \" << n << \" natural numbers is: \" << result << \"\\n\";  // 15\n    return 0;\n}", "nb": 4, "fns": ["sum_of_natural_numbers"], "lines": 16, "extra": 1}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "p6db02329e5a841f0b88f1d4e478f4fc4", "path": ["초급 문제", "Sum of natural numbers"], "lang": "py", "code": "def sum_of_natural_numbers(n):\n    if n == 1:\n        return 1\n    else:\n        return n + sum_of_natural_numbers(n - 1)\n\n# 예제: 자연수 1부터 5까지의 합을 구하기\nn = 5\nresult = sum_of_natural_numbers(n)\nprint(f\"Sum of first {n} natural numbers is: {result}\")", "nb": 3, "fns": ["sum_of_natural_numbers"], "lines": 10}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "p6db02329e5a841f0b88f1d4e478f4fc4", "path": ["초급 문제", "Sum of natural numbers"], "lang": "cpp", "code": "#include <iostream>\nusing namespace std;\n\nint sum_of_natural_numbers(int n) {\n    if (n == 1)\n        return 1;\n    else\n        return n + sum_of_natural_numbers(n - 1);\n}\n\nint main() {\n    int n = 5;\n    int result = sum_of_natural_numbers(n);\n    cout << \"Sum of first \" << n << \" natural numbers is: \" << result << \"\\n\";  // 15\n    return 0;\n}", "nb": 3, "fns": ["sum_of_natural_numbers"], "lines": 16, "extra": 1}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "p44b8e0a2e4dd4b1a865daeb369f4ab91", "path": ["초급 문제", "Sum of array"], "lang": "py", "code": "def array_sum(arr):\n    total = 0\n    for num in arr:\n        total += num\n    return total\n\n# 예시 사용\narr = [1, 2, 3, 4, 5]\nprint(array_sum(arr))  # 출력 결과는 15\nprint(array_sum([])  # 출력 결과는 0", "nb": 4, "fns": ["array_sum"], "lines": 10}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "p44b8e0a2e4dd4b1a865daeb369f4ab91", "path": ["초급 문제", "Sum of array"], "lang": "cpp", "code": "#include <iostream>\n#include <vector>\nusing namespace std;\n\nint array_sum(const vector<int>& arr) {\n    int total = 0;\n    for (int num : arr)\n        total += num;\n    return total;\n}\n\nint main() {\n    vector<int> arr = {1, 2, 3, 4, 5};\n    cout << array_sum(arr) << \"\\n\";   // 출력 결과는 15\n    cout << array_sum({}) << \"\\n\";    // 출력 결과는 0\n    return 0;\n}", "nb": 4, "fns": ["array_sum"], "lines": 17, "extra": 1}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "p44b8e0a2e4dd4b1a865daeb369f4ab91", "path": ["초급 문제", "Sum of array"], "lang": "py", "code": "def array_sum(arr):\n    if not arr: # 빈 배열인 경우\n        return 0\n    else:\n        return array_sum(arr[:-1]) + arr[-1]\n\n# 예시 사용\narr = [1, 2, 3, 4, 5]\nprint(array_sum(arr))  # 출력 결과는 15\nprint(array_sum([])  # 출력 결과는 0", "nb": 3, "fns": ["array_sum"], "lines": 10}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "p44b8e0a2e4dd4b1a865daeb369f4ab91", "path": ["초급 문제", "Sum of array"], "lang": "cpp", "code": "#include <iostream>\n#include <vector>\nusing namespace std;\n\n// 앞에서부터 n개 원소의 합\nint array_sum(const vector<int>& arr, int n) {\n    if (n == 0)               // 빈 배열인 경우\n        return 0;\n    else\n        return array_sum(arr, n - 1) + arr[n - 1];\n}\n\nint main() {\n    vector<int> arr = {1, 2, 3, 4, 5};\n    cout << array_sum(arr, arr.size()) << \"\\n\";   // 출력 결과는 15\n    cout << array_sum({}, 0) << \"\\n\";             // 출력 결과는 0\n    return 0;\n}", "nb": 3, "fns": ["array_sum"], "lines": 18, "extra": 1}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "p44b8e0a2e4dd4b1a865daeb369f4ab91", "path": ["초급 문제", "Sum of array"], "lang": "py", "code": "def array_sum_recursive(arr):\n    if not arr: # 빈 배열인 경우\n        return 0\n    else:\n        return arr[0] + array_sum_recursive(arr[1:])\n\n# 예시: 배열 [1, 2, 3, 4, 5]의 합 구하기\narr = [1, 2, 3, 4, 5]\nprint(array_sum_recursive(arr))  # 출력 결과는 15", "nb": 3, "fns": ["array_sum_recursive"], "lines": 9}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "p44b8e0a2e4dd4b1a865daeb369f4ab91", "path": ["초급 문제", "Sum of array"], "lang": "cpp", "code": "#include <iostream>\n#include <vector>\nusing namespace std;\n\n// arr[start:]의 합 = arr[start] + arr[start+1:]의 합   (arr[1:] 대신 시작 인덱스를 넘긴다)\nint array_sum_recursive(const vector<int>& arr, int start = 0) {\n    if (start == (int)arr.size())   // 빈 배열인 경우\n        return 0;\n    else\n        return arr[start] + array_sum_recursive(arr, start + 1);\n}\n\nint main() {\n    vector<int> arr = {1, 2, 3, 4, 5};\n    cout << array_sum_recursive(arr) << \"\\n\";  // 출력 결과는 15\n    return 0;\n}", "nb": 3, "fns": ["array_sum_recursive"], "lines": 17, "extra": 1}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "p3fa5f65ef3134ceeb945b979c865a1ff", "path": ["초급 문제", "Max of array"], "lang": "py", "code": "def max_array(arr):\n    max_value = arr[0]\n    for num in arr[1:]:\n        if num > max_value:\n            max_value = num\n    return max_value\n\n# 예시: 배열 [3, 7, 2, 10, 5]의 최대값 구하기\narr = [3, 7, 2, 10, 5]\nprint(max_array(arr))  # 출력 결과는 10\n\n\n# 예시: 배열 [ ]의 최대값 구하기\narr = [ ]\nprint(max_array(arr))  # 출력 결과는 None", "nb": 5, "fns": ["max_array"], "lines": 15}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "p3fa5f65ef3134ceeb945b979c865a1ff", "path": ["초급 문제", "Max of array"], "lang": "cpp", "code": "#include <iostream>\n#include <vector>\nusing namespace std;\n\nint max_array(const vector<int>& arr) {\n    int max_value = arr[0];\n    for (size_t i = 1; i < arr.size(); i++) {\n        if (arr[i] > max_value)\n            max_value = arr[i];\n    }\n    return max_value;\n}\n\nint main() {\n    vector<int> arr = {3, 7, 2, 10, 5};\n    cout << max_array(arr) << \"\\n\";  // 출력 결과는 10\n    // 빈 배열에서 arr[0]에 접근하면 정의되지 않은 동작이므로 호출 전에 확인해야 한다\n    return 0;\n}", "nb": 5, "fns": ["max_array"], "lines": 19, "extra": 1}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "p3fa5f65ef3134ceeb945b979c865a1ff", "path": ["초급 문제", "Max of array"], "lang": "py", "code": "def max_array(arr):\n    if len(arr) == 1:  # 배열에 하나의 요소만 있는 경우\n        return arr[0]\n    else:\n        return max(arr[0], max_array(arr[1:]))\n\n# 예시: 배열 [3, 7, 2, 10, 5]의 최대값 구하기\narr = [3, 7, 2, 10, 5]\nprint(max_array(arr))  # 출력 결과는 10\n\n# 예시: 배열 [ ]의 최대값 구하기\narr = [ ]\nprint(max_array(arr))  # 출력 결과는 None", "nb": 3, "fns": ["max_array"], "lines": 13}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "p3fa5f65ef3134ceeb945b979c865a1ff", "path": ["초급 문제", "Max of array"], "lang": "cpp", "code": "#include <iostream>\n#include <vector>\n#include <algorithm>\nusing namespace std;\n\n// arr[start:]의 최댓값\nint max_array(const vector<int>& arr, int start = 0) {\n    if (start == (int)arr.size() - 1)        // 배열에 하나의 요소만 남은 경우\n        return arr[start];\n    else\n        return max(arr[start], max_array(arr, start + 1));\n}\n\nint main() {\n    vector<int> arr = {3, 7, 2, 10, 5};\n    cout << max_array(arr) << \"\\n\";  // 출력 결과는 10\n    return 0;\n}", "nb": 3, "fns": ["max_array"], "lines": 18, "extra": 1}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "p3fa5f65ef3134ceeb945b979c865a1ff", "path": ["초급 문제", "Max of array"], "lang": "py", "code": "def max_array(arr):\n    if len(arr) == 1:  # 배열에 하나의 요소만 있는 경우\n        return arr[0]\n    else:\n        return max(arr[-1], max_array(arr[:-1]))", "nb": 3, "fns": ["max_array"], "lines": 5}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "p3fa5f65ef3134ceeb945b979c865a1ff", "path": ["초급 문제", "Max of array"], "lang": "cpp", "code": "#include <iostream>\n#include <vector>\n#include <algorithm>\nusing namespace std;\n\n// arr[0..n-1]의 최댓값 = max(마지막 원소, arr[0..n-2]의 최댓값)\nint max_array(const vector<int>& arr, int n) {\n    if (n == 1)                              // 배열에 하나의 요소만 있는 경우\n        return arr[0];\n    else\n        return max(arr[n - 1], max_array(arr, n - 1));\n}\n\nint main() {\n    vector<int> arr = {3, 7, 2, 10, 5};\n    cout << max_array(arr, arr.size()) << \"\\n\";  // 10\n    return 0;\n}", "nb": 3, "fns": ["max_array"], "lines": 18, "extra": 1}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "p701b8c0807ee4d85938f40a7a5dfe96e", "path": ["초급 문제", "String length"], "lang": "py", "code": "def string_length(s):\n    length = 0\n    for _ in s:\n        length += 1\n    return length\n\n# 예시 사용\ns = \"Hello, world!\"\nprint(f\"문자열 '{s}'의 길이는 {string_length(s)}입니다.\") # 출력 결과는 13", "nb": 4, "fns": ["string_length"], "lines": 9}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "p701b8c0807ee4d85938f40a7a5dfe96e", "path": ["초급 문제", "String length"], "lang": "cpp", "code": "#include <iostream>\n#include <string>\nusing namespace std;\n\nint string_length(const string& s) {\n    int length = 0;\n    for (char c : s) {\n        (void)c;\n        length += 1;\n    }\n    return length;\n}\n\nint main() {\n    string s = \"Hello, world!\";\n    cout << \"문자열 '\" << s << \"'의 길이는 \" << string_length(s) << \"입니다.\\n\";  // 13\n    return 0;\n}", "nb": 4, "fns": ["string_length"], "lines": 18, "extra": 1}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "p701b8c0807ee4d85938f40a7a5dfe96e", "path": ["초급 문제", "String length"], "lang": "py", "code": "def string_length(s):\n    if not s:  # 빈 문자열인 경우\n        return 0\n    else:\n        return 1 + string_length(s[1:])\n\n# 예시 사용\ns = \"Hello, world!\"\nprint(f\"문자열 '{s}'의 길이는 {string_length(s)}입니다.\") # 출력 결과는 13", "nb": 3, "fns": ["string_length"], "lines": 9}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "p701b8c0807ee4d85938f40a7a5dfe96e", "path": ["초급 문제", "String length"], "lang": "cpp", "code": "#include <iostream>\n#include <string>\nusing namespace std;\n\nint string_length(const string& s, size_t i = 0) {\n    if (i == s.size())                    // 남은 문자열이 비었으면\n        return 0;\n    else\n        return 1 + string_length(s, i + 1);   // s[1:] 대신 인덱스를 한 칸 옮긴다\n}\n\nint main() {\n    string s = \"Hello, world!\";\n    cout << \"문자열 '\" << s << \"'의 길이는 \" << string_length(s) << \"입니다.\\n\";  // 13\n    return 0;\n}", "nb": 3, "fns": ["string_length"], "lines": 16, "extra": 1}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "p1841568897644a239c5d0834678f9f98", "path": ["초급 문제", "Checking has_digit"], "lang": "py", "code": "def has_digit(s):\n    for ch in s:\n        if ch.isdigit():\n            return True\n\n    return False", "nb": 4, "fns": ["has_digit"], "lines": 6}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "p1841568897644a239c5d0834678f9f98", "path": ["초급 문제", "Checking has_digit"], "lang": "cpp", "code": "#include <iostream>\n#include <string>\n#include <cctype>\nusing namespace std;\n\nbool has_digit(const string& s) {\n    for (char ch : s) {\n        if (isdigit(ch))\n            return true;\n    }\n    return false;\n}\n\nint main() {\n    cout << boolalpha << has_digit(\"Hello123\") << \" \" << has_digit(\"Hello\") << \"\\n\";\n    return 0;\n}", "nb": 4, "fns": ["has_digit"], "lines": 17, "extra": 1}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "p1841568897644a239c5d0834678f9f98", "path": ["초급 문제", "Checking has_digit"], "lang": "py", "code": "def has_digit(s):\n    if s == \"\":\n        return False\n    else:\n        return s[0].isdigit() or has_digit(s[1:])\n        \n# 예시 사용\nprint(has_digit(\"Hello123\")) # True\nprint(has_digit(\"Hello\")) # False\nprint(has_digit(\"\")) # False", "nb": 3, "fns": ["has_digit"], "lines": 10}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "p1841568897644a239c5d0834678f9f98", "path": ["초급 문제", "Checking has_digit"], "lang": "cpp", "code": "#include <iostream>\n#include <string>\n#include <cctype>\nusing namespace std;\n\nbool has_digit(const string& s, size_t i = 0) {\n    if (i == s.size())\n        return false;\n    else\n        return isdigit(s[i]) || has_digit(s, i + 1);\n}\n\nint main() {\n    cout << boolalpha;\n    cout << has_digit(\"Hello123\") << \"\\n\";  // true\n    cout << has_digit(\"Hello\") << \"\\n\";     // false\n    cout << has_digit(\"\") << \"\\n\";          // false\n    return 0;\n}", "nb": 3, "fns": ["has_digit"], "lines": 19, "extra": 1}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "p2a9c480ab1144614b844da9ba4ebf628", "path": ["초급 문제", "Checking is_sorted"], "lang": "py", "code": "def is_sorted(lst):\n    # Handle edge cases: list of length 0 or 1 is always sorted\n    if len(lst) <= 1:\n        return True\n    \n    # Iterate through the list and compare each element with the next\n    for i in range(len(lst) - 1):\n        if lst[i] > lst[i + 1]:\n            return False\n    \n    # If no out-of-order elements were found, return True\n    return True\n\n# Example usage:\nprint(is_sorted([1, 2, 3, 4]))  # True\nprint(is_sorted([1, 3, 2, 4]))  # False\nprint(is_sorted([1]))           # True\nprint(is_sorted([]))            # True", "nb": 6, "fns": ["is_sorted"], "lines": 18}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "p2a9c480ab1144614b844da9ba4ebf628", "path": ["초급 문제", "Checking is_sorted"], "lang": "cpp", "code": "#include <iostream>\n#include <vector>\nusing namespace std;\n\nbool is_sorted_list(const vector<int>& lst) {\n    // 길이가 0이나 1이면 항상 정렬된 상태\n    if (lst.size() <= 1)\n        return true;\n    // 이웃한 두 원소를 차례로 비교\n    for (size_t i = 0; i + 1 < lst.size(); i++) {\n        if (lst[i] > lst[i + 1])\n            return false;\n    }\n    return true;\n}\n\nint main() {\n    cout << boolalpha;\n    cout << is_sorted_list({1, 2, 3, 4}) << \"\\n\";  // true\n    cout << is_sorted_list({1, 3, 2, 4}) << \"\\n\";  // false\n    cout << is_sorted_list({1}) << \"\\n\";           // true\n    cout << is_sorted_list({}) << \"\\n\";            // true\n    return 0;\n}", "nb": 6, "fns": ["is_sorted_list"], "lines": 24, "extra": 1}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "p2a9c480ab1144614b844da9ba4ebf628", "path": ["초급 문제", "Checking is_sorted"], "lang": "py", "code": "def is_sorted(l):\n    if len(l) <= 1:\n        return True\n    elif l[0] > l[1]:\n        return False\n    return is_sorted(l[1:])", "nb": 5, "fns": ["is_sorted"], "lines": 6}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "p2a9c480ab1144614b844da9ba4ebf628", "path": ["초급 문제", "Checking is_sorted"], "lang": "cpp", "code": "#include <iostream>\n#include <vector>\nusing namespace std;\n\nbool is_sorted_list(const vector<int>& l, size_t i = 0) {\n    if (l.size() - i <= 1 || l.size() <= 1)   // 남은 원소가 1개 이하\n        return true;\n    else if (l[i] > l[i + 1])\n        return false;\n    return is_sorted_list(l, i + 1);           // l[1:] 대신 i + 1\n}\n\nint main() {\n    cout << boolalpha << is_sorted_list({1, 2, 3, 4}) << \" \" << is_sorted_list({1, 3, 2, 4}) << \"\\n\";\n    return 0;\n}", "nb": 4, "fns": ["is_sorted_list"], "lines": 16, "extra": 1}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "p2a9c480ab1144614b844da9ba4ebf628", "path": ["초급 문제", "Checking is_sorted"], "lang": "py", "code": "def is_sorted(l):\n    if len(l) <= 1:\n        return True\n    return l[0] <= l[1] and is_sorted(l[1:])", "nb": 3, "fns": ["is_sorted"], "lines": 4}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "p2a9c480ab1144614b844da9ba4ebf628", "path": ["초급 문제", "Checking is_sorted"], "lang": "cpp", "code": "#include <iostream>\n#include <vector>\nusing namespace std;\n\nbool is_sorted_list(const vector<int>& l, size_t i = 0) {\n    if (l.size() <= 1 || l.size() - i <= 1)\n        return true;\n    return l[i] <= l[i + 1] && is_sorted_list(l, i + 1);\n}\n\nint main() {\n    cout << boolalpha << is_sorted_list({1, 2, 3, 4}) << \" \" << is_sorted_list({1, 3, 2, 4}) << \"\\n\";\n    return 0;\n}", "nb": 3, "fns": ["is_sorted_list"], "lines": 14, "extra": 1}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "p9bfebadabb11491c8a75acd60c866c7f", "path": ["초급 문제", "Checking all_equal"], "lang": "py", "code": "def all_equal(lst):\n    if not lst:  # Handle empty list\n        return True\n    return all(x == lst[0] for x in lst)", "nb": 3, "fns": ["all_equal"], "lines": 4}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "p9bfebadabb11491c8a75acd60c866c7f", "path": ["초급 문제", "Checking all_equal"], "lang": "cpp", "code": "#include <iostream>\n#include <vector>\n#include <algorithm>\nusing namespace std;\n\nbool all_equal(const vector<int>& lst) {\n    if (lst.empty())                     // 빈 리스트 처리\n        return true;\n    return all_of(lst.begin(), lst.end(), [&](int x) { return x == lst[0]; });\n}\n\nint main() {\n    cout << boolalpha << all_equal({1, 1, 1}) << \" \" << all_equal({1, 2, 1}) << \"\\n\";\n    return 0;\n}", "nb": 3, "fns": ["all_equal"], "lines": 15, "extra": 1}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "p9bfebadabb11491c8a75acd60c866c7f", "path": ["초급 문제", "Checking all_equal"], "lang": "py", "code": "def all_equal(lst):\n    if not lst:  # Handle empty list\n        return True\n    \n    first_item = lst[0]\n    for item in lst:\n        if item != first_item:\n            return False\n    \n    return True\n\n# Example usage:\nprint(all_equal([1, 1, 1]))  # Output: True\nprint(all_equal([1, 2, 1]))  # Output: False\nprint(all_equal([7]))        # Output: True\nprint(all_equal([]))         # Output: True\n", "nb": 7, "fns": ["all_equal"], "lines": 16}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "p9bfebadabb11491c8a75acd60c866c7f", "path": ["초급 문제", "Checking all_equal"], "lang": "cpp", "code": "#include <iostream>\n#include <vector>\nusing namespace std;\n\nbool all_equal(const vector<int>& lst) {\n    if (lst.empty())\n        return true;\n    int first_item = lst[0];\n    for (int item : lst) {\n        if (item != first_item)\n            return false;\n    }\n    return true;\n}\n\nint main() {\n    cout << boolalpha;\n    cout << all_equal({1, 1, 1}) << \"\\n\";  // true\n    cout << all_equal({1, 2, 1}) << \"\\n\";  // false\n    cout << all_equal({7}) << \"\\n\";        // true\n    cout << all_equal({}) << \"\\n\";         // true\n    return 0;\n}", "nb": 7, "fns": ["all_equal"], "lines": 23, "extra": 1}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "p9bfebadabb11491c8a75acd60c866c7f", "path": ["초급 문제", "Checking all_equal"], "lang": "py", "code": "def all_equal(lst):\n    # Base case: if the list is empty or has only one element\n    if len(lst) <= 1:\n        return True\n    \n    # Check if the first element is equal to the second\n    if lst[0] != lst[1]:\n        return False\n    \n    # Recursive case: check the rest of the list\n    return all_equal(lst[1:])\n\n# Example usage:\nprint(all_equal([1, 1, 1]))  # Output: True\nprint(all_equal([1, 2, 1]))  # Output: False\nprint(all_equal([7]))        # Output: True\nprint(all_equal([]))         # Output: True", "nb": 5, "fns": ["all_equal"], "lines": 17}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "p9bfebadabb11491c8a75acd60c866c7f", "path": ["초급 문제", "Checking all_equal"], "lang": "cpp", "code": "#include <iostream>\n#include <vector>\nusing namespace std;\n\nbool all_equal(const vector<int>& lst, size_t i = 0) {\n    // Base case: 남은 원소가 0개 또는 1개\n    if (lst.size() <= 1 || i >= lst.size() - 1)\n        return true;\n    // 앞의 두 원소 비교\n    if (lst[i] != lst[i + 1])\n        return false;\n    // Recursive case: 나머지 확인\n    return all_equal(lst, i + 1);\n}\n\nint main() {\n    cout << boolalpha;\n    cout << all_equal({1, 1, 1}) << \"\\n\";  // true\n    cout << all_equal({1, 2, 1}) << \"\\n\";  // false\n    cout << all_equal({7}) << \"\\n\";        // true\n    cout << all_equal({}) << \"\\n\";         // true\n    return 0;\n}", "nb": 5, "fns": ["all_equal"], "lines": 23, "extra": 1}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "p0415f45d213244cbacc187037ab3aedb", "path": ["초급 문제", "Fibonacci sequence"], "lang": "py", "code": "def fibonacci_iterative(n):\n    if n <= 1:\n        return n\n\n    fib_prev = 0\n    fib_current = 1\n\n    for i in range(2, n + 1):\n        fib_prev, fib_current = fib_current, fib_prev + fib_current\n\n    return fib_current\n\n# 테스트\nprint(fibonacci_iterative(10))  # 55", "nb": 7, "fns": ["fibonacci_iterative"], "lines": 14}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "p0415f45d213244cbacc187037ab3aedb", "path": ["초급 문제", "Fibonacci sequence"], "lang": "cpp", "code": "#include <iostream>\nusing namespace std;\n\nlong long fibonacci_iterative(int n) {\n    if (n <= 1)\n        return n;\n    long long fib_prev = 0;\n    long long fib_current = 1;\n    for (int i = 2; i <= n; i++) {\n        long long next = fib_prev + fib_current;   // C++에는 a, b = b, a + b 가 없으므로 임시 변수 사용\n        fib_prev = fib_current;\n        fib_current = next;\n    }\n    return fib_current;\n}\n\nint main() {\n    cout << fibonacci_iterative(10) << \"\\n\";  // 55\n    return 0;\n}", "nb": 9, "fns": ["fibonacci_iterative"], "lines": 20, "extra": 1}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "p0415f45d213244cbacc187037ab3aedb", "path": ["초급 문제", "Fibonacci sequence"], "lang": "py", "code": "def fibonacci_recursive(n):\n    if n <= 1:\n        return n\n    else:\n        return fibonacci_recursive(n - 1) + fibonacci_recursive(n - 2)\n\n# 테스트\nprint(fibonacci_recursive(10))  # 55", "nb": 3, "fns": ["fibonacci_recursive"], "lines": 8}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "p0415f45d213244cbacc187037ab3aedb", "path": ["초급 문제", "Fibonacci sequence"], "lang": "cpp", "code": "#include <iostream>\nusing namespace std;\n\nlong long fibonacci_recursive(int n) {\n    if (n <= 1)\n        return n;\n    else\n        return fibonacci_recursive(n - 1) + fibonacci_recursive(n - 2);\n}\n\nint main() {\n    cout << fibonacci_recursive(10) << \"\\n\";  // 55\n    return 0;\n}", "nb": 3, "fns": ["fibonacci_recursive"], "lines": 14, "extra": 1}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "p0415f45d213244cbacc187037ab3aedb", "path": ["초급 문제", "Fibonacci sequence"], "lang": "cpp", "code": "#include <iostream>\n#include <chrono>\nusing namespace std;\nusing namespace chrono;\n\nlong long fibonacci_iterative(int n) {\n    if (n <= 1) return n;\n    long long a = 0, b = 1;\n    for (int i = 2; i <= n; i++) { long long t = a + b; a = b; b = t; }\n    return b;\n}\nlong long fibonacci_recursive(int n) {\n    return n <= 1 ? n : fibonacci_recursive(n - 1) + fibonacci_recursive(n - 2);\n}\n\nint main() {\n    auto t0 = steady_clock::now();\n    fibonacci_iterative(40);\n    auto t1 = steady_clock::now();\n    cout << \"반복문 함수 실행 시간: \" << duration<double>(t1 - t0).count() << \" 초\\n\";\n\n    t0 = steady_clock::now();\n    fibonacci_recursive(40);          // C++은 Python보다 훨씬 빠르지만 여전히 O(2^n)\n    t1 = steady_clock::now();\n    cout << \"재귀 함수 실행 시간: \" << duration<double>(t1 - t0).count() << \" 초\\n\";\n    return 0;\n}", "nb": 3, "fns": ["fibonacci_iterative", "fibonacci_recursive"], "lines": 27, "extra": 1}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "pa432c5acd07249d3be41a873897b9fcb", "path": ["초급 문제", "Reverse of a string"], "lang": "py", "code": "def reverse_string(s):\n    reversed_str = ''\n    for char in s:\n        reversed_str = char + reversed_str\n    return reversed_str\n\n# 예제 사용\ns = \"Hello\"\nreversed_string = reverse_string(s)\n if len(s) == 1:\n        return s\n    else:\n        # 첫 번째 문자를 제외한 나머지 문자열을 재귀적으로 역순으로 만들어서,\n        # 첫 번째 문자와 결합하여 반환합니다.\n        return s[-1] + reverse_string(s[0:-1])\n\n# 예제 문자열\ns = \"Hello\"\nreversed_string = reverse_string(s)\nprint(reversed_string) # \"olleH\"", "nb": 3, "fns": ["reverse_string"], "lines": 13}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "pa432c5acd07249d3be41a873897b9fcb", "path": ["초급 문제", "Reverse of a string"], "lang": "cpp", "code": "#include <iostream>\n#include <string>\nusing namespace std;\n\nstring reverse_string(const string& s) {\n    if (s.length() <= 1)\n        return s;\n    // 마지막 글자 + 나머지(앞부분)를 뒤집은 것\n    return s.back() + reverse_string(s.substr(0, s.length() - 1));\n}\n\nint main() {\n    cout << reverse_string(\"Hello\") << \"\\n\";  // olleH\n    return 0;\n}", "nb": 3, "fns": ["reverse_string"], "lines": 15, "extra": 1}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "p0a699ab3010d4dafb0fd3b178c90bfcd", "path": ["중급 문제", "Decimal to binary"], "lang": "cpp", "code": "#include <iostream>\n#include <bitset>\n#include <string>\nusing namespace std;\n\nstring dec2bin(int n) {\n    string s = bitset<32>(n).to_string();          // 32자리 2진 문자열\n    size_t first = s.find('1');                     // 앞쪽의 0을 잘라낸다 ('0b' 제거와 같은 역할)\n    return first == string::npos ? \"0\" : s.substr(first);\n}\n\nint main() {\n    int number = 25;\n    cout << number << \"의 2진수 표현은 '\" << dec2bin(number) << \"'입니다.\\n\";  // 11001\n    return 0;\n}", "nb": 3, "fns": ["dec2bin"], "lines": 16, "extra": 1}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "p0a699ab3010d4dafb0fd3b178c90bfcd", "path": ["중급 문제", "Decimal to binary"], "lang": "cpp", "code": "#include <iostream>\n#include <bitset>\n#include <string>\nusing namespace std;\n\nstring dec2bin(int n) {\n    string s = bitset<32>(n).to_string();\n    size_t first = s.find('1');\n    return first == string::npos ? \"0\" : s.substr(first);\n}\n\nint main() {\ n(n / 2) + to_string(n % 2);\n}\n\nint main() {\n    cout << dec2bin(8) << \"\\n\";   // 1000\n    cout << dec2bin(9) << \"\\n\";   // 1001\n    cout << dec2bin(10) << \"\\n\";  // 1010\n    return 0;\n}", "nb": 3, "fns": ["dec2bin"], "lines": 17, "extra": 1}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "pe2707405c91a475cafa3cd354b22c247", "path": ["중급 문제", "Sum of digits of a number"], "lang": "cpp", "code": "#include <iostream>\n#include <string>\n#include <cstdlib>\nusing namespace std;\n\nint sum_of_digits(int n) {\n    // 정수를 문자열로 바꾼 뒤, 각 문자에서 '0'을 빼서 숫자로 변환해 더한다\n    string s = to_string(n);\n    int total = 0;\n    for (char c : s) total += c - '0';\n    return total;\n}\n\nint main() {\n    int number = 12345;\n    number = abs(number);   // 음수일 경우 양수로 변환\n    cout << number << \"의 각 자릿수 숫자들의 합은 \" << sum_of_digits(number) << \"입니다.\\n\";  // 15\n    return 0;\n}", "nb": 4, "fns": ["sum_of_digits"], "lines": 19, "extra": 1}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "pe2707405c91a475cafa3cd354b22c247", "path": ["중급 문제", "Sum of digits of a number"], "lang": "py", "code": "def sum_of_digits(n):\n    total_sum = 0\n    while n > 0:\n        # n을 10으로 나눈 나머지는 가장 낮은 자릿수의 숫자 구하기\n        total_sum += n % 10\n        \n        # n을 10으로 나누어서 자릿수 하나씩 줄임\n        n //= 10\n    \n    return total_sum\n\n# 예시 사용\nnumber = 12345\n# 음수일 경우 양수로 변환\nnumber = abs(number)\nresult = sum_of_digits(number)\nprint(f\"{number}의 각 자릿수 숫자들의 합은 {result}입니다.\")\n", "nb": 5, "fns": ["sum_of_digits"], "lines": 17}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "pe2707405c91a475cafa3cd354b22c247", "path": ["중급 문제", "Sum of digits of a number"], "lang": "cpp", "code": "#include <iostream>\n#include <cstdlib>\nusing namespace std;\n\nint sum_of_digits(int n) {\n    int total_sum = 0;\n    while (n > 0) {\n        total_sum += n % 10;   // 가장 낮은 자릿수\n        n /= 10;               // 자릿수 하나 줄이기\n    }\n    return total_sum;\n}\n\nint main() {\n    int number = abs(12345);\n    cout << number << \"의 각 자릿수 숫자들의 합은 \" << sum_of_digits(number) << \"입니다.\\n\";  // 15\n    return 0;\n}", "nb": 5, "fns": ["sum_of_digits"], "lines": 18, "extra": 1}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "pe2707405c91a475cafa3cd354b22c247", "path": ["중급 문제", "Sum of digits of a number"], "lang": "py", "code": "def sum_of_digits(n):\n    # base case: n이 한 자리 숫자일 경우\n    if n == 0:\n        return 0\n    else:\n        # n을 10으로 나눈 몫과 나머지를 이용하여 재귀적으로 처리\n        return n % 10 + sum_of_digits(n // 10)\n", "nb": 3, "fns": ["sum_of_digits"], "lines": 7}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "pe2707405c91a475cafa3cd354b22c247", "path": ["중급 문제", "Sum of digits of a number"], "lang": "cpp", "code": "#include <iostream>\nusing namespace std;\n\nint sum_of_digits(int n) {\n    if (n == 0)                              // base case\n        return 0;\n    else\n        return n % 10 + sum_of_digits(n / 10);\n}\n\nint main() {\n    cout << sum_of_digits(12345) << \"\\n\";   // 15\n    return 0;\n}", "nb": 3, "fns": ["sum_of_digits"], "lines": 14, "extra": 1}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "pe2707405c91a475cafa3cd354b22c247", "path": ["중급 문제", "Sum of digits of a number"], "lang": "py", "code": "def sum_of_digits(n):\n    # base case: n이 한 자리 숫자일 경우\n    if n < 10:\n        return n\n    else:\n        # n을 10으로 나눈 몫과 나머지를 이용하여 재귀적으로 처리\n        return n % 10 + sum_of_digits(n // 10)\n\n# 예시 사용\nnumber = 12345\nnumber = abs(number)\nresult = sum_of_digits(number)\nprint(f\"{number}의 각 자릿수 숫자들의 합은 {result}입니다.\")\n", "nb": 3, "fns": ["sum_of_digits"], "lines": 13}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "pe2707405c91a475cafa3cd354b22c247", "path": ["중급 문제", "Sum of digits of a number"], "lang": "cpp", "code": "#include <iostream>\n#include <cstdlib>\nusing namespace std;\n\nint sum_of_digits(int n) {\n    if (n < 10)                              // base case: 한 자리 숫자\ )\nprint(\"평균:\", average) # 평균: 0", "nb": 6, "fns": ["array_average"], "lines": 18}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "p8af391f930c0474ead8bb4a9a0c8b805", "path": ["중급 문제", "Average of array"], "lang": "cpp", "code": "#include <iostream>\n#include <vector>\nusing namespace std;\n\ndouble array_average(const vector<int>& arr) {\n    if (arr.empty())\n        return 0;\n    int total = 0;\n    for (int num : arr)\n        total += num;\n    return (double)total / arr.size();\n}\n\nint main() {\n    cout << \"평균: \" << array_average({1, 2, 3, 4, 5}) << \"\\n\";   // 평균: 3\n    cout << \"평균: \" << array_average({}) << \"\\n\";                // 평균: 0\n    return 0;\n}", "nb": 6, "fns": ["array_average"], "lines": 18, "extra": 1}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "p8af391f930c0474ead8bb4a9a0c8b805", "path": ["중급 문제", "Average of array"], "lang": "py", "code": "def array_average(arr):\n    if not arr:\n        return 0  # 빈 배열인 경우 0을 반환한다.\n    \n    # 재귀 함수 정의\n    def sum_array(arr):\n        if not arr:\n            return 0\n        return arr[0] + sum_array(arr[1:])\n    \n    total_sum = sum_array(arr)\n    return total_sum / len(arr)\n\n# 예시 사용\narr = [1, 2, 3, 4, 5]\naverage = array_average(arr)\nprint(\"평균:\", average) # 평균: 3.0\n\narr = []\naverage = array_average(arr)\nprint(\"평균:\", average) # 평균: 0", "nb": 7, "fns": ["array_average", "sum_array"], "lines": 21}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "p8af391f930c0474ead8bb4a9a0c8b805", "path": ["중급 문제", "Average of array"], "lang": "cpp", "code": "#include <iostream>\n#include <vector>\nusing namespace std;\n\nint sum_array(const vector<int>& arr, size_t i) {   // arr[i:]의 합\n    if (i == arr.size())\n        return 0;\n    return arr[i] + sum_array(arr, i + 1);\n}\n\ndouble array_average(const vector<int>& arr) {\n    if (arr.empty())\n        return 0;\n    int total_sum = sum_array(arr, 0);\n    return (double)total_sum / arr.size();\n}\n\nint main() {\n    cout << \"평균: \" << array_average({1, 2, 3, 4, 5}) << \"\\n\";   // 평균: 3\n    cout << \"평균: \" << array_average({}) << \"\\n\";                // 평균: 0\n    return 0;\n}", "nb": 7, "fns": ["sum_array", "array_average"], "lines": 22, "extra": 1}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "p8af391f930c0474ead8bb4a9a0c8b805", "path": ["중급 문제", "Average of array"], "lang": "py", "code": "def array_mean(arr): \n    if len(arr) == 1: \n        return arr[0] \n    else: \n        return (array_mean(arr[:-1]) * (len(arr)-1) + arr[-1]) / len(arr) \n  \n# 예시 코드\narr = [1] \nprint(array_mean(arr)) # 평균: 1\n\narr = [1, 2, 3, 4, 5] \nprint(array_mean(arr)) # 평균: 3.0", "nb": 3, "fns": ["array_mean"], "lines": 12}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "p8af391f930c0474ead8bb4a9a0c8b805", "path": ["중급 문제", "Average of array"], "lang": "cpp", "code": "#include <iostream>\n#include <vector>\nusing namespace std;\n\n// 앞의 n개 원소의 평균 = (앞의 n-1개 평균 * (n-1) + 마지막 원소) / n\ndouble array_mean(const vector<int>& arr, int n) {\n    if (n == 1)\n        return arr[0];\n    else\n        return (array_mean(arr, n - 1) * (n - 1) + arr[n - 1]) / n;\n}\n\nint main() {\n    vector<int> a = {1};\n    cout << array_mean(a, a.size()) << \"\\n\";   // 1\n    vector<int> b = {1, 2, 3, 4, 5};\n    cout << array_mean(b, b.size()) << \"\\n\";   // 3\n    return 0;\n}", "nb": 3, "fns": ["array_mean"], "lines": 19, "extra": 1}, {"ci": 5, "ch": "4. 재귀(Recursion)", "kind": "ds", "sid": "p8af391f930c0474ead8bb4a9a0c8b805", "path": ["중급 문제", "Average of array"], "lang": "py", "code": "def array_mean(arr): \n    if len(arr) == 0: \n        return 0\n    elif len(arr) == 1: \n        return arr[0] \n    else: \n        return (array_mean(arr[:-1]) * (len(arr)-1) + arr[-1]) / len(arr) \n  \n# 예시 코드\narr = [] \nprint(\"평균:\", array_mean(arr)) # 평균: 0\n\narr = [1] \nprint(\"평균:\", array_mean(arr)) # 평균: 1\n\narr = [1, 2, 3, 4, 5] \nprint(\"평균:\", array_mean(arr)) #
