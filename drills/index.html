n        else:\n            # 토큰이 연산자인 경우 스택에서 두 개의 숫자를 꺼냄\n            # 주의: 나중에 넣은 숫자가 b(오른쪽 피연산자)가 됩니다.\n            b = stack.pop()\n            a = stack.pop()\n\n            # 연산자에 맞게 계산 후 결과를 다시 스택에 추가\n            if token == '+':\n                stack.append(a + b)\n            elif token == '-':\n                stack.append(a - b)\n            elif token == '*':\n                stack.append(a * b)\n\n    # 모든 연산이 끝나면 스택에 남은 유일한 값이 정답\n    print(stack[0])\n\n# 함수 실행\nif __name__ == \"__main__\":\n    solve()", "nb": 14, "fns": ["solve"], "lines": 34}, {"ci": 19, "ch": "[자료 구조] 실전 문제", "kind": "practice", "sid": "p383713e35a7d80738825ecdf76a06aa2", "path": ["스택", "응용 문제: postfix 수식 계산", "해결 방법"], "lang": "cpp", "code": "#include <iostream>\n#include <string>\n#include <stack>\nusing namespace std;\n\nint main() {\n    int N;\n    cin >> N;\n    stack<long long> st;\n    for (int i = 0; i < N; i++) {\n        string token;\n        cin >> token;\n        bool is_number = isdigit(token.back());        // \"-3\"처럼 음수도 마지막 글자는 숫자\n        if (is_number) st.push(stoll(token));\n        else {\n            long long b = st.top(); st.pop();          // 나중에 넣은 값이 오른쪽 피연산자\n            long long a = st.top(); st.pop();\n            if (token == \"+\") st.push(a + b);\n            else if (token == \"-\") st.push(a - b);\n            else if (token == \"*\") st.push(a * b);\n        }\n    }\n    cout << st.top() << \"\\n\";                          // 남은 하나가 정답\n    return 0;\n}", "nb": 5, "fns": ["main"], "lines": 25, "extra": 1}, {"ci": 19, "ch": "[자료 구조] 실전 문제", "kind": "practice", "sid": "p383713e35a7d8084b808f35a21b4bf95", "path": ["스택", "응용 문제: The Geneva Confection", "해결 방법"], "lang": "py", "code": "# 스택을 이용한 문제\nimport sys\n\ndef solve():\n    # 모든 입력을 한 번에 읽어옵니다.\n    input_data = sys.stdin.read().split()\n    if not input_data:\n        return\n    \n    # 테스트 케이스 개수 T\n    T = int(input_data[0])\n    idx = 1\n    \n    for _ in range(T):\n        N = int(input_data[idx])\n        idx += 1\n        \n        # 1. 산 정상(Mountain) 초기화\n        # 입력은 위에서 아래 순서지만, 리스트에서 빠르게 pop() 하기 위해 역순으로 저장합니다.\n        mountain = []\n        for _ in range(N):\n            mountain.append(int(input_data[idx]))\n            idx += 1\n        mountain.reverse() # 리스트의 맨 끝([-1])이 산의 꼭대기가 됨\n        \n        # 2. 지선(Branch Line, Stack) 초기화\n        branch = []\n        \n        # 3. 호수로 보내야 할 다음 타겟 번호\n        target = 1\n        possible = True\n        \n        # 타겟 번호가 N이 될 때까지 반복\n        while target <= N:\n            # 1순위: 지선(스택)의 맨 끝이 타겟 번호인지 확인\n            if branch and branch[-1] == target:\n                branch.pop()\n                target += 1\n            \n            # 2순위: 산 정상의 꼭대기가 타겟 번호인지 확인\n            elif mountain and mountain[-1] == target:\n                mountain.pop()\n                target += 1\n                \n            # 3순위: 둘 다 아니면 산 정상의 기차를 지선으로 이동\n            elif mountain:\n                branch.append(mountain.pop())\n                \n            # 위 3가지가 모두 불가능하면 더 이상 해결할 수 없음\n            else:\n                possible = False\n                break\n                \n        # 결과 출력\n        if possible:\n            print(\"Y\")\n        else:\n            print(\"N\")\n\n# 함수 실행\nsolve()", "nb": 26, "fns": ["solve"], "lines": 61}, {"ci": 19, "ch": "[자료 구조] 실전 문제", "kind": "practice", "sid": "p383713e35a7d8084b808f35a21b4bf95", "path": ["스택", "응용 문제: The Geneva Confection", "해결 방법"], "lang": "cpp", "code": "#include <iostream>\n#include <vector>\n#include <stack>\n#include <algorithm>\nusing namespace std;\n\nint main() {\n    int T;\n    cin >> T;\n    while (T--) {\n        int N;\n        cin >> N;\n        vector<int> mountain(N);\n        for (int& x : mountain) cin >> x;\n        reverse(mountain.begin(), mountain.end());     // back()이 산의 꼭대기\n        stack<int> branch;                              // 지선 = 스택\n        int target = 1;                                 // 다음으로 호수에 보낼 번호\n        bool possible = true;\n        while (target <= N) {\n            if (!branch.empty() && branch.top() == target) {           // 1순위: 지선\n                branch.pop(); target++;\n            } else if (!mountain.empty() && mountain.back() == target) { // 2순위: 산 꼭대기\n                mountain.pop_back(); target++;\n            } else if (!mountain.empty()) {                              // 3순위: 지선으로 이동\n                branch.push(mountain.back()); mountain.pop_back();\n            } else {                                                     // 더 이상 불가능\n                possible = false;\n                break;\n            }\n        }\n        cout << (possible ? \"Y\" : \"N\") << \"\\n\";\n    }\n    return 0;\n}", "nb": 9, "fns": ["main"], "lines": 34, "extra": 1}, {"ci": 19, "ch": "[자료 구조] 실전 문제", "kind": "practice", "sid": "p383713e35a7d80329a0cd64e4f5a02c0", "path": ["스택", "응용 문제: 수식 계산 문제의 변형: Twenty Four", "해결 방법(back tracking)"], "lang": "py", "code": "import sys\n\ndef solve():\n       \n    N = int(input())\n    idx = 1\n    \n    for _ in range(N):\n        # 4개의 숫자 카드를 리스트로 받습니다\n        cards = [int(input()) for i in range(4)]\n        idx += 4\n        \n        max_val = -float('inf')\n        \n        # DFS 백트래킹 함수 정의\n        def dfs(current_nums):\n            nonlocal max_val\n            \n            # 숫자가 하나만 남았을 때 (모든 연산 종료)\n            if len(current_nums) == 1:\n                val = current_nums[0]\n                # 결과가 24 이하인 경우에만 최대값 갱신\n                if val <= 24 and val > max_val:\n                    max_val = val\n                return\n            \n            # 현재 배열에서 임의의 서로 다른 두 숫자 선택\n            for i in range(len(current_nums)):\n                for j in range(len(current_nums)):\n                    if i != j:\n                        a = current_nums[i]\n                        b = current_nums[j]\n                        \n                        # 선택한 두 숫자를 제외한 나머지 숫자들만 모은 새로운 리스트\n                        next_nums = [current_nums[k] for k in range(len(current_nums)) if k != i and k != j]\n                        \n                        # 두 숫자를 연산한 결과를 리스트에 더해 재귀 호출\n                        dfs(next_nums + [a + b])\n                        dfs(next_nums + [a - b])\n                        dfs(next_nums + [a * b])\n                        \n                        # 문제의 특수 조건: 나누어 떨어질 때만 나눗셈 허용 (그리고 0으로 나누기 방지)\n                        if b != 0 and a % b == 0:\n                            dfs(next_nums + [a // b])\n        \n        # 탐색 시작\n        dfs(cards)\n        print(max_val)\n\n\"\"\"\nSample Input\n3\n3\n3\n3\n3\n1\n1\n1\n1\n12\n5\n13\n1\n\nOutput for Sample Input\n24\n4\n21\n\"\"\"\n\nsolve()\n\n\n", "nb": 22, "fns": ["solve", "dfs"], "lines": 72}, {"ci": 19, "ch": "[자료 구조] 실전 문제", "kind": "practice", "sid": "p383713e35a7d80329a0cd64e4f5a02c0", "path": ["스택", "응용 문제: 수식 계산 문제의 변형: Twenty Four", "해결 방법(back tracking)"], "lang": "cpp", "code": "#include <iostream>\n#include <vector>\n#include <climits>\nusing namespace std;\n\nint max_val;\n\nvoid dfs(const vector<int>& current_nums) {\n    if (current_nums.size() == 1) {                    // 숫자가 하나 남으면 연산 끝\n        int val = current_nums[0];\n        if (val <= 24 && val > max_val) max_val = val; // 24 이하 중 최대\n        return;\n    }\n    int n = current_nums.size();\n    for (int i = 0; i < n; i++)\n        for (int j = 0; j < n; j++) {\n            if (i == j) continue;\n            int a = current_nums[i], b = current_nums[j];\n            vector<int> next_nums;                     // 고른 두 수를 뺀 나머지\n            for (int k = 0; k < n; k++) if (k != i && k != j) next_nums.push_back(current_nums[k]);\n            for (int r : {a + b, a - b, a * b}) {\n                next_nums.push_back(r);\n                dfs(next_nums);\n                next_nums.pop_back();                  // 백트래킹\n            }\n            if (b != 0 && a % b == 0) {                // 나누어떨어질 때만 나눗셈\n                next_n erate(i + 1, current + [arr[i]], arr)\n    \n# main\ngenerate(0, [], [1,2,3])\n\n\"\"\"\n[]\n[3]\n[2]\n[2, 3]\n[1]\n[1, 3]\n[1, 2]\n[1, 2, 3]\n\"\"\"", "nb": 3, "fns": ["generate"], "lines": 23}, {"ci": 20, "ch": "[알고리즘] 실전 문제", "kind": "practice", "sid": "p375713e35a7d80f5b678f540d9c3c178", "path": ["LDS(Longest Decreasing Sequence)", "Subsequence", "DFS(depth first search)"], "lang": "cpp", "code": "#include <iostream>\n#include <vector>\nusing namespace std;\n\nvoid print(const vector<int>& s) {          // Python 리스트처럼 [1, 2] 형태로 출력\n    cout << \"[\";\n    for (size_t i = 0; i < s.size(); i++) cout << s[i] << (i + 1 < s.size() ? \", \" : \"\");\n    cout << \"]\";\n}\n\n// i번째 원소를 \"안 넣는다 / 넣는다\" 두 갈래로 내려가는 DFS\nvoid generate(int i, vector<int> current, const vector<int>& arr) {\n    if (i == (int)arr.size()) {\n        print(current); cout << \"\\n\";\n        return;\n    }\n    generate(i + 1, current, arr);           // arr[i] 미포함\n    current.push_back(arr[i]);\n    generate(i + 1, current, arr);           // arr[i] 포함\n}\n\nint main() {\n    generate(0, {}, {1, 2, 3});\n    return 0;\n}", "nb": 4, "fns": ["generate"], "lines": 25, "extra": 1}, {"ci": 20, "ch": "[알고리즘] 실전 문제", "kind": "practice", "sid": "p375713e35a7d8008a580c5fc189fa441", "path": ["LDS(Longest Decreasing Sequence)", "Subsequence", "backtracking"], "lang": "py", "code": "def generate(i, current, arr, result):\n\n    result.append(current[:])\n\n    for j in range(i, len(arr)):\n        current.append(arr[j])\n        generate(j + 1, current, arr, result)\n        current.pop()\n\n\n# 메인 코드\nnums = [1, 2, 3]\nresult = []\n\ngenerate(0, [], nums, result)\n\nfor s in result:\n    print(s)", "nb": 5, "fns": ["generate"], "lines": 18}, {"ci": 20, "ch": "[알고리즘] 실전 문제", "kind": "practice", "sid": "p375713e35a7d8008a580c5fc189fa441", "path": ["LDS(Longest Decreasing Sequence)", "Subsequence", "backtracking"], "lang": "cpp", "code": "#include <iostream>\n#include <vector>\nusing namespace std;\n\nvoid print(const vector<int>& s) {          // Python 리스트처럼 [1, 2] 형태로 출력\n    cout << \"[\";\n    for (size_t i = 0; i < s.size(); i++) cout << s[i] << (i + 1 < s.size() ? \", \" : \"\");\n    cout << \"]\";\n}\n\nvoid generate(int i, vector<int>& current, const vector<int>& arr, vector<vector<int>>& result) {\n    result.push_back(current);               // 현재 상태를 결과에 저장\n    for (int j = i; j < (int)arr.size(); j++) {\n        current.push_back(arr[j]);           // 선택\n        generate(j + 1, current, arr, result);\n        current.pop_back();                  // 되돌리기 (백트래킹)\n    }\n}\n\nint main() {\n    vector<int> nums = {1, 2, 3}, current;\n    vector<vector<int>> result;\n    generate(0, current, nums, result);\n    for (auto& s : result) { print(s); cout << \"\\n\"; }\n    return 0;\n}", "nb": 5, "fns": ["generate"], "lines": 26, "extra": 1}, {"ci": 20, "ch": "[알고리즘] 실전 문제", "kind": "practice", "sid": "p375713e35a7d80d9a874df05d8bb7b84", "path": ["LDS(Longest Decreasing Sequence)", "LDS", "LDS brute force 함수"], "lang": "py", "code": "def subsequences(lis):\n    if lis == []:\n        return [[]]\n\n    not_include_subset = subsequences(lis[1:])\n    return not_include_subset + [[lis[0]] + s for s in not_include_subset]\n\n\ndef is_decreasing(seq):\n    for i in range(len(seq) - 1):\n        if seq[i] <= seq[i + 1]:\n            return False\n    return True\n\n\ndef LDS_bruteforce(arr):\n    all_subseq = subsequences(arr)\n    for seq in all_subseq:\n        print(seq)\n\n    max_len = 0\n    best_seq = []\n\n    for seq in all_subseq:\n        if is_decreasing(seq):\n            if len(seq) > max_len:\n                max_len = len(seq)\n                best_seq = seq\n\n    return max_len, best_seq\n    \n\n# 사용 예시\nnums = [15, 11, 4, 8, 5, 2, 4]\n\nlength, seq = LDS_bruteforce(nums)\n\nprint(length)\nprint(seq)", "nb": 18, "fns": ["subsequences", "is_decreasing", "LDS_bruteforce"], "lines": 39}, {"ci": 20, "ch": "[알고리즘] 실전 문제", "kind": "practice", "sid":  min_total_swaps = min({min_total_swaps, swaps_abc, swaps_acb});\n    }\n    return min_total_swaps;\n}\n\nint main() {\n    cout << min_swaps(\"BABCBCACCA\") << \"\\n\";   // 2\n    return 0;\n}", "nb": 25, "fns": ["min_swaps"], "lines": 49, "extra": 1}, {"ci": 20, "ch": "[알고리즘] 실전 문제", "kind": "practice", "sid": "p38f713e35a7d80ada19ae846dd6211f1", "path": ["백트래킹", "응용 문제: Chances of Winning", "해결 방법: brute-force"], "lang": "py", "code": "# 반복문 사용\ndef solve():\n    T = int(input())\n    G = int(input())\n    \n    # 1~4팀의 현재 점수와 경기 여부\n    scores = [0] * 5\n    played = [[False] * 5 for _ in range(5)]\n    \n    for _ in range(G):\n        a, b, sa, sb = map(int, input().split())\n        played[a][b] = played[b][a] = True\n        if sa > sb: scores[a] += 3\n        elif sb > sa: scores[b] += 3\n        else:\n            scores[a] += 1\n            scores[b] += 1\n            \n    # 남은 경기 리스트\n    remaining_games = []\n    for i in range(1, 5):\n        for j in range(i + 1, 5):\n            if not played[i][j]:\n                remaining_games.append((i, j))\n                \n    num_remaining = len(remaining_games)\n    count = 0\n    \n    # 지금까지의 코드는 입력 데이터 정리하는 부분\n    # 아래가 핵심임.\n    # 3의 거듭제곱만큼 반복 (모든 경우의 수 탐색)\n    # 이 것이 키포인트\n    for i in range(3**num_remaining):\n        temp_scores = list(scores)\n        temp_i = i\n        \n        # 각 경기의 결과를 3진법으로 해석\n        for a, b in remaining_games:\n            result = temp_i % 3 # 0: A승, 1: B승, 2: 무승부\n            temp_i //= 3\n            \n            if result == 0: temp_scores[a] += 3\n            elif result == 1: temp_scores[b] += 3\n            else:\n                temp_scores[a] += 1\n                temp_scores[b] += 1\n        \n        # 우승 판별 (T팀이 단독 1위인지)\n        is_champion = True\n        for team in range(1, 5):\n            if team != T and temp_scores[team] >= temp_scores[T]:\n                is_champion = False\n                break\n        \n        if is_champion:\n            count += 1\n            \n    print(count)\n\n\"\"\"\nSample Input 1\n3\n3\n1 3 7 5\n3 4 0 8\n2 4 2 2\n\nOutput for Sample Input 1\n0\n\nSample Input 2\n3\n4\n1 3 5 7\n3 4 8 0\n2 4 2 2\n1 2 5 5\n\nOutput for Sample Input 2\n9\n\n\"\"\"\n\nsolve()\n", "nb": 34, "fns": ["solve"], "lines": 84}, {"ci": 20, "ch": "[알고리즘] 실전 문제", "kind": "practice", "sid": "p38f713e35a7d80ada19ae846dd6211f1", "path": ["백트래킹", "응용 문제: Chances of Winning", "해결 방법: brute-force"], "lang": "cpp", "code": "#include <iostream>\n#include <vector>\n#include <utility>\nusing namespace std;\n\nint main() {\n    int T, G;\n    cin >> T >> G;\n    vector<int> scores(5, 0);                          // 1~4팀 점수\n    vector<vector<bool>> played(5, vector<bool>(5, false));\n    for (int g = 0; g < G; g++) {\n        int a, b, sa, sb;\n        cin >> a >> b >> sa >> sb;\n        played[a][b] = played[b][a] = true;\n        if (sa > sb) scores[a] += 3;\n        else if (sb > sa) scores[b] += 3;\n        else { scores[a] += 1; scores[b] += 1; }\n    }\n    vector<pair<int, int>> remaining_games;            // 남은 경기\n    for (int i = 1; i <= 4; i++)\n        for (int j = i + 1; j <= 4; j++)\n            if (!played[i][j]) remaining_games.push_back({i, j});\n\n    int total = 1;\n    for (size_t k = 0; k < remaining_games.size(); k++) total *= 3;   // 3^남은경기\n    int count = 0;\n    for (int i = 0; i < total; i++) {                  // 각 i를 3진법으로 해석\n        vector<int> temp_scores = scores;\n        int temp_i = i;\n        for (auto [a, b] : remaining_games) {\n            int result = temp_i % 3;                   // 0: A승, 1: B승, 2: 무승부\n            temp_i /= 3;\n            if (result == 0) temp_scores[a] += 3;\n            else if (result == 1) temp_scores[b] += 3;\n            else { temp_scores[a] += 1; temp_scores[b] += 1; }\n        }\n        bool is_champion = true;                       // T팀이 단독 1위인가\n        for (int team = 1; team <= 4; team++)\n            if (team != T && temp_scores[team] > const BOOK = '../';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const store = { get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} } };
function hash(s){ let h = 2166136261; for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); }
P.forEach((p, i) => { p.key = p.sid + '-' + hash(p.code); p.idx = i; });

const S = Object.assign({ py: false, cpp: true, ch: 'all', q: '', todo: false, orig: false }, store.get('dp-view') || {});
const DONE = new Set(store.get('dp-done') || []);
const save = () => { store.set('dp-view', { py: S.py, cpp: S.cpp, ch: S.ch, todo: S.todo, orig: S.orig }); };
let tt; function toast(m){ const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 1600); }

const CHS = [...new Map(P.map(p => [p.ci, { ci: p.ci, title: p.ch, kind: p.kind }])).values()].sort((a, b) => a.ci - b.ci);
const chName = t => t.replace(/^\d+\.\s*/, '');
const chNum = t => (t.match(/^(\d+)\./) || [])[1];

function visible(p){
  if (!S[p.lang]) return false;
  if (S.ch !== 'all' && p.ci !== +S.ch) return false;
  if (S.todo && DONE.has(p.key)) return false;
  if (S.orig && p.extra) return false;
  if (S.q){ const hay = (p.path.join(' ') + ' ' + p.ch + ' ' + p.fns.join(' ')).toLowerCase(); if (!S.q.toLowerCase().split(/\s+/).every(w => hay.includes(w))) return false; }
  return true;
}

function card(p){
  const title = p.path[p.path.length - 1] || chName(p.ch);
  const crumb = p.path.slice(0, -1).join(' › ');
  const fns = p.fns.filter((f, i, a) => a.indexOf(f) === i);
  return `<details class="pc${DONE.has(p.key) ? ' done' : ''}" data-i="${p.idx}" id="q-${p.key}">
    <summary><span class="lt ${p.lang}">${p.lang === 'cpp' ? 'C++' : 'Py'}</span>
      <span class="pm"><span class="pt">${esc(title)}${p.extra ? '<span class="xt">추가 구현</span>' : ''}</span>${crumb ? `<div class="pp">${esc(crumb)}</div>` : ''}
        <div class="pf">${fns.length ? `<span>${fns.slice(0, 6).map(f => `<code>${esc(f)}()</code>`).join(' ')}${fns.length > 6 ? ` 외 ${fns.length - 6}개` : ''}</span>` : ''}<span>${p.lines}줄 코드</span></div></span>
      <span class="okm" aria-label="${DONE.has(p.key) ? '푼 문제' : '안 푼 문제'}">✓</span></summary>
    <div class="pb"></div></details>`;
}

function render(){
  const main = $('#main');
  const shown = P.filter(visible);
  // chips
  const base = P.filter(p => S[p.lang] && !(S.orig && p.extra));
  $('#chips').innerHTML = `<button type="button" class="chip${S.ch === 'all' ? ' on' : ''}" data-ch="all">전체<span class="c">${base.length}</span></button>` +
    CHS.map(c => { const n = base.filter(p => p.ci === c.ci).length; if (!n) return ''; const num = chNum(c.title);
      return `<button type="button" class="chip${String(S.ch) === String(c.ci) ? ' on' : ''}" data-ch="${c.ci}">${num ? num + '장 ' : ''}${esc(chName(c.title).replace(/\[(알고리즘|자료 구조)\]\s*/, '').split(/[:(]/)[0].trim())}<span class="c">${n}</span></button>`; }).join('');
  if (!shown.length){ main.innerHTML = `<section class="sheet grp"><div class="wrap"><p class="empty">조건에 맞는 문제가 없어요. 위에서 언어(Py / C++)나 필터를 바꿔 보세요.</p></div></section>`; }
  else main.innerHTML = CHS.map(c => {
    const ps = shown.filter(p => p.ci === c.ci); if (!ps.length) return '';
    const d = ps.filter(p => DONE.has(p.key)).length;
    const alg = /\[알고리즘\]/.test(c.title);
    return `<section class="sheet grp"><div class="wrap"><div class="gh"><h2>${esc(c.title)}</h2>${alg ? '<span class="badge alg">알고리즘</span>' : ''}<span class="meta">${ps.length}문제 · ${d}개 완료</span></div><div class="list">${ps.map(card).join('')}</div></div></section>`;
  }).join('');
  stats(shown.length);
  paintLangs();
}
function stats(nShown){
  const pool = P.filter(p => S[p.lang] && !(S.orig && p.extra));
  const done = pool.filter(p => DONE.has(p.key)).length;
  $('#sDone').textContent = `${done}/${pool.length}`;
  $('#pbar').style.width = (pool.length ? done / pool.length * 100 : 0) + '%';
}
function paintLangs(){ document.querySelectorAll('#langs [data-lang]').forEach(b => { b.classList.toggle('on', !!S[b.dataset.lang]); b.setAttribute('aria-pressed', !!S[b.dataset.lang]); }); }

// lazy mount the drill when a card opens
document.addEventListener('toggle', e => {
  const d = e.target; if (!d.matches || !d.matches('details.pc') || !d.open) return;
  const body = d.querySelector('.pb'); if (body.dataset.ready) return; body.dataset.ready = '1';
  const p = P[+d.dataset.i];
  body.innerHTML = `<div class="pb-top"><a href="${BOOK}#${esc(p.sid)}" target="_blank" rel="noopener">교재에서 보기 ↗</a><button type="button" data-mark>${DONE.has(p.key) ? '완료 해제' : '완료로 표시'}</button></div>
    <figure class="code"><div class="code-h"><span>${p.lang === 'cpp' ? 'C++' : 'Python'}</span></div><pre><code class="language-${p.lang === 'cpp' ? 'cpp' : 'python'}"></code></pre></figure>`;
  body.querySelector('code').textContent = p.code;
  Drill.mountAll(body);
  const dr = body.querySelector('details.drill'); if (dr) dr.open = true;
}, true);

function setDone(key, on){
  if (on) DONE.add(key); else DONE.delete(key);
  store.set('dp-done', [...DONE]);
  const d = document.getElementById('q-' + key);
  if (d){ d.classList.toggle('done', on); const m = d.querySelector('[data-mark]'); if (m) m.textContent = on ? '완료 해제' : '완료로 표시'; }
  stats();
}
document.addEventListener('click', e => {
  const m = e.target.closest('[data-mark]');
  if (m){ const d = m.closest('details.pc'); const p = P[+d.dataset.i]; setDone(p.key, !DONE.has(p.key)); return; }
  const act = e.target.closest('.pb [data-act="check"], .pb [data-act="cmp"]');
  if (act){ const d = act.closest('details.pc'); setTimeout(() => {
      const sc = d.querySelector('.dr-pane .dr-score'); if (sc && /🎉/.test(sc.textContent)){ const p = P[+d.dataset.i]; if (!DONE.has(p.key)){ setDone(p.key, true); toast('만점! 완료로 표시했어요 ✓'); } }
    }, 0); }
});

$('#langs').onclick = e => { const b = e.target.closest('[data-lang]'); if (!b) return; S[b.dataset.lang] = !S[b.dataset.lang]; save(); render(); toast(`${b.dataset.lang === 'py' ? 'Python' : 'C++'} 문제 ${S[b.dataset.lang] ? '보이기' : '숨기기'}`); };
$('#chips').onclick = e => { const b = e.target.closest('[data-ch]'); if (!b) return; S.ch = b.dataset.ch; save(); render(); };
$('#orig').onclick = () => { S.orig = !S.orig; save(); syncTogs(); render(); };
$('#todo').onclick = () => { S.todo = !S.todo; save(); syncTogs(); render(); };
let qt; $('#q').oninput = e => { clearTimeout(qt); qt = setTimeout(() => { S.q = e.target.value.trim(); render(); }, 150); };
$('#rand').onclick = () => {
  const pool = P.filter(p => S[p.lang] && !DONE.has(p.key) && !(S.orig && p.extra));
  if (!pool.length){ toast('안 푼 문제가 없어요 🎉'); return; }
  const p = pool[Math.floor(Math.random() * pool.length)];
  if (!visible(p)){ S.ch = 'all'; S.q = ''; $('#q').value = ''; S.todo = false; syncTogs(); render(); }
  const d = document.getElementById('q-' + p.key); d.open = true; d.scrollIntoView({ block: 'start', behavior: 'smooth' });
};
$('#reset').onclick = () => { if (!DONE.size){ toast('지울 기록이 없어요'); return; } const n = DONE.size; DONE.clear(); store.set('dp-done', []); render(); toast(`완료 기록 ${n}개를 지웠어요`); };
function syncTogs(){ $('#orig').setAttribute('aria-pressed', S.orig); $('#todo').setAttribute('aria-pressed', S.todo); }
syncTogs(); render();
</script>
