ead 1: Lock1을 획득!\nThread 2: Lock2을 획득 시도 중...\nThread 2: Lock2을 획득!\nThread 2: Lock1을 획득 시도 중...\nThread 1: Lock2을 획득 시도 중...\n\"\"\"", "nb": 10, "fns": ["thread1", "thread2"], "lines": 53}, {"ci": 10, "ch": "8. 스택과 큐: 후입선출/선입선출의 활용", "kind": "ds", "sid": "p39d713e35a7d80f18740d9c23539cf75", "path": ["[참고] Parallel Programming in Python", "동기화와 공유 자원 관리", "교착상태(deadlock)", "in deadlock"], "lang": "cpp", "code": "#include <iostream>\n#include <thread>\n#include <mutex>\n#include <chrono>\nusing namespace std;\n\nmutex lock1, lock2;   // 두 개의 Lock\n\nvoid thread1() {\n    cout << \"Thread 1: Lock1을 획득 시도 중...\\n\";\n    lock1.lock();\n    cout << \"Thread 1: Lock1을 획득!\\n\";\n    this_thread::sleep_for(chrono::seconds(1));\n    cout << \"Thread 1: Lock2을 획득 시도 중...\\n\";\n    lock2.lock();                        // thread2가 lock2를 쥐고 있으면 영원히 대기\n    cout << \"Thread 1: Lock2을 획득!\\n\";\n    lock2.unlock();\n    lock1.unlock();\n}\n\nvoid thread2() {\n    cout << \"Thread 2: Lock2을 획득 시도 중...\\n\";\n    lock2.lock();\n    cout << \"Thread 2: Lock2을 획득!\\n\";\n    this_thread::sleep_for(chrono::seconds(1));\n    cout << \"Thread 2: Lock1을 획득 시도 중...\\n\";\n    lock1.lock();                        // thread1이 lock1을 쥐고 있으면 영원히 대기 -> 교착 상태\n    cout << \"Thread 2: Lock1을 획득!\\n\";\n    lock1.unlock();\n    lock2.unlock();\n}\n\nint main() {\n    thread t1(thread1), t2(thread2);\n    t1.join();\n    t2.join();\n    cout << \"모든 스레드 종료\\n\";        // 교착 상태라 여기까지 오지 못한다\n    return 0;\n}\n// 해결책: 두 락을 항상 같은 순서로 잡거나, std::scoped_lock lk(lock1, lock2); 로 한 번에 잡는다.", "nb": 10, "fns": ["thread1", "thread2"], "lines": 40, "extra": 1}, {"ci": 10, "ch": "8. 스택과 큐: 후입선출/선입선출의 활용", "kind": "ds", "sid": "p390713e35a7d808c92e6cccb73ef2892", "path": ["8.8. 큐의 활용", "활용 1: 생산자-소비자 문제(Producer and Consumer Problem)", "Python 구현 예제"], "lang": "py", "code": "import threading\nimport time\nimport random\nfrom queue import Queue\n\n# 버퍼 크기\nBUFFER_SIZE = 5\n\n# 생산자 함수\ndef producer(queue):\n    while True:\n        # 생산자가 생산할 아이템 (랜덤한 값)\n        item = random.randint(1, 100)\n        if queue.qsize() < BUFFER_SIZE:\n            queue.put(item)\n            print(f\"생산자: {item} 생산\")\n        else:\n            print(\"버퍼가 꽉 찼습니다. 소비자가 아이템을 소비할 때까지 대기 중...\")\n        time.sleep(random.uniform(0.5, 2.5))  # 생산 속도 조절\n\n# 소비자 함수\ndef consumer(queue):\n    while True:\n        if not queue.empty():\n            item = queue.get()\n            print(f\"소비자: {item} 소비\")\n        else:\n            print(\"버퍼가 비었습니다. 생산자가 아이템을 생산할 때까지 대기 중...\")\n        time.sleep(random.uniform(0.5, 1.5))  # 소비 속도 조절\n\n# 큐 객체 생성\nqueue = Queue(BUFFER_SIZE)\n\n# 생산자와 소비자 스레드 생성\nproducer_thread = threading.Thread(target=producer, args=(queue,))\nconsumer_thread = threading.Thread(target=consumer, args=(queue,))\n\n# 스레드 시작\nproducer_thread.start()\nconsumer_thread.start()\n\n# 메인 스레드가 종료되지 않도록 대기\nproducer_thread.join()\nconsumer_thread.join()\n\n\"\"\"\n생산자: 2 생산\n소비자: 2 소비\n버퍼가 비었습니다. 생산자가 아이템을 생산할 때까지 대기 중...\n생산자: 37 생산\n소비자: 37 소비\n생산자: 80 생산\n소비자: 80 소비\n생산자: 99 생산\n소비자: 99 소비\n버퍼가 비었습니다. 생산자가 아이템을 생산할 때까지 대기 중...\n생산자: 86 생산\n소비자: 86 소비\n\n\"\"\"", "nb": 9, "fns": ["producer", "consumer"], "lines": 60}, {"ci": 10, "ch": "8. 스택과 큐: 후입선출/선입선출의 활용", "kind": "ds", "sid": "p390713e35a7d808c92e6cccb73ef2892", "path": ["8.8. 큐의 활용", "활용 1: 생산자-소비자 문제(Producer and Consumer Problem)", "Python 구현 예제"], "lang": "cpp", "code": "#include <iostream>\n#include <queue>\n#include <thread>\n#include <mutex>\n#include <condition_variable>\n#include <random>\n#include <chrono>\nusing namespace std;\n\nconst size_t BUFFER_SIZE = 5;   // 버퍼 크기\nqueue<int> buffer;              // 공유 큐\nmutex m;\ncondition_variable not_full, not_empty;\n\nvoid producer(int count) {\n    mt19937 rng(1);\n    for (int k = 0; k < count; k++) {\n        int item = rng() % 100 + 1;\n        unique_lock<mutex> lk(m);\n        not_full.wait(lk, [] { return buffer.size() < BUFFER_SIZE; });   // 꽉 차면 대기\n        buffer.push(item);\n        cout << \"생산자: \" << item << \" 생산\\n\";\n        lk.unlock();\n        not_empty.notify_one();                                         // 소비자 깨우기\n        this_thread::sleep_for(chrono::milliseconds(50));\n    }\n}\n\nvoid consumer(int count) {\n    for (int k = 0; k < count; k++) {\n        unique_lock<mutex> lk(m);\n        not_empty.wait(lk, [] { return !buffer.empty(); });            // 비었으면 대기\n        int item = buffer.front();\n        buffer.pop();\n        cout << \"소비자: \" << item << \" 소비\\n\";\n        lk.unlock();\n        not_full.notify_one();                                          // 생산자 깨우기\n        this_thread::sleep_for(chrono::milliseconds(80));\n    }\n}\n\nint main() {\n    // Python 예제는 무한 반복이지만 여기서는 10개만 주고받고 끝낸다\n    thread p(producer, 10), c(consumer, 10);\n    p.join();\n    c.join();\n    return 0;\n}", "nb": 14, "fns": ["producer", "consumer"], "lines": 48, "extra": 1}, {"ci": 11, "ch": "9. 트리: 효율적인 탐색을 위한 자료구조", "kind": "ds", "sid": "p39d713e35a7d80878b4ce527f5436184", "path": ["이진 트리(binary tree)", "[구현] 배열을 이용한 이진 트리 구현", "Python: 노드 인덱스에 대한 개념 이해"], "lang": "py", "code": "# 배열을 이용한 트리 표현 (완전 이진 트리)\n# [None, 1, 2, 3, 4, 5, 6, 7]\n# 1번 인덱스: 루트(1)\n# 2번 인덱스: 1의 왼쪽 자식(2), 3번 인덱스: 1의 오른쪽 자식(3)\n# 4번 인덱스: 2의 왼쪽 자식(4), 5번 인덱스: 2의 오른쪽 자식(5)\n\ntree = [None, 1, 2, 3, 4, 5, 6, 7]\n\"\"\"\n                  [ 1 ]  <-- 인덱스 1 (Root)\n                 /     \\\n               /         \\\n             /             \\\n          [ 2 ]           [ 3 ]  <-- 인덱스 2, 3\n          /   \\           /   \\\n        /       \\       /       \\\n      [ 4 ]    [ 5 ] [ 6 ]     [ 7 ]  <-- 인덱스 4, 5, 6, 7\n\"\"\"\n\ndef get_left_node_data(index):\n    return tree[index * 2] if index * 2 < len(tree) else None\n\ndef get_right_node_data(index):\n    return tree[index * 2 + 1] if index * 2 + 1 < len(tree) else None\n\ndef get_parent_node(index):\n    return tree[index // 2] if index > 1 else None\n\n# 사용 예시\nprint(f\"루트(1)의 왼쪽 자식: {get_left_child(1)}\")  # 출력: 2\nprint(f\"노드 2의 부모: {get_parent(2)}\")            # 출력: 1", "nb": 3, "fns": ["get_left_node_data", "get_right_node_data", "get_parent_node"], "lines": 30}, {"ci": 11, "ch": "9. 트리: 효율적인 탐색을 위한 자료구조", "kind": "ds", "sid": "p39d713e35a7d8005beefc625527d3d55", "path": ["이진 트리(binary tree)", "[구현] 배열을 이용한 이진 트리 구현", "Python: 배열을 이용한 이진 트리 구현"], "lang": "py", "code": "class ArrayBinaryTree:\n    def __init__(self, size=7):\n        self.size = size\n        self.tree = [None] * (size + 1) # 0번 인덱스는 미사용 (1번이 루트)\n\n    # --- 범위 검사 및 예외 처리 헬퍼 ---\n    def validate_index(self, index):\n        \"\"\"인덱스가 범위를 벗어나면 IndexError를 발생\"\"\"\n        if not (1 <= index <= self.size):\n            raise IndexError(f\"트리 인덱스 범위 초과: {index} (허용 범위: 1 ~ {self.size})\")\n\n    def is_valid_index(self, index):\n        \"\"\"\n        인덱스가 물리적 범위(1 ~ size) 내에 존재하고,\n        해당 위치에 실제 노드 데이터가 존재하는지(is not None) 검사\n        \"\"\"\n        return 1 <= index <= self.size and self.tree[index] is not None\n\t\t\n    # --- 데이터 접근 및 변경 ---\n    def set_data(self, index, data):\n        self.validate_index(index)\n        self.tree[index] = data\n\n    def get_data(self, index):\n        self.validate_index(index)\n        return self.tree[index]\n\n    # --- 인덱스 계산 메서드 ---\n    # 파라미터로 넘겨주는 인덱스의 노드 데이터가 None인지 확인하지 않고 있음.\n    # 왜냐하면...\n    # 반환하는 노드 데이터의 None 여부를 self.is_valid_index(idx) 이렇게 확인하고 있으니까\n    def left_idx(self, parent_idx):\n        self.validate_index(parent_idx) \n        idx = parent_idx * 2\n        return idx if self.is_valid_index(idx) else None\n\n    def right_idx(self, parent_idx):\n        self.validate_index(parent_idx)\n        idx = parent_idx * 2 + 1\n        return idx if self.is_valid_index(idx) else None\n\n    def parent_idx(self, child_idx):\n        self.validate_index(child_idx)\n        if child_idx == 1:\n            return None  # 루트 노드는 부모가 없음\n        idx = child_idx // 2\n        return idx if self.is_valid_index(idx) else None\n\n    def display(self):\n        print(\"트리 배열 상태:\", self.tree[1:])\n\n\n# --- 메인 실행 코드 ---\nif __name__ == \"__main__\":\n    tree = ArrayBinaryTree(7)\n\n    # 1. 데이터 저장 및 출력\n    tree.set_data(1, 'A')\n    tree.set_data(2, 'B')\n    tree.set_data(3, 'C')\n    tree.set_data(4, 'D')\n    tree.display()\n\n    left_1 = tree.left_idx(1)\n    right_1 = tree.right_idx(1)\n    parent_2 = tree.parent_idx(2)\n    parent_1 = tree.parent_idx(1)\n\n    print(f\"1번('A')의 왼쪽 자식 인덱스 : {left_1} -> 데이터: {tree.get_data(left_1)}\")\n    print(f\"1번('A')의 오른쪽 자식 인덱스: {right_1} -> 데이터: {tree.get_data(right_1)}\")\n    print(f\"1번('A')의 부모 인덱스       : {parent_1} (None = 루트)\")", "nb": 18, "fns": ["__init__", "validate_index", "is_valid_index", "set_data", "get_data", "left_idx", "right_idx", "parent_idx"], "lines": 71}, {"ci": 11, "ch": "9. 트리: 효율적인 탐색을 위한 자료구조", "kind": "ds", "sid": "p3bc713e35a7d809285feca5882da4eaa", "path": ["이진 트리(binary tree)", "[구현] 배열을 이용한 이진 트리 구현", "C++: 배열을 이용한 이진 트리 구현"], "lang": "cpp", "code": "#include <iostream>\n#include <vector>\n#include <optional>\n#include <stdexcept>\n#include <string>\n\ntemplate <typename T>\nclass ArrayBinaryTree {\nprivate:\n    size_t size;\n    std::vector<std::optional<T>> tree;\n\n    // --- 범위 검사 및 예외 처리 헬퍼 ---\n    void validate_index(size_t index) const {\n        if (index < 1 || index > size) {\n            throw std::out_of_range(\"트리 인덱스 범위 초과: \" + std::to_string(index) + \n                                    \" (허용 범위: 1 ~ \" + std::to_string(size) + \")\");\n        }\n    }\n\n    // 인덱스가 범위 내에 존재하고, 실제 노드 데이터가 존재하는지(has_value) 검사\n    bool is_valid_index(size_t index) const {\n        return (index >= 1 && index <= size) && tree[index].has_value();\n    }\n    \npublic:\n    explicit ArrayBinaryTree(size_t max_size = 7) \n        : size(max_size), tree(max_size + 1, std::nullopt) {}\n\n    // --- 데이터 접근 및 변경 ---\n    void set_data(size_t index, const T& data) {\n        validate_index(index);\n        tree[index] = data;\n    }\n\n    std::optional<T> get_data(size_t index) const {\n        validate_index(index);\n        return tree[index];\n    }\n\n    // --- 인덱스 계산 메서드 ---\n    std::optional<size_t> left_idx(size_t parent_idx) const {\n        validate_index(parent_idx);\n        size_t idx = parent_idx * 2;\n        if (is_valid_index(idx)) return idx;\n        return std::nullopt;\n    }\n\n    std::optional<size_t> right_idx(size_t parent_idx) const {\n        validate_index(parent_idx);\n        size_t idx = parent_idx * 2 + 1;\n        if (is_valid_index(idx)) return idx;\n        return std::nullopt;\n    }\n\n    std::optional<size_t> parent_idx(size_t child_idx) const {\n        validate_index(child_idx);\n        if (child_idx == 1) return std::nullopt; // 루트 노드는 부모가 없음\n        \n        size_t idx = child_idx / 2;\n        if (is_valid_index(idx)) return idx;\n        return std::nullopt;\n    }\n\n    void display() const {\n        std::cout << \"트리 배열 상태: [ \";\n        for (size_t i = 1; i <= size; ++i) {\n            if (tree[i].has_value()) {\n                std::cout << tree[i].value() << \" \";\n            } else {\n                std::cout << \"None \";\n            }\n        }\n        std::cout << \"]\\n\";\n    }\n};\n\n// --- 메인 실행 코드 ---\nint main() {\n    ArrayBinaryTree<char> tree(7);\n\n    // 1. 데이터 저장 및 출력\n    tree.set_data(1, 'A');\n    tree.set_data(2, 'B');\n    tree.set_data(3, 'C');\n    tree.set_data(4, 'D');\n    tree.display();\n\n    auto left_1 = tree.left_idx(1);\n    auto right_1 = tree.right_idx(1);\n    auto parent_2 = tree.parent_idx(2);\n    auto parent_1 = tree.parent_idx(1);\n\n    if (left_1.has_value()) {\n        std::cout << \"1번('A')의 왼쪽 자식 인덱스 : \" << left_1.value() \n                  << \" -> 데이터: \" << tree.get_data(left_1.value()).value_or('?') << \"\\n\";\n    }\n    if (right_1.has_value()) {\n        std::cout << \"1번('A')의 오른쪽 자식 인덱스: \" << right_1.value() \n                  << \" -> 데이터: \" << tree.get_data(right_1.value()).value_or('?') << \"\\n\";\n    }\n    if (!parent_1.has_value()) {\n        std::cout << \"1번('A')의 부모 인덱스       : std::nullopt (루트)\\n\";\n    }\n\n    return 0;\n}", "nb": 15, "fns": ["validate_index", "is_valid_index", "set_data", "get_data", "left_idx", "right_idx", "parent_idx"], "lines": 107}, {"ci": 11, "ch": "9. 트리: 효율적인 탐색을 위한 자료구조", "kind": "ds", "sid": "p390713e35a7d80f69b58e8699ae2df99", "path": ["이진 트리(binary tree)", "[구현] 연결 리스트를 이용한 이진 트리 구현", "노드(Node) 설계"], "lang": "py", "code": "class Node:\n    def __init__(self, data):\n        self.data = data\n        self.left = None   # 왼쪽 자식 노드\n        self.right = None  # 오른쪽 자신 노드\n        \n        \nif __name__ == \"__main__\":\n    # 1. 노드 생성\n    root = Node('A')\n    node_b = Node('B')\n    node_c = Node('C')\n    node_d = Node('D')\n\n    # 2. 노드 간 연결 (트리 구조 형성)\n    #        A\n    #       / \\\n    #      B   C\n    #     /\n    #    D\n    root.left = node_b\n    root.right = node_c\n    node_b.left = node_d", "nb": 3, "fns": ["__init__"], "lines": 23}, {"ci": 11, "ch": "9. 트리: 효율적인 탐색을 위한 자료구조", "kind": "ds", "sid": "p390713e35a7d80f69b58e8699ae2df99", "path": ["이진 트리(binary tree)", "[구현] 연결 리스트를 이용한 이진 트리 구현", "노드(Node) 설계"], "lang": "cpp", "code": "template <typename T>\nstruct Node {\n    T data;\n    std::shared_ptr<Node<T>> left{nullptr};   // 왼쪽 자식 노드\n    std::shared_ptr<Node<T>> right{nullptr};  // 오른쪽 자식 노드\n\n    explicit Node(const T& val) : data(val) {}\n};\n\n\nint main() {\n    // 1. std::make_shared를 이용한 안전한 동적 노드 생성\n    auto root   = std::make_shared<Node<char>>('A');\n    auto node_b = std::make_shared<Node<char>>('B');\n    auto node_c = std::make_shared<Node<char>>('C');\n    auto node_d = std::make_shared<Node<char>>('D');\n\n    // 2. 노드 간 연결 (트리 구조 형성)\n    //        A\n    //       / \\\n    //      B   C\n    //     /\n    //    D\n    root->left = node_b;\n    root->right = node_c;\n    node_b->left = node_d;\n\n    return 0;\n}", "nb": 8, "fns": ["main"], "lines": 29}, {"ci": 11, "ch": "9. 트리: 효율적인 탐색을 위한 자료구조", "kind": "ds", "sid": "p390713e35a7d80cd8330dcb3c0b6cda0", "path": ["이진 트리(binary tree)", "[구현] 연결 리스트를 이용한 이진 트리 구현", "Python: 이진 트리 클래스"], "lang": "py", "code": "class Node:\n    def __init__(self, data):\n        self.data = data\n        self._left = None   # 왼쪽 자식 노드를 가리킴\n        self._right = None  # 오른쪽 자식 노드를 가리킴\n\n\nclass BinaryTree:\n    def __init__(self, root_data=None):\n        \"\"\"\n        create_tree(): 이진 트리(공집합 트리) 생성.\n        root_data 파라미터를 root 노드의 data로 한다.\n        root_data가 주어지지 않으면 내부 _root는 None(공집합)이 된다.\n        \"\"\"\n        if root_data is None: \n            self._root = None\n        else:\n            self._root = Node(root_data)\n\n    def is_empty(self):\n        \"\"\"is_empty(): 현재 이진 트리가 공집합(Empty Tree)인지 반환\"\"\"\n        return self._root is None\n\n    def get_root_data(self):\n        \"\"\"get_root_data(): 루트 노드에 저장된 데이터 반환\"\"\"\n        if self.is_empty():\n            return None\n        return self._root.data\n\n    def set_root_data(self, x):\n        \"\"\"set_root_data(x): 루트 노드의 데이터를 x로 변경\"\"\"\n        if self.is_empty():\n            self._root = Node(x)\n        else:\n            self._root.data = x\n\n    def get_left_child(self):\n        \"\"\"get_left_child(): 현재 트리의 왼쪽 서브 트리 반환\"\"\"\n        sub_tree = BinaryTree()  # 반환할 빈 트리 객체 생성\n        if not self.is_empty() and self._root._left is not None:\n            sub_tree._root = self._root._left  # 왼쪽 자식 노드를 루트로 연결\n        return sub_tree  # 자식이 없더라도 정의에 따라 '공집합 이진 트리' 반환\n\n    def get_right_child(self):\n        \"\"\"get_right_child(): 현재 트리의 오른쪽 서브 트리 반환\"\"\"\n        sub_tree = BinaryTree() # empty tree 생성\n        if not self.is_empty() and self._root._right is not None:\n            sub_tree._root = self._root._right\n        return sub_tree\n\n    def set_left_child(self, sub):\n        \"\"\"set_left_child(sub): 현재 트리의 Left에 새로운 서브 트리 sub 연결\"\"\"\n        if self.is_empty():\n            print(\"공집합 트리에는 자식 서브 트리를 연결할 수 없습니다.\")\n            return\n        # 인자로 받은 sub 트리 객체의 _root 노드를 현재 노드의 _left에 연결\n        self._root._left = sub._root if (sub and not sub.is_empty()) else None\n        \n        \"\"\"\n        참고:\n        test = BinaryTree()\n        print(test is None) # False\n        print(test._root is None) # True\n        \"\"\"\n\n    def set_right_child(self, sub):\n        \"\"\"set_right_child(sub): 현재 트리의 Right에 새로운 서브 트리 sub 연결\"\"\"\n        if self.is_empty():\n            print(\"공집합 트리에는 자식 서브 트리를 연결할 수 없습니다.\")\n            return\n        self._root._right = sub._root if (sub and not sub.is_empty()) else None\n\n\n# =================================================================\n# [트리 구조]\n#         A\n#       /   \\\n#      B     C\n#     / \\     \n#    D   E     \n# =================================================================\n\n# 1. 단말 노드(Leaf Node) 서브 트리 생성\ntree_d = BinaryTree('D')\ntree_e = BinaryTree('E')\n\n# 2. 중간 서브 트리 구성 (Bottom-up)\ntree_b = BinaryTree('B')\ntree_b.set_left_child(tree_d)\ntree_b.set_right_child(tree_e)\n\ntree_c = BinaryTree('C')\n\n# 3. 루트 노드 생성 및 전체 트리 완성\nmain_tree = BinaryTree('A')\nmain_tree.set_left_child(tree_b)\nmain_tree.set_right_child(tree_c)\n\n\n# --- ADT 메서드 활용 테스트 ---\nprint(\"=== 1. 루트 및 1단계 자식 노드 조회 ===\")\nprint(f\"루트 노드 데이터: {main_tree.get_root_data()}\")\n\nleft_sub = main_tree.get_left_child()\nright_sub = main_tree.get_right_child()\n\nprint(f\"왼쪽 자식(B) 루트 데이터: {left_sub.get_root_data()}\")\nprint(f\"오른쪽 자식(C) 루트 데이터: {right_sub.get_root_data()}\")\n\n\nprint(\"\\n=== 2. 연속적 메서드 호출(Chaining)을 통한 깊은 노드 접근 ===\")\n# A -> B -> D 접근\nd_data = main_tree.get_left_child().get_left_child().get_root_data()\nprint(f\"A -> 왼쪽 -> 왼쪽 데이터: {d_data}\")\n\n\nprint(\"\\n=== 3. 데이터 수정 연산 ===\")\n# B 노드의 데이터 변경\nleft_sub.set_root_data('B_MODIFIED')\nprint(f\"수정 후 루트의 왼쪽 자식 데이터: {main_tree.get_left_child().get_root_data()}\")", "nb": 25, "fns": ["__init__", "__init__", "is_empty", "get_root_data", "set_root_data", "get_left_child", "get_right_child", "set_left_child", "set_right_child"], "lines": 120}, {"ci": 11, "ch": "9. 트리: 효율적인 탐색을 위한 자료구조", "kind": "ds", "sid": "p3bc713e35a7d80aaaab5d7f39b609201", "path": ["이진 트리(binary tree)", "[구현] 연결 리스트를 이용한 이진 트리 구현", "C++: 이진 트리 클래스"], "lang": "cpp", "code": "#include <iostream>\n#include <memory>\n#include <string>\n\n// 1. Node 구조체 정의\ntemplate <typename T>\nstruct Node {\n    T data;\n    std::shared_ptr<Node<T>> left{nullptr};   // 왼쪽 자식 노드\n    std::shared_ptr<Node<T>> right{nullptr};  // 오른쪽 자식 노드\n\n    explicit Node(const T& val) : data(val) {}\n};\n\n// 2. BinaryTree 클래스 정의\ntemplate <typename T>\nclass BinaryTree {\nprivate:\n    std::shared_ptr<Node<T>> root{nullptr};\n\n    // 내부 전용 생성자: 기존 노드 포인터로 서브 트리 객체를 포장(wrap)할 때 사용\n    // std::shared_ptr는 복사할 때마다 내부 참조 횟수(Reference Count)가 늘어나기 때문에 \n    // 약간의 오버헤드가 발생할 수 있다.\n    // std::move를 사용하면 복사 대신 소유권 자체를 그대로 이전(Move)한다.\n    // 즉, 인자로 넘어온 node가 가지고 있던 노드 제어권을 성능 저하 없이 \n    // root에게 넘겨준다.\n    explicit BinaryTree(std::shared_ptr<Node<T>> node) : root(std::move(node)) {}\n\npublic:\n    // 기본 생성자 (공집합 트리 생성)\n    BinaryTree() = default;\n\n    // 루트 데이터를 받아서 생성하는 생성자\n    explicit BinaryTree(const T& root_data) {\n        root = std::make_shared<Node<T>>(root_data);\n    }\n\n    // is_empty(): 현재 이진 트리가 공집합인지 확인\n    bool is_empty() const {\n        return root == nullptr;\n    }\n\n    // get_root_data(): 루트 노드의 데이터 반환\n    // template class여서 발행하는 문제를 해결하기 위해서, 디폴트 매개변수 필요함\n    T get_root_data(T default_val = T{}) const {\n        if (is_empty()) {\n            return default_val;\n        }\n        return root->data;\n    }\n\n    // set_root_data(x): 루트 노드의 데이터를 x로 설정하거나 신규 생성\n    void set_root_data(const T& x) {\n        if (is_empty()) {\n            root = std::make_shared<Node<T>>(x);\n        } else {\n            root->data = x;\n        }\n    }\n\n    // get_left_child(): 왼쪽 서브 트리 반환\n    BinaryTree get_left_child() const {\n        if (!is_empty() && root->left != nullptr) {\n            return BinaryTree(root->left);\n        }\n        return BinaryTree(); // 자식이 없으면 공집합 이진 트리 반환\n    }\n\n    // get_right_child(): 오른쪽 서브 트리 반환\n    BinaryTree get_right_child() const {\n        if (!is_empty() && root->right != nullptr) {\n            return BinaryTree(root->right);\n        }\n        return BinaryTree();\n    }\n\n    // set_left_child(sub): 왼쪽 자리에 새로운 서브 트리 sub 연결\n    void set_left_child(const BinaryTree& sub) {\n        if (is_empty()) {\n            std::cout << \"공집합 트리에는 자식 서브 트리를 연결할 수 없습니다.\\n\";\n            return;\n        }\n        root->left = (!sub.is_empty()) ? sub.root : nullptr;\n    }\n\n    // set_right_child(sub): 오른쪽 자리에 새로운 서브 트리 sub 연결\n    void set_right_child(const BinaryTree& sub) {\n        if (is_empty()) {\n            std::cout << \"공집합 트리에는 자식 서브 트리를 연결할 수 없습니다.\\n\";\n            return;\n        }\n        root->right = (!sub.is_empty()) ? sub.root : nullptr;\n    }\n};\n\n/*\n [트리 구조]\n         A\n       /   \\\n      B     C\n     / \\     \n    D   E     \n*/\n\nint main() {\n    // 1. 서브 트리 생성 (Bottom-up 방식)\n    BinaryTree<char> sub_d('D');\n    BinaryTree<char> sub_e('E');\n\n    BinaryTree<char> sub_b('B');\n    sub_b.set_left_child(sub_d);\n    sub_b.set_right_child(sub_e);\n\n    BinaryTree<char> sub_c('C');\n\n    // 2. 메인 트리 생성 및 연결\n    BinaryTree<char> tree;\n    tree.set_root_data('A');\n    tree.set_left_child(sub_b);\n    tree.set_right_child(sub_c);\n\n    // 3. 데이터 조회 및 탐색\n    std::cout << \"루트 데이터: \" << tree.get_root_data() << \"\\n\";\n\n    BinaryTree<char> left_sub = tree.get_left_child();\n    std::cout << \"루트의 왼쪽 자식 데이터: \" << left_sub.get_root_data() << \"\\n\";\n\n    BinaryTree<char> left_left_sub = left_sub.get_left_child();\n    std::cout << \"왼쪽 자식의 왼쪽 자식 데이터: \" << left_left_sub.get_root_data() << \"\\n\";\n\n    return 0;\n}", "nb": 15, "fns": ["BinaryTree", "is_empty", "set_root_data", "get_left_child", "get_right_child", "set_left_child", "set_right_child"], "lines": 132}, {"ci": 11, "ch": "9. 트리: 효율적인 탐색을 위한 자료구조", "kind": "ds", "sid": "p390713e35a7d808cbd83e2a8285f7bc7", "path": ["이진 트리 순회", "Python: 이진 트리 순회 구현"], "lang": "py", "code": "def preorder(tree):\n    \"\"\"전위 순회: Root -> Left -> Right\"\"\"\n    if tree is None or tree.is_empty():\n        return\n    print(tree.get_root_data(), end=\" \") # 1. 루트 방문\n    preorder(tree.get_left_child())      # 2. 왼쪽 서브 트리 순회\n    preorder(tree.get_right_child())     # 3. 오른쪽 서브 트리 순회\n\n\ndef inorder(tree):\n    \"\"\"중위 순회: Left -> Root -> Right\"\"\"\n    if tree is None or tree.is_empty():\n        return\n    inorder(tree.get_left_child())       # 1. 왼쪽 서브 트리 순회\n    print(tree.get_root_data(), end=\" \") # 2. 루트 방문\n    inorder(tree.get_right_child())      # 3. 오른쪽 서브 트리 순회\n\n\ndef postorder(tree):\n    \"\"\"후위 순회: Left -> Right -> Root\"\"\"\n    if tree is None or tree.is_empty():\n        return\n    postorder(tree.get_left_child())     # 1. 왼쪽 서브 트리 순회\n    postorder(tree.get_right_child())    # 2. 오른쪽 서브 트리 순회\n    print(tree.get_root_data(), end=\" \") # 3. 루트 방문 \n    \n    \n# --- 기존 트리 생성 코드 ---\nsub_d = BinaryTree(\"D\")\nsub_e = BinaryTree(\"E\")\n\nsub_b = BinaryTree(\"B\")\nsub_b.set_left_child(sub_d)\nsub_b.set_right_child(sub_e)\n\nsub_c = BinaryTree(\"C\")\n\ntree = BinaryTree()\ntree.set_root_data(\"A\")\ntree.set_left_child(sub_b)\ntree.set_right_child(sub_c)\n\n# =================================================================\n# [트리 구조]\n#         A\n#       /   \\\n#      B     C\n#     / \\     \n#    D   E     \n# =================================================================\n\n# --- 순회 결과 출력 ---\nprint(\"전위 순회 (Preorder) : \", end=\"\")\npreorder(tree)\nprint()  # 출력: A B D E C\n\nprint(\"중위 순회 (Inorder)  : \", end=\"\")\ninorder(tree)\nprint()  # 출력: D B E A C\n\nprint(\"후위 순회 (Postorder) : \", end=\"\")\npostorder(tree)\nprint()  # 출력: D E B C A", "nb": 9, "fns": ["preorder", "inorder", "postorder"], "lines": 63}, {"ci": 11, "ch": "9. 트리: 효율적인 탐색을 위한 자료구조", "kind": "ds", "sid": "p390713e35a7d808cbd83e2a8285f7bc7", "path": ["이진 트리 순회", "Python: 이진 트리 순회 구현"], "lang": "py", "code": "class BinaryTree:\n    # ... (기존 메서드 생략) ...\n\n    def preorder(self):\n        if self.is_empty():\n            return\n        print(self.get_root_data(), end=\" \")\n        self.get_left_child().preorder()\n        self.get_right_child().preorder()\n\n    def inorder(self):\n        if self.is_empty():\n            return\n        self.get_left_child().inorder()\n        print(self.get_root_data(), end=\" \")\n        self.get_right_child().inorder()\n\n    def postorder(self):\n        if self.is_empty():\n            return\n        self.get_left_child().postorder()\n        self.get_right_child().postorder()\n        print(self.get_root_data(), end=\" \")\n\n\n# 사용 방법:\n# tree.preorder()\n# tree.inorder()\n# tree.postorder()", "nb": 9, "fns": ["preorder", "inorder", "postorder"], "lines": 29}, {"ci": 11, "ch": "9. 트리: 효율적인 탐색을 위한 자료구조", "kind": "ds", "sid": "p3a3713e35a7d80b49ab0c55d09fd41ad", "path": ["이진 트리 순회", "C++: 이진 트리 순회 구현"], "lang": "cpp", "code": "// 전위 순회 (Preorder): Root -> Left -> Right\ntemplate <typename T>\nvoid preorder(const BinaryTree<T>& tree) {\n    if (tree.is_empty()) return;\n\n    std::cout << tree.get_root_data() << \" \"; // 1. 루트 방문\n    preorder(tree.get_left_child());          // 2. 왼쪽 서브 트리 순회\n    preorder(tree.get_right_child());         // 3. 오른쪽 서브 트리 순회\n}\n\n// 중위 순회 (Inorder): Left -> Root -> Right\ntemplate <typename T>\nvoid inorder(const BinaryTree<T>& tree) {\n    if (tree.is_empty()) return;\n\n    inorder(tree.get_left_child());           // 1. 왼쪽 서브 트리 순회\n    std::cout << tree.get_root_data() << \" \"; // 2. 루트 방문\n    inorder(tree.get_right_child());          // 3. 오른쪽 서브 트리 순회\n}\n\n// 후위 순회 (Postorder): Left -> Right -> Root\ntemplate <typename T>\nvoid postorder(const BinaryTree<T>& tree) {\n    if (tree.is_empty()) return;\n\n    postorder(tree.get_left_child());         // 1. 왼쪽 서브 트리 순회\n    postorder(tree.get_right_child());        // 2. 오른쪽 서브 트리 순회\n    std::cout << tree.get_root_data() << \" \"; // 3. 루트 방문\n}\n\n/*\n [트리 구조]\n         A\n       /   \\\n      B     C\n     / \\     \n    D   E     \n*/\n\n/*\n전위 순회 (Preorder) : A B D E C \n중위 순회 (Inorder)  : D B E A C \n후위 순회 (Postorder) : D E B C A \n*/\n\n\nint main() {\n    BinaryTree<char> sub_d('D');\n    BinaryTree<char> sub_e('E');\n\n    BinaryTree<char> sub_b('B');\n    sub_b.set_left_child(sub_d);\n    sub_b.set_right_child(sub_e);\n\n    BinaryTree<char> sub_c('C');\n\n    BinaryTree<char> tree;\n    tree.set_root_data('A');\n    tree.set_left_child(sub_b);\n    tree.set_right_child(sub_c);\n\n    std::cout << \"전위 순회 (Preorder) : \";\n    preorder(tree);\n    std::cout << \"\\n\";\n\n    std::cout << \"중위 순회 (Inorder)  : \";\n    inorder(tree);\n    std::cout << \"\\n\";\n\n    std::cout << \"후위 순회 (Postorder) : \";\n    postorder(tree);\n    std::cout << \"\\n\";\n\n    return 0;\n}", "nb": 6, "fns": ["preorder", "inorder", "postorder"], "lines": 75}, {"ci": 11, "ch": "9. 트리: 효율적인 탐색을 위한 자료구조", "kind": "ds", "sid": "p3a3713e35a7d80b49ab0c55d09fd41ad", "path": ["이진 트리 순회", "C++: 이진 트리 순회 구현"], "lang": "cpp", "code": "template <typename T>\nclass BinaryTree {\n    // ... 기존 코드 유지 ...\n    \n    \n    \n    \n\npublic:\n    // 전위 순회 메서드\n    void preorder() const {\n        if (is_empty()) return;\n        std::cout << get_root_data() << \" \";\n        get_left_child().preorder();\n        get_right_child().preorder();\n    }\n\n    // 중위 순회 메서드\n    void inorder() const {\n        if (is_empty()) return;\n        get_left_child().inorder();\n        std::cout << get_root_data() << \" \";\n        get_right_child().inorder();\n    }\n\n    // 후위 순회 메서드\n    void postorder() const {\n        if (is_empty()) return;\n        get_left_child().postorder();\n        get_right_child().postorder();\n        std::cout << get_root_data() << \" \";\n    }\n};\n\n\nint main() {\n    BinaryTree<char> sub_d('D');\n    BinaryTree<char> sub_e('E');\n\n    BinaryTree<char> sub_b('B');\n    sub_b.set_left_child(sub_d);\n    sub_b.set_right_child(sub_e);\n\n    BinaryTree<char> sub_c('C');\n\n    BinaryTree<char> tree;\n    tree.set_root_data('A');\n    tree.set_left_child(sub_b);\n    tree.set_right_child(sub_c);\n\n    std::cout << \"전위 순회 (Preorder) : \";\n    tree.preorder();\n    std::cout << \"\\n\";\n\n    std::cout << \"중위 순회 (Inorder)  : \";\n    tree.inorder();\n    std::cout << \"\\n\";\n\n    std::cout << \"후위 순회 (Postorder) : \";\n    tree.postorder();\n    std::cout << \"\\n\";\n\n    return 0;\n}\n\n\n/*\n전위 순회 (Preorder) : A B D E C \n중위 순회 (Inorder)  : D B E A C \n후위 순회 (Postorder) : D E B C A \n*/", "nb": 6, "fns": ["preorder", "inorder", "postorder"], "lines": 71}, {"ci": 11, "ch": "9. 트리: 효율적인 탐색을 위한 자료구조", "kind": "ds", "sid": "p3e2713e35a7d8084ad1cdd4425ec803b", "path": ["우선 순위 큐(Priority Queue)", "우선순위 큐의 구현: 힙(Heap)", "힙의 구현", "Python: list를 이용한 구현"], "lang": "py", "code": "class MaxHeap:\n\n    def __init__(self):\n        # 0번 인덱스는 사용하지 않음. None으로 설정\n        self.heap = [None]\n\n    def is_empty(self):\n        return len(self.heap) <= 1\n\n    def size(self):\n        return len(self.heap) - 1\n\n    def insert(self, value):\n        self.heap.append(value) # 마지막에 노드를 추가. O(1)\n        current = self.size() # 추가된 노드의 현재 위치\n\n        # Up-Heap (부모와 비교하여 위로 올림)\n        while current > 1:\n            parent = current // 2\n            if self.heap[parent] >= self.heap[current]:\n                break\n            # 교환\n            self.heap[parent], self.heap[current] = (self.heap[current],self.heap[parent],)\n            current = parent\n\n    def delete(self):\n        if self.is_empty():\n            return None\n\n        max_val = self.heap[1]\n\n        # 마지막 요소를 루트로 이동\n        last_val = self.heap.pop() # O(1)\n        if not self.is_empty():\n            self.heap[1] = last_val\n            current = 1\n\n            # Down-Heap (더 큰 자식과 비교하여 아래로 내림)\n            while current * 2 <= self.size(): # 일단 여기에서는 왼쪽 자식의 존재 여부만 체크한다.\n                left = current * 2\n                right = current * 2 + 1\n                larger = left\n\n                # 오른쪽 자식의 존재 여부를 별도로 여기서 확인한다.\n                if right <= self.size() and self.heap[right] > self.heap[left]:\n                    larger = right\n\n                if self.heap[current] >= self.heap[larger]:\n                    break\n\n                # 교환\n                self.heap[current], self.heap[larger] = (\n                    self.heap[larger],\n                    self.heap[current],\n                )\n                current = larger\n\n        return max_val\n\n    def peek(self):\n        \"\"\"우선순위가 가장 높은 요소를 삭제하지 않고 반환\"\"\"\n        if self.is_empty():\n            return None\n        return self.heap[1]\n        \n        \n# 사용 예시\nheap = MaxHeap()\nfor val in [10, 40, 30, 5, 12, 50]:\n    heap.insert(val)\n\nprint(\"힙 배열:\", heap.heap[1:])  # [50, 12, 40, 5, 10, 30]\nprint(\"Peek 결과 (최댓값 확인):\", heap.peek())  # 50 (삭제되지 않음)\nprint(\"Pop 결과:\", [heap.delete() for _ in range(heap.size())])  # [50, 40, 30, 12, 10, 5]\n\n\"\"\"\n출력 결과\n힙 배열: [50, 12, 40, 5, 10, 30]\nPeek 결과 (최댓값 확인): 50\nPop 결과: [50, 40, 30, 12, 10, 5]\n\"\"\"", "nb": 30, "fns": ["__init__", "is_empty", "size", "insert", "delete", "peek"], "lines": 81}, {"ci": 11, "ch": "9. 트리: 효율적인 탐색을 위한 자료구조", "kind": "ds", "sid": "p3e2713e35a7d8040a29adfba7f39a9f0", "path": ["우선 순위 큐(Priority Queue)", "우선순위 큐의 구현: 힙(Heap)", "힙의 구현", "C++: vector를 이용한 구현"], "lang": "cpp", "code": "#include <iostream>\n#include <vector>\n#include <cstddef>   // std::size_t\n#include <utility>   // std::swap\n\ntemplate <typename T>\nclass MaxHeap {\nprivate:\n    std::vector<T> heap; // 0번 인덱스는 사용하지 않음\n\npublic:\n    // 생성자: 0번 인덱스를 비워두기 위해 기본값 1개 삽입\n    // T{}: 템플릿 타입 T에 대한 값 초기화(Value-Initialization) 표현. \n    // 만약 T가 int라면 0으로 초기화됨. \n    // T가 사용자가 정의한 클래스나 구조체라면, \n    // 해당 타입의 기본 생성자(Default Constructor)를 호출하여 초기화된 객체를 반환\n    MaxHeap() {\n        heap.push_back(T{});\n    }\n\n    bool is_empty() const {\n        return heap.size() <= 1;\n    }\n\n    std::size_t size() const {\n        return heap.size() - 1;\n    }\n\n    // Up-Heap (부모와 비교하여 위로 올림)\n    void push(const T& value) {\n        heap.push_back(value); // 마지막에 노드를 추가\n        std::size_t current = size(); // 추가된 노드의 현재 위치\n\n        while (current > 1) {\n            std::size_t parent = current / 2;\n            if (heap[parent] >= heap[current]) {\n                break;\n            }\n            std::swap(heap[parent], heap[current]);\n            current = parent;\n        }\n    }\n\n    // Down-Heap (더 큰 자식과 비교하여 아래로 내림)\n    T pop() {\n        if (is_empty()) {\n            return T{}; // 비어있는 경우 기본값 반환 (또는 예외 처리)\n        }\n\n        T max_val = heap[1];\n\n        // 마지막 요소를 루트로 이동\n        T last_val = heap.back();\n        heap.pop_back();\n\n        if (!is_empty()) {\n            heap[1] = last_val;\n            std::size_t current = 1;\n\n            // Down-Heap (더 큰 자식과 비교해서 아래로 내림)\n            while (current * 2 <= size()) { // 일단 여기에서는 왼쪽 자식의 존재 여부만 체크한다.\n                std::size_t left = current * 2;\n                std::size_t right = current * 2 + 1;\n                std::size_t larger = left;\n\n                // 오른쪽 자식의 존재 여부를 별도로 여기서 확인한다.\n                if (right <= size() && heap[right] > heap[left]) {\n                    larger = right;\n                }\n\n                if (heap[current] >= heap[larger]) {\n                    break;\n                }\n\n                std::swap(heap[current], heap[larger]);\n                current = larger;\n            }\n        }\n\n        return max_val;\n    }\n    \n    // 우선순위가 가장 높은 요소를 삭제하지 않고 반환\n    T peek() const {\n        if (is_empty()) {\n            return T{};\n        }\n        return heap[1];\n    }    \n\n    // 힙 배열의 현재 상태 출력 (1번 인덱스부터)\n    void display() const {\n        std::cout << \"힙 배열: [\";\n        for (std::size_t i = 1; i <= size(); ++i) {\n            std::cout << heap[i];\n            if (i < size()) std::cout << \", \";\n        }\n        std::cout << \"]\\n\";\n    }\n};\n\nint main() {\n    MaxHeap<int> heap;\n\n    for (int val : {10, 40, 30, 5, 12, 50}) {\n        heap.push(val);\n    }\n\n    // 1. 힙 배열 상태 출력\n    heap.display(); // 힙 배열: [50, 12, 40, 5, 10, 30]\n    \n    // 2. Peek 결과 출력\n    std::cout << \"Peek 결과 (최댓값 확인): \" << heap.peek() << \"\\n\"; // 50 (삭제되지 않음)\n    \n    // 3. Pop 결과 출력\n    std::cout << \"Pop 결과: [\";\n    std::size_t initial_size = heap.size();\n    for (std::size_t i = 0; i < initial_size; ++i) {\n        std::cout << heap.pop();\n        if (i < initial_size - 1) std::cout << \", \";\n    }\n    std::cout << \"]\\n\"; // Pop 결과: [50, 40, 30, 12, 10, 5]\n\n    return 0;\n}\n\n/*\n출력 결과 \n힙 배열: [50, 12, 40, 5, 10, 30]\nPeek 결과 (최댓값 확인): 50\nPop 결과: [50, 40, 30, 12, 10, 5]\n*/", "nb": 31, "fns": ["MaxHeap", "is_empty", "size", "push", "pop", "peek"], "lines": 132}, {"ci": 11, "ch": "9. 트리: 효율적인 탐색을 위한 자료구조", "kind": "ds", "sid": "p3f9713e35a7d80c8affcd1647425457c", "path": ["우선 순위 큐(Priority Queue)", "우선순위 큐의 구현: 힙(Heap)", "힙 연산의 복잡도", "힙 생성: 단순 삽입 방식"], "lang": "py", "code": "class MaxHeap:\n    def __init__(self):\n        self.heap = [None]                 # 0번은 비워 둔다\n\n    def push(self, value):                 # 삽입 + up-heap: O(log n)\n        self.heap.append(value)\n        i = len(self.heap) - 1\n        while i > 1 and self.heap[i // 2] < self.heap[i]:\n            self.heap[i // 2], self.heap[i] = self.heap[i], self.heap[i // 2]\n            i //= 2\n\nheap = MaxHeap()\nfor val in [10, 40, 30, 5, 12, 50]:        # 하나씩 삽입 -> 전체 O(n log n)\n    heap.push(val)\nprint(heap.heap[1:])                        # [50, 12, 40, 5, 10, 30]", "nb": 6, "fns": ["__init__", "push"], "lines": 15, "extra": 1}, {"ci": 11, "ch": "9. 트리: 효율적인 탐색을 위한 자료구조", "kind": "ds", "sid": "p3fe713e35a7d80ecbb7dce60fa9ba62e", "path": ["우선 순위 큐(Priority Queue)", "우선순위 큐의 구현: 힙(Heap)", "힙 연산의 복잡도", "힙 생성: Bottom-up 방식", "Python"], "lang": "py", "code": "    def _down_heap(self, current):\n        \"\"\"특정 노드에서 시작하여 아래로 내리며 힙 속성을 복구하는 헬퍼 메서드\"\"\"\n        \"\"\"기존의 delete( ) 함수와 유사함\"\"\"\n        while current * 2 <= self.size():\n            left = current * 2\n            right = current * 2 + 1\n            larger = left\n\n            if right <= self.size() and self.heap[right] > self.heap[left]:\n                larger = right\n\n            if self.heap[current] >= self.heap[larger]:\n                break\n\n            # 교환\n            self.heap[current], self.heap[larger] = (\n                self.heap[larger],\n                self.heap[current],\n            )\n            current = larger\n            \n    def heapify(self, arr):\n        \"\"\"임의의 배열을 O(N) 만에 힙으로 변환하는 바텀업(Bottom-up) 메서드\"\"\"\n        self.heap = [None] + list(arr)\n        \n        # 트리의 가장 마지막 노드의 부모 인덱스부터 시작해서 루트(1)까지 역순으로 순회\n        # 방금 전 수학 유도 과정에서 보았던 Sum_{h=0}^{log N} (N / 2^{h+1}) * h 형태의 연산이 여기서 수행됨\n        for current in range(self.size() // 2, 0, -1):\n            self._down_heap(current)", "nb": 12, "fns": ["_down_heap", "heapify"], "lines": 29}, {"ci": 11, "ch": "9. 트리: 효율적인 탐색을 위한 자료구조", "kind": "ds", "sid": "p3fe713e35a7d80ecbb7dce60fa9ba62e", "path": ["우선 순위 큐(Priority Queue)", "우선순위 큐의 구현: 힙(Heap)", "힙 연산의 복잡도", "힙 생성: Bottom-up 방식", "Python"], "lang": "py", "code": "class MaxHeap:\n    def __init__(self, arr=None):\n        # 0번 인덱스는 사용하지 않음. None으로 설정\n        self.heap = [None]\n        if arr is not None:\n            self.heapify(arr)\n\n    def is_empty(self):\n        return len(self.heap) <= 1\n\n    def size(self):\n        return len(self.heap) - 1\n\n    def insert(self, value):\n        self.heap.append(value)  # 마지막에 노드를 추가. O(1)\n        current = self.size()  # 추가된 노드의 현재 위치\n\n        # Up-Heap (부모와 비교하여 위로 올림)\n        while current > 1:\n            parent = current // 2\n            if self.heap[parent] >= self.heap[current]:\n                break\n            # 교환\n            self.heap[parent], self.heap[current] = (\n                self.heap[current],\n                self.heap[parent],\n            )\n            current = parent\n\n    def _down_heap(self, current):\n        \"\"\"특정 노드에서 시작하여 아래로 내리며 힙 속성을 복구하는 헬퍼 메서드\"\"\"\n        while current * 2 <= self.size():\n            left = current * 2\n            right = current * 2 + 1\n            larger = left\n\n            if right <= self.size() and self.heap[right] > self.heap[left]:\n                larger = right\n\n            if self.heap[current] >= self.heap[larger]:\n                break\n\n            # 교환\n            self.heap[current], self.heap[larger] = (\n                self.heap[larger],\n                self.heap[current],\n            )\n            current = larger\n\n    def heapify(self, arr):\n        \"\"\"임의의 배열을 O(N) 만에 힙으로 변환하는 바텀업(Bottom-up) 메서드\"\"\"\n        self.heap = [None] + list(arr)\n        \n        # 트리의 가장 마지막 노드의 부모 인덱스부터 시작해서 루트(1)까지 역순으로 순회\n        # 방금 전 수학 유도 과정에서 보았던 Sum_{h=0}^{log N} (N / 2^{h+1}) * h 형태의 연산이 여기서 수행됨\n        for current in range(self.size() // 2, 0, -1):\n            self._down_heap(current)\n\n    def delete(self):\n        if self.is_empty():\n            return None\n\n        max_val = self.heap[1]\n\n        # 마지막 요소를 루트로 이동\n        last_val = self.heap.pop()  # O(1)\n        if not self.is_empty():\n            self.heap[1] = last_val\n            self._down_heap(1)\n\n        return max_val\n\n    def peek(self):\n        \"\"\"우선순위가 가장 높은 요소를 삭제하지 않고 반환\"\"\"\n        if self.is_empty():\n            return None\n        return self.heap[1]\n\n\n# --- 사용 예시 ---\nif __name__ == \"__main__\":\n    # 1. heapify를 이용해 한 번에 힙 구축 (O(N))\n    data = [10, 40, 30, 5, 12, 50]\n    heap = MaxHeap(data)\n\n    print(\"힙 배열:\", heap.heap[1:])  # [50, 12, 40, 5, 10, 30]\n    print(\"Peek 결과 (최댓값 확인):\", heap.peek())  # 50\n    print(\"Pop 결과:\", [heap.delete() for _ in range(heap.size())])  # [50, 40, 30, 12, 10, 5]", "nb": 35, "fns": ["__init__", "is_empty", "size", "insert", "_down_heap", "heapify", "delete", "peek"], "lines": 88}, {"ci": 11, "ch": "9. 트리: 효율적인 탐색을 위한 자료구조", "kind": "ds", "sid": "p3fe713e35a7d8040a625e97e462e35ad", "path": ["우선 순위 큐(Priority Queue)", "우선순위 큐의 구현: 힙(Heap)", "힙 연산의 복잡도", "힙 생성: Bottom-up 방식", "C++"], "lang": "cpp", "code": "#include <iostream>\n#include <vector>\n#include <cstddef>   // std::size_t\n#include <utility>   // std::swap\n\ntemplate <typename T>\nclass MaxHeap {\nprivate:\n    std::vector<T> heap; // 0번 인덱스는 사용하지 않음\n\n    // 공통으로 사용되는 Down-Heap (더 큰 자식과 비교하여 아래로 내림)\n    void down_heap(std::size_t current) {\n        while (current * 2 <= size()) {\n            std::size_t left = current * 2;\n            std::size_t right = current * 2 + 1;\n            std::size_t larger = left;\n\n            if (right <= size() && heap[right] > heap[left]) {\n                larger = right;\n            }\n\n            if (heap[current] >= heap[larger]) {\n                break;\n            }\n\n            std::swap(heap[current], heap[larger]);\n            current = larger;\n        }\n    }\n\npublic:\n    // 기본 생성자: 0번 인덱스를 비워두기 위해 기본값 1개 삽입\n    MaxHeap() {\n        heap.push_back(T{});\n    }\n\n    // 벡터를 인자로 받는 생성자 (heapify 수행)\n    MaxHeap(const std::vector<T>& arr) {\n        heap.push_back(T{}); // 0번 인덱스 더미 삽입\n        heapify(arr);\n    }\n\n    bool is_empty() const {\n        return heap.size() <= 1;\n    }\n\n    std::size_t size() const {\n        return heap.size() - 1;\n    }\n\n    // Up-Heap (부모와 비교하여 위로 올림)\n    void push(const T& value) {\n        heap.push_back(value); // 마지막에 노드를 추가\n        std::size_t current = size(); // 추가된 노드의 현재 위치\n\n        while (current > 1) {\n            std::size_t parent = current / 2;\n            if (heap[parent] >= heap[current]) {\n                break;\n            }\n            std::swap(heap[parent], heap[current]);\n            current = parent;\n        }\n    }\n\n    // Pop (최댓값 추출)\n    T pop() {\n        if (is_empty()) {\n            return T{}; \n        }\n\n        T max_val = heap[1];\n        T last_val = heap.back();\n        heap.pop_back();\n\n        if (!is_empty()) {\n            heap[1] = last_val;\n            down_heap(1);\n        }\n\n        return max_val;\n    }\n    \n    // 임의의 배열을 O(N) 만에 힙으로 변환하는 바텀업(Bottom-up) 메서드\n    void heapify(const std::vector<T>& arr) {\n        // 기존 데이터를 초기화하고 0번 더미 뒤에 배열 통째로 복사\n        heap.resize(1);\n        heap.insert(heap.end(), arr.begin(), arr.end());\n\n        // 가장 마지막 부모 노드부터 루트(1)까지 역순으로 순회\n        // signed 타입(long long)을 사용하여 unsigned 언더플로 방지\n        for (long long current = static_cast<long long>(size() / 2); current >= 1; --current) {\n            down_heap(static_cast<std::size_t>(current));\n        }\n    }\n\n    // 우선순위가 가장 높은 요소를 삭제하지 않고 반환\n    T peek() const {\n        if (is_empty()) {\n            return T{};\n        }\n        return heap[1];\n    }    \n\n    // 힙 배열의 현재 상태 출력 (1번 인덱스부터)\n    void display() const {\n        std::cout << \"힙 배열: [\";\n        for (std::size_t i = 1; i <= size(); ++i) {\n            std::cout << heap[i];\n            if (i < size()) std::cout << \", \";\n        }\n        std::cout << \"]\\n\";\n    }\n};\n\nint main() {\n    // 1. heapify 생성자를 이용한 O(N) 힙 구축 테스트\n    std::vector<int> data = {10, 40, 30, 5, 12, 50};\n    MaxHeap<int> heap(data);\n\n    // 힙 배열 상태 출력\n    heap.display(); // 힙 배열: [50, 12, 40, 5, 10, 30]\n    \n    // Peek 결과 출력\n    std::cout << \"Peek 결과 (최댓값 확인): \" << heap.peek() << \"\\n\"; // 50\n    \n    // Pop 결과 출력\n    std::cout << \"Pop 결과: [\";\n    std::size_t initial_size = heap.size();\n    for (std::size_t i = 0; i < initial_size; ++i) {\n        std::cout << heap.pop();\n        if (i < initial_size - 1) std::cout << \", \";\n    }\n    std::cout << \"]\\n\"; // Pop 결과: [50, 40, 30, 12, 10, 5]\n\n    return 0;\n}", "nb": 36, "fns": ["down_heap", "MaxHeap", "MaxHeap", "is_empty", "size", "push", "pop", "heapify", "peek"], "lines": 137}, {"ci": 11, "ch": "9. 트리: 효율적인 탐색을 위한 자료구조", "kind": "ds", "sid": "p3a6713e35a7d8034b117e0fd63218728", "path": ["우선 순위 큐(Priority Queue)", "[응용] 허프만 코딩", "예제"], "lang": "py", "code": "import heapq\n\nclass Node:\n    def __init__(self, freq, char=None, left=None, right=None):\n        self.freq, self.char, self.left, self.right = freq, char, left, right\n    def __lt__(self, other):               # heapq가 빈도로 비교하도록\n        return self.freq < other.freq\n\ndef build_huffman(freqs):\n    pq = [Node(f, c) for c, f in freqs.items()]\n    heapq.heapify(pq)                       # 빈도 오름차순 우선순위 큐\n    while len(pq) > 1:\n        a = heapq.heappop(pq)               # 가장 작은 두 개를 꺼내\n        b = heapq.heappop(pq)\n        heapq.heappush(pq, Node(a.freq + b.freq, None, a, b))   # 합친 부모를 다시 넣기\n    return pq[0]\n\ndef make_codes(node, prefix=\"\", codes=None):\n    if codes is None:\n        codes = {}\n    if node.char is not None:               # 리프 = 문자\n        codes[node.char] = prefix or \"0\"\n    else:\n        make_codes(node.left, prefix + \"0\", codes)    # 왼쪽 0\n        make_codes(node.right, prefix + \"1\", codes)   # 오른쪽 1\n    return codes\n\nroot = build_huffman({'A': 45, 'B': 13, 'C': 12, 'D': 16, 'E': 9})\nprint(\"Root:\", root.freq)                   # 95\nfor ch, code in sorted(make_codes(root).items()):\n    print(ch, code)                         # A 0 / B 110 / C 101 / D 111 / E 100", "nb": 16, "fns": ["__init__", "__lt__", "build_huffman", "make_codes"], "lines": 31, "extra": 1}, {"ci": 11, "ch": "9. 트리: 효율적인 탐색을 위한 자료구조", "kind": "ds", "sid": "p3a6713e35a7d8034b117e0fd63218728", "path": ["우선 순위 큐(Priority Queue)", "[응용] 허프만 코딩", "예제"], "lang": "cpp", "code": "#include <iostream>\n#include <queue>\n#include <vector>\n#include <map>\n#include <string>\nusing namespace std;\n\nstruct Node {\n    int freq;\n    char ch;                  // 내부 노드는 '\\0'\n    Node *left, *right;\n    Node(int f, char c, Node* l = nullptr, Node* r = nullptr) : freq(f), ch(c), left(l), right(r) {}\n};\n\nstruct Cmp {                  // priority_queue를 최소 힙으로 만드는 비교 함수\n    bool operator()(Node* a, Node* b) const { return a->freq > b->freq; }\n};\n\nNode* build_huffman(const map<char, int>& freqs) {\n    priority_queue<Node*, vector<Node*>, Cmp> pq;\n    for (auto& [c, f] : freqs) pq.push(new Node(f, c));\n    while (pq.size() > 1) {\n        Node* a = pq.top(); pq.pop();          // 가장 작은 두 개\n        Node* b = pq.top(); pq.pop();\n        pq.push(new Node(a->freq + b->freq, '\\0', a, b));\n    }\n    return pq.top();\n}\n\nvoid make_codes(Node* node, const string& prefix, map<char, string>& codes) {\n    if (node->ch != '\\0') {                    // 리프\n        codes[node->ch] = prefix.empty() ? \"0\" : prefix;\n        return;\n    }\n    make_codes(node->left, prefix + \"0\", codes);\n    make_codes(node->right, prefix + \"1\", codes);\n}\n\nint main() {\n    Node* root = build_huffman({{'A', 45}, {'B', 13}, {'C', 12}, {'D', 16}, {'E', 9}});\n    cout << \"Root: \" << root->freq << \"\\n\";    // 95\n    map<char, string> codes;\n    make_codes(root, \"\", codes);\n    for (auto& [c, code] : codes) cout << c << \" \" << code << \"\\n\";\n    return 0;   // (예제라 노드 메모리 해제는 생략)\n}", "nb": 9, "fns": ["build_huffman", "make_codes"], "lines": 46, "extra": 1}, {"ci": 11, "ch": "9. 트리: 효율적인 탐색을 위한 자료구조", "kind": "ds", "sid": "p3f5713e35a7d80bb99e6d0ddd4faac11", "path": ["[참고] 트리의 활용 1: 의사 결정 트리(decision tree)", "Python"], "lang": "py", "code": "class ArrayDecisionTree:\n\n  def __init__(self):\n    # 0번 인덱스는 편의상 비워두고, 1번부터 루트 노드가 시작되도록 구성\n    # 인덱스 공식: 왼쪽 자식 = 2*i, 오른쪽 자식 = 2*i + 1\n    self.tree = [\n        None,  # 0번 (사용 안 함)\n        \"동물입니까?\",  # 1 (루트)\n        \"다리가 2개입니까?\",  # 2 (1의 왼쪽 자식)\n        \"키가 큽니까?\",  # 3 (1의 오른쪽 자식)\n        \"날 수 있습니까?\",  # 4 (2의 왼쪽 자식)\n        \"몸집이 사람보다 큽니까?\",  # 5 (2의 오른쪽 자식)\n        \"침엽수 입니까?\",  # 6 (3의 왼쪽 자식)\n        \"꽃입니까?\",  # 7 (3의 오른쪽 자식)\n        \"새입니다.\",  # 8 (4의 왼쪽 자식 - 리프)\n        \"타조나 닭입니다.\",  # 9 (4의 오른쪽 자식 - 리프)\n        \"코끼리입니다.\",  # 10 (5의 왼쪽 자식 - 리프)\n        \"개입니다.\",  # 11 (5의 오른쪽 자식 - 리프)\n        \"소나무입니다.\",  # 12 (6의 왼쪽 자식 - 리프)\n        \"대나무입니다.\",  # 13 (6의 오른쪽 자식 - 리프)\n        \"난초입니다.\",  # 14 (7의 왼쪽 자식 - 리프)\n        \"잔디입니다.\",  # 15 (7의 오른쪽 자식 - 리프)\n    ]\n\n  def is_leaf(self, index):\n    # 리스트 범위를 벗어나거나 값이 없거나, 문장이 '입니다.'로 끝나면 리프 노드로 간주\n    if index >= len(self.tree) or self.tree[index] is None:\n      return True\n    return \"입니다.\" in self.tree[index]\n\n  def play(self, index=1):\n    # 트리의 범위를 벗어난 경우 종료\n    if index >= len(self.tree) or self.tree[index] is None:\n      return\n\n    current_data = self.tree[index]\n\n    # 리프 노드(결과 도출)에 도달한 경우\n    if self.is_leaf(index):\n      print(f\"\\n[결과]:{current_data}\")\n      return\n\n    # 내부 노드(질문)인 경우\n    print(f\"\\nQ. {current_data}\")\n    user_input = input(\"(y/n): \").strip().lower()\n\n    if user_input in [\"y\", \"yes\"]:\n      # '예'일 경우 왼쪽 자식으로 이동 (인덱스: 2 * i)\n      self.play(2 * index)\n    else:\n      # '아니오'일 경우 오른쪽 자식으로 이동 (인덱스: 2 * i + 1)\n      self.play(2 * index + 1)\n\n\n# --- 실행 테스트 ---\nif __name__ == \"__main__\":\n  dt = ArrayDecisionTree()\n  dt.play(1)  # 루트인 1번 인덱스부터 시작", "nb": 11, "fns": ["__init__", "is_leaf", "play"], "lines": 58}, {"ci": 11, "ch": "9. 트리: 효율적인 탐색을 위한 자료구조", "kind": "ds", "sid": "p3f5713e35a7d80418da8e326ddce77b2", "path": ["[참고] 트리의 활용 1: 의사 결정 트리(decision tree)", "C++"], "lang": "cpp", "code": "#include <iostream>\n#include <vector>\n#include <string>\n\nclass ArrayDecisionTree {\nprivate:\n    std::vector<std::string> tree;\n\n    bool is_leaf(int index) {\n        // 리스트 범위를 벗어나거나 비어있거나, 문장이 '입니다.'로 끝나면 리프 노드로 간주\n        if (index >= tree.size() || tree[index].empty()) {\n            return true;\n        }\n        return tree[index].find(\"입니다.\") != std::string::npos;\n    }\n\npublic:\n    ArrayDecisionTree() {\n        // 0번 인덱스는 편의상 비워두고, 1번부터 루트 노드가 시작되도록 구성\n        // 인덱스 공식: 왼쪽 자식 = 2*i, 오른쪽 자식 = 2*i + 1\n        tree = {\n            \"\",                  // 0번 (사용 안 함)\n            \"동물입니까?\",         // 1 (루트)\n            \"다리가 2개입니까?\",     // 2 (1의 왼쪽 자식)\n            \"키가 큽니까?\",        // 3 (1의 오른쪽 자식)\n            \"날 수 있습니까?\",     // 4 (2의 왼쪽 자식)\n            \"몸집이 사람보다 큽니까?\", // 5 (2의 오른쪽 자식)\n            \"침엽수 입니까?\",      // 6 (3의 왼쪽 자식)\n            \"꽃입니까?\",          // 7 (3의 오른쪽 자식)\n            \"새입니다.\",          // 8 (4의 왼쪽 자식 - 리프)\n            \"타조나 닭입니다.\",    // 9 (4의 오른쪽 자식 - 리프)\n            \"코끼리입니다.\",       // 10 (5의 왼쪽 자식 - 리프)\n            \"개입니다.\",          // 11 (5의 오른쪽 자식 - 리프)\n            \"소나무입니다.\",       // 12 (6의 왼쪽 자식 - 리프)\n            \"대나무입니다.\",       // 13 (6의 오른쪽 자식 - 리프)\n            \"난초입니다.\",       // 14 (7의 왼쪽 자식 - 리프)\n            \"잔디입니다.\"        // 15 (7의 오른쪽 자식 - 리프)\n        };\n    }\n\n    void play(int index = 1) {\n        // 트리의 범위를 벗어난 경우 종료\n        if (index >= tree.size() || tree[index].empty()) {\n            return;\n        }\n\n        std::string current_data = tree[index];\n\n        // 리프 노드(결과 도출)에 도달한 경우\n        if (is_leaf(index)) {\n            std::cout << \"\\n[결과]: \" << current_data << \"\\n\";\n            return;\n        }\n\n        // 내부 노드(질문)인 경우\n        std::cout << \"\\nQ. \" << current_data << \"\\n(y/n): \";\n        std::string user_input;\n        std::cin >> user_input;\n\n        if (user_input == \"y\" || user_input == \"yes\") {\n            // '예'일 경우 왼쪽 자식으로 이동 (인덱스: 2 * i)\n            play(2 * index);\n        } else {\n            // '아니오'일 경우 오른쪽 자식으로 이동 (인덱스: 2 * i + 1)\n            play(2 * index + 1);\n        }\n    }\n};\n\n// --- 실행 테스트 ---\nint main() {\n    ArrayDecisionTree dt;\n    dt.play(1); // 루트인 1번 인덱스부터 시작\n\n    return 0;\n}", "nb": 9, "fns": ["is_leaf", "ArrayDecisionTree", "play"], "lines": 76}, {"ci": 11, "ch": "9. 트리: 효율적인 탐색을 위한 자료구조", "kind": "ds", "sid": "p391713e35a7d8080a51be115176790fa", "path": ["[참고] 트리의 활용 2: 게임 트리(game tree)", "Min-Max 트리 구현"], "lang": "py", "code": "# 게임 트리를 중첩 리스트로 표현: 리프는 정적 형세 점수(staticEvaluate 결과)\n#        max\n#      /     \\\n#    min     min\n#   / \\     / \\\n#  3   5   2   9\ngame_tree = [[3, 5], [2, 9]]\n\ndef static_evaluate(node):\n    return node                          # 리프에 이미 점수가 들어 있다\n\ndef max_node(node, depth):\n    if depth == 0 or not isinstance(node, list):\n        return static_evaluate(node)\n    best = float('-inf')\n    for child in node:                   # 모든 후보 수\n        score = min_node(child, depth - 1)\n        best = max(best, score)\n    return best\n\ndef min_node(node, depth):\n    if depth == 0 or not isinstance(node, list):\n        return static_evaluate(node)\n    best = float('inf')\n    for child in node:\n        score = max_node(child, depth - 1)\n        best = min(best, score)\n    return best\n\nprint(max_node(game_tree, 2))   # 3  (왼쪽 min=3, 오른쪽 min=2 중 최대)", "nb": 15, "fns": ["static_evaluate", "max_node", "min_node"], "lines": 30, "extra": 1}, {"ci": 11, "ch": "9. 트리: 효율적인 탐색을 위한 자료구조", "kind": "ds", "sid": "p391713e35a7d8080a51be115176790fa", "path": ["[참고] 트리의 활용 2: 게임 트리(game tree)", "Min-Max 트리 구현"], "lang": "cpp", "code": "#include <iostream>\n#include <vector>\n#include <climits>\n#include <algorithm>\nusing namespace std;\n\n// 게임 트리 노드: 자식이 없으면 리프(정적 형세 점수 value)\nstruct Node {\n    int value;\n    vector<Node> children;\n};\n\nint staticEvaluate(const Node& node) { return node.value; }\n\nint minNode(const Node& node, int depth);\n\nint maxNode(const Node& node, int depth) {\n    if (depth == 0 || node.children.empty()) return staticEvaluate(node);\n    int best = INT_MIN;\n    for (const Node& child : node.children)        // 모든 후보 수 (makeMove)\n        best = max(best, minNode(child, depth - 1));\n    return best;                                   // (unMakeMove는 트리를 복사로 다뤄 불필요)\n}\n\nint minNode(const Node& node, int depth) {\n    if (depth == 0 || node.children.empty()) return staticEvaluate(node);\n    int best = INT_MAX;\n    for (const Node& child : node.children)\n        best = min(best, maxNode(child, depth - 1));\n    return best;\n}\n\nint main() {\n    Node tree{0, {Node{0, {Node{3, {}}, Node{5, {}}}}, Node{0, {Node{2, {}}, Node{9, {}}}}}};\n    cout << maxNode(tree, 2) << \"\\n\";   // 3\n    return 0;\n}", "nb": 8, "fns": ["maxNode", "minNode"], "lines": 37, "extra": 1}, {"ci": 11, "ch": "9. 트리: 효율적인 탐색을 위한 자료구조", "kind": "ds", "sid": "p391713e35a7d80e099e3c103d23843b3", "path": ["[참고] 트리의 활용 2: 게임 트리(game tree)", "NegaMax 구현"], "lang": "py", "code": "game_tree = [[3, 5], [2, 9]]          # 리프 점수는 '먼저 두는 쪽(max)' 기준\n\ndef negamax(node, depth, color):\n    \"\"\"color: 내 차례 +1, 상대 차례 -1. 상대 점수 = -(내 점수)\"\"\"\n    if depth == 0 or not isinstance(node, list):\n        return color * node\n    best = float('-inf')\n    for child in node:\n        score = -negamax(child, depth - 1, -color)\n        best = max(best, score)\n    return best\n\nprint(negamax(game_tree, 2, 1))       # 3  (Min-Max와 같은 결과)", "nb": 7, "fns": ["negamax"], "lines": 13, "extra": 1}, {"ci": 11, "ch": "9. 트리: 효율적인 탐색을 위한 자료구조", "kind": "ds", "sid": "p391713e35a7d80e099e3c103d23843b3", "path": ["[참고] 트리의 활용 2: 게임 트리(game tree)", "NegaMax 구현"], "lang": "cpp", "code": "#include <iostream>\n#include <vector>\n#include <climits>\n#include <algorithm>\nusing namespace std;\n\nstruct Node {\n    int value;\n    vector<Node> children;\n};\n\n// color: 내 차례 +1, 상대 차례 -1\nint NegaMax(const Node& node, int depth, int color) {\n    if (depth == 0 || node.children.empty()) return color * node.value;\n    int best = INT_MIN;\n    for (const Node& child : node.children) {\n        int score = -NegaMax(child, depth - 1, -color);   // 상대 점수의 부호를 뒤집는다\n        best = max(best, score);\n    }\n    return best;\n}\n\nint main() {\n    Node tree{0, {Node{0, {Node{3, {}}, Node{5, {}}}}, Node{0, {Node{2, {}}, Node{9, {}}}}}};\n    cout << NegaMax(tree, 2, 1) << \"\\n\";   // 3\n    return 0;\n}", "nb": 5, "fns": ["NegaMax"], "lines": 27, "extra": 1}, {"ci": 11, "ch": "9. 트리: 효율적인 탐색을 위한 자료구조", "kind": "ds", "sid": "p3a3713e35a7d801da9feff9724444377", "path": ["일반 트리의 구현"], "lang": "py", "code": "class Node:\n    \"\"\"LCRS(Left-Child Right-Sibling) 노드: 자식이 몇 개든 포인터 2개로 표현\"\"\"\n    def __init__(self, data):\n        self.data = data\n        self.left_child = None      # 첫째 자식\n        self.right_sibling = None   # 바로 오른쪽 형제\n\ndef add_child(parent, child):\n    if parent.left_child is None:\n        parent.left_child = child\n    else:\n        cur = parent.left_child\n        while cur.right_sibling is not None:   # 마지막 형제를 찾아 뒤에 붙인다\n            cur = cur.right_sibling\n        cur.right_sibling = child\n\ndef print_tree(node, depth=0):\n    while node is not None:\n        print(\"  \" * depth + node.data)\n        print_tree(node.left_child, depth + 1)   # 자식들은 한 단계 들여쓰기\n        node = node.right_sibling                # 형제는 같은 깊이\n\nA = Node(\"A\")\nfor name in \"BCD\":\n    add_child(A, Node(name))\nprint_tree(A)        # A / B / C / D (B, C, D는 A의 자식)", "nb": 9, "fns": ["__init__", "add_child"], "lines": 26, "extra": 1}, {"ci": 11, "ch": "9. 트리: 효율적인 탐색을 위한 자료구조", "kind": "ds", "sid": "p3a3713e35a7d801da9feff9724444377", "path": ["일반 트리의 구현"], "lang": "cpp", "code": "#include <iostream>\n#include <string>\nusing namespace std;\n\n// LCRS 노드: 자식이 몇 개든 포인터 2개로 표현\nstruct Node {\n    string data;\n    Node* left_child = nullptr;      // 첫째 자식\n    Node* right_sibling = nullptr;   // 바로 오른쪽 형제\n    explicit Node(string d) : data(d) {}\n};\n\nvoid add_child(Node* parent, Node* child) {\n    if (parent->left_child == nullptr) {\n        parent->left_child = child;\n        return;\n    }\n    Node* cur = parent->left_child;\n    while (cur->right_sibling != nullptr)    // 마지막 형제 찾기\n        cur = cur->right_sibling;\n    cur->right_sibling = child;\n}\n\nvoid print_tree(Node* node, int depth = 0) {\n    for (; node != nullptr; node = node->right_sibling) {\n        cout << string(depth * 2, ' ') << node->data << \"\\n\";\n        print_tree(node->left_child, depth + 1);\n    }\n}\n\nint main() {\n    Node* A = new Node(\"A\");\n    add_child(A, new Node(\"B\"));\n    add_child(A, new Node(\"C\"));\n    add_child(A, new Node(\"D\"));\n    print_tree(A);\n    return 0;\n}", "nb": 6, "fns": ["add_child"], "lines": 38, "extra": 1}, {"ci": 12, "ch": "10. [알고리즘] 탐색(Searching)", "kind": "algo", "sid": "pd951203ee86c4b82a05a349033597f7f", "path": ["Python의 검색 함수", "리스트(List)와 튜플(Tuple)"], "lang": "cpp", "code": "#include <iostream>\n#include <vector>\n#include <algorithm>\nusing namespace std;\n\nint main() {\n    vector<int> my_list = {1, 2, 3, 4, 5};\n    // list.index(x)  ->  std::find + distance\n    auto it = find(my_list.begin(), my_list.end(), 3);\n    cout << distance(my_list.begin(), it) << \"\\n\";   // 2\n    // 없으면 예외 대신 end()가 돌아온다\n    auto it2 = find(my_list.begin(), my_list.end(), 33);\n    if (it2 == my_list.end()) cout << \"찾을 수 없음\\n\";\n    return 0;\n}", "nb": 4, "fns": ["main"], "lines": 15, "extra": 1}, {"ci": 12, "ch": "10. [알고리즘] 탐색(Searching)", "kind": "algo", "sid": "pd951203ee86c4b82a05a349033597f7f", "path": ["Python의 검색 함수", "리스트(List)와 튜플(Tuple)"], "lang": "cpp", "code": "#include <iostream>\n#include <vector>\n#include <algorithm>\nusing namespace std;\n\nint main() {\n    vector<int> my_list = {1, 1, 2, 3, 3, 3, 3};\n    long cnt = count(my_list.begin(), my_list.end(), 3);   // list.count(3)\n    cout << cnt << \"\\n\";  // 4\n    return 0;\n}", "nb": 3, "fns": ["main"], "lines": 11, "extra": 1}, {"ci": 12, "ch": "10. [알고리즘] 탐색(Searching)", "kind": "algo", "sid": "pd951203ee86c4b82a05a349033597f7f", "path": ["Python의 검색 함수", "리스트(List)와 튜플(Tuple)"], "lang": "cpp", "code": "#include <iostream>\n#include <vector>\n#include <algorithm>\nusing namespace std;\n\nint main() {\n    vector<int> my_list = {1, 2, 3, 4, 5};\n    bool result = find(my_list.begin(), my_list.end(), 3) != my_list.end();   // 3 in my_list\n    cout << boolalpha << result << \"\\n\";  // true\n    return 0;\n}", "nb": 3, "fns": ["main"], "lines": 11, "extra": 1}, {"ci": 12, "ch": "10. [알고리즘] 탐색(Searching)", "kind": "algo", "sid": "pd951203ee86c4b82a05a349033597f7f", "path": ["Python의 검색 함수", "리스트(List)와 튜플(Tuple)"], "lang": "cpp", "code": "#include <iostream>\n#include <vector>\n#include <algorithm>\n#include <iterator>\nusing namespace std;\n\nint main() {\n    vector<int> numbers = {1, 5, 10, 15, 20, 25};\n    int search_value = 15;\n    vector<int> matching_numbers;\n    copy_if(numbers.begin(), numbers.end(), back_inserter(matching_numbers),\n            [&](int num) { return num == search_value; });\n    if (!matching_numbers.empty())\n        cout << \"The value \" << search_value << \" is found in the list.\\n\";\n    else\n        cout << \"The value \" << search_value << \" is not found.\\n\";\n    return 0;\n}", "nb": 4, "fns": ["main"], "lines": 18, "extra": 1}, {"ci": 12, "ch": "10. [알고리즘] 탐색(Searching)", "kind": "algo", "sid": "p0bf84e93606e4990ba304903a171120e", "path": ["Python의 검색 함수", "문자열(String)"], "lang": "cpp", "code": "#include <iostream>\n#include <string>\nusing namespace std;\n\nint main() {\n    string text = \"Python is a powerful programming language.\";\n    string search_term = \"powerful\";\n    size_t index = text.find(search_term);\n    if (index != string::npos)\n        cout << \"The substring '\" << search_term << \"' is found at index \" << index << \".\\n\";\n    else\n        cout << \"The substring '\" << search_term << \"' is not found.\\n\";\n    return 0;\n}", "nb": 5, "fns": ["main"], "lines": 14, "extra": 1}, {"ci": 12, "ch": "10. [알고리즘] 탐색(Searching)", "kind": "algo", "sid": "p0bf84e93606e4990ba304903a171120e", "path": ["Python의 검색 함수", "문자열(String)"], "lang": "cpp", "code": "#include <iostream>\n#include <string>\nusing namespace std;\n\nint main() {\n    string text = \"Python is a powerful programming language.\";\n    string keyword = \"powerful\";\n    if (text.find(keyword) != string::npos)   // keyword in text\n        cout << \"Keyword found.\\n\";\n    return 0;\n}", "nb": 4, "fns": ["main"], "lines": 11, "extra": 1}, {"ci": 12, "ch": "10. [알고리즘] 탐색(Searching)", "kind": "algo", "sid": "p3e2713e35a7d80a1890ecb26e2b2f1ad", "path": ["C++의 검색 함수"], "lang": "cpp", "code": "#include <iostream>\n#include <vector>\n#include <algorithm> // std::find, std::find_if\n\nint main(){\n    std::vector<int> vec = {10, 20, 30, 40, 50};\n\n    // 1. std::find\n    auto it = std::find(vec.begin(), vec.end(), 30);\n    if (it != vec.end()) {\n        std::cout << \"값:\" << *it << \" (인덱스: \" << std::distance(vec.begin(), it) << \")\\n\";\n    }\n\n    // 2. std::find_if (조건 검색: 35보다 큰 첫 번재 수)\n    auto it2 = std::find_if(vec.begin(), vec.end(), [](int val) {\n        return val > 35;\n    });\n    if (it2 != vec.end()) {\n        std::cout << \"조건 만족 값: \" << *it2 << \"\\n\"; // 40\n    }\n}", "nb": 5, "fns": ["main"], "lines": 21}, {"ci": 12, "ch": "10. [알고리즘] 탐색(Searching)", "kind": "algo", "sid": "p3e2713e35a7d80a1890ecb26e2b2f1ad", "path": ["C++의 검색 함수"], "lang": "cpp", "code": "#include <iostream>\n#include <vector>\n#include <algorithm>\n\nint main(){\n    std::vector<int> vec = {10, 20, 30, 30, 30, 40, 50}; // 정렬된 배열\n\n    // 1. 존재 여부만 확인\n    bool exists = std::binary_search(vec.begin(), vec.end(), 30);\n    std::cout << \"30 존재 여부: \" << std::boolalpha << exists << \"\\n\";\n\n    // 2. lower_bound & upper_bound (중복 구간 찾기)\n    auto low = std::lower_bound(vec.begin(), vec.end(), 30); // 첫 번째 30의 위치\n    auto up = std::upper_bound(vec.begin(), vec.end(), 30);  // 30을 넘어서는 첫 위치(40의 위치)\n\n    std::cout << \"30의 개수: \" << std::distance(low, up) << \"개\\n\";\n}", "nb": 4, "fns": ["main"], "lines": 17}, {"ci": 12, "ch": "10. [알고리즘] 탐색(Searching)", "kind": "algo", "sid": "p3e2713e35a7d80a1890ecb26e2b2f1ad", "path": ["C++의 검색 함수"], "lang": "cpp", "code": "#include <iostream>\n#include <unordered_map>\n#include <string>\n\nint main(){\n    std::unordered_map<std::string, int> scores = {{\"Alice\", 90}, {\"Bob\", 80}};\n\n    // map/set의 전용 find() 메서드 사용\n    auto it = scores.find(\"Alice\");\n    if (it != scores.end()) {\n        std::cout << it->first << \"의 점수: \" << it->second << \"\\n\";\n    } else {\n        std::cout << \"찾을 수 없음\\n\";\n    }\n}", "nb": 3, "fns": ["main"], "lines": 15}, {"ci": 12, "ch": "10. [알고리즘] 탐색(Searching)", "kind": "algo", "sid": "p3e2713e35a7d80a1890ecb26e2b2f1ad", "path": ["C++의 검색 함수"], "lang": "cpp", "code": "#include <iostream>\n#include <string>\n\nint main(){\n    std::string text = \"Hello, Data Structures and Algorithms!\";\n\n    std::size_t pos = text.find(\"Data\");\n    if (pos != std::string::npos) {\n        std::cout << \"'Data' 시작 위치: \" << pos << \"\\n\";\n    }\n}", "nb": 3, "fns": ["main"], "lines": 11}, {"ci": 12, "ch": "10. [알고리즘] 탐색(Searching)", "kind": "algo", "sid": "p3a3713e35a7d809e8713efc1b7f534d3", "path": ["선형 탐색", "정렬안된 리스트에서의 선형 검색 알고리즘(unordered linear search)", "구현"], "lang": "py", "code": "def search(arr, search_key):\n    for i in range(0, len(arr)):\n        if arr[i] == search_key:\n            return i\n    return -1\n\n\n# Driver Code\narr = [2, 3, 4, 10, 40]\nitem = 10\n\nindex = search(arr, item)\nif index == -1:\n    print(f\"{item} is not present in array\")\nelse:\n    print(f\"{item} is at index\", index )", "nb": 4, "fns": ["search"], "lines": 16}, {"ci": 12, "ch": "10. [알고리즘] 탐색(Searching)", "kind": "algo", "sid": "p3a3713e35a7d809e8713efc1b7f534d3", "path": ["선형 탐색", "정렬안된 리스트에서의 선형 검색 알고리즘(unordered linear search)", "구현"], "lang": "cpp", "code": "#include <iostream>\n#include <vector>\n\nint search(const std::vector<int>& arr, int search_key) {\n    for (int i = 0; i < arr.size(); ++i) {\n        if (arr[i] == search_key) {\n            return i;\n        }\n    }\n    return -1;\n}\n\nint main() {\n    std::vector<int> arr = {2, 3, 4, 10, 40};\n    int item = 10;\n\n    int index = search(arr, item);\n    if (index == -1) {\n        std::cout << item << \" is not present in array\\n\";\n    } else {\n        std::cout << item << \" is at index \" << index << \"\\n\";\n    }\n\n    return 0;\n}", "nb": 4, "fns": ["search"], "lines": 25}, {"ci": 12, "ch": "10. [알고리즘] 탐색(Searching)", "kind": "algo", "sid": "p15dd2f1528f94c3f93f232670e0fbe0c", "path": ["선형 탐색", "센티널 순차 검색(sentinel linear search)"], "lang": "py", "code": "def search(arr, search_key):\n    for i in range(0, len(arr)):\n        if arr[i] == search_key:\n            return i\n    return -1", "nb": 4, "fns": ["search"], "lines": 5}, {"ci": 12, "ch": "10. [알고리즘] 탐색(Searching)", "kind": "algo", "sid": "p15dd2f1528f94c3f93f232670e0fbe0c", "path": ["선형 탐색", "센티널 순차 검색(sentinel linear search)"], "lang": "py", "code": "def search_with_while(arr, search_key):\n    i = 0\n    while i < len(arr):  # 이 부분에서는 인덱스를 비교하고 있고\n        if arr[i] == search_key: # 이 부분에서는 키 값을 비교하고 있다.\n            return i\n        i += 1\n    return -1", "nb": 6, "fns": ["search_with_while"], "lines": 7}, {"ci": 12, "ch": "10. [알고리즘] 탐색(Searching)", "kind": "algo", "sid": "p3a3713e35a7d806bbef6c9d1feced5dc", "path": ["선형 탐색", "센티널 순차 검색(sentinel linear search)", "구현"], "lang": "py", "code": "def sentinel_search(arr, search_key):\n    arr.append(search_key) # search_key를 sentinel로 추가\n    size = len(arr)   \n\n    index = 0\n    while arr[index] != search_key: # search_key 값의 유무 판단\n        index += 1\n \n    if index == size - 1: # 해당 값이 sentinel인지 여부 판단\n        return -1\n    else:\n        return index\n \n \n# Driver Code\narr = [10, 20, 180, 30, 60, 50, 110, 100, 70]\nitem = 80\n\nindex = sentinel_search(arr, item)\nif index == -1:\n    print(f\"{item} is not present in array\")\nelse:\n    print(f\"{item} is at index\", index )", "nb": 8, "fns": ["sentinel_search"], "lines": 23}, {"ci": 12, "ch": "10. [알고리즘] 탐색(Searching)", "kind": "algo", "sid": "p3a3713e35a7d806bbef6c9d1feced5dc", "path": ["선형 탐색", "센티널 순차 검색(sentinel linear search)", "구현"], "lang": "cpp", "code": "#include <iostream>\n#include <vector>\n\nint sentinel_search(std::vector<int>& arr, int search_key) {\n    // 1. search_key를 보초(Sentinel)로 추가\n    arr.push_back(search_key);\n    int size = arr.size();\n\n    int index = 0;\n    // 2. 루프 내에서 경계 검사(index < size) 없이 조건 판단\n    while (arr[index] != search_key) {\n        index++;\n    }\n\n    // 3. 보초 원소를 제거하여 원래 배열 상태 복구\n    arr.pop_back();\n\n    // 4. 찾은 위치가 보초 위치(size - 1)인지 확인\n    if (index == size - 1) {\n        return -1; // 보초에서 멈춘 것이므로 원래 배열엔 없음\n    } else {\n        return index;\n    }\n}\n\nint main() {\n    std::vector<int> arr = {10, 20, 180, 30, 60, 50, 110, 100, 70};\n    int item = 80;\n\n    int index = sentinel_search(arr, item);\n    if (index == -1) {\n        std::cout << item << \" is not present in array\\n\";\n    } else {\n        std::cout << item << \" is at index \" << index << \"\\n\";\n    }\n\n    return 0;\n}", "nb": 9, "fns": ["sentinel_search"], "lines": 38}, {"ci": 12, "ch": "10. [알고리즘] 탐색(Searching)", "kind": "algo", "sid": "p3a3713e35a7d808ab8eccb14f52a31e5", "path": ["선형 탐색", "정렬된 리스트에서의 순차 검색(ordered linear search)", "구현"], "lang": "py", "code": "def optimized_linear_search(arr, search_key):\n    for i in range(len(arr)):\n        if arr[i] == search_key:\n            return i\n        elif arr[i] > search_key:\n            return -1\n    return -1\n \n# Driver Code\narr = [10, 20, 180, 30, 60, 50, 110, 100, 70]\nitem = 80\n\nindex = optimized_linear_search(arr, item)\nif index == -1:\n    print(f\"{item} is not present in array\")\nelse:\n    print(f\"{item} is at index\", index )", "nb": 6, "fns": ["optimized_linear_search"], "lines": 17}, {"ci": 12, "ch": "10. [알고리즘] 탐색(Searching)", "kind": "algo", "sid": "p3a3713e35a7d808ab8eccb14f52a31e5", "path": ["선형 탐색", "정렬된 리스트에서의 순차 검색(ordered linear search)", "구현"], "lang": "cpp", "code": "#include <iostream>\n#include <vector>\n\n// 정렬된 배열을 전제로 하는 최적화된 선형 검색\nint optimized_linear_search(const std::vector<int>& arr, int search_key) {\n    for (int i = 0; i < arr.size(); ++i) {\n        if (arr[i] == search_key) {\n            return i; // 값 발견\n        } \n        else if (arr[i] > search_key) {\n            return -1; // 오름차순 정렬 상태에서 찾고자 하는 값보다 큰 값을 만났으므로 이후 탐색 중단\n        }\n    }\n    return -1;\n}\n\nint main() {\n    // 주의: 배열이 오름차순으로 정렬되어 있어야 합니다.\n    std::vector<int> arr = {10, 20, 30, 50, 60, 70, 100, 110, 180};\n    int item = 80;\n\n    int index = optimized_linear_search(arr, item);\n    if (index == -1) {\n        std::cout << item << \" is not present in array\\n\";\n    } else {\n        std::cout << item << \" is at index \" << index << \"\\n\";\n    }\n\n    return 0;\n}", "nb": 5, "fns": ["optimized_linear_search"], "lines": 30}, {"ci": 12, "ch": "10. [알고리즘] 탐색(Searching)", "kind": "algo", "sid": "p3a3713e35a7d80ceac95ffdc4fa3c58a", "path": ["이진 탐색", "정렬된 리스트에서의 이진 검색(binary search)", "구현: Python"], "lang": "py", "code": "def binary_search(arr, search_key):\n    left = 0\n    right = len(arr) - 1\n\n    while left <= right:\n        mid = left + (right - left) // 2 # mid position\n \n        if arr[mid] == search_key:  # check if x is present at mid\n            return mid\n        elif arr[mid] < search_key: # if x is greater, ignore left half\n            left = mid + 1\n        else:                       # if x is smaller, ignore right half\n            right = mid - 1\n \n    return -1\n\n# Driver Code\narr = [10, 20, 180, 30, 60, 50, 110, 100, 70]\narr.sort() # sort array\nitem = 50\n\nprint(\"sorted array\", arr)\nindex= binary_search(arr, item)\nif index == -1:\n    print(f\"{item} is not present in array\")\nelse:\n    print(f\"{item} is at index\", index )", "nb": 10, "fns": ["binary_search"], "lines": 27}, {"ci": 12, "ch": "10. [알고리즘] 탐색(Searching)", "kind": "algo", "sid": "p3a3713e35a7d80ceac95ffdc4fa3c58a", "path": ["이진 탐색", "정렬된 리스트에서의 이진 검색(binary search)", "구현: Python"], "lang": "py", "code": "def binary_search_recursive(arr, left, right, search_key):\n    # Check base case\n    if right >= left:\n        mid = left + (right - left) // 2 # mid position\n\n        if arr[mid] == search_key:  # check if x is present at mid\n            return mid\n        elif arr[mid] < search_key: # if x is greater, ignore left half\n            return binary_search_recursive(arr, mid + 1, right, search_key)\n        else:                       # if x is smaller, ignore right half\n            return binary_search_recursive(arr, left, mid - 1, search_key)\n    else:     # Element is not present in the array\n        return -1\n\n# Driver Code\narr = [10, 20, 180, 30, 60, 50, 110, 100, 70]\narr.sort()\nitem = 50\n\nprint(\"sorted array\", arr)\nindex = binary_search_recursive(arr, 0, len(arr) - 1, item)\nif index == -1:\n    print(f\"{item} is not present in array\")\nelse:\n    print(f\"{item} is at index\", index )", "nb": 8, "fns": ["binary_search_recursive"], "lines": 25}, {"ci": 12, "ch": "10. [알고리즘] 탐색(Searching)", "kind": "algo", "sid": "p3e2713e35a7d806890b6cb244477a81e", "path": ["이진 탐색", "정렬된 리스트에서의 이진 검색(binary search)", "구현: C++"], "lang": "cpp", "code": "#include <iostream>\n#include <vector>\n#include <algorithm> // std::sort 사용\n\nint binary_search(const std::vector<int>& arr, int search_key) {\n    int left = 0;\n    int right = arr.size() - 1;\n\n    while (left <= right) {\n        // 정수 오버플로를 방지하는 중간값 계산 방식\n        int mid = left + (right - left) / 2;\n\n        if (arr[mid] == search_key) {\n            return mid; // search_key 찾음\n        } \n        else if (arr[mid] < search_key) {\n            left = mid + 1;  // 오른쪽 반쪽으로 탐색 범위 축소\n        } \n        else {\n            right = mid - 1; // 왼쪽 반쪽으로 탐색 범위 축소\n        }\n    }\n\n    return -1; // 존재하지 않음\n}\n\nint main() {\n    std::vector<int> arr = {10, 20, 180, 30, 60, 50, 110, 100, 70};\n\n    // 1. 배열 정렬 (std::sort 사용)\n    std::sort(arr.begin(), arr.end());\n\n    // 정렬된 배열 출력\n    std::cout << \"sorted array: \";\n    for (int num : arr) {\n        std::cout << num << \" \";\n    }\n    std::cout << \"\\n\";\n\n    int item = 50;\n    int index = binary_search(arr, item);\n\n    if (index == -1) {\n        std::cout << item << \" is not present in array\\n\";\n    } else {\n        std::cout << item << \" is at index \" << index << \"\\n\";\n    }\n\n    return 0;\n}", "nb": 9, "fns": ["binary_search"], "lines": 50}, {"ci": 12, "ch": "10. [알고리즘] 탐색(Searching)", "kind": "algo", "sid": "p3e2713e35a7d806890b6cb244477a81e", "path": ["이진 탐색", "정렬된 리스트에서의 이진 검색(binary search)", "구현: C++"], "lang": "py", "code": "def binary_search_recursive(arr, left, right, search_key):\n    # Check base case\n    if right >= left:\n        mid = left + (right - left) // 2 # mid position\n\n        if arr[mid] == search_key:  # check if x is present at mid\n            return mid\n        elif arr[mid] < search_key: # if x is greater, ignore left half\n            return binary_search_recursive(arr, mid + 1, right, search_key)\n        else:                       # if x is smaller, ignore right half\n            return binary_search_recursive(arr, left, mid - 1, search_key)\n    else:     # Element is not present in the array\n        return -1\n\n# Driver Code\narr = [10, 20, 180, 30, 60, 50, 110, 100, 70]\narr.sort()\nitem = 50\n\nprint(\"sorted array\", arr)\nindex = binary_search_recursive(arr, 0, len(arr) - 1, item)\nif index == -1:\n    print(f\"{item} is not present in array\")\nelse:\n    print(f\"{item} is at index\", index )", "nb": 8, "fns": ["binary_search_recursive"], "lines": 25}, {"ci": 12, "ch": "10. [알고리즘] 탐색(Searching)", "kind": "algo", "sid": "p3a3713e35a7d8013b308d674db01fcf0", "path": ["이진 탐색", "[중급] 인터폴레이션 검색(interpolation search)", "구현: Python"], "lang": "py", "code": "no_comparison = 0\n\ndef interpolationSearch(arr, low, hi, search_key):\n    if (low <= hi):\n        pos = low + ((search_key - arr[low]) * (hi - low) // (arr[hi] - arr[low]) )\n        \n        global no_comparison # to count # of comparision\n        no_comparison += 1\n\n        # found\n        if arr[pos] == search_key:\n            return pos\n \n        # If x is larger, x is in right subarray\n        elif arr[pos] < search_key:\n            return interpolationSearch(arr, pos + 1, hi, search_key)\n \n        # If x is smaller, x is in left subarray\n        else:\n            return interpolationSearch(arr, low, pos - 1, search_key)\n    return -1\n \n# Driver code\narr = [10, 12, 13, 16, 18, 19, 20, 21, 22, 23, 24, 33, 35, 42, 47]\nitem = 18\nindex = interpolationSearch(arr, 0, len(arr) - 1, item)\n\nif index == -1:\n    print(f\"{item} is not present in array\")\nelse:\n    print(f\"{item} is at index\", index )\nprint(\"no of comparison:\", no_comparison)", "nb": 9, "fns": ["interpolationSearch"], "lines": 32}, {"ci": 12, "ch": "10. [알고리즘] 탐색(Searching)", "kind": "algo", "sid": "p3e2713e35a7d80098156f862a6423852", "path": ["이진 탐색", "[중급] 인터폴레이션 검색(interpolation search)", "구현: C++"], "lang": "cpp", "code": "#include <iostream>\n#include <vector>\n\n// 비교 횟수를 기록할 전역 변수\nint no_comparison = 0;\n\nint interpolationSearch(const std::vector<int>& arr, int low, int hi, int search_key) {\n    // 1. 유효 범위 및 안전 경계 조건 확인 (Out of bounds & Division by zero 방지)\n    if (low <= hi && search_key >= arr[low] && search_key <= arr[hi]) {\n        \n        // arr[hi] == arr[low]인 경우 0으로 나누기 예외 방지\n        if (arr[hi] == arr[low]) {\n            no_comparison++;\n            if (arr[low] == search_key) return low;\n            return -1;\n        }\n\n        // 보간 탐색 위치(pos) 계산 수식\n        int pos = low + static_cast<int>(\n            (static_cast<long long>(search_key - arr[low]) * (hi - low)) / (arr[hi] - arr[low])\n        );\n\n        no_comparison++; // 비교 횟수 증가\n\n        // 2. 값 발견\n        if (arr[pos] == search_key) {\n            return pos;\n        }\n        // 3. search_key가 더 크면 오른쪽 부분 배열 탐색\n        else if (arr[pos] < search_key) {\n            return interpolationSearch(arr, pos + 1, hi, search_key);\n        }\n        // 4. search_key가 더 작으면 왼쪽 부분 배열 탐색\n        else {\n            return interpolationSearch(arr, low, pos - 1, search_key);\n        }\n    }\n\n    return -1; // 찾지 못함\n}\n\nint main() {\n    std::vector<int> arr = {10, 12, 13, 16, 18, 19, 20, 21, 22, 23, 24, 33, 35, 42, 47};\n    int item = 18;\n\n    int index = interpolationSearch(arr, 0, arr.size() - 1, item);\n\n    if (index == -1) {\n        std::cout << item << \" is not present in array\\n\";\n    } else {\n        std::cout << item << \" is at index \" << index << \"\\n\";\n    }\n    std::cout << \"no of comparison: \" << no_comparison << \"\\n\";\n\n    return 0;\n}", "nb": 10, "fns": ["interpolationSearch"], "lines": 56}, {"ci": 12, "ch": "10. [알고리즘] 탐색(Searching)", "kind": "algo", "sid": "p39d713e35a7d80789a05d043f4fb088e", "path": ["이진 탐색 트리(Binary Search Tree: BST)", "[참고] 이진 탐색 트리에서의 중복된 노드 값이 있는 경우"], "lang": "py", "code": "class Node:\n    def __init__(self, data):\n        self.data = data\n        self.count = 1  # 중복 횟수 기록\n        self.left = None\n        self.right = None", "nb": 4, "fns": ["__init__"], "lines": 6}, {"ci": 12, "ch": "10. [알고리즘] 탐색(Searching)", "kind": "algo", "sid": "p39d713e35a7d80789a05d043f4fb088e", "path": ["이진 탐색 트리(Binary Search Tree: BST)", "[참고] 이진 탐색 트리에서의 중복된 노드 값이 있는 경우"], "lang": "cpp", "code": "#include <iostream>\nusing namespace std;\n\nstruct Node {\n    int data;\n    int count = 1;          // 중복 횟수 기록\n    Node* left = nullptr;\n    Node* right = nullptr;\n    explicit Node(int d) : data(d) {}\n};\n\nNode* insert(Node* node, int key) {\n    if (node == nullptr) return new Node(
