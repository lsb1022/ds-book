td::size_t current = size(); // 추가된 노드의 현재 위치\n\n        while (current > 1) {\n            std::size_t parent = current / 2;\n            if (heap[parent] >= heap[current]) {\n                break;\n            }\n            std::swap(heap[parent], heap[current]);\n            current = parent;\n        }\n    }\n\n    // Pop (최댓값 추출)\n    T pop() {\n        if (is_empty()) {\n            return T{}; \n        }\n\n        T max_val = heap[1];\n        T last_val = heap.back();\n        heap.pop_back();\n\n        if (!is_empty()) {\n            heap[1] = last_val;\n            down_heap(1);\n        }\n\n        return max_val;\n    }\n    \n    // 임의의 배열을 O(N) 만에 힙으로 변환하는 바텀업(Bottom-up) 메서드\n    void heapify(const std::vector<T>& arr) {\n        // 기존 데이터를 초기화하고 0번 더미 뒤에 배열 통째로 복사\n        heap.resize(1);\n        heap.insert(heap.end(), arr.begin(), arr.end());\n\n        // 가장 마지막 부모 노드부터 루트(1)까지 역순으로 순회\n        // signed 타입(long long)을 사용하여 unsigned 언더플로 방지\n        for (long long current = static_cast<long long>(size() / 2); current >= 1; --current) {\n            down_heap(static_cast<std::size_t>(current));\n        }\n    }\n\n    // 우선순위가 가장 높은 요소를 삭제하지 않고 반환\n    T peek() const {\n        if (is_empty()) {\n            return T{};\n        }\n        return heap[1];\n    }    \n\n    // 힙 배열의 현재 상태 출력 (1번 인덱스부터)\n    void display() const {\n        std::cout << \"힙 배열: [\";\n        for (std::size_t i = 1; i <= size(); ++i) {\n            std::cout << heap[i];\n            if (i < size()) std::cout << \", \";\n        }\n        std::cout << \"]\\n\";\n    }\n};\n\nint main() {\n    // 1. heapify 생성자를 이용한 O(N) 힙 구축 테스트\n    std::vector<int> data = {10, 40, 30, 5, 12, 50};\n    MaxHeap<int> heap(data);\n\n    // 힙 배열 상태 출력\n    heap.display(); // 힙 배열: [50, 12, 40, 5, 10, 30]\n    \n    // Peek 결과 출력\n    std::cout << \"Peek 결과 (최댓값 확인): \" << heap.peek() << \"\\n\"; // 50\n    \n    // Pop 결과 출력\n    std::cout << \"Pop 결과: [\";\n    std::size_t initial_size = heap.size();\n    for (std::size_t i = 0; i < initial_size; ++i) {\n        std::cout << heap.pop();\n        if (i < initial_size - 1) std::cout << \", \";\n    }\n    std::cout << \"]\\n\"; // Pop 결과: [50, 40, 30, 12, 10, 5]\n\n    return 0;\n}", "ch": "9. 트리: 효율적인 탐색을 위한 자료구조", "chs": "9장", "path": "힙 생성: Bottom-up 방식 › C++", "core": ["down_heap", "is_empty", "size", "push", "pop", "heapify", "peek"]}, {"lang": "py", "code": "def search(arr, search_key):\n    for i in range(0, len(arr)):\n        if arr[i] == search_key:\n            return i\n    return -1\n\n\n# Driver Code\narr = [2, 3, 4, 10, 40]\nitem = 10\n\nindex = search(arr, item)\nif index == -1:\n    print(f\"{item} is not present in array\")\nelse:\n    print(f\"{item} is at index\", index )", "ch": "10. [알고리즘] 탐색(Searching)", "chs": "10장", "path": "정렬안된 리스트에서의 선형 검색 알고리즘(unordered linear search) › 구현", "core": ["search"]}, {"lang": "cpp", "code": "#include <iostream>\n#include <vector>\n\nint search(const std::vector<int>& arr, int search_key) {\n    for (int i = 0; i < arr.size(); ++i) {\n        if (arr[i] == search_key) {\n            return i;\n        }\n    }\n    return -1;\n}\n\nint main() {\n    std::vector<int> arr = {2, 3, 4, 10, 40};\n    int item = 10;\n\n    int index = search(arr, item);\n    if (index == -1) {\n        std::cout << item << \" is not present in array\\n\";\n    } else {\n        std::cout << item << \" is at index \" << index << \"\\n\";\n    }\n\n    return 0;\n}", "ch": "10. [알고리즘] 탐색(Searching)", "chs": "10장", "path": "정렬안된 리스트에서의 선형 검색 알고리즘(unordered linear search) › 구현", "core": ["search"]}, {"lang": "py", "code": "def search(arr, search_key):\n    for i in range(0, len(arr)):\n        if arr[i] == search_key:\n            return i\n    return -1", "ch": "10. [알고리즘] 탐색(Searching)", "chs": "10장", "path": "선형 탐색 › 센티널 순차 검색(sentinel linear search)", "core": ["search"]}, {"lang": "py", "code": "def sentinel_search(arr, search_key):\n    arr.append(search_key) # search_key를 sentinel로 추가\n    size = len(arr)   \n\n    index = 0\n    while arr[index] != search_key: # search_key 값의 유무 판단\n        index += 1\n \n    if index == size - 1: # 해당 값이 sentinel인지 여부 판단\n        return -1\n    else:\n        return index\n \n \n# Driver Code\narr = [10, 20, 180, 30, 60, 50, 110, 100, 70]\nitem = 80\n\nindex = sentinel_search(arr, item)\nif index == -1:\n    print(f\"{item} is not present in array\")\nelse:\n    print(f\"{item} is at index\", index )", "ch": "10. [알고리즘] 탐색(Searching)", "chs": "10장", "path": "센티널 순차 검색(sentinel linear search) › 구현", "core": ["sentinel_search"]}, {"lang": "cpp", "code": "#include <iostream>\n#include <vector>\n\nint sentinel_search(std::vector<int>& arr, int search_key) {\n    // 1. search_key를 보초(Sentinel)로 추가\n    arr.push_back(search_key);\n    int size = arr.size();\n\n    int index = 0;\n    // 2. 루프 내에서 경계 검사(index < size) 없이 조건 판단\n    while (arr[index] != search_key) {\n        index++;\n    }\n\n    // 3. 보초 원소를 제거하여 원래 배열 상태 복구\n    arr.pop_back();\n\n    // 4. 찾은 위치가 보초 위치(size - 1)인지 확인\n    if (index == size - 1) {\n        return -1; // 보초에서 멈춘 것이므로 원래 배열엔 없음\n    } else {\n        return index;\n    }\n}\n\nint main() {\n    std::vector<int> arr = {10, 20, 180, 30, 60, 50, 110, 100, 70};\n    int item = 80;\n\n    int index = sentinel_search(arr, item);\n    if (index == -1) {\n        std::cout << item << \" is not present in array\\n\";\n    } else {\n        std::cout << item << \" is at index \" << index << \"\\n\";\n    }\n\n    return 0;\n}", "ch": "10. [알고리즘] 탐색(Searching)", "chs": "10장", "path": "센티널 순차 검색(sentinel linear search) › 구현", "core": ["sentinel_search"]}, {"lang": "py", "code": "def binary_search(arr, search_key):\n    left = 0\n    right = len(arr) - 1\n\n    while left <= right:\n        mid = left + (right - left) // 2 # mid position\n \n        if arr[mid] == search_key:  # check if x is present at mid\n            return mid\n        elif arr[mid] < search_key: # if x is greater, ignore left half\n            left = mid + 1\n        else:                       # if x is smaller, ignore right half\n            right = mid - 1\n \n    return -1\n\n# Driver Code\narr = [10, 20, 180, 30, 60, 50, 110, 100, 70]\narr.sort() # sort array\nitem = 50\n\nprint(\"sorted array\", arr)\nindex= binary_search(arr, item)\nif index == -1:\n    print(f\"{item} is not present in array\")\nelse:\n    print(f\"{item} is at index\", index )", "ch": "10. [알고리즘] 탐색(Searching)", "chs": "10장", "path": "정렬된 리스트에서의 이진 검색(binary search) › 구현: Python", "core": ["binary_search"]}, {"lang": "py", "code": "def binary_search_recursive(arr, left, right, search_key):\n    # Check base case\n    if right >= left:\n        mid = left + (right - left) // 2 # mid position\n\n        if arr[mid] == search_key:  # check if x is present at mid\n            return mid\n        elif arr[mid] < search_key: # if x is greater, ignore left half\n            return binary_search_recursive(arr, mid + 1, right, search_key)\n        else:                       # if x is smaller, ignore right half\n            return binary_search_recursive(arr, left, mid - 1, search_key)\n    else:     # Element is not present in the array\n        return -1\n\n# Driver Code\narr = [10, 20, 180, 30, 60, 50, 110, 100, 70]\narr.sort()\nitem = 50\n\nprint(\"sorted array\", arr)\nindex = binary_search_recursive(arr, 0, len(arr) - 1, item)\nif index == -1:\n    print(f\"{item} is not present in array\")\nelse:\n    print(f\"{item} is at index\", index )", "ch": "10. [알고리즘] 탐색(Searching)", "chs": "10장", "path": "정렬된 리스트에서의 이진 검색(binary search) › 구현: Python", "core": ["binary_search_recursive"]}, {"lang": "cpp", "code": "#include <iostream>\n#include <vector>\n#include <algorithm> // std::sort 사용\n\nint binary_search(const std::vector<int>& arr, int search_key) {\n    int left = 0;\n    int right = arr.size() - 1;\n\n    while (left <= right) {\n        // 정수 오버플로를 방지하는 중간값 계산 방식\n        int mid = left + (right - left) / 2;\n\n        if (arr[mid] == search_key) {\n            return mid; // search_key 찾음\n        } \n        else if (arr[mid] < search_key) {\n            left = mid + 1;  // 오른쪽 반쪽으로 탐색 범위 축소\n        } \n        else {\n            right = mid - 1; // 왼쪽 반쪽으로 탐색 범위 축소\n        }\n    }\n\n    return -1; // 존재하지 않음\n}\n\nint main() {\n    std::vector<int> arr = {10, 20, 180, 30, 60, 50, 110, 100, 70};\n\n    // 1. 배열 정렬 (std::sort 사용)\n    std::sort(arr.begin(), arr.end());\n\n    // 정렬된 배열 출력\n    std::cout << \"sorted array: \";\n    for (int num : arr) {\n        std::cout << num << \" \";\n    }\n    std::cout << \"\\n\";\n\n    int item = 50;\n    int index = binary_search(arr, item);\n\n    if (index == -1) {\n        std::cout << item << \" is not present in array\\n\";\n    } else {\n        std::cout << item << \" is at index \" << index << \"\\n\";\n    }\n\n    return 0;\n}", "ch": "10. [알고리즘] 탐색(Searching)", "chs": "10장", "path": "정렬된 리스트에서의 이진 검색(binary search) › 구현: C++", "core": ["binary_search"]}, {"lang": "py", "code": "def binary_search_recursive(arr, left, right, search_key):\n    # Check base case\n    if right >= left:\n        mid = left + (right - left) // 2 # mid position\n\n        if arr[mid] == search_key:  # check if x is present at mid\n            return mid\n        elif arr[mid] < search_key: # if x is greater, ignore left half\n            return binary_search_recursive(arr, mid + 1, right, search_key)\n        else:                       # if x is smaller, ignore right half\n            return binary_search_recursive(arr, left, mid - 1, search_key)\n    else:     # Element is not present in the array\n        return -1\n\n# Driver Code\narr = [10, 20, 180, 30, 60, 50, 110, 100, 70]\narr.sort()\nitem = 50\n\nprint(\"sorted array\", arr)\nindex = binary_search_recursive(arr, 0, len(arr) - 1, item)\nif index == -1:\n    print(f\"{item} is not present in array\")\nelse:\n    print(f\"{item} is at index\", index )", "ch": "10. [알고리즘] 탐색(Searching)", "chs": "10장", "path": "정렬된 리스트에서의 이진 검색(binary search) › 구현: C++", "core": ["binary_search_recursive"]}, {"lang": "py", "code": "class Node:\n    def __init__(self, data):\n        self.data = data\n        self.left = None\n        self.right = None\n\n\nclass BST:\n    def __init__(self, root_data):\n        self.root = Node(root_data)\n\n    # 재귀적 검색 방식\n    def search_recur(self, node, key):\n        # 값을 찾지 못했거나, 노드가 없는 경우\n        if node is None:\n            return None\n        # 값을 찾은 경우\n        if node.data == key:\n            return node\n\n        # key가 현재 노드보다 작으면 왼쪽 탐색\n        if key < node.data:\n            return self.search_recur(node.left, key)\n        # key가 현재 노드보다 크면 오른쪽 탐색\n        else:\n            return self.search_recur(node.right, key)\n\n    # 반복적 검색 방식 (성능상 조금 더 유리)\n    def search_iterative(self, key):\n        current = self.root\n        while current is not None:\n            if key == current.data:\n                return current\n            elif key < current.data:\n                current = current.left\n            else:\n                current = current.right\n        return None\n        \n        \n # --- 1. 루트 생성 ---\nbst = BST(50)\n\n# --- 2. 노드 직접 생성 ---\nnode30 = Node(30)\nnode70 = Node(70)\nnode20 = Node(20)\nnode40 = Node(40)\n\n# --- 3. 포인터 직접 연결 (구조 구성) ---\n#      50\n#     /  \\\n#    30  70\n#   /  \\\n#  20  40\n\nbst.root.left = node30\nbst.root.right = node70\n\nbst.root.left.left = node20\nbst.root.left.right = node40\n\n# --- 4. 검색 테스트(반복문 이용) ---\ntarget = 40\nresult = bst.search_iterative(target)\n\nif result:\n    print(f\"[반복] 찾았습니다: {result.data}\")\nelse:\n    print(\"[반복] 찾지 못했습니다.\")\n    \n# --- 5. 검색 테스트(재귀함수 이용) ---\ntarget = 40\nresult = bst.search_recur(bst.root, target)\n\nif result:\n    print(f\"[재귀] 찾았습니다: {result.data}\")\nelse:\n    print(\"[재귀] 찾지 못했습니다.\")", "ch": "10. [알고리즘] 탐색(Searching)", "chs": "10장", "path": "탐색 › [구현] BST 탐색: Python", "core": ["search_recur", "search_iterative"]}, {"lang": "cpp", "code": "#include <iostream>\n#include <memory>\n#include <string>\n\n// 1. std::shared_ptr 기반 템플릿 노드 구조체\ntemplate <typename T>\nstruct Node {\n    T data;\n    std::shared_ptr<Node<T>> left{nullptr};   // 왼쪽 자식 노드\n    std::shared_ptr<Node<T>> right{nullptr};  // 오른쪽 자식 노드\n\n    explicit Node(const T& val) : data(val) {}\n};\n\n// 2. std::shared_ptr 기반 템플릿 이진 탐색 트리(BST) 클래스\ntemplate <typename T>\nclass BST {\npublic:\n    std::shared_ptr<Node<T>> root;\n\n    explicit BST(const T& root_data) {\n        root = std::make_shared<Node<T>>(root_data);\n    }\n\n    // 스마트 포인터 사용으로 소멸자를 직접 구현할 필요가 없음 (자동 메모리 해제)\n\n    // 재귀적 검색 방식\n    std::shared_ptr<Node<T>> search_recur(std::shared_ptr<Node<T>> node, const T& key) const {\n        if (node == nullptr) {\n            return nullptr;\n        }\n        if (node->data == key) {\n            return node;\n        }\n\n        if (key < node->data) {\n            return search_recur(node->left, key);\n        } else {\n            return search_recur(node->right, key);\n        }\n    }\n\n    // 반복적 검색 방식\n    std::shared_ptr<Node<T>> search_iterative(const T& key) const {\n        std::shared_ptr<Node<T>> current = root;\n        while (current != nullptr) {\n            if (key == current->data) {\n                return current;\n            } else if (key < current->data) {\n                current = current->left;\n            } else {\n                current = current->right;\n            }\n        }\n        return nullptr;\n    }\n};\n\nint main() {\n    // --- 1. 정수형(int) BST 생성 ---\n    BST<int> bst(50);\n\n    // std::make_shared를 통한 노드 생성 (RAII 지원 및 안전한 메모리 할당)\n    auto node30 = std::make_shared<Node<int>>(30);\n    auto node70 = std::make_shared<Node<int>>(70);\n    auto node20 = std::make_shared<Node<int>>(20);\n    auto node40 = std::make_shared<Node<int>>(40);\n\n    // 포인터 직접 연결 (구조 구성)\n    //      50\n    //     /  \\\n    //    30  70\n    //   /  \\\n    //  20  40\n    bst.root->left = node30;\n    bst.root->right = node70;\n\n    bst.root->left->left = node20;\n    bst.root->left->right = node40;\n\n    // --- 2. 검색 테스트 (반복문 이용) ---\n    int target = 40;\n    auto result1 = bst.search_iterative(target);\n\n    if (result1 != nullptr) {\n        std::cout << \"[반복] 찾았습니다: \" << result1->data << \"\\n\";\n    } else {\n        std::cout << \"[반복] 찾지 못했습니다.\\n\";\n    }\n\n    // --- 3. 검색 테스트 (재귀함수 이용) ---\n    auto result2 = bst.search_recur(bst.root, target);\n\n    if (result2 != nullptr) {\n        std::cout << \"[재귀] 찾았습니다: \" << result2->data << \"\\n\";\n    } else {\n        std::cout << \"[재귀] 찾지 못했습니다.\\n\";\n    }\n\n    return 0;\n}", "ch": "10. [알고리즘] 탐색(Searching)", "chs": "10장", "path": "탐색 › [구현] BST 탐색: C++", "core": ["search_recur", "search_iterative"]}, {"lang": "py", "code": "class Node:\n    def __init__(self, data):\n        self.data = data\n        self.left = None\n        self.right = None\n\n\nclass BST:\n    def __init__(self, root_data):\n        self.root = Node(root_data)\n\n    # --- 재귀적 검색 방식 ---\n    def search(self, node, key):\n        if node is None:\n            return None\n        if node.data == key:\n            return node\n\n        if key < node.data:\n            return self.search(node.left, key)\n        else:\n            return self.search(node.right, key)\n\n    # --- 반복적 검색 방식 ---\n    def search_iterative(self, key):\n        current = self.root\n        while current is not None:\n            if key == current.data:\n                return current\n            elif key < current.data:\n                current = current.left\n            else:\n                current = current.right\n        return None\n\n    # =========================================================\n    # --- 추가된 재귀적 노드 삽입(insert) 메서드 ---\n    # =========================================================\n    def insert(self, data):\n        \"\"\"사용자가 bst.insert(data) 형태로 호출하는 인터페이스 함수\"\"\"\n        self.root = self._insert_rec(self.root, data)\n\n    def _insert_rec(self, node, data):\n        \"\"\"실제 재귀 호출이 일어나는 내부 헬퍼 함수\"\"\"\n        # 1. 기저 조건(Base Case): 빈자리를 발견하면 새 노드 생성 후 반환\n        if node is None:\n            return Node(data)\n\n        # 2. 재귀 단계(Recursive Step): 값 비교 후 적절한 서브트리로 재귀 호출\n        if data < node.data:\n            node.left = self._insert_rec(node.left, data)\n        elif data > node.data:\n            node.right = self._insert_rec(node.right, data)\n        # data == node.data 인 경우(중복 값)는 변화 없이 진행\n\n        # 3. 갱신된 현재 노드 반환\n        return node\n\n    # =========================================================\n    # --- [추가] 반복적 노드 삽입(insert_iterative) 메서드 ---\n    # =========================================================\n    def insert_iterative(self, data):\n        \"\"\"루프문과 parent 포인터를 이용한 반복적 삽입 함수\"\"\"\n        # 1. 예외 처리: 트리가 비어있는 경우\n        if self.root is None:\n            self.root = Node(data)\n            return\n\n        parent = None\n        current = self.root\n\n        # 2. 탐색 및 위치 추적: 빈자리에 도달할 때까지 아래로 이동\n        while current is not None:\n            parent = current  # 이동하기 전 부모 노드 기록\n\n            if data < current.data:\n                current = current.left\n            elif data > current.data:\n                current = current.right\n\n        # 3. 노드 연결: parent 노드의 자식으로 새 노드 연결\n        if data < parent.data:\n            parent.left = Node(data)\n        else:\n            parent.right = Node(data)\n\n\n# =========================================================\n# --- 실행 및 테스트 코드 ---\n# =========================================================\nif __name__ == \"__main__\":\n    # 1. 루트 생성 (50)\n    bst = BST(50)\n\n    # 2. 재귀적 insert()를 통한 노드 삽입\n    #      50\n    #     /  \\\n    #    30  70\n    bst.insert(30)\n    bst.insert(70)\n\n    # 3. 반복적 insert_iterative()를 통한 노드 추가 삽입\n    #      50\n    #     /  \\\n    #    30  70\n    #   /  \\\n    #  20  40\n    bst.insert_iterative(20)\n    bst.insert_iterative(40)\n\n    # 4. 검색 테스트 (반복문 이용)\n    target = 40\n    result = bst.search_iterative(target)\n    if result:\n        print(f\"[반복] 찾았습니다: {result.data}\")\n    else:\n        print(\"[반복] 찾지 못했습니다.\")\n\n    # 5. 검색 테스트 (재귀함수 이용)\n    target = 20\n    result = bst.search(bst.root, target)\n    if result:\n        print(f\"[재귀] 찾았습니다: {result.data}\")\n    else:\n        print(\"[재귀] 찾지 못했습니다.\")", "ch": "10. [알고리즘] 탐색(Searching)", "chs": "10장", "path": "삽입 › [구현] 노드 삽입: Python", "core": ["search", "search_iterative", "insert", "_insert_rec", "insert_iterative"]}, {"lang": "cpp", "code": "#include <iostream>\n#include <memory>\n#include <string>\n\n// 1. std::shared_ptr 기반 템플릿 노드 구조체\ntemplate <typename T>\nstruct Node {\n    T data;\n    std::shared_ptr<Node<T>> left{nullptr};   // 왼쪽 자식 노드\n    std::shared_ptr<Node<T>> right{nullptr};  // 오른쪽 자식 노드\n\n    explicit Node(const T& val) : data(val) {}\n};\n\n// 2. std::shared_ptr 기반 템플릿 이진 탐색 트리(BST) 클래스\ntemplate <typename T>\nclass BST {\n\n// =========================================================\n// --- 실제 재귀 호출이 일어나는 내부 헬퍼 함수 ---\n// =========================================================\nprivate:\n    std::shared_ptr<Node<T>> _insert_rec(std::shared_ptr<Node<T>> node, const T& data) {\n        // 1. 기저 조건(Base Case): 빈자리를 발견하면 새 노드 생성 후 반환\n        if (node == nullptr) {\n            return std::make_shared<Node<T>>(data);\n        }\n\n        // 2. 재귀 단계(Recursive Step): 값 비교 후 적절한 서브트리로 재귀 호출 및 포인터 재연결\n        if (data < node->data) {\n            node->left = _insert_rec(node->left, data);\n        } else if (data > node->data) {\n            node->right = _insert_rec(node->right, data);\n        }\n        // data == node->data 인 경우(중복 값)는 변화 없이 진행\n\n        // 3. 갱신된 현재 노드 반환\n        return node;\n    }\n\npublic:\n    std::shared_ptr<Node<T>> root;\n\n    // 루트 데이터를 입력받는 생성자\n    explicit BST(const T& root_data) {\n        root = std::make_shared<Node<T>>(root_data);\n    }\n\n    // 스마트 포인터 사용으로 소멸자를 직접 구현할 필요가 없음 (자동 메모리 해제)\n\n    // 재귀적 검색 방식\n    std::shared_ptr<Node<T>> search(std::shared_ptr<Node<T>> node, const T& key) const {\n        if (node == nullptr) {\n            return nullptr;\n        }\n        if (node->data == key) {\n            return node;\n        }\n\n        if (key < node->data) {\n            return search(node->left, key);\n        } else {\n            return search(node->right, key);\n        }\n    }\n\n    // 반복적 검색 방식\n    std::shared_ptr<Node<T>> search_iterative(const T& key) const {\n        std::shared_ptr<Node<T>> current = root;\n        while (current != nullptr) {\n            if (key == current->data) {\n                return current;\n            } else if (key < current->data) {\n                current = current->left;\n            } else {\n                current = current->right;\n            }\n        }\n        return nullptr;\n    }\n\n    // =========================================================\n    // --- 추가된 재귀적 노드 삽입(insert) 메서드 ---\n    // =========================================================\n    void insert(const T& data) {\n        root = _insert_rec(root, data);\n    }\n\n    // =========================================================\n    // --- [추가] 반복적 노드 삽입(insert_iterative) 메서드 ---\n    // =========================================================\n    void insert_iterative(const T& data) {\n        // 1. 예외 처리: 트리가 비어있는 경우\n        if (root == nullptr) {\n            root = std::make_shared<Node<T>>(data);\n            return;\n        }\n\n        std::shared_ptr<Node<T>> parent = nullptr;\n        std::shared_ptr<Node<T>> current = root;\n\n        // 2. 탐색 및 위치 추적: 빈자리에 도달할 때까지 아래로 이동\n        while (current != nullptr) {\n            parent = current; // 이동하기 전 부모 노드 기록\n\n            if (data < current->data) {\n                current = current->left;\n            } else if (data > current->data) {\n                curr   balanced = insert(balanced, x)\nskewed = None\nfor x in [10, 20, 30, 40]:                 # 정렬된 순서로 넣으면 편향\n    skewed = insert(skewed, x)\n\nprint(\"균형:\", height(balanced))   # 3  -> 탐색 O(log n)\nprint(\"편향:\", height(skewed))     # 4  -> 탐색 O(n), 연결 리스트와 같다", "ch": "10. [알고리즘] 탐색(Searching)", "chs": "10장", "path": "삽입 › 성능 분석", "core": ["insert", "height"]}, {"lang": "cpp", "code": "#include <iostream>\n#include <algorithm>\nusing namespace std;\n\nstruct Node {\n    int data;\n    Node *left = nullptr, *right = nullptr;\n    explicit Node(int d) : data(d) {}\n};\n\nNode* insert(Node* node, int key) {\n    if (node == nullptr) return new Node(key);\n    if (key < node->data) node->left = insert(node->left, key);\n    else if (key > node->data) node->right = insert(node->right, key);\n    return node;\n}\n\nint height(Node* node) {\n    return node == nullptr ? 0 : 1 + max(height(node->left), height(node->right));\n}\n\nint main() {\n    Node* balanced = nullptr;\n    for (int x : {50, 30, 70, 20, 40, 60, 80}) balanced = insert(balanced, x);\n    Node* skewed = nullptr;\n    for (int x : {10, 20, 30, 40}) skewed = insert(skewed, x);\n    cout << \"균형: \" << height(balanced) << \"\\n\";   // 3\n    cout << \"편향: \" << height(skewed) << \"\\n\";     // 4\n    return 0;\n}", "ch": "10. [알고리즘] 탐색(Searching)", "chs": "10장", "path": "삽입 › 성능 분석", "core": ["insert", "height"]}, {"lang": "py", "code": "class Node:\n    def __init__(self, data):\n        self.data = data\n        self.left = None\n        self.right = None\n\n\nclass BST:\n    def __init__(self, root_data):\n        self.root = Node(root_data)\n    \n    # --- 재귀적 검색 방식 ---\n    def search(self, node, key):\n        if node is None:\n            return None\n        if node.data == key:\n            return node\n\n        if key < node.data:\n            return self.search(node.left, key)\n        else:\n            return self.search(node.right, key)\n\n    # --- 반복적 검색 방식 ---\n    def search_iterative(self, key):\n        current = self.root\n        while current is not None:\n            if key == current.data:\n                return current\n            elif key < current.data:\n                current = current.left\n            else:\n                current = current.right\n        return None\n\n    # --- 재귀적 노드 삽입(insert) 메서드 ---\n    def insert(self, data):\n        \"\"\"사용자가 bst.insert(data) 형태로 호출하는 인터페이스 함수\"\"\"\n        self.root = self._insert_rec(self.root, data)\n\n    def _insert_rec(self, node, data):\n        \"\"\"실제 재귀 호출이 일어나는 내부 헬퍼 함수\"\"\"\n        # 1. 기저 조건(Base Case): 빈자리를 발견하면 새 노드 생성 후 반환\n        if node is None:\n            return Node(data)\n\n        # 2. 재귀 단계(Recursive Step): 값 비교 후 적절한 서브트리로 재귀 호출\n        if data < node.data:\n            node.left = self._insert_rec(node.left, data)\n        elif data > node.data:\n            node.right = self._insert_rec(node.right, data)\n        # data == node.data 인 경우(중복 값)는 변화 없이 진행\n\n        # 3. 갱신된 현재 노드 반환\n        return node\n\n    # --- 반복적 노드 삽입(insert_iterative) 메서드 ---\n    def insert_iterative(self, data):\n        \"\"\"루프문과 parent 포인터를 이용한 반복적 삽입 함수\"\"\"\n        if self.root is None:\n            self.root = Node(data)\n            return\n\n        parent = None\n        current = self.root\n\n        while current is not None:\n            parent = current\n\n            if data < current.data:\n                current = current.left\n            elif data > current.data:\n                current = current.right\n            else:\n                return\n\n        if data < parent.data:\n            parent.left = Node(data)\n        else:\n            parent.right = Node(data)\n\n    # =========================================================\n    # --- [추가] 재귀적 노드 삭제(delete) 메서드 ---\n    # =========================================================\n    def delete(self, key):\n        \"\"\"사용자가 bst.delete(key) 형태로 호출하는 인터페이스 함수\"\"\"\n        self.root = self._delete_rec(self.root, key)\n\n    def _delete_rec(self, node, key):\n        \"\"\"실제 재귀 호출이 일어나는 삭제 내부 헬퍼 함수\"\"\"\n        # 1. 기저 조건(Base Case): 삭제할 키를 찾지 못한 경우\n        if node is None:\n            return None\n\n        # 2. 삭제할 노드 탐색 (재귀 호출)\n        if key < node.data:\n            node.left = self._delete_rec(node.left, key)\n        elif key > node.data:\n            node.right = self._delete_rec(node.right, key)\n        else:\n            # --- 삭제할 노드를 찾은 경우 (key == node.data) ---\n\n            # Case 1 & Case 2: 리프 노드(자식 0개) 또는 자식이 1개인 경우\n            # 아래의 코드는 리프 노드인 경우도 고려하고 있다.\n            # 리프 노드인 경우, 아래의 if 문이 true이고, 따라서 if 바디에서 None이 return된다.\n            if node.left is None:\n                return node.right  # 오른쪽 자식(또는 None)을 부모에 연결\n            elif node.right is None:\n                return node.left   # 왼쪽 자식을 부모에 연결\n\n            # Case 3: 자식이 2개인 경우\n            # 오른쪽 서브트리에서 가장 작은 노드(Inorder Successor)를 찾음\n            succ = self._min_value_node(node.right)\n            # 후계자 노드의 데이터를 현재 노드로 복사\n            node.data = succ.data\n            # 오른쪽 서브트리에서 복사해온 후계자 노드를 재귀적으로 삭제\n            node.right = self._delete_rec(node.right, succ.data)\n\n        # 3. 갱신된 현재 노드 반환\n        return node\n\n    def _min_value_node(self, node):\n        \"\"\"주어진 서브트리에서 가장 작은 값(가장 왼쪽)을 가진 노드 탐색\"\"\"\n        current = node\n        while current.left is not None:\n            current = current.left\n        return current\n\n\n# =========================================================\n# --- 실행 및 테스트 코드 ---\n# =========================================================\nif __name__ == \"__main__\":\n    # 1. 루트 생성 (50)\n    bst = BST(50)\n\n    # 2. 노드 삽입\n    #         50\n    #       /    \\\n    #     30      70\n    #    /  \\    /  \\\n    #  20   40  60  80\n    bst.insert(30)\n    bst.insert(70)\n    bst.insert(20)\n    bst.insert(40)\n    bst.insert(60)\n    bst.insert(80)\n\n    # 3. 검색 테스트\n    print(\"--- 삭제 전 검색 테스트 ---\")\n    print(\"40 검색:\", \"찾음\" if bst.search_iterative(40) else \"못 찾음\") # 찾음\n\n    # 4. 삭제 테스트 (자식이 2개인 노드 30 삭제)\n    # 30 삭제 후 오른쪽 서브트리 최소값인 40이 30 자리로 대체됨\n    bst.delete(30)\n\n    print(\"\\n--- 노드 30 삭제 후 검색 테스트 ---\")\n    print(\"30 검색:\", \"찾음\" if bst.search_iterative(30) else \"못 찾음\") # 못 찾음\n    print(\"40 검색 (대체됨):\", \"찾음\" if bst.search_iterative(40) else \"못 찾음\") # 찾음\n    print(\"20 검색 (자식 유지):\", \"찾음\" if bst.search_iterative(20) else \"못 찾음\") # 찾음", "ch": "10. [알고리즘] 탐색(Searching)", "chs": "10장", "path": "삭제 › [구현] 노드 삭제: Python", "core": ["search", "search_iterative", "insert", "_insert_rec", "insert_iterative", "delete", "_delete_rec", "_min_value_node"]}, {"lang": "cpp", "code": "#include <iostream>\n#include <memory>\n#include <string>\n\n// 1. std::shared_ptr 기반 템플릿 노드 구조체\ntemplate <typename T>\nstruct Node {\n    T data;\n    std::shared_ptr<Node<T>> left{nullptr};   // 왼쪽 자식 노드\n    std::shared_ptr<Node<T>> right{nullptr};  // 오른쪽 자식 노드\n\n    explicit Node(const T& val) : data(val) {}\n};\n\n// 2. std::shared_ptr 기반 템플릿 이진 탐색 트리(BST) 클래스\ntemplate <typename T>\nclass BST {\n\nprivate:\n    std::shared_ptr<Node<T>> _insert_rec(std::shared_ptr<Node<T>> node, const T& data) {\n        // 1. 기저 조건(Base Case): 빈자리를 발견하면 새 노드 생성 후 반환\n        if (node == nullptr) {\n            return std::make_shared<Node<T>>(data);\n        }\n\n        // 2. 재귀 단계(Recursive Step): 값 비교 후 적절한 서브트리로 재귀 호출 및 포인터 재연결\n        if (data < node->data) {\n            node->left = _insert_rec(node->left, data);\n        } else if (data > node->data) {\n            node->right = _insert_rec(node->right, data);\n        }\n        // data == node->data 인 경우(중복 값)는 변화 없이 진행\n\n        // 3. 갱신된 현재 노드 반환\n        return node;\n    }\n    // =========================================================\n    // --- 추가된 함수 ---\n    // =========================================================\n    // 주어진 서브트리에서 가장 작은 값(가장 왼쪽)을 가진 노드 탐색\n    std::shared_ptr<Node<T>> _min_value_node(std::shared_ptr<Node<T>> node) const {\n        std::shared_ptr<Node<T>> current = node;\n        while (current->left != nullptr) {\n            current = current->left;\n        }\n        return current;\n    }\n\n    // 실제 재귀 호출이 일어나는 노드 삭제 내부 헬퍼 함수\n    std::shared_ptr<Node<T>> _delete_rec(std::shared_ptr<Node<T>> node, const T& key) {\n        // 1. 기저 조건(Base Case): 삭제할 키를 찾지 못한 경우\n        if (node == nullptr) {\n            return nullptr;\n        }\n\n        // 2. 삭제할 노드 탐색 (재귀 호출)\n        if (key < node->data) {\n            node->left = _delete_rec(node->left, key);\n        } else if (key > node->data) {\n            node->right = _delete_rec(node->right, key);\n        } else {\n            // --- 삭제할 노드를 찾은 경우 (key == node->data) ---\n\n            // Case 1 & Case 2: 리프 노드(자식 0개) 또는 자식이 1개인 경우\n            if (node->left == nullptr) {\n                return node->right; // 오른쪽 자식(또는 nullptr)을 부모에 연결\n            } else if (node->right == nullptr) {\n                return node->left;  // 왼쪽 자식을 부모에 연결\n            }\n\n            // Case 3: 자식이 2개인 경우\n            // 오른쪽 서브트리에서 가장 작은 노드(Inorder Successor)를 탐색\n            std::shared_ptr<Node<T>> succ = _min_value_node(node->right);\n            // 후계자 노드의 데이터를 현재 노드로 복사\n            node->data = succ->data;\n            // 오른쪽 서브트리에서 복사해온 후계자 노드를 재귀적으로 삭제\n            node->right = _delete_rec(node->right, succ->data);\n        }\n\n        // 3. 갱신된 현재 노드 반환\n        return node;\n    }\n\npublic:\n    std::shared_ptr<Node<T>> root;\n\n    // 루트 데이터를 입력받는 생성자\n    explicit BST(const T& root_data) {\n        root = std::make_shared<Node<T>>(root_data);\n    }\n\n    // 스마트 포인터 사용으로 소멸자를 직접 구현할 필요가 없음 (자동 메모리 해제)\n\n    // 재귀적 검색 방식\n    std::shared_ptr<Node<T>> search(std::shared_ptr<Node<T>> node, const T& key) const {\n        if (node == nullptr) {\n            return nullptr;\n        }\n        if (node->data == key) {\n            return node;\n        }\n\n        if (key < node->data) {\n            return search(node->left, key);\n        } else {\n            return search(node->right, key);\n        }\n    }\n\n    // 반복적 검색 방식\n    std::shared_ptr<Node<T>> search_iterative(const T& key) const {\n        std::shared_ptr<Node<T>> current = root;\n        while (current != nullptr) {\n            if (key == current->data) {\n                return current;\n            } else if (key < current->data) {\n                current = current->left;\n            } else {\n                current = current->right;\n            }\n        }\n        return nullptr;\n    }\n\n    // =========================================================\n    // --- 추가된 재귀적 노드 삽입(insert) 메서드 ---\n    // =========================================================\n    void insert(const T& data) {\n        root = _insert_rec(root, data);\n    }\n\n    void insert_iterative(const T& data) {\n        // 1. 예외 처리: 트리가 비어있는 경우\n        if (root == nullptr) {\n            root = std::make_shared<Node<T>>(data);\n            return;\n        }\n\n        std::shared_ptr<Node<T>> parent = nullptr;\n        std::shared_ptr<Node<T>> current = root;\n\n        // 2. 탐색 및 위치 추적: 빈자리에 도달할 때까지 아래로 이동\n        while (current != nullptr) {\n            parent = current; // 이동하기 전 부모 노드 기록\n\n            if (data < current->data) {\n                current = current->left;\n            } else if (data > current->data) {\n                current = current->right;\n            } else {\n                // 중복 값 존재하는 경우 변화 없이 종료\n                return;\n            }\n        }\n\n        // 3. 노드 연결: parent 노드의 자식으로 새 노드 연결\n        if (data < parent->data) {\n            parent->left = std::make_shared<Node<T>>(data);\n        } else {\n            parent->right = std::make_shared<Node<T>>(data);\n        }\n    }\n    \n    // =========================================================\n    // --- [추가] 재귀적 노드 삭제(delete_node) 메서드 ---\n    // =========================================================\n    void delete_node(const T& key) {\n        root = _delete_rec(root, key);\n    }    \n    \n};\n\nint main() {\n    // --- 1. 루트 생성 (50) ---\n    BST<int> bst(50);\n\n    // --- 2. 노드 삽입 ---\n    //         50\n    //       /    \\\n    //     30      70\n    //    /  \\    /  \\\n    //  20   40  60  80\n    bst.insert(30);\n    bst.insert(70);\n    bst.insert_iterative(20);\n    bst.insert_iterative(40);\n    bst.insert(60);\n    bst.insert(80);\n\n    // --- 3. 삭제 전 검색 테스트 ---\n    std::cout << \"--- 삭제 전 검색 테스트 ---\\n\";\n    auto check1 = bst.search_iterative(30);\n    std::cout << \"30 검색: \" << (check1 ? \"찾음\" : \"못 찾음\") << \"\\n\";\n\n    // --- 4. 삭제 테스트 (자식이 2개인 노드 30 삭제) ---\n    // 30 삭제 후 오른쪽 서브트리의 최소값인 40이 30 자리를 대체함\n    bst.delete_node(30);\n\n    std::cout << \"\\n--- 노드 30 삭제 후 검색 테스트 ---\\n\";\n    auto check2 = bst.search_iterative(30);\n    std::cout << \"30 검색: \" << (check2 ? \"찾음\" : \"못 찾음\") << \"\\n\"; // 못 찾음\n\n    auto check3 = bst.search_iterative(40);\n    std::cout << \"40 검색 (대체됨): \" << (check3 ? \"찾음\" : \"못 찾음\") << \"\\n\"; // 찾음\n\n    auto check4 = bst.search_iterative(20);\n    std::cout << \"20 검색 (자식 유지): \" << (check4 ? \"찾음\" : \"못 찾음\") << \"\\n\"; // 찾음\n\n    return 0;\n}", "ch": "10. [알고리즘] 탐색(Searching)", "chs": "10장", "path": "삭제 › [구현] 노드 삭제: C++", "core": ["_insert_rec", "_min_value_node", "_delete_rec", "search", "search_iterative", "insert", "insert_iterative"]}, {"lang": "py", "code": "class FixedSimpleHashTable:\n    \"\"\"ADT 명세를 엄격히 따르는 정수 키 전용 해시 테이블\"\"\"\n\n    def __init__(self):\n        \"\"\"create() 연산: 크기 10인 빈 해시 테이블 생성\"\"\"\n        self.table_size = 10\n        # 체이닝(Chaining)을 위해 10개의 빈 방(bucket)을 준비합니다.\n        self._table = [[] for _ in range(self.table_size)]\n        self._length = 0\n\n    def _hash_function(self, search_key: int):\n        \"\"\"내부 해시 함수: 주어진 정수의 1의 자리(나머지 10)를 방 번호로 사용\"\"\"\n        return search_key % self.table_size\n\n    def destroy(self):\n        \"\"\"destroy() 연산: 해시 테이블의 데이터를 지우고 무력화\"\"\"\n        self._table = None\n        self._length = 0\n\n    def add(self, key: int, value):\n        \"\"\"add(key, value) 연산: (key, value) 추가 및 업데이트\"\"\"\n        if self._table is None:\n            raise RuntimeError(\"해시 테이블이 이미 삭제(destroy)되었습니다.\")\n\n        index = self._hash_function(key)\n        bucket = self._table[index]\n\n        # 이미 존재하는 Key가 있는지 방 안을 확인합니다.\n        for item in bucket:\n            if item[0] == key:\n                item[1] = value  # 이미 있다면 value만 업데이트(덮어쓰기)\n                return\n\n        # 완전히 새로운 Key라면 방의 맨 뒤에 쌍을 추가합니다.\n        bucket.append([key, value])\n        self._length += 1\n\n    def delete(self, key: int):\n        \"\"\"delete(key) 연산: key에 해당하는 쌍 삭제 (없으면 KeyError)\"\"\"\n        if self._table is None:\n            raise RuntimeError(\"해시 테이블이 이미 삭제(destroy)되었습니다.\")\n\n        index = self._hash_function(key)\n        bucket = self._table[index]\n\n        for i, item in enumerate(bucket):\n            if item[0] == key:\n                bucket.pop(i)  # 해당 인덱스의 [key, value] 제거\n                self._length -= 1\n                return\n\n        # 끝까지 돌았는데 키가 없다면 ADT 명세에 따라 KeyError 발생\n        raise KeyError(f\"Key {key}가 테이블에 존재하지 않습니다.\")\n\n    def search(self, key: int):\n        \"\"\"search(key) 연산: key에 해당하는 value 반환 (없으면 None)\"\"\"\n        if self._table is None:\n            return None\n\n        index = self._hash_function(key)\n        bucket = self._table[index]\n\n        for item in bucket:\n            if item[0] == key:\n                return item[1]  # 찾았다면 value 반환\n\n        return None  # 못 찾았다면 ADT 명세에 따라 None 반환\n\n    def length(self) -> int:\n        \"\"\"length() 연산: 저장된 (key, value) 쌍의 총개수 반환\"\"\"\n        return self._length\n\n    def display(self):\n        \"\"\"내부 메커니즘 확인용: 각 방(버킷)의 상태를 시각적으로 출력\"\"\"\n        if self._table is None:\n            print(\"Destroyed Table\")\n            return\n        print(\"=== 해시 테이블 내부 상태 ===\")\n        for i, bucket in enumerate(self._table):\n            print(f\"방 번호 [{i}]: {bucket}\")\n        print(f\"총 데이터 개수: {self._length}\\n\")", "ch": "10. [알고리즘] 탐색(Searching)", "chs": "10장", "path": "해싱(hashing) › [구현] Python: 숫자를 키 값으로", "core": ["_hash_function", "add", "delete", "search"]}, {"lang": "py", "code": "class Graph:\n    def __init__(self, size):\n        self.size = size\n        # 0으로 초기화된 V x V 행렬 생성\n        self.matrix = [[0] * size for _ in range(size)]\n\n    def add_edge(self, u, v):\n        \"\"\"간선 추가 (비방향 그래프)\"\"\"\n        self.matrix[u][v] = 1\n        self.matrix[v][u] = 1\n\n    def delete_edge(self, u, v):\n        \"\"\"간선 삭제\"\"\"\n        self.matrix[u][v] = 0\n        self.matrix[v][u] = 0\n\n    def adjacent(self, u) -> list:\n        \"\"\"특정 정점과 연결된 인접 노드들의 목록을 리스트로 반환\"\"\"\n        # 행렬의 해당 행에서 값이 1인 인덱스들을 List Comprehension으로 추출\n        return [i for i, val in enumerate(self.matrix[u]) if val == 1]\n\n    def print_matrix(self):\n        \"\"\"인접 행렬 출력\"\"\"\n        for row in self.matrix:\n            print(row)\n\n\n# --- 사용 예시 및 검증 ---\nif __name__ == \"__main__\":\n    g = Graph(4)\n    g.add_edge(0, 1)\n    g.add_edge(0, 2)\n    g.add_edge(1, 2)\n    \n    print(\"=== 초기 그래프 행렬 ===\")\n    g.print_matrix()\n\n    print(f\"\\n정점 0의 인접 노드: {g.adjacent(0)}\")  # 출력: [1, 2]\n\n    print(\"\\n=== 정점 0과 2 사이의 간선 삭제 후 ===\")\n    g.delete_edge(0, 2)\n    g.print_matrix()\n    print(f\"정점 0의 인접 노드: {g.adjacent(0)}\")  # 출력: [1]", "ch": "11. 그래프(graphs): 관계를 표현하는 자료구조", "chs": "11장", "path": "인접 행렬(adjacency matrix)을 이용한 구현 › [구현] Python", "core": ["add_edge", "delete_edge", "adjacent"]}, {"lang": "cpp", "code": "#include <iostream>\n#include <vector>\n#include <stdexcept>\n\nclass Graph {\nprivate:\n    int size;\n    std::vector<std::vector<int>> matrix;\n\npublic:\n    // 생성자: size x size 크기의 2차원 vector를 0으로 초기화\n    explicit Graph(int size) : size(size), matrix(size, std::vector<int>(size, 0)) {}\n\n    // 간선 추가 (비방향 그래프)\n    void add_edge(int u, int v) {\n        matrix[u][v] = 1;\n        matrix[v][u] = 1;\n    }\n\n    // 간선 삭제\n    void delete_edge(int u, int v) {\n        matrix[u][v] = 0;\n        matrix[v][u] = 0;\n    }\n\n    // 특정 정점과 연결된 인접 노드들의 목록을 vector로 반환\n    std::vector<int> adjacent(int u) const {\n        std::vector<int> neighbors;\n        for (int i = 0; i < size; ++i) {\n            if (matrix[u][i] == 1) {\n                neighbors.push_back(i);\n            }\n        }\n        return neighbors;\n    }\n\n    // 인접 행렬 출력\n    void print_matrix() const {\n        for (int i = 0; i < size; ++i) {\n            std::cout << \"[\";\n            for (int j = 0; j < size; ++j) {\n                std::cout << matrix[i][j] << (j == size - 1 ? \"\" : \", \");\n            }\n            std::cout << \"]\\n\";\n        }\n    }\n};\n\n// --- 사용 예시 및 검증 ---\nint main() {\n    Graph g(4);\n    g.add_edge(0, 1);\n    g.add_edge(0, 2);\n    g.add_edge(1, 2);\n\n    std::cout << \"=== 초기 그래프 행렬 ===\\n\";\n    g.print_matrix();\n\n    std::cout << \"\\n정점 0의 인접 노드: \";\n    for (int node : g.adjacent(0)) {\n        std::cout << node << \" \";\n    }\n    std::cout << \"\\n\";\n\n    std::cout << \"\\n=== 정점 0과 2 사이의 간선 삭제 후 ===\\n\";\n    g.delete_edge(0, 2);\n    g.print_matrix();\n\n    std::cout << \"정점 0의 인접 노드: \";\n    for (int node : g.adjacent(0)) {\n        std::cout << node << \" \";\n    }\n    std::cout << \"\\n\";\n\n    return 0;\n}", "ch": "11. 그래프(graphs): 관계를 표현하는 자료구조", "chs": "11장", "path": "인접 행렬(adjacency matrix)을 이용한 구현 › [구현] C++", "core": ["add_edge", "delete_edge", "adjacent"]}, {"lang": "py", "code": "class AdjacencyListGraph:\n    def __init__(self, size):\n        self.size = size\n        # 0부터 size-1까지의 정점을 위한 고정 크기 인접 리스트\n        # self.adj_list[0]은 0번 노드에 연결된 인접 노드를 가진 리스트이다.\n        self.adj_list = [[] for _ in range(size)]\n\n    def add_edge(self, u, v):\n        \"\"\"간선 추가 (비방향 그래프)\"\"\"\n        if v not in self.adj_list[u]:\n            self.adj_list[u].append(v)\n        if u not in self.adj_list[v]:\n            self.adj_list[v].append(u)\n\n    def delete_edge(self, u, v):\n        \"\"\"간선 삭제\"\"\"\n        if v in self.adj_list[u]:\n            self.adj_list[u].remove(v)\n        if u in self.adj_list[v]:\n            self.adj_list[v].remove(u)\n\n    def adjacent(self, u):\n        \"\"\"특정 정점의 인접 노드 목록 반환\"\"\"\n        return self.adj_list[u]\n\n    def print_graph(self):\n        \"\"\"그래프 구조 출력\"\"\"\n        for i, neighbors in enumerate(self.adj_list):\n            print(f\"정점 {i}: {neighbors}\")\n\n\n# --- 사용 예시 ---\nif __name__ == \"__main__\":\n    g = AdjacencyListGraph(4)\n    g.add_edge(0, 1)\n    g.add_edge(0, 2)\n    g.add_edge(1, 2)\n    \n    print(\"=== 그래프 상태 ===\")\n    g.print_graph()\n    \n    print(f\"\\n정점 0의 인접 노드 조회: {g.adjacent(0)}\")  # 출력: [1, 2]", "ch": "11. 그래프(graphs): 관계를 표현하는 자료구조", "chs": "11장", "path": "인접 리스트(adjacency list)를 이용한 구현 › [구현] Python: list 사용", "core": ["add_edge", "delete_edge", "adjacent"]}, {"lang": "py", "code": "# 아래는 노드 추가, 에지 추가만 구현하였다.\nclass DynamicGraph:\n    def __init__(self):\n        # 정점(Key)과 그에 인접한 노드들의 목록(Value, List)을 담는 딕셔너리\n        self.adj_list = {}\n\n    def add_vertex(self, u):\n        \"\"\"새로운 정점 동적 추가\"\"\"\n        if u not in self.adj_list:\n            self.adj_list[u] = []\n\n    def add_edge(self, u, v):\n        \"\"\"간선 추가 (정점이 없으면 자동으로 생성)\"\"\"\n        self.add_vertex(u)\n        self.add_vertex(v)\n        \n        if v not in self.adj_list[u]:\n            self.adj_list[u].append(v)\n        if u not in self.adj_list[v]:\n            self.adj_list[v].append(u)\n\n    def adjacent(self, u):\n        \"\"\"특정 정점의 인접 노드 목록 반환 (존재하지 않으면 빈 리스트 반환)\"\"\"\n        return self.adj_list.get(u, [])\n    \n    def print_graph(self):\n        \"\"\"그래프 구조 출력\"\"\"\n        for u, neighbors in self.adj_list.items():\n            print(f\"정점 {u}: {neighbors}\")\n\n\n# --- 사용 예시 ---\nif __name__ == \"__main__\":\n    g = DynamicGraph()\n    g.add_edge(\"A\", \"B\")\n    g.add_edge(\"A\", \"C\")\n    g.add_edge(\"B\", \"D\")  # 미리 크기를 지정하지 않아도 새로운 정점 'D'가 자연스럽게 추가된다.\n    \n    g.print_graph()\n    \"\"\"\n    정점 A: ['B', 'C']\n    정점 B: ['A', 'D']\n    정점 C: ['A']\n    정점 D: ['B']\n    \"\"\"\n    print(g.adjacent(\"A\")) # ['B', 'C']", "ch": "11. 그래프(graphs): 관계를 표현하는 자료구조", "chs": "11장", "path": "인접 리스트(adjacency list)를 이용한 구현 › [구현] Python: dictionary 사용", "core": ["add_edge", "adjacent"]}, {"lang": "cpp", "code": "#include <iostream>\n#include <vector>\n#include <algorithm>\n\nclass FixedAdjacencyListGraph {\nprivate:\n    int size;\n    std::vector<std::vector<int>> adj_list;\n\npublic:\n    // 생성자: size 크기의 2차원 vector 초기화\n    explicit FixedAdjacencyListGraph(int size) : size(size), adj_list(size) {}\n\n    // 간선 추가 (비방향 그래프)\n    void add_edge(int u, int v) {\n        // v가 adj_list[u]에 없다면 추가\n        if (std::find(adj_list[u].begin(), adj_list[u].end(), v) == adj_list[u].end()) {\n            adj_list[u].push_back(v);\n        }\n        // u가 adj_list[v]에 없다면 추가\n        if (std::find(adj_list[v].begin(), adj_list[v].end(), u) == adj_list[v].end()) {\n            adj_list[v].push_back(u);\n        }\n    }\n\n    // 간선 삭제\n    void delete_edge(int u, int v) {\n        auto it_u = std::find(adj_list[u].begin(), adj_list[u].end(), v);\n        if (it_u != adj_list[u].end()) {\n            adj_list[u].erase(it_u);\n        }\n\n        auto it_v = std::find(adj_list[v].begin(), adj_list[v].end(), u);\n        if (it_v != adj_list[v].end()) {\n            adj_list[v].erase(it_v);\n        }\n    }\n\n    // 특정 정점의 인접 노드 목록 반환 (const 참조 반환으로 불필요한 복사 방지)\n    const std::vector<int>& adjacent(int u) const {\n        return adj_list[u];\n    }\n\n    // 그래프 구조 출력\n    void print_graph() const {\n        for (int i = 0; i < size; ++i) {\n            std::cout << \"정점 \" << i << \": [\";\n            for (size_t j = 0; j < adj_list[i].size(); ++j) {\n                std::cout << adj_list[i][j] << (j == adj_list[i].size() - 1 ? \"\" : \", \");\n            }\n            std::cout << \"]\\n\";\n        }\n    }\n};\n\n// --- 사용 예시 ---\nint main() {\n    FixedAdjacencyListGraph g(4);\n    g.add_edge(0, 1);\n    g.add_edge(0, 2);\n    g.add_edge(1, 2);\n    \n    std::cout << \"=== 그래프 상태 ===\\n\";\n    g.print_graph();\n    /*\n    === 그래프 상태 ===\n    정점 0: [1, 2]\n    정점 1: [0, 2]\n    정점 2: [0, 1]\n    정점 3: []\n    */\n    \n    std::cout << \"\\n정점 0의 인접 노드 조회: [\";\n\n    const auto& neighbors = g.adjacent(0);\n    for (size_t i = 0; i < neighbors.size(); ++i) {\n        std::cout << neighbors[i] << (i == neighbors.size() - 1 ? \"\" : \", \");\n    }\n    std::cout << \"]\\n\";\n\n    return 0;\n}", "ch": "11. 그래프(graphs): 관계를 표현하는 자료구조", "chs": "11장", "path": "인접 리스트(adjacency list)를 이용한 구현 › [구현] C++", "core": ["add_edge", "delete_edge", "adjacent"]}, {"lang": "py", "code": "from collections import deque\n\ngraph = {0: [1, 2], 1: [3], 2: [4], 3: [5], 4: [5], 5: []}   # 인접 리스트 (방향 그래프)\n\ndef bfs_search(graph, start_node, goal):\n    visited = [False] * len(graph)               # 1. 방문 배열, 큐\n    queue = deque([start_node])                  # 2. enqueue + 방문 처리\n    visited[start_node] = True\n    while queue:                                 # 3. 큐가 빌 때까지\n        current_node = queue.popleft()           # 4. dequeue\n        print(current_node, end=\" \")\n        if current_node == goal:                 # 5. 목적지\n            print()\n            return True\n        for neighbor in graph[current_node]:     # 6. 인접 노드\n            if not visited[neighbor]:\n                visited[neighbor] = True         # 넣기 전에 방문 처리 (중복 방지)\n                queue.append(neighbor)\n    print()\n    return False                                 # 7. 못 찾음\n\nprint(bfs_search(graph, 0, 5))   # 0 1 2 3 4 5 / True", "ch": "11. 그래프(graphs): 관계를 표현하는 자료구조", "chs": "11장", "path": "그래프 탐색 › 너비 우선 탐색", "core": ["bfs_search"]}, {"lang": "py", "code": "from collections import deque\n\nclass Graph:\n    def __init__(self, size):\n        self.size = size\n        # 인접 행렬 초기화\n        self.matrix = [[0] * size for _ in range(size)]\n\n    def add_edge(self, u, v):\n        self.matrix[u][v] = 1\n        self.matrix[v][u] = 1\n\n    # DFS: 재귀 함수 사용\n    def dfs_recur_search(self, v, goal, visited):\n        visited[v] = True\n        \n        # 1. 목적지 도달 확인\n        if v == goal:\n            return True\n        \n        # 2. 연결된 모든 정점 확인\n        for neighbor in range(self.size):\n            if self.matrix[v][neighbor] == 1 and not visited[neighbor]:\n                # 자식 탐색 결과 목적지를 찾았다면 True를 연쇄적으로 반환하며 즉시 종료\n                if self.dfs_recur_search(neighbor, goal, visited):\n                    return True\n                    \n        return False\n\n    # DFS: 스택을 이용한 비재귀(반복문) 탐색\n    def dfs_stack_search(self, start, goal):\n        visited = [False] * self.size\n        stack = [start]  # 파이썬 리스트를 스택으로 활용 (.append와 .pop 사용)\n        \n        while stack:\n            v = stack.pop()\n            \n            # 이미 방문한 노드라면 건너뜀\n            if visited[v]:\n                continue\n                \n            visited[v] = True\n            \n            # 목적지 도달 확인 (조기 종료)\n            if v == goal:\n                return True\n                \n            # 인접 노드 탐색\n            # 재귀 DFS와 유사한 방문 순서를 유지하기 위해 역순(size-1부터 0까지)으로 스택에 삽입\n            for neighbor in range(self.size - 1, -1, -1):\n                if self.matrix[v][neighbor] == 1 and not visited[neighbor]:\n                    stack.append(neighbor)\n                    \n        return False\n\n    # BFS: deque를 사용하여 너비 우선 탐색\n    def bfs_search(self, start, goal):\n        visited = [False] * self.size\n        queue = deque([start])\n        visited[start] = True\n        \n        while queue:\n            v = queue.popleft()\n            \n            # 목적지 도달 확인 (조기 종료)\n            if v == goal:\n                return True\n                \n            for neighbor in range(self.size):\n                if self.matrix[v][neighbor] == 1 and not visited[neighbor]:\n                    visited[neighbor] = True\n                    queue.append(neighbor)\n                    \n        return False\n\n# 실행 예시\ng = Graph(8)\ng.add_edge(0, 1)\ng.add_edge(0, 2)\ng.add_edge(0, 6)\ng.add_edge(2, 5)\ng.add_edge(2, 4)\ng.add_edge(5, 6)\ng.add_edge(6, 4)\ng.add_edge(6, 7)\n\nstart_node = 0\ngoal_node = 7\n\nprint(f\"--- 재귀 DFS 탐색 ({start_node}번 노드 -> 목표 {goal_node}번 노드) ---\")\nvisited_dfs = [False] * 8\nfound_recursive = g.dfs_recur_search(start_node, goal_node, visited_dfs)\nprint(f\"결과: {'성공적으로 찾았습니다!' if found_recursive else '찾지 못했습니다.'}\\n\")\n# 탐색 순서: 0 - 1 - 2 - 4 - 6 - 5 - 7\n\n# 2. 스택 기반(비재귀) DFS 호출\nprint(f\"--- 스택 DFS 탐색 ({start_node}번 노드 -> 목표 {goal_node}번 노드) ---\")\nfound_stack = g.dfs_stack_search(start_node, goal_node)\nprint(f\"결과: {'성공적으로 찾았습니다!' if found_stack else '찾지 못했습니다.'}\\n\")\n# 탐색 순서: 0 - 1 - 2 - 4 - 6 - 5 - 7\n    \n# 3. BFS 호출    \nprint(f\"--- BFS 탐색 ({start_node}번 노드 -> 목표 {goal_node}번 노드) ---\")\nfound_bfs = g.bfs_search(start_node, goal_node)\nprint(f\"결과: {'성공적으로 찾았습니다!' if found_bfs else '찾지 못했습니다.'}\")\n# 탐색 순서: 0 - 1 - 2 - 6 - 4 - 5 - 7", "ch": "11. 그래프(graphs): 관계를 표현하는 자료구조", "chs": "11장", "path": "그래프 탐색 구현 › [구현] Python: 인접 행렬", "core": ["add_edge", "dfs_recur_search", "dfs_stack_search", "bfs_search"]}, {"lang": "py", "code": "from collections import deque\n\nclass AdjacencyListGraph:\n    def __init__(self, size):\n        self.size = size\n        # 0부터 size-1까지의 정점을 위한 고정 크기 인접 리스트\n        self.adj_list = [[] for _ in range(size)]\n\n    def add_edge(self, u, v):\n        \"\"\"간선 추가 (비방향 그래프)\"\"\"\n        if v not in self.adj_list[u]:\n            self.adj_list[u].append(v)\n        if u not in self.adj_list[v]:\n            self.adj_list[v].append(u)\n\n    # 1. 재귀 함수를 이용한 DFS 탐색\n    def dfs_recur_search(self, v, goal, visited):\n        visited[v] = True\n        \n        # 목적지 도달 확인\n        if v == goal:\n            return True\n        \n        # 인접한 모든 정점 확인\n        for neighbor in self.adj_list[v]:\n            if not visited[neighbor]:\n                if self.dfs_recur_search(neighbor, goal, visited):\n                    return True\n                    \n        return False\n\n    # 2. 스택을 이용한 비재귀(반복문) DFS 탐색\n    def dfs_stack_search(self, start, goal):\n        visited = [False] * self.size\n        stack = [start]  # 파이썬 리스트를 스택으로 활용\n        \n        while stack:\n            v = stack.pop()\n            \n            # 이미 방문한 노드라면 건너뜀\n            if visited[v]:\n                continue\n                \n            visited[v] = True\n            \n            # 목적지 도달 확인 (조기 종료)\n            if v == goal:\n                return True\n                \n            # 인접 노드 탐색 (재귀와 유사한 순서를 유지하기 위해 역순으로 스택에 삽입)\n            for neighbor in reversed(self.adj_list[v]):\n                if not visited[neighbor]:\n                    stack.append(neighbor)\n                    \n        return False\n\n    # 3. BFS 탐색 (deque 사용)\n    def bfs_search(self, start, goal):\n        visited = [False] * self.size\n        queue = deque([start])\n        visited[start] = True\n        \n        while queue:\n            v = queue.popleft()\n            \n            # 목적지 도달 확인 (조기 종료)\n            if v == goal:\n                return True\n                \n            for neighbor in self.adj_list[v]:\n                if not visited[neighbor]:\n                    visited[neighbor] = True\n                    queue.append(neighbor)\n                    \n        return False\n\n# --- 실행 예시 ---\nif __name__ == \"__main__\":\n    # 8개 노드(0 ~ 7)로 크기 설정\n    g = AdjacencyListGraph(8)\n    \n    # 그래프 에지 설정\n    g.add_edge(0, 1)\n    g.add_edge(0, 2)\n    g.add_edge(0, 6)\n    g.add_edge(2, 5)\n    g.add_edge(2, 4)\n    g.add_edge(5, 6)\n    g.add_edge(6, 4)\n    g.add_edge(6, 7)\n\n    start_node = 0\n    goal_node = 7\n\n    print(f\"--- 재귀 DFS 탐색 ({start_node}번 노드 -> 목표 {goal_node}번 노드) ---\")\n    visited_dfs = [False] * 8\n    found_recursive = g.dfs_recur_search(start_node, goal_node, visited_dfs)\n    print(f\"결과: {'성공적으로 찾았습니다!' if found_recursive else '찾지 못했습니다.'}\\n\")\n    # 탐색 순서: 0 - 1 - 2 - 4 - 6 - 5 - 7\n\n    # 2. 스택 기반(비재귀) DFS 호출\n    print(f\"--- 스택 DFS 탐색 ({start_node}번 노드 -> 목표 {goal_node}번 노드) ---\")\n    found_stack = g.dfs_stack_search(start_node, goal_node)\n    print(f\"결과: {'성공적으로 찾았습니다!' if found_stack else '찾지 못했습니다.'}\\n\")\n    # 탐색 순서: 0 - 1 - 2 - 4 - 6 - 5 - 7\n        \n    # 3. BFS 호출    \n    print(f\"--- BFS 탐색 ({start_node}번 노드 -> 목표 {goal_node}번 노드) ---\")\n    found_bfs = g.bfs_search(start_node, goal_node)\n    print(f\"결과: {'성공적으로 찾았습니다!' if found_bfs else '찾지 못했습니다.'}\")\n    # 탐색 순서: 0 - 1 - 2 - 6 - 4 - 5 - 7", "ch": "11. 그래프(graphs): 관계를 표현하는 자료구조", "chs": "11장", "path": "그래프 탐색 구현 › [구현] Python: 인접 리스트", "core": ["add_edge", "dfs_recur_search", "dfs_stack_search", "bfs_search"]}, {"lang": "cpp", "code": "\n#include <iostream>\n#include <vector>\n#include <stack>\n#include <queue>\n\nusing namespace std;\n\nclass Graph {\nprivate:\n    int size;\n    vector<vector<int>> matrix;\n\npublic:\n    Graph(int size) {\n        this->size = size;\n        matrix.resize(size, vector<int>(size, 0));\n    }\n\n    // 간선 추가\n    void add_edge(int u, int v) {\n        matrix[u][v] = 1;\n        matrix[v][u] = 1;\n    }\n\n    // 1. 재귀 DFS\n    bool dfs_recur_search(int v, int goal, vector<bool>& visited) {\n        visited[v] = true;\n\n        // 방문 정점 출력\n        cout << v << \" \";\n\n        // 목적지 도달 확인\n        if (v == goal) {\n            return true;\n        }\n\n        // 인접 정점 탐색\n        for (int neighbor = 0; neighbor < size; neighbor++) {\n            if (matrix[v][neighbor] == 1 && !visited[neighbor]) {\n                if (dfs_recur_search(neighbor, goal, visited)) {\n                    return true;\n                }\n            }\n        }\n\n        return false;\n    }\n\n    // 2. 스택 DFS\n    bool dfs_stack_search(int start, int goal) {\n        vector<bool> visited(size, false);\n        stack<int> st;\n\n        st.push(start);\n\n        while (!st.empty()) {\n            int v = st.top();\n            st.pop();\n\n            if (visited[v]) {\n                continue;\n            }\n\n            visited[v] = true;\n\n            // 방문 정점 출력\n            cout << v << \" \";\n\n            // 목적지 도달 확인\n            if (v == goal) {\n                return true;\n            }\n\n            // 역순으로 스택에 삽입\n            for (int neighbor = size - 1; neighbor >= 0; neighbor--) {\n                if (matrix[v][neighbor] == 1 && !visited[neighbor]) {\n                    st.push(neighbor);\n                }\n            }\n        }\n\n        return false;\n    }\n\n    // 3. BFS\n    bool bfs_search(int start, int goal) {\n        vector<bool> visited(size, false);\n        queue<int> q;\n\n        q.push(start);\n        visited[start] = true;\n\n        while (!q.empty()) {\n            int v = q.front();\n            q.pop();\n\n            // 방문 정점 출력\n            cout << v << \" \";\n\n            // 목적지 도달 확인\n            if (v == goal) {\n                return true;\n            }\n\n            // 인접 정점 탐색\n            for (int neighbor = 0; neighbor < size; neighbor++) {\n                if (matrix[v][neighbor] == 1 && !visited[neighbor]) {\n                    visited[neighbor] = true;\n                    q.push(neighbor);\n                }\n            }\n        }\n\n        return false;\n    }\n};\n\n\n// 실행 예시\nint main() {\n    Graph g(8);\n\n    g.add_edge(0, 1);\n    g.add_edge(0, 2);\n    g.add_edge(0, 6);\n    g.add_edge(2, 5);\n    g.add_edge(2, 4);\n    g.add_edge(5, 6);\n    g.add_edge(6, 4);\n    g.add_edge(6, 7);\n\n    int start_node = 0;\n    int goal_node = 7;\n\n    // 1. 재귀 DFS\n    cout << \"--- 재귀 DFS 탐색 ---\" << endl;\n    vector<bool> visited_dfs(8, false);\n    bool found_recursive = g.dfs_recur_search(start_node, goal_node, visited_dfs);\n    cout << \"\\n결과: \" << (found_recursive ? \"성공!\" : \"실패!\") << \"\\n\\n\";\n    // 0 1 2 4 6 5 7 \n\n    // 2. 스택 DFS\n    cout << \"--- 스택 DFS 탐색 ---\" << endl;\n    bool found_stack = g.dfs_stack_search(start_node, goal_node);\n    cout << \"\\n결과: \" << (found_stack ? \"성공!\" : \"실패!\") << \"\\n\\n\";\n    // 0 1 2 4 6 5 7 \n    \n    // 3. BFS\n    cout << \"--- BFS 탐색 ---\" << endl;\n    bool found_bfs = g.bfs_search(start_node, goal_node);\n    cout << \"\\n결과: \" << (found_bfs ? \"성공!\" : \"실패!\") << endl;\n    // 0 1 2 6 4 5 7 \n    return 0;\n}", "ch": "11. 그래프(graphs): 관계를 표현하는 자료구조", "chs": "11장", "path": "그래프 탐색 구현 › [구현] C++: 인접 행렬", "core": ["add_edge", "dfs_recur_search", "dfs_stack_search", "bfs_search"]}, {"lang": "cpp", "code": "\n#include <iostream>\n#include <vector>\n#include <stack>\n#include <queue>\n#include <algorithm>\n\nusing namespace std;\n\nclass AdjacencyListGraph {\nprivate:\n    int size;\n\n    // 인접 리스트\n    vector<vector<int>> adj_list;\n\npublic:\n    // 생성자\n    AdjacencyListGraph(int size) {\n        this->size = size;\n        adj_list.resize(size);\n    }\n\n    // 간선 추가 (무방향 그래프)\n    void add_edge(int u, int v) {\n\n        // 중복 간선 방지\n        if (find(adj_list[u].begin(), adj_list[u].end(), v)\n            == adj_list[u].end()) {\n            adj_list[u].push_back(v);\n        }\n\n        if (find(adj_list[v].begin(), adj_list[v].end(), u)\n            == adj_list[v].end()) {\n            adj_list[v].push_back(u);\n        }\n    }\n\n    // 1. 재귀 DFS\n    bool dfs_recur_search(int v, int goal, vector<bool>& visited) {\n\n        visited[v] = true;\n\n        // 방문 정점 출력\n        cout << v << \" \";\n\n        // 목적지 도달 확인\n        if (v == goal) {\n            return true;\n        }\n\n        // 인접 정점 탐색\n        for (int neighbor : adj_list[v]) {\n\n            if (!visited[neighbor]) {\n\n                if (dfs_recur_search(neighbor, goal, visited)) {\n                    return true;\n                }\n            }\n        }\n\n        return false;\n    }\n\n    // 2. 스택 DFS\n    bool dfs_stack_search(int start, int goal) {\n\n        vector<bool> visited(size, false);\n        stack<int> st;\n\n        st.push(start);\n\n        while (!st.empty()) {\n\n            int v = st.top();\n            st.pop();\n\n            // 이미 방문한 정점이면 건너뜀\n            if (visited[v]) {\n                continue;\n            }\n\n            visited[v] = true;\n\n            // 방문 정점 출력\n            cout << v << \" \";\n\n            // 목적지 도달 확인\n            if (v == goal) {\n                return true;\n            }\n\n            // 재귀 DFS와 같은 순서를 유지하기 위해 역순 삽입\n            for (int i = (int)adj_list[v].size() - 1; i >= 0; i--) {\n\n                int neighbor = adj_list[v][i];\n\n                if (!visited[neighbor]) {\n                    st.push(neighbor);\n                }\n            }\n        }\n\n        return false;\n    }\n\n    // 3. BFS\n    bool bfs_search(int start, int goal) {\n\n        vector<bool> visited(size, false);\n        queue<int> q;\n\n        q.push(start);\n        visited[start] = true;\n\n        while (!q.empty()) {\n\n            int v = q.front();\n            q.pop();\n\n            // 방문 정점 출력\n            cout << v << \" \";\n\n            // 목적지 도달 확인\n            if (v == goal) {\n                return true;\n            }\n\n            // 인접 정점 탐색\n            for (int neighbor : adj_list[v]) {\n\n                if (!visited[neighbor]) {\n\n                    visited[neighbor] = true;\n                    q.push(neighbor);\n                }\n            }\n        }\n\n        return false;\n    }\n};\n\n\n// 실행 예시\nint main() {\n\n    // 8개 정점 (0 ~ 7)\n    AdjacencyListGraph g(8);\n\n    // 간선 추가\n    g.add_edge(0, 1);\n    g.add_edge(0, 2);\n    g.add_edge(0, 6);\n    g.add_edge(2, 5);\n    g.add_edge(2, 4);\n    g.add_edge(5, 6);\n    g.add_edge(6, 4);\n    g.add_edge(6, 7);\n\n    int start_node = 0;\n    int goal_node = 7;\n\n\n    // 1. 재귀 DFS\n    cout << \"--- 재귀 DFS 탐색 (\"\n         << start_node << \" -> \" << goal_node << \") ---\" << endl;\n\n    vector<bool> visited_dfs(8, false);\n\n    bool found_recursive = g.dfs_recur_search(start_node, goal_node, visited_dfs);\n\n    cout << \"\\n결과: \"\n         << (found_recursive ? \"성공적으로 찾았습니다!\" : \"찾지 못했습니다!\") << \"\\n\\n\";\n\n\n    // 2. 스택 DFS\n    cout << \"--- 스택 DFS 탐색 (\"\n         << start_node << \" -> \" << goal_node << \") ---\" << endl;\n\n    bool found_stack = g.dfs_stack_search(start_node, goal_node);\n\n    cout << \"\\n결과: \"\n         << (found_stack ? \"성공적으로 찾았습니다!\" : \"찾지 못했습니다!\") << \"\\n\\n\";\n\n\n    // 3. BFS\n    cout << \"--- BFS 탐색 (\"\n         << start_node << \" -> \" << goal_node << \") ---\" << endl;\n\n    bool found_bfs = g.bfs_search(start_node, goal_node);\n\n    cout << \"\\n결과: \"\n         << (found_bfs ? \"성공적으로 찾았습니다!\" : \"찾지 못했습니다!\")\n         << endl;\n\n    return 0;\n}\n", "ch": "11. 그래프(graphs): 관계를 표현하는 자료구조", "chs": "11장", "path": "그래프 탐색 구현 › [구현] C++: 인접 리스트", "core": ["add_edge", "dfs_recur_search", "dfs_stack_search", "bfs_search"]}, {"lang": "py", "code": "import heapq # min-heap을 위해서\n\ndef dijkstra(graph, start):\n    # 최단 거리 테이블을 모두 무한대(Infinity)로 초기화\n    distances = {node: float('inf') for node in graph}\n    \n    # 시작 노드의 거리는 0으로 설정\n    distances[start] = 0\n    \n    # 우선순위 큐 (Min-Heap) 생성: (거리, 노드)\n    pq = [(0, start)]\n    \n    while pq:\n        # 현재 가장 거리가 짧은 노드 정보를 꺼냄\n        current_distance, current_node = heapq.heappop(pq)\n        \n        # 이미 처리된 적이 있는 노드라면 무시 (테이블의 기록된 거리보다 크다면)\n        if distances[current_node] < current_distance:\n            continue\n            \n        # 인접한 노드들과의 거리 계산\n        for neighbor, weight in graph[current_node].items():\n            distance = current_distance + weight\n            \n            # 기존에 기록된 최단 거리보다 더 짧은 경로가 발견된 경우\n            if distance < distances[neighbor]:\n                distances[neighbor] = distance\n                # 큐에 새로운 최단 거리 정보 삽입\n                heapq.heappush(pq, (distance, neighbor))\n                \n    return distances\n\n# --- 실행 예시 ---\nif __name__ == \"__main__\":\n    # 그래프 표현: 딕셔너리 구조 {노드: {인접노드: 가중치, ...}}\n    graph = {\n        'A': {'B': 8, 'C': 1, 'D': 2},\n        'B': {},\n        'C': {'B': 5, 'D': 2},\n        'D': {'E': 3, 'F': 5},\n        'E': {'F': 1},\n        'F': {}\n    }\n    \n    start_node = 'A'\n    \n    print(f\"--- 다익스트라 최단 경로 탐색 (시작 노드: '{start_node}') ---\")\n    shortest_paths = dijkstra(graph, start_node)\n    \n    for node, distance in shortest_paths.items():\n        print(f\"시작점 '{start_node}' -> 노드 '{node}' 최단 거리: {distance}\")\n        \n\"\"\"\n--- 다익스트라 최단 경로 탐색 (시작 노드: 'A') ---\n시작점 'A' -> 노드 'A' 최단 거리: 0\n시작점 'A' -> 노드 'B' 최단 거리: 6\n시작점 'A' -> 노드 'C' 최단 거리: 1\n시작점 'A' -> 노드 'D' 최단 거리: 2\n시작점 'A' -> 노드 'E' 최단 거리: 5\n시작점 'A' -> 노드 'F' 최단 거리: 6\n\"\"\"", "ch": "11. 그래프(graphs): 관계를 표현하는 자료구조", "chs": "11장", "path": "다익스트라 알고리즘: 가중치가 있는 그래프의 최단 경로 › [구현] Python", "core": ["dijkstra"]}, {"lang": "cpp", "code": "#include <iostream>\n#include <map>\n#include <queue>\n#include <vector>\n#include <climits>\n#include <functional>\nusing namespace std;\n\nmap<char, int> dijkstra(map<char, map<char, int>>& graph, char start) {\n    map<char, int> distances;\n    for (auto& [node, _] : graph) distances[node] = INT_MAX;   // 모두 무한대로\n    distances[start] = 0;\n    // (거리, 노드) 최소 힙\n    priority_queue<pair<int, char>, vector<pair<int, char>>, greater<>> pq;\n    pq.push({0, start});\n\n    while (!pq.empty()) {\n        auto [current_distance, current_node] = pq.top(); pq.pop();\n        if (distances[current_node] < current_distance) continue;   // 이미 처리된 노드\n        for (auto& [neighbor, weight] : graph[current_node]) {\n            int distance = current_distance + weight;\n            if (distance < distances[neighbor]) {                   // 더 짧은 경로 발견\n                distances[neighbor] = distance;\n                pq.push({distance, neighbor});\n            }\n        }\n    }\n    return distances;\n}\n\nint main() {\n    map<char, map<char, int>> graph = {\n        {'A', {{'B', 8}, {'C', 1}, {'D', 2}}},\n        {'B', {}},\n        {'C', {{'B', 5}, {'D', 2}}},\n        {'D', {{'E', 3}, {'F', 5}}},\n        {'E', {{'F', 1}}},\n        {'F', {}}};\n    char start_node = 'A';\n    cout << \"--- 다익스트라 최단 경로 탐색 (시작 노드: '\" << start_node << \"') ---\\n\";\n    for (auto& [node, distance] : dijkstra(graph, start_node))\n        cout << \"시작점 '\" << start_node << \"' -> 노드 '\" << node << \"' 최단 거리: \" << distance << \"\\n\";\n    return 0;\n}", "ch": "11. 그래프(graphs): 관계를 표현하는 자료구조", "chs": "11장", "path": "다익스트라 알고리즘: 가중치가 있는 그래프의 최단 경로 › [구현] Python", "core": ["dijkstra"]}];
const AIREF = [{"id": "c1", "no": 1, "name": "1장 소프트웨어 공학·디버깅", "ref": "## 한눈에 보기\n- 소프트웨어 비용의 약 **50%는 유지 보수**에서 나온다. 그래서 초반 설계, 특히 자료구조·알고리즘 설계가 중요하다.\n- 문제 해결 5단계: **분석 → 개념 모델링 → 자료구조·알고리즘 결정 → 프로그래밍 → 검증·수정**\n- 에러는 발생 시점에 따라 **논리 · 컴파일 · 링크 · 런타임** 에러로 나뉜다.\n- Python `list`는 이름과 달리 **동적 배열**이다. 맨 앞 삽입·삭제가 O(n)인 이유가 여기 있다.\n\n## 1.1 소프트웨어 공학\n- 하드와이어 프로그래밍(ENIAC) → 폰 노이만의 **내장 프로그램 방식** → 고급 언어 등장 → 소프트웨어 대형화\n- 체계 없이 주먹구구로 만들다 생긴 문제가 **소프트웨어 위기**이고, 그 해법으로 구조적 프로그래밍 같은 공학적 접근이 도입되었다.\n- **소프트웨어 공학**: 소프트웨어 제작을 공학적으로 체계화하는 방법. 전체 과정에서 코딩은 10~20%뿐이고, 요구 분석과 설계에 더 많은 시간을 쓴다.\n\n## 1.2 소프트웨어 개발 주기\n| 단계 | 비용 비율 |\n|---|---|\n| 요구 분석·명세 | 약 10% |\n| 설계 | 약 10% |\n| 프로그래밍 | 약 10% |\n| 테스트·디버그 | 약 20% |\n| **유지 보수** | **약 50%** |\n\n> 💡 유지 보수에 절반이 든다. 처음 설계가 잘못되면 집을 리모델링하듯 큰 비용이 든다.\n\n## 1.3 AI 시대의 소프트웨어 공학\n- 무게 중심이 **코드 작성 → AI 결과물의 검증·관리**로 옮겨 가고 있다.\n- AI 모델 자체가 소프트웨어의 일부가 되면서 비결정론적 출력을 다루는 과제가 생겼다.\n- 그래도 데이터를 어떤 형태로 조직할지(자료구조), 어떤 순서로 풀지(알고리즘)는 여전히 엔지니어가 정한다. 자료구조와 알고리즘은 **설계의 뼈대**다.\n\n## 1.4 문제 해결을 위한 프로그래밍 절차\n1. **문제 분석**: 입력, 출력, 요구 사항 정의\n2. **개념 모델링**: 큰 그림 구상\n3. **자료구조·알고리즘 결정**: 효율을 좌우하는 핵심 단계\n4. **프로그래밍**\n5. **검증·수정**\n\n설계 원칙 4가지\n- **문제 분해**: 하향식(큰 덩어리 → 상세화) 또는 상향식(작은 모듈 → 조합)\n- **수도코드**: 언어 문법과 무관하게 논리만 적은 설계 도면\n- **엣지 케이스**: 빈 입력, 아주 큰 입력, 오버플로, 시간 제한\n- **설계서**: 입출력 명세, 알고리즘 선택 근거, 복잡도 예측, 수도코드\n\n## 1.6 디버깅과 에러의 종류\n| 에러 | 언제 | 예 |\n|---|---|---|\n| 논리(semantic) | 알고리즘 설계 | `i = i - 1`로 잘못 씀, 무한 루프. 컴파일러가 못 찾음 |\n| 컴파일 | 컴파일 중 | 문법 오류 |\n| 링크 | 오브젝트 파일 결합 | 정의를 찾지 못함 |\n| 런타임 | 실행 중 | 0으로 나누기, 허가되지 않은 메모리 접근 |\n\n## 1.7 에러를 만났을 때\n1. 찾을 수 있다는 자신감\n2. 대부분은 **오타**: 0과 o, `,`와 `.`, `;`와 `:`, 대소문자\n3. 에러 메시지를 다시 읽기 (최소한 위치 힌트가 있다)\n4. 잠깐 쉬기, 다른 사람에게 묻기\n5. `print()`로 중간 값 확인", "codes": []}, {"id": "c2", "no": 2, "name": "2장 자료구조·ADT", "ref": "## 한눈에 보기\n- **자료구조** = 재료(데이터를 어떻게 저장·조직하나), **알고리즘** = 요리법(어떤 순서로 처리하나). 둘은 떼어 놓을 수 없다.\n- 자료구조는 **선형**(배열, 연결 리스트, 스택, 큐)과 **비선형**(트리, 그래프), **특수 목적**(힙, 해싱)으로 나뉜다.\n- 알고리즘의 요건은 **정확성 · 명확성 · 효율성**.\n- **ADT**는 \"무엇을 할 수 있는가(what)\"만 정하고 \"어떻게 구현하는가(how)\"는 숨긴다.\n\n## 2.0 왜 배우는가\n- 자료구조: 각 구조의 장단점을 알고 문제에 맞게 고르기 위해, 그리고 직접 구현하며 프로그래밍 실력을 키우기 위해\n- 알고리즘: 더 적은 시간·메모리로 풀기, 문제를 쪼개 규칙을 찾는 논리적 사고, 언어가 바뀌어도 남는 기술\n\n## 2.1 자료구조란?\n데이터를 목적에 맞게 체계적으로 저장하고 관리하는 논리적 방식. 정리 잘 된 집에서 물건을 빨리 찾는 것과 같다.\n- **효율성**: 삽입·삭제·검색 속도\n- **구조적 적합성**: 순서, 계층, 연결 같은 관계를 표현\n- **확장성**: 데이터가 크게 늘어도 안정적\n\n## 2.2 자료구조의 종류\n| 분류 | 관계 | 예 |\n|---|---|---|\n| 기본 자료형 | 단일 값 | int, float, char |\n| 선형 | 1:1, 일렬 | 배열, 연결 리스트, 스택(LIFO), 큐(FIFO) |\n| 비선형 | 1:N, M:N | 트리(계층), 그래프(망) |\n| 특수 목적 | | 힙(최댓값·최솟값 O(1)), 해싱(키 → 주소로 거의 즉시 검색) |\n\n## 2.3 일상 속 자료구조\n| 자료구조 | 일상의 예 |\n|---|---|\n| 배열 | 방#1, 방#2처럼 번호로 부르는 방 |\n| 연결 리스트 | 수시로 끼워 넣고 지우는 일정표 |\n| 스택 | 책상 위 책 더미, 헨젤과 그레텔의 되돌아가는 길 |\n| 큐 | 은행 번호표 |\n| 트리 / 그래프 | 조직도 / 지하철 노선도 (사이클이 있으면 그래프, 트리는 그래프의 부분 집합) |\n| 힙 | 우선순위 큐, CPU 스케줄링 |\n| 해싱 | 비교 한 번으로 존재 여부 확인 |\n\n## 2.4~2.6 알고리즘과 표현 방법\n알고리즘: 문제를 해결하기 위한 명확하고 순서 있는 절차의 집합.\n\n| 표현 방법 | 장점 | 단점 |\n|---|---|---|\n| 자연어 | 쉽게 씀 | 모호함 (\"아버지가방에들어가신다\") |\n| 순서도 | 흐름이 그림으로 보임 | 복잡하면 그림도 복잡 |\n| 의사 코드 | 실제 코드와 비슷하고 언어 독립적 | |\n\n알고리즘의 요건\n- **정확성**: 모든 입력에 올바른 결과\n- **명확성**: 입력, 출력, 각 단계가 분명\n- **효율성**: 시간·공간을 적게 사용\n\n## 2.7 추상 데이터 타입(ADT)\n- 자료형 = **데이터의 집합 + 연산의 집합** (예: int는 정수 범위 + 사칙연산)\n- **ADT**: 새 자료형의 데이터와 연산을 추상적으로 정의한 것. 내부 구현은 숨기고 연산(인터페이스)만 공개한다.\n- 명세 항목: **데이터 정의 + 연산 명세** (+ 사전·사후 조건. 이 교재는 조건은 생략)\n\n왜 쓰나\n1. **모듈화**: 배열 스택을 연결 리스트 스택으로 바꿔도 사용하는 코드는 그대로\n2. 추상 단계에서 먼저 설계할 수 있어 실수가 줄어든다\n3. 언어와 무관하게 같은 명세를 공유\n\n예: 연락처 ADT\n- 데이터: (이름, 번호) 쌍의 집합\n- 연산: `add(name, number)`, `find(name)`, `delete(name)`, `count()`\n- 내부가 정렬 배열이든 연결 리스트든 사용자는 `find(name)`만 알면 된다.\n\n> 📝 \"ADT는 what을 정의하고 how를 숨긴다\"는 문장과, 이후 장마다 나오는 스택·큐·트리·그래프 ADT의 연산 목록을 함께 기억하자.\n\n## 참고 사이트\n- VisuAlgo, USFCA Data Structure Visualizations, DataStructure360: 자료구조 동작을 애니메이션으로 볼 수 있는 무료 사이트", "codes": []}, {"id": "c3", "no": 3, "name": "3장 성능 분석·Big-O", "ref": "## 한눈에 보기\n- 알고리즘의 효율은 코드 줄 수나 실제 실행 시간이 아니라 **입력 크기 n에 따른 단위 연산 횟수**(시간 복잡도)와 메모리(공간 복잡도)로 잰다.\n- **점근적 분석**: n이 아주 클 때 성장률만 본다. 상수 계수와 낮은 차수는 버린다. $4n^3 + 2n$ → $O(n^3)$\n- O는 상한(최악), Ω는 하한(최선), Θ는 상한과 하한이 같을 때.\n- 성장 순서: $O(1) < O(\\log n) < O(n) < O(n\\log n) < O(n^2) < O(2^n)$\n- **분할상환 분석**: 가끔 비싼 연산이 있어도 일련의 연산 전체를 평균 내면 싸다 (`list.append`는 O(1)).\n\n## 3.1 같은 문제, 네 가지 풀이: 도수 분포표\n0~99 사이 난수 n개를 10 단위 구간으로 세는 문제.\n\n| 방법 | 방식 | 원소 하나당 비교 |\n|---|---|---|\n| #1 | `if` 10개를 모두 검사 | 항상 10번 |\n| #2 | `elif` 사슬 | 평균 약 5번 |\n| #3 | 이중 `for` + `break` | #2와 같은 동작, 코드만 짧음 |\n| #4 | 나눗셈으로 바로 인덱스 | 비교 없음 |\n\n```python\nfor num in samples:\n    graph[num // 10] += 1     # 방법 #4: if 없이 몫을 인덱스로\n```\n> 💡 코드가 짧다고 빠른 게 아니다(#3). 동작 방식 자체를 바꿔야 빨라진다(#4).\n\n## 3.2 효율성을 어떻게 잴까\n| 아이디어 | 문제점 |\n|---|---|\n| 코드 줄 수 | 줄 수와 실제 연산량은 별개 |\n| 실제 실행 시간 측정 | CPU, 메모리, OS에 따라 달라지고 특정 경우에만 해당 |\n| **시간 복잡도** | 입력 크기 n에 대한 **단위 연산**(가장 중심이 되는 반복 연산, 예: 정렬의 비교) 횟수 |\n| **공간 복잡도** | 고정 공간 + 보조 공간(임시 저장소) |\n\n## 3.3 점근적 분석과 Big-O\n| 표기 | 의미 | 쓰는 곳 |\n|---|---|---|\n| $O$ | 상한: \"아무리 느려도 이 이상은 아니다\" | 최악의 경우, 실무 보장 |\n| $\\Omega$ | 하한: \"최소한 이 정도는 걸린다\" | 비교 기반 정렬은 $\\Omega(n\\log n)$ |\n| $\\Theta$ | 상한 = 하한 | 배열 합 구하기는 언제나 $\\Theta(n)$ |\n\nBig-O 정의: 양의 상수 $c$와 $n_0$가 있어서 모든 $n \\ge n_0$에 대해 $0 \\le f(n) \\le c\\,g(n)$이면 $f(n) = O(g(n))$.\n\n예: $3n + 2 = O(n)$ 증명. $c = 4$로 두면 $3n + 2 \\le 4n \\iff n \\ge 2$ 이므로 $c = 4,\\ n_0 = 2$.\n\n| 복잡도 | 대표 예 |\n|---|---|\n| $O(1)$ | 배열 인덱스 접근, 스택 push/pop |\n| $O(\\log n)$ | 이진 탐색 (매번 절반으로) |\n| $O(n)$ | 배열 전체 합·출력 |\n| $O(n\\log n)$ | 퀵·병합 정렬 |\n| $O(n^2)$ | 이중 반복문, 버블·선택 정렬 |\n| $O(2^n)$ | 재귀 피보나치 |\n\n| $n$ | $\\log n$ | $n\\log n$ | $n^2$ |\n|---|---|---|---|\n| 8 | 3 | 24 | 64 |\n| 32 | 5 | 160 | 1024 |\n| 128 | 7 | 896 | 16384 |\n\n## 연습 문제 핵심\n| 질문 | 답 |\n|---|---|\n| $O(n^2)$에서 입력이 3배 | 실행 시간 약 9배 |\n| $O(n)$에서 입력이 3배 | 약 3배 |\n| $n^2 < 2^n/100$이 되는 첫 n | 15 (14: 163.8 < 196, 15: 327.7 > 225) |\n| `for i in range(N): for j in range(M)` | $O(NM)$ |\n| `for i in range(N): for j in range(i)` | $N(N-1)/2$번 → $O(N^2)$ |\n| O(1)의 의미 | 수행 시간이 입력 개수와 상관없이 일정하다 |", "codes": []}, {"id": "c4", "no": 4, "name": "4장 재귀", "ref": "## 한눈에 보기\n- **재귀 함수**는 자기 자신을 더 작은 입력으로 다시 호출하는 함수다. (再歸: 다시 돌아온다)\n- 모든 재귀는 **기저 조건(base case)** 과 **재귀 단계(recursive step)** 두 부분으로 이루어진다. 기저 조건이 없으면 스택 오버플로가 난다.\n- 함수 호출마다 **스택 프레임**이 쌓이므로 재귀는 공간 O(깊이)를 쓴다.\n- 재귀 피보나치는 중복 계산 때문에 지수 시간 $\\Theta(1.618^n)$, 반복문은 O(n), 행렬 거듭제곱은 O(log n).\n- 트리·그래프와 분할 정복·DP·백트래킹이 모두 재귀적 사고에 기대므로 앞부분에서 배운다.\n\n## 4.1~4.2 자기 참조와 재귀를 배우는 이유\n- 마트료시카, 마주 보는 거울처럼 **전체를 자기와 같은 모양의 작은 구조로 정의**하는 것이 자기 참조이고, 이를 코드로 옮긴 것이 재귀 함수다.\n- 폴더 안의 폴더처럼 **구조 자체가 재귀적**이면 반복문보다 훨씬 짧고 정확하다.\n- 퀵·병합 정렬, 트리 순회, DFS, 백트래킹, DP의 기초 도구.\n\n## 4.4 재귀 함수의 구조\n```python\ndef factorial(n):\n    if n <= 1:                    # 기저 조건: 답을 바로 아는 가장 작은 입력\n        return 1\n    return n * factorial(n - 1)   # 재귀 단계: 더 작은 문제에 맡긴다\n```\n- 기저 조건 설계: \"계산 없이 답을 바로 아는 최소 입력은?\"\n- 재귀 단계 설계: 매 호출마다 입력이 **반드시 기저 조건을 향해** 줄어들어야 한다.\n\n### 팩토리얼의 복잡도\n$$T(n) = T(n-1) + c = T(n-k) + kc = \\dots = nc \\Rightarrow O(n)$$\n공간: 호출이 n단계 쌓이므로 O(n).\n\n### 재귀적으로 생각하는 법\n1. 함수의 역할을 정확히 정한다.\n2. 문제를 같은 모양의 작은 문제로 나누는 방법을 찾는다.\n3. 작은 문제의 결과로 원래 문제를 푸는 방법을 정한다.\n4. 기저 조건을 정한다.\n\n> 💡 모든 호출을 따라가며 생각하지 말고, \"작은 문제는 이미 풀렸다\"고 믿고 크게(macro) 생각한다.\n\n| | 재귀 | 반복 |\n|---|---|---|\n| 사고방식 | 큰 문제를 같은 모양의 작은 문제로 정의 (what) | 단계별로 값을 갱신 (how) |\n| 상태 | 매개변수로 전달 | 변수를 직접 바꿈 |\n| 종료 | 기저 조건 | 루프 조건 |\n| 시간·공간 | 호출 오버헤드, 스택 사용 → 상대적으로 큼 | 상대적으로 작음 |\n| 코드 | 간결 (트리, 하노이, 퀵·병합 정렬에 유리) | 길어질 수 있음 |\n\n## 4.5 재귀와 반복의 성능 비교\n### 피보나치 세 가지 풀이\n```python\ndef fibonacci(n):            # 반복문: 시간 O(n), 공간 O(1)\n    if n <= 1:\n        return n\n    prev, curr = 0, 1\n    for _ in range(2, n + 1):\n        prev, curr = curr, prev + curr\n    return curr\n```\n- 단순 재귀 $T(n) = T(n-1) + T(n-2) + c$\n  - 상한 $O(2^n)$, 하한 $\\Omega(2^{n/2}) \\approx \\Omega(1.414^n)$\n  - 정확히는 특성 방정식 $x^2 - x - 1 = 0$의 양의 근(황금비) → $\\Theta(1.618^n)$\n  - 원인: **중복 계산**. F(5) 하나에 F(3)이 2번, F(2)가 3번 계산된다.\n- 행렬 거듭제곱: $\\begin{pmatrix}1&1\\\\1&0\\end{pmatrix}^n = \\begin{pmatrix}F_{n+1}&F_n\\\\F_n&F_{n-1}\\end{pmatrix}$, 거듭제곱을 반씩 나눠 구하면 O(log n)\n\n| 방식 | 시간 | 공간 |\n|---|---|---|\n| 단순 재귀 | $\\Theta(1.618^n)$ | O(n) |\n| 반복문 | O(n) | O(1) |\n| 행렬 거듭제곱 | O(log n) | O(log n) |\n\n### 재귀의 단점\n- **호출 오버헤드**: 레지스터, 복귀 주소 저장. 반복문은 점프 한 번.\n- **스택 오버플로**: 깊이가 너무 깊으면 스택 영역을 넘는다.\n\n## 초급 문제\n같은 문제를 내장 함수 → 반복문 → 재귀 순서로 푼다. 재귀 풀이의 핵심 한 줄만 정리하면 이렇다.\n\n| 문제 | 재귀 관계 |\n|---|---|\n| 1~n의 합 | `n + sum(n - 1)`, 기저 `n == 1 → 1` |\n| 배열 합 | `sum(arr[:-1]) + arr[-1]`, 빈 배열 → 0 |\n| 1부터 n 출력 | `print_numbers(n - 1)` 뒤에 `print(n)` (순서를 바꾸면 n부터 1) |\n| 최댓값 | `max(arr[0], max_array(arr[1:]))` |\n| 문자열 길이 | `1 + length(s[1:])` |\n| 숫자 포함 여부 | `s[0].isdigit() or has_digit(s[1:])` |\n| 정렬 여부 | `l[0] <= l[1] and is_sorted(l[1:])` |\n| 피보나치 | `fib(n-1) + fib(n-2)` → fib(40) 반복문 0초 vs 재귀 수십 초 |\n| 문자열 뒤집기 | `reverse(s[1:]) + s[0]` |\n\n## 중급 문제\n| 문제 | 재귀 관계 |\n|---|---|\n| 10진수 → 2진수 | `dec2bin(n // 2) + str(n % 2)`, 0 → \"\" |\n| 자릿수 합 | `n % 10 + sum_digits(n // 10)` |\n| 평균 | `(mean(arr[:-1]) * (n - 1) + arr[-1]) / n` |\n| 회문 | `s[0] == s[-1] and is_palindrome(s[1:-1])` |\n| 곱셈 | `x + product(x, y - 1)` (y가 작은 쪽이 되게 바꾸면 호출이 줄어든다) |\n\n### 하노이 탑\n```python\ndef hanoi(n, frm, to, aux):\n    if n == 0:\n        return\n    hanoi(n - 1, frm, aux, to)          # 위의 n-1개를 보조 기둥으로\n    print(\"Move disk\", n, frm, \"->\", to)  # 가장 큰 원판을 목표로\n    hanoi(n - 1, aux, to, frm)          # n-1개를 목표 위로\n```\n$T(n) = 2T(n-1) + 1,\\ T(1) = 1 \\Rightarrow T(n) = 2^n - 1$ → 원판 3개 7번, 5개 31번\n\n## 고급 문제\n- **멱집합**: 원소마다 넣거나 안 넣거나 두 선택 → $2^n$개.\n```python\ndef subsets(lis):\n    if lis == []:\n        return [[]]\n    rest = subsets(lis[1:])\n    return rest + [[lis[0]] + s for s in rest]\n```\n- **조합의 합**: 각 숫자를 포함하는 경우와 안 하는 경우를 재귀로 탐색. `[2, 4, 5]`로 9를 만들 수 있다(True), `[2, 4, 6]`으로는 불가(False). 합이 목표를 넘거나 숫자를 다 쓰면 그 가지에서 멈춘다.", "codes": []}, {"id": "c5", "no": 5, "name": "5장 배열·연결 리스트", "ref": "## 한눈에 보기\n- **배열**: 같은 타입을 메모리의 **연속된 칸**에 둔다. 인덱스 접근 O(1), 중간 삽입·삭제 O(n).\n- **연결 리스트**: 노드(데이터 + 다음 주소)를 링크로 잇는다. 위치를 알면 삽입·삭제 O(1), i번째 접근 O(n).\n- 2차원 배열은 메모리에 **행 우선**으로 펼쳐진다: 인덱스 = $i \\times C + j$\n- 0이 많은 행렬은 **희소 행렬**(COO, DOK, CSR)로 0이 아닌 값만 저장한다.\n- 고르는 기준: 인덱스 조회가 많으면 배열, 앞·중간 삽입·삭제가 잦고 개수를 예측하기 어려우면 연결 리스트.\n\n| 연산 | 배열 | 연결 리스트 |\n|---|---|---|\n| 맨 앞 삽입·삭제 | O(n) | **O(1)** |\n| 맨 뒤 삽입 | **O(1)** | O(n) (tail 없을 때) |\n| i번째 접근 | **O(1)** | O(n) |\n| 값 검색 | O(n) | O(n) |\n| 메모리 | 연속, 오버헤드 없음 | 노드마다 포인터 추가 |\n\n## 5.1 배열\n- 하나의 이름으로 여러 칸을 쓰고 번호(인덱스)로 구분한다. `brick0 ~ brick9` 대신 `bricks[0..9]`.\n- 주소 계산: $\\text{address}(data[i]) = base + i \\times size$. 예: base 1000, int 4바이트면 `data[3]`은 1012번지.\n- 연속 배치라 **캐시 지역성**이 좋고, 대신 크기가 고정이다.\n\n### 1차원 배열 ADT\n- 연산: `create(size)`, `get(index)`, `set(index, value)`, `find(value)`, `size()`, `display()`\n- 기본 자료형을 굳이 ADT로 감싸는 이유: `get`/`set` 안에서 **범위 검사**를 강제할 수 있고, 내부 구현을 바꿔도 사용 코드는 그대로다.\n```python\ndef get(self, index):\n    if not (0 <= index < self._size):\n        raise IndexError(\"인덱스 범위를 벗어났습니다.\")\n    return self._array[index]\n```\n\n### 언어별 차이\n| | C/C++ 배열 | Python list |\n|---|---|---|\n| 정체 | 메모리 블록 그 자체, `arr[i]` = `*(arr + i)` | 객체 주소를 담은 **포인터 배열**(동적 배열) |\n| 범위 검사 | 안 함 → 범위 밖 접근 위험 | 항상 함 → `IndexError` |\n| 크기 | 고정(정적) | 자동 확장. 원소 1~4개는 88바이트, 5개부터 120바이트 |\n| 타입 | 한 가지 | 섞어 담을 수 있음 |\n\n## 2차원 배열\n- 행과 열 두 인덱스를 쓴다. 행렬(수학 개념)을 메모리에 구현하는 자료구조.\n- ADT: `create(rows, cols)`, `get(row, col)`, `set(row, col, value)`, `num_rows()`, `num_cols()`\n- 바둑판, 미로, 이미지 픽셀처럼 **좌표·관계**를 표현한다. 중첩 반복문이 많아 $O(n^2)$를 체감하는 대표 예.\n\n### 평탄화(flattening)\n- 메모리는 1차원이라 2차원 배열을 한 줄로 펼친다.\n- **행 우선(row-major)**: C/C++. $R \\times C$ 행렬의 (i, j)는 $i \\times C + j$번째.\n  - $\\begin{bmatrix}1&2&3\\\\4&5&6\\end{bmatrix}$ → `[1,2,3,4,5,6]`, 값 6은 $1 \\times 3 + 2 = 5$번\n- **열 우선(column-major)**: Fortran, MATLAB, R, Julia\n- Python의 list of lists는 행마다 따로 할당되어 엄밀한 행 우선 배치가 아니다.\n> 💡 행 우선 언어에서는 가로(행) 방향으로 순회해야 캐시 적중률이 높아 빠르다.\n\n## 희소 행렬\n- 사용법(ADT: get/set/크기)은 일반
