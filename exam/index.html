 2차원 배열과 같고 **내부 저장 전략만 다르다**. 없는 좌표를 get 하면 0을 돌려준다.\n\n| 방식 | 구조 | 특징 |\n|---|---|---|\n| COO | (행, 열, 값) 목록 | 가장 직관적, 행·열 번호가 중복 저장됨 |\n| DOK | `{(r, c): value}` 딕셔너리 | 조회·수정 O(1) |\n| CSR | `data`, `indices`, `indptr` 세 배열 | 행 번호를 압축. SciPy 표준, 행 단위 연산이 빠름 |\n\nCSR 예: 4×4 행렬의 0이 아닌 값이 1(0,0), 2(1,1), 3(1,3), 4(3,0), 5(3,2)이면\n- `data = [1, 2, 3, 4, 5]`, `indices = [0, 1, 3, 0, 2]`, `indptr = [0, 1, 3, 3, 5]`\n- i행의 값은 `data[indptr[i] : indptr[i+1]]`. 2행은 3~3이라 비어 있다.\n\n## 5.2 연결 리스트\n- 메모리 연속성이 필요 없다. 노드 = **데이터 필드 + 링크 필드(next)**.\n- 종류: **단순**(다음만, 역방향 불가), **이중**(이전·다음, 메모리 추가), **원형**(마지막이 처음을 가리킴)\n- ADT: `push_front`, `push_back`, `pop_front`, `pop_back`, `find`, `remove`, `insert_after(node, value)`, `size`, `display`\n\n### 핵심 코드\n```python\ndef push_front(self, value):            # O(1)\n    new_node = Node(value)\n    new_node.next = self._head          # 새 노드가 먼저 기존 첫 노드를 잡고\n    self._head = new_node               # head를 옮긴다\n    self._size += 1\n\ndef pop_back(self):                     # O(n)\n    if self._head.next is None:\n        return self.pop_front()\n    current = self._head\n    while current.next.next is not None:   # 끝에서 두 번째에서 멈춤\n        current = current.next\n    value = current.next.data\n    current.next = None\n    self._size -= 1\n    return value\n\ndef remove(self, value):                # O(n), 지울 노드의 '앞' 노드에서 처리\n    if self._head.data == value:\n        self.pop_front(); return\n    current = self._head\n    while current.next is not None:\n        if current.next.data == value:\n            current.next = current.next.next\n            self._size -= 1\n            return\n        current = current.next\n\ndef insert_after(self, node, value):    # O(1)\n    new_node = Node(value)\n    new_node.next = node.next           # ① 뒤를 먼저 잡고\n    node.next = new_node                # ② 앞이 새 노드를 가리킨다\n    self._size += 1\n```\n> 📝 빈칸 1순위: `new_node.next = self._head`, `while current.next.next is not None`, `current.next = current.next.next`, insert_after의 두 줄 순서(바꾸면 뒤쪽을 잃어버린다).\n\n### 메모리 관리: C++ vs Python\n- C++: `new`로 받은 노드는 직접 `delete` 해야 한다. 빠뜨리면 **메모리 누수**.\n- Python: 참조 횟수가 0이 되면 **GC**가 자동으로 지운다. 그래서 `self._head = self._head.next`만으로 삭제가 끝난다.\n\n## 연습 문제\n- 길이 5인 배열과 노드 5개짜리 연결 리스트에서 3번째 위치에 삽입할 때, 배열은 뒤쪽 원소를 밀고 리스트는 링크 2개만 바꾼다.\n- 에디터 Undo(마지막 글자 삭제): 배열 끝에 넣고 끝에서 빼면 O(1). head만 있는 단순 연결 리스트에서 끝을 지우면 O(n)이므로, 리스트를 쓰려면 앞에 넣고 앞에서 빼야 한다. 이게 바로 **스택**이다.", "codes": ["#include <iostream>\n#include <stdexcept> // std::out_of_range, std::invalid_argument 예외 클래스 제공\n\nclass MyArray {\nprivate:\n    static const int MAX_SIZE = 100; // 정적 배열의 최대 크기 (상수 정의)\n    int _size;                       // 사용자가 지정한 실제 배열 크기\n    int _array[MAX_SIZE];            // 스택에 고정 할당된 정적 배열\n\npublic:\n    // 생성자\n    // 1. create(size): 최대 크기 이내로 배열 크기를 지정하여 생성 및 초기화\n    MyArray(int size) : _size(size) {\n        if (size <= 0 || size > MAX_SIZE) {\n            throw std::invalid_argument(\"배열 크기는 1 이상, 최대 크기(100) 미만이어야 합니다.\");\n        }\n        \n        // 배열 요소 전체 0으로 초기화\n        for (int i = 0; i < MAX_SIZE; ++i) {\n            _array[i] = 0;\n        }\n    }\n\n    // 소멸자: 정적 배열은 스택에 자동 생성되므로 별도의 메모리 해제(delete)가 필요 없음\n    // 컴파일러가 만들어주는 기본 소멸자(Default Destructor)를 명시적으로 생성하도록 지시하는 C++11 이후의 문법\n    ~MyArray() = default;\n\n    // 2. get(index): 지정한 index의 값 반환\n    // const는 \"이 멤버 함수는 객체의 내부 상태를 변경하지 않는 읽기 전용(Constant) 함수임을 \n    // 컴파일러와 사용자에게 보장한다\"는 의미\n    int get(int index) const {\n        if (index < 0 || index >= _size) {\n            throw std::out_of_range(\"Index Out of Bound)\");\n        }\n        return _array[index];\n    }\n\n    // 3. set(index, value): 지정한 index에 값 저장\n    void set(int index, int value) {\n        if (index < 0 || index >= _size) {\n            throw std::out_of_range(\"Index Out of Bound)\");\n        }\n        _array[index] = value;\n    }\n\n    // 4. size(): 현재 설정된 배열의 크기 반환\n    int size() const {\n        return _size;\n    }\n\n    // 5. find(value): 값의 위치(index) 탐색\n    int find(int value) const {\n        for (int i = 0; i < _size; ++i) {\n            if (_array[i] == value) {\n                return i;\n            }\n        }\n        return -1;\n    }\n\n    // 6. display(): 배열 데이터 출력\n    void display() const {\n        std::cout << \"Array(size=\" << _size << \"): [\";\n        for (int i = 0; i < _size; ++i) {\n            std::cout << _array[i];\n            if (i < _size - 1) {\n                std::cout << \", \";\n            }\n        }\n        std::cout << \"]\\n\";\n    }\n};\n\n// === 실제 사용 예시 ===\nint main() {\n    try {\n        MyArray arr(5);\n        std::cout << \"정적 배열 생성 완료! 현재 크기: \" << arr.size() << \"\\n\";\n\n        arr.set(0, 10);\n        arr.set(1, 20);\n        arr.set(2, 30);\n        arr.set(3, 40);\n        arr.set(4, 50);\n\n        arr.display();\n\n        std::cout << \"2번 인덱스의 값: \" << arr.get(2) << \"\\n\";\n        \n        int idx = arr.find(30);\n        std::cout << \"'30'의 위치(index): \" << idx << \"\\n\";\n\n    }\n    catch (const std::exception& e) {\n        std::cerr << \"에러: \" << e.what() << \"\\n\";\n    }\n\n    return 0;\n}", "#include <iostream>\n#include <stdexcept>\n#include <string> // std::string 테스트를 위해 추가\n\ntemplate <typename T>\nclass MyArray {\nprivate:\n    static const int MAX_SIZE = 100; // 정적 배열의 최대 크기\n    int _size;                       // 사용자가 지정한 실제 배열 크기\n    T _array[MAX_SIZE];              // T 타입의 스택 고정 할당 배열\n\npublic:\n    // 1. 생성자\n    MyArray(int size) : _size(size) {\n        if (size <= 0 || size > MAX_SIZE) {\n            throw std::invalid_argument(\"배열 크기는 1 이상, 최대 크기(100) 이하이어야 합니다.\");\n        }\n        \n        // 배열 요소 전체 기본값으로 초기화\n        for (int i = 0; i < MAX_SIZE; ++i) {\n            _array[i] = T(); // T 타입의 기본값 (int면 0, string이면 빈 문자열 등)\n        }\n    }\n\n    // 소멸자\n    ~MyArray() = default;\n\n    // 2. get(index): 지정한 index의 값 읽기 (복사본 반환)\n    T get(int index) const {\n        if (index < 0 || index >= _size) {\n            throw std::out_of_range(\"Index Out of Bound\");\n        }\n        return _array[index];\n    }\n\n    // 3. set(index, value): 지정한 index에 값 저장 (const 참조로 전달받아 효율성 증가)\n    void set(int index, const T& value) {\n        if (index < 0 || index >= _size) {\n            throw std::out_of_range(\"Index Out of Bound\");\n        }\n        _array[index] = value;\n    }\n\n    // 4. size(): 현재 설정된 배열의 크기 반환\n    int size() const {\n        return _size;\n    }\n\n    // 5. find(value): 값의 위치(index) 탐색\n    int find(const T& value) const {\n        for (int i = 0; i < _size; ++i) {\n            if (_array[i] == value) {\n                return i;\n            }\n        }\n        return -1;\n    }\n\n    // 6. display(): 배열 데이터 출력\n    void display() const {\n        std::cout << \"Array(size=\" << _size << \"): [\";\n        for (int i = 0; i < _size; ++i) {\n            std::cout << _array[i];\n            if (i < _size - 1) {\n                std::cout << \", \";\n            }\n        }\n        std::cout << \"]\\n\";\n    }\n};\n\n// === 실제 사용 예시 ===\nint main() {\n    try {\n        // 1. int 타입을 담는 MyArray 생성\n        std::cout << \"=== 정수형(int) 배열 테스트 ===\\n\";\n        MyArray<int> intArray(5);\n        intArray.set(0, 10);\n        intArray.set(1, 20);\n        intArray.set(2, 30);\n        intArray.display();\n        \n        std::cout << \"값 '20'의 인덱스: \" << intArray.find(20) << \"\\n\\n\";\n\n        // 2. std::string 타입을 담는 MyArray 생성 (템플릿의 강력한 장점!)\n        std::cout << \"=== 문자열(string) 배열 테스트 ===\\n\";\n        MyArray<std::string> strArray(3);\n        strArray.set(0, \"Apple\");\n        strArray.set(1, \"Banana\");\n        strArray.set(2, \"Cherry\");\n        strArray.display();\n\n        std::cout << \"'Banana'의 인덱스: \" << strArray.find(\"Banana\") << \"\\n\";\n\n    }\n    catch (const std::exception& e) {\n        std::cerr << \"에러: \" << e.what() << \"\\n\";\n    }\n\n    return 0;\n}", "#include <iostream>\n#include <stdexcept> \n\nclass MyArray {\nprivate:\n    int _size;   // 배열의 총 크기\n    int* _array; // 동적 할당된 int 배열을 가리키는 포인터\n\npublic:\n    // 1. create(size): size 크기만큼 데이터를 담을 배열을 만들고 초기화한다.\n    MyArray(int size) : _size(size) {\n        if (size <= 0) {\n            throw std::invalid_argument(\"배열의 크기는 1 이상이어야 합니다.\");\n        }\n        // size 크기만큼 int 메모리를 동적 할당하고 0으로 초기화\n        // 아래 문장의 끝 부분의 괄호는 배열을 할당하면서 모든 요소를 0으로 자동 초기화하라는 의미이다.\n        _array = new int[size]();\n    }\n\n    // 소멸자(Destructor): 동적 할당된 메모리 해제\n    ~MyArray() {\n        delete[] _array;\n    }\n\n    // 2. get(index): 지정한 index에 있는 값을 읽어서 가져온다. (배열 값은 변하지 않음)\n    int get(int index) const {\n        if (index < 0 || index >= _size) {\n            throw std::out_of_range(\"인덱스 범위를 벗어났습니다. (Out of Bound)\");\n        }\n        return _array[index];\n    }\n\n    // 3. set(index, value): 지정한 index에 새로운 정수 value를 집어넣는다. (기존 값은 지워짐)\n    void set(int index, int value) {\n        if (index < 0 || index >= _size) {\n            throw std::out_of_range(\"인덱스 범위를 벗어났습니다. (Out of Bound)\");\n        }\n        _array[index] = value;\n    }\n\n    // 4. size(): 이 배열에 들어갈 수 있는 데이터의 총개수(크기)를 알려준다.\n    int size() const {\n        return _size;\n    }\n\n    // 5. find(value): 해당 정수 값을 가진 항목이 존재하는지 확인하여 그 위치(index)를 반환한다.\n    int find(int value) const {\n        for (int i = 0; i < _size; ++i) {\n            if (_array[i] == value) {\n                return i; // 값을 찾으면 해당 인덱스 반환\n            }\n        }\n        return -1; // 값을 찾지 못한 경우 -1 반환\n    }\n\n    // 6. display(): 리스트의 모든 데이터를 출력한다.\n    void display() const {\n        std::cout << \"Array(size=\" << _size << \"): [\";\n        for (int i = 0; i < _size; ++i) {\n            std::cout << _array[i];\n            if (i < _size - 1) {\n                std::cout << \", \";\n            }\n        }\n        std::cout << \"]\\n\";\n    }\n};\n\n// === 실제 사용 예시 ===\nint main() {\n    try {\n        // [1. create] 크기가 5인 정수(int) 배열 생성 (모두 0으로 초기화됨)\n        MyArray arr(5);\n        std::cout << \"배열 생성 완료! 현재 크기: \" << arr.size() << \"\\n\"; // 출력: 5\n\n        // 초기 상태 출력\n        std::cout << \"초기 배열 상태: \";\n        arr.display(); // 출력: Array(size=5): [0, 0, 0, 0, 0]\n\n        // [2. set] 지정한 인덱스에 정수 값 저장\n        arr.set(0, 10);\n        arr.set(1, 20);\n        arr.set(2, 30);\n        arr.set(3, 40);\n        arr.set(4, 50);\n\n        // [3. display] 설정 후 전체 출력\n        std::cout << \"\\n--- 전체 배열 출력 ---\\n\";\n        arr.display(); // 출력: Array(size=5): [10, 20, 30, 40, 50]\n\n        // [4. get] 인덱스로 값 읽어오기\n        std::cout << \"\\n--- 인덱스 조회 ---\\n\";\n        std::cout << \"2번 인덱스의 값: \" << arr.get(2) << \"\\n\"; // 출력: 30\n\n        // [5. find] 값으로 위치 탐색\n        std::cout << \"\\n--- 데이터 위치 탐색 (find) ---\\n\";\n        int target = 40;\n        int idx = arr.find(target);\n        std::cout << \"'\" << target << \"'의 위치(index): \" << idx << \"\\n\"; // 출력: 3\n\n        // 존재하지 않는 값 탐색\n        int not_found = 99;\n        int idx_not_found = arr.find(not_found);\n        std::cout << \"'\" << not_found << \"'의 위치(index): \" << idx_not_found << \"\\n\"; // 출력: -1\n\n        // [6. 예외 처리 검증]\n        std::cout << \"\\n--- 예외 처리 검증 ---\\n\";\n        try {\n            arr.get(5); // 범위를 벗어난 인덱스 접근 (0~4만 가능)\n        }\n        catch (const std::out_of_range& e) {\n            std::cout << \"[안전장치 에러 발생] \" << e.what() << \"\\n\";\n        }\n    }\n    catch (const std::exception& e) {\n        std::cerr << \"에러: \" << e.what() << \"\\n\";\n    }\n\n    return 0;\n}", "#include <iostream>\n#include <vector>\n#include <stdexcept>\n\nclass MyArray {\nprivate:\n    std::vector<int> _array; // std::vector가 메모리를 알아서 관리함!\n\npublic:\n    MyArray(int size) {\n        if (size <= 0) {\n            throw std::invalid_argument(\"배열 크기는 1 이상이어야 합니다.\");\n        }\n        // 지정된 크기만큼 0으로 초기화된 벡터 생성\n        _array.resize(size, 0); \n    }\n\n    // 소멸자도 직접 구현할 필요 없음! 컴파일러 기본 소멸자 사용 가능\n    ~MyArray() = default;\n\n    int get(int index) const {\n        // vector의 at()을 쓰면 범위를 벗어났을 때 알아서 std::out_of_range 예외를 던져줍니다.\n        return _array.at(index); \n    }\n\n    void set(int index, int value) {\n        _array.at(index) = value; // 안전한 범위 검사 포함\n    }\n\n    int size() const {\n        return static_cast<int>(_array.size());\n    }\n\n    int find(int value) const {\n        for (size_t i = 0; i < _array.size(); ++i) {\n            if (_array[i] == value) {\n                return static_cast<int>(i);\n            }\n        }\n        return -1;\n    }\n\n    void display() const {\n        std::cout << \"Array(size=\" << _array.size() << \"): [\";\n        for (size_t i = 0; i < _array.size(); ++i) {\n            std::cout << _array[i];\n            if (i < _array.size() - 1) {\n                std::cout << \", \";\n            }\n        }\n        std::cout << \"]\\n\";\n    }\n};", "#include <iostream>\n#include <stdexcept>\n\nclass MyArray2D {\nprivate:\n    int _rows;\n    int _cols;\n    int* _matrix; // 원시 포인터를 이용한 동적 배열 관리\n\npublic:\n    // 1. 생성자: rows x cols 크기의 메모리를 동적 할당하고 0으로 초기화\n    MyArray2D(int rows, int cols) : _rows(rows), _cols(cols) {\n        if (rows <= 0 || cols <= 0) {\n            throw std::invalid_argument(\"행과 열의 크기는 1 이상이어야 합니다.\");\n        }\n        // 1차원 연속 메모리로 할당 후 0으로 초기화\n        _matrix = new int[rows * cols](); \n    }\n\n    // 소멸자: 동적 할당된 메모리 해제 (메모리 누수 방지)\n    ~MyArray2D() {\n        delete[] _matrix;\n    }\n\n    // 2. get(row, col): 값 읽기 (행 우선 순서 인덱싱)\n    int get(int row, int col) const {\n        if (row < 0 || row >= _rows || col < 0 || col >= _cols) {\n            throw std::out_of_range(\"인덱스 범위를 벗어났습니다. (Out of Bound)\");\n        }\n        return _matrix[row * _cols + col];\n    }\n\n    // 3. set(row, col, value): 값 쓰기\n    void set(int row, int col, int value) {\n        if (row < 0 || row >= _rows || col < 0 || col >= _cols) {\n            throw std::out_of_range(\"인덱스 범위를 벗어났습니다. (Out of Bound)\");\n        }\n        _matrix[row * _cols + col] = value;\n    }\n\n    // 4. num_rows(): 행 개수 반환\n    int num_rows() const {\n        return _rows;\n    }\n\n    // 5. num_cols(): 열 개수 반환\n    int num_cols() const {\n        return _cols;\n    }\n};\n\nint main() {\n    try {\n        MyArray2D arr2d(2, 3);\n        arr2d.set(0, 0, 10);\n        arr2d.set(1, 2, 99);\n\n        std::cout << \"0행 0열: \" << arr2d.get(0, 0) << \"\\n\";\n        std::cout << \"1행 2열: \" << arr2d.get(1, 2) << \"\\n\";\n    }\n    catch (const std::exception& e) {\n        std::cerr << \"에러: \" << e.what() << \"\\n\";\n    }\n    return 0;\n}", "#include <iostream>\n#include <vector>\n#include <stdexcept>\n\nclass MyArray2D {\nprivate:\n    int _rows;\n    int _cols;\n    std::vector<std::vector<int>> _matrix; // 2차원 벡터로 메모리 자동 관리\n\npublic:\n    // 1. 생성자: rows x cols 크기의 2차원 배열 생성 (0으로 초기화)\n    MyArray2D(int rows, int cols) : _rows(rows), _cols(cols) {\n        if (rows <= 0 || cols <= 0) {\n            throw std::invalid_argument(\"행과 열의 크기는 1 이상이어야 합니다.\");\n        }\n        // 파이썬의 컴프리헨션처럼 안전하게 2차원 공간 할당\n        _matrix.resize(rows, std::vector<int>(cols, 0));\n    }\n\n    // 2. get(row, col): 값 읽기\n    int get(int row, int col) const {\n        if (row < 0 || row >= _rows || col < 0 || col >= _cols) {\n            throw std::out_of_range(\"인덱스 범위를 벗어났습니다. (Out of Bound)\");\n        }\n        return _matrix[row][col];\n    }\n\n    // 3. set(row, col, value): 값 쓰기\n    void set(int row, int col, int value) {\n        if (row < 0 || row >= _rows || col < 0 || col >= _cols) {\n            throw std::out_of_range(\"인덱스 범위를 벗어났습니다. (Out of Bound)\");\n        }\n        _matrix[row][col] = value;\n    }\n\n    // 4. num_rows(): 행 개수 반환\n    int num_rows() const {\n        return _rows;\n    }\n\n    // 5. num_cols(): 열 개수 반환\n    int num_cols() const {\n        return _cols;\n    }\n};\n\nint main() {\n    try {\n        MyArray2D arr2d(2, 3);\n        arr2d.set(0, 0, 10);\n        arr2d.set(1, 2, 99);\n\n        std::cout << \"0행 0열: \" << arr2d.get(0, 0) << \"\\n\";\n        std::cout << \"1행 2열: \" << arr2d.get(1, 2) << \"\\n\";\n    }\n    catch (const std::exception& e) {\n        std::cerr << \"에러: \" << e.what() << \"\\n\";\n    }\n    return 0;\n}"]}, {"id": "c8", "no": 8, "name": "8장 스택·큐", "ref": "## 한눈에 보기\n- 스택과 큐는 **넣고 빼는 통로를 제한한 선형 자료구조**. 제한 덕분에 알고리즘이 단순해지고 연산이 $O(1)$.\n  - **스택(LIFO)**: 한쪽 끝(top)으로만 넣고(push) 뺀다(pop).\n  - **큐(FIFO)**: 뒤(rear)로 넣고(enqueue) 앞(front)으로 뺀다(dequeue).\n\n| | 스택 | 큐 |\n|---|---|---|\n| 규칙 | 후입선출 LIFO | 선입선출 FIFO |\n| 삽입 / 삭제 | push / pop (top) | enqueue (rear) / dequeue (front) |\n| Python | `list.append` / `list.pop()` | `collections.deque`의 `append` / `popleft()` |\n| C++ | `std::stack` | `std::queue` |\n| 대표 활용 | 괄호 검사, 후위 표기식, 미로(DFS), 함수 호출, 되돌리기 | 프린터 대기열, 버퍼링, 생산자-소비자, BFS |\n\n> 📝 시험 포인트: 배열/연결 리스트로 직접 구현한 클래스의 `push`·`pop`·`enqueue`·`dequeue`·`is_full`·`is_empty` 빈칸 채우기, 그리고 주어진 입력에 대한 스택·큐 상태 추적.\n\n## 8.1 스택: 후입선출\n- top에서만 입출력. 마지막에 push한 데이터가 가장 먼저 pop된다.\n- 비유: 정해진 품새처럼 동작을 제한하면 그 문제를 푸는 데 더 효율적이다.\n\n## 8.2 왜 스택을 쓸까?\n- **써야 하니까**: 하노이 탑 — 맨 위 원판만 옮길 수 있다는 조건 자체가 스택.\n- **쓰면 편하니까**: 라면 재료를 넣을 순서대로 쌓아 두면 \"맨 위 재료를 넣는다\"만 반복하면 된다.\n\n## 8.3 스택의 구현\n- ADT: `push(x)`, `pop()`, `peek()`, `isEmpty()` — 모두 $O(1)$.\n- list를 그대로 쓰면 밖에서 중간 인덱스를 건드려 LIFO가 깨질 수 있다 → 클래스 안에 숨겨서(**캡슐화**) 연산만 공개.\n\n### 배열 스택\n- 리스트의 **끝을 top**으로. (0번을 top으로 하면 push/pop마다 전체 이동 $O(n)$)\n```python\nclass Stack:\n    def __init__(self):\n        self.items = []\n        self._size = 0\n    def push(self, item):\n        self.items.append(item)\n        self._size += 1\n    def pop(self):\n        if not self.is_empty():\n            self._size -= 1\n            return self.items.pop()\n        return None\n    def peek(self):\n        if not self.is_empty():\n            return self.items[-1]\n        return None\n    def is_empty(self):\n        return self._size == 0\n```\n\n### 연결 리스트 스택\n- **head를 top**으로. 맨 앞 삽입·삭제가 $O(1)$이기 때문(tail을 top으로 하면 pop마다 직전 노드를 찾느라 $O(n)$).\n```python\nclass LinkedStack:\n    def __init__(self):\n        self.head = None\n        self._size = 0\n    def push(self, data):\n        new_node = Node(data)\n        new_node.next = self.head   # 기존 top을 뒤에 연결\n        self.head = new_node        # top 갱신\n        self._size += 1\n    def pop(self):\n        if self.is_empty():\n            return None\n        popped = self.head\n        self.head = self.head.next\n        self._size -= 1\n        return popped.data\n```\n\n| | 배열 스택 | 연결 리스트 스택 |\n|---|---|---|\n| push/pop 평균 | $O(1)$ | $O(1)$ |\n| push/pop 최악 | $O(n)$ (꽉 차서 재할당·복사) | $O(1)$ (항상 일정) |\n| 메모리 | 데이터만, 촘촘 | 노드마다 포인터 추가 |\n| 실제 속도 | 빠름(캐시 적중) | 느린 편(캐시 미스, 할당 비용) |\n\n- 최대 용량을 대략 예측할 수 있으면 배열 스택이 유리. C++은 `std::stack`(기본 `deque` 기반) 사용.\n\n## 8.4 스택의 활용\n\n### 활용 1: 괄호 쌍 검사\n- 틀린 경우 3가지: 개수가 다름 `(())(` / 닫는 괄호가 먼저 `())(` / 엉킴 `{(})`\n- 알고리즘: 여는 괄호 → push. 닫는 괄호 → 스택이 비었거나 top이 짝이 아니면 오류, 맞으면 pop. 끝났을 때 **스택이 비어야** 정상.\n```python\ndef check_parentheses(expression):\n    stack = Stack()\n    pairs = {')': '(', '}': '{', ']': '['}\n    for char in expression:\n        if char in \"({[\":\n            stack.push(char)\n        elif char in \")}]\":\n            if stack.is_empty():\n                return False          # 닫는 괄호가 먼저\n            if pairs[char] != stack.pop():\n                return False          # 짝이 다름\n    return stack.is_empty()           # 남은 여는 괄호가 있으면 False\n```\n- 괄호가 한 종류면 스택 없이 `balance` 카운터(+1/−1, 음수가 되면 오류, 끝에 0)로도 된다.\n\n### 활용 2: 후위 표기식 계산\n- 중위 `3 + 4 * (5 + 1)` → 후위 `3 4 5 1 + * +`. 후위는 **괄호·우선순위가 필요 없다**.\n\n| 중위 | 후위 |\n|---|---|\n| `2 + 3 * 4` | `2 3 4 * +` |\n| `(2 + 3) * 4` | `2 3 + 4 *` |\n| `(A + B) * (C - D)` | `A B + C D - *` |\n| `A + B * C - D / E` | `A B C * + D E / -` |\n\n- 계산: 피연산자 → push. 연산자 → **두 개 pop**(먼저 꺼낸 게 **오른쪽** 피연산자) → 계산 결과 push. 끝에 남은 하나가 답.\n```python\ndef evaluate_postfix(expression):\n    stack = Stack()\n    for token in expression.split():\n        if token.isdigit():\n            stack.push(int(token))\n        else:\n            val2 = stack.pop()        # 오른쪽\n            val1 = stack.pop()        # 왼쪽\n            if token == '+': stack.push(val1 + val2)\n            elif token == '-': stack.push(val1 - val2)\n            elif token == '*': stack.push(val1 * val2)\n            elif token == '/': stack.push(val1 / val2)\n    return stack.pop()\n```\n\n### 활용 3: 미로 탈출\n- 한 방향으로 가다가 막히면 **왔던 길로 되돌아가기** → 지나온 위치를 스택에 쌓는다(= DFS). 최단 경로는 보장하지 않는다(최단은 큐/BFS).\n```python\nwhile not stack.is_empty():\n    x, y = stack.peek()\n    if (x, y) == end:\n        return 경로(스택을 pop해서 뒤집기)\n    for dx, dy in [(-1,0), (1,0), (0,-1), (0,1)]:\n        nx, ny = x + dx, y + dy\n        if 범위 안 and maze[nx][ny] == 0 and (nx, ny) not in visited:\n            stack.push((nx, ny)); visited.add((nx, ny))\n            break\n    else:\n        stack.pop()          # 갈 곳이 없으면 되돌아감\n```\n\n| | 스택(반복문) | 재귀 함수 |\n|---|---|---|\n| 코드 | 명확하지만 길다 | 간결 |\n| 메모리 | 직접 관리하는 스택 | 시스템 **콜 스택** (보이지 않는 스택) |\n| 주의 | 무한 루프 제어 쉬움 | 재귀 깊이 제한(Python 기본 1000) → `RecursionError` |\n\n## 8.5 큐: 선입선출\n- 대기 줄. 새로 온 사람은 **뒤(rear)**, 서비스는 **앞(front)**부터.\n\n## 8.6 왜 큐를 쓸까?\n1. **순서 보장**: 프린터 대기열 — 먼저 누른 문서가 먼저.\n2. **버퍼링**: 유튜브처럼 받아 오는 속도와 재생 속도의 차이를 메워 줌.\n3. **동기화**: 생산자와 소비자 사이에 큐를 두면 서로 엉키지 않음.\n\n## 8.7 큐의 구현\n- ADT: `enqueue(x)`, `dequeue()`, `peek()`, `isEmpty()`\n- Python list의 `pop(0)`은 뒤 원소를 다 당겨서 **$O(n)$** → 큐로 쓰면 안 된다. **`collections.deque`**(`append`, `popleft` 모두 $O(1)$) 또는 멀티스레드용 `queue.Queue`(`put`, `get`).\n```python\nfrom collections import deque\nq = deque()\nq.append(1); q.append(2)   # enqueue\nq.popleft()                # dequeue → 1\nq[0]                       # peek\n```\n\n### 선형 배열 큐\n- `front = rear = -1`에서 시작. enqueue: `rear += 1` 후 저장 / dequeue: `front += 1` 후 읽기.\n- Empty: `front == rear`, Full: `rear == size - 1`.\n- 문제: 앞에서 빼도 그 칸을 다시 못 씀 → rear가 끝에 닿으면 빈칸이 있어도 Full. 주기적으로 앞으로 당겨야 한다.\n\n### 원형 큐\n- 배열의 양 끝을 이어 붙인 구조. 다음 위치 = `(index + 1) % size`.\n- `front`는 첫 데이터의 **바로 앞**, `rear`는 마지막 데이터 위치. 처음엔 `front = rear = 0`.\n- **Empty**: `front == rear` / **Full**: `(rear + 1) % size == front` → **한 칸을 비워 둔다**(저장 가능 개수 = size − 1). count 변수를 따로 두면 모든 칸을 쓸 수 있다.\n```python\nclass CircularQueue:\n    def __init__(self, size):\n        self.size = size\n        self.queue = [None] * size\n        self.front = 0\n        self.rear = 0\n    def is_empty(self):\n        return self.front == self.rear\n    def is_full(self):\n        return (self.rear + 1) % self.size == self.front\n    def enqueue(self, item):\n        if self.is_full():\n            return\n        self.rear = (self.rear + 1) % self.size     # 먼저 이동\n        self.queue[self.rear] = item                # 그 자리에 쓰기\n    def dequeue(self):\n        if self.is_empty():\n            return None\n        self.front = (self.front + 1) % self.size   # 먼저 이동\n        item = self.queue[self.front]               # 그 자리 읽기\n        self.queue[self.front] = None\n        return item\n```\n\n### 연결 리스트 큐\n- `front`(삭제 위치)와 `rear`(삽입 위치) 포인터를 함께 관리. Full 개념이 없다.\n```python\ndef enqueue(self, item):\n    new_node = Node(item)\n    if self.is_empty():                 # 비어 있으면 둘 다 새 노드\n        self.front = self.rear = new_node\n    else:\n        self.rear.next = new_node       # 뒤에 연결\n        self.rear = new_node\n    self._size += 1\n\ndef dequeue(self):\n    if self.is_empty():\n        return None\n    item = self.front.data\n    self.front = self.front.next\n    if self.front is None:              # 마지막 하나를 뺐으면\n        self.rear = None                # rear도 비워야 함\n    self._size -= 1\n    return item\n```\n\n| | list `pop(0)` 큐 | 원형 큐 | 연결 리스트 큐 |\n|---|---|---|---|\n| enqueue | $O(1)$ | $O(1)$ | $O(1)$ |\n| dequeue | **$O(n)$** | $O(1)$ | $O(1)$ |\n| 크기 | 가변 | 고정(size − 1) | 무제한 |\n| 메모리 | 연속 | 고정 배열 | 노드마다 포인터 |\n\n- 고르는 기준: 최대 용량을 알고 속도가 중요하면 원형 큐, 요청량을 예측할 수 없으면 연결 리스트 큐.\n\n## 8.8 큐의 활용: 생산자-소비자\n- 생산자: 큐가 Full이 아니면 enqueue / 소비자: Empty가 아니면 dequeue. 큐가 속도 차이를 흡수하는 버퍼.\n- Python `queue.Queue`는 lock을 알아서 관리하는 **thread-safe** 큐(`put`, `get`, `qsize`, `empty`).", "codes": ["#include <iostream>\n#include <vector>\n#include <string>\n#include <stdexcept>\n\n// template class\ntemplate <typename T>\nclass Stack {\nprivate:\n    std::vector<T> items;\n\npublic:\n    // 데이터 삽입\n    void push(const T& item) {\n        items.push_back(item);\n    }\n\n    // 데이터 추출\n    T pop() {\n        if (is_empty()) {\n            throw std::out_of_range(\"Stack Underflow: Stack is empty\");\n        }\n        T top_item = items.back();\n        items.pop_back();\n        return top_item;\n    }\n\n    // 가장 위의 데이터 확인\n    T peek() const {\n        if (is_empty()) {\n            throw std::out_of_range(\"Stack Underflow: Stack is empty\");\n        }\n        return items.back();\n    }\n\n    // 스택이 비어있는지 확인\n    bool is_empty() const {\n        return items.empty();\n    }\n};\n\nint main() {\n    // 사용 예시\n    Stack<std::string> my_stack;\n    my_stack.push(\"데이터 A\");\n    my_stack.push(\"데이터 B\");\n\n    std::cout << my_stack.pop() << std::endl;  // 출력: 데이터 B\n    std::cout << my_stack.peek() << std::endl; // 출력: 데이터 A\n\n    return 0;\n}", "#include <iostream>\n#include <string>\n#include <stdexcept>\n\ntemplate <typename T>\nclass LinkedStack {\nprivate:\n    // 스택 내부에서 사용할 노드 구조체(캡슐화)\n    struct Node {\n        T data;\n        Node* next;\n\n        Node(const T& d) : data(d), next(nullptr) {}\n    };\n\n    Node* head;    // 가장 최근에 들어온 노드 (Top)\n    size_t _size;  // 스택의 크기\n\npublic:\n    // 생성자  \n    LinkedStack() : head(nullptr), _size(0) {}\n\n    // 소멸자: 스택이 소멸될 때 남은 노드 메모리 해제\n    ~LinkedStack() {\n        while (!is_empty()) {\n            clear_top();\n        }\n    }\n\n    // 새 노드를 생성하여 헤드 앞에 연결\n    void push(const T& data) {\n        Node* new_node = new Node(data);\n        new_node->next = head; // 기존 헤드를 새 노드의 다음으로 연결\n        head = new_node;       // 헤드를 새 노드로 갱신\n        _size++;\n    }\n\n    // 헤드 노드를 제거하고 그 값을 반환\n    T pop() {\n        if (is_empty()) {\n            throw std::out_of_range(\"Stack Underflow: Stack is empty\");\n        }\n\n        Node* popped_node = head;\n        T popped_data = popped_node->data;\n\n        head = head->next;    // 헤드를 다음 노드로 이동\n        delete popped_node;   // C++ 동적 메모리 해제 (필수)\n        _size--;\n\n        return popped_data;\n    }\n\n    // 스택의 가장 위에 있는 데이터 확인(삭제 안 함)\n    T peek() const {\n        if (is_empty()) {\n            throw std::out_of_range(\"Stack Underflow: Stack is empty\");\n        }\n        return head->data;\n    }\n\n    bool is_empty() const {\n        return head == nullptr;\n    }\n\n\nprivate:\n    // 소멸자용 노드 제거 도우미 함수\n    void clear_top() {\n        if (head != nullptr) {\n            Node* temp = head;\n            head = head->next;\n            delete temp;\n            _size--;\n        }\n    }\n};\n\nint main() {\n    // --- 사용 예시 ---\n    LinkedStack<std::string> stack;\n    stack.push(\"A\");\n    stack.push(\"B\");\n    stack.push(\"C\");\n\n    std::cout << \"팝핑: \" << stack.pop() << std::endl;  // C\n    std::cout << \"팝핑: \" << stack.pop() << std::endl;  // B\n\n    return 0;\n}", "#include <iostream>\n#include <string>\n#include <vector>\n#include <stdexcept>\n\n// 소괄호() 짝 검사 함수\nbool check_simple_parentheses(const std::string& expression) {\n    Stack<char> stack; // 문자를 저장하는 스택 생성\n\n    for (char ch : expression) {\n        if (ch == '(') {\n            stack.push('('); // 여는 괄호 발견 시 스택에 삽입\n        } \n        else if (ch == ')') {\n            if (stack.is_empty()) {\n                return false; // 비어있는 상태에서 닫는 괄호가 나오면 불균형\n            }\n            stack.pop(); // 짝이 맞는 여는 괄호 제거\n        }\n    }\n\n    // 최종적으로 스택이 비어있어야 올바른 괄호 쌍\n    return stack.is_empty();\n}\n\nint main() {\n    // bool 결과를 1/0 대신 true/false 문자열로 출력 설정\n    std::cout << std::boolalpha;\n\n    // --- 테스트 실행 ---\n    std::cout << check_simple_parentheses(\"(a+b)\") << std::endl;   // true\n    std::cout << check_simple_parentheses(\"((a+b))\") << std::endl; // true\n    std::cout << check_simple_parentheses(\"(a+b))\") << std::endl;  // false (닫힌 괄호가 더 많음)\n    std::cout << check_simple_parentheses(\"((a+b)\") << std::endl;  // false (열린 괄호가 더 많음)\n\n    return 0;\n}", "#include <iostream>\n#include <string>\n#include <stack>\n#include <unordered_map>\n#include <vector>\n\nusing namespace std;\n\nbool check_parentheses(const string& expression) {\n    stack<char> s;\n    \n    // 괄호 쌍 정의 (닫는 괄호를 Key, 여는 괄호를 Value로 매핑)\n    unordered_map<char, char> pairs = {\n        {')', '('},\n        {'}', '{'},\n        {']', '['}\n    };\n\n    for (char ch : expression) {\n        // 1. 여는 괄호일 경우 스택에 PUSH\n        if (ch == '(' || ch == '{' || ch == '[') {\n            s.push(ch);\n        }\n        // 2. 닫히는 괄호일 경우 비교\n        else if (ch == ')' || ch == '}' || ch == ']') {\n            if (s.empty()) {\n                return false; // 닫힌 괄호가 먼저 나오면 오류\n            }\n            \n            char top = s.top();\n            s.pop();\n            \n            if (pairs[ch] != top) {\n                return false; // 짝이 맞지 않으면 오류\n            }\n        }\n    }\n\n    // 3. 모든 문자를 확인한 후 스택이 비어있어야 정상\n    return s.empty();\n}\n\nint main() {\n    // 테스트 케이스\n    vector<string> test_cases = {\n        \"(a+b)\",\n        \"((a+b)*c)\",\n        \"{a+[b*(c+d)]}\",\n        \"(a+b)*c)\",\n        \"((a+b)\"\n    };\n\n    // bool 값을 true/false 문자열로 출력하기 위한 설정\n    cout << boolalpha;\n\n    for (const string& expr : test_cases) {\n        cout << \"'\" << expr << \"': \" << check_parentheses(expr) << \"\\n\";\n    }\n\n    return 0;\n}", "#include <iostream>\n#include <string>\n#include <vector>\n#include <sstream> // 문자열 입출력 스트립 제공. 공백 기준 문자열 분할을 목적으로\n#include <cctype>  // 문자 데이터의 타입 판별 함수. isdigit()\n#include <stdexcept> // 예외 처리\n\n// 후위 표기법 수식 계산 함수\nint evaluate_postfix(const std::string& expression) {\n    Stack<int> stack;\n    std::stringstream ss(expression); // 파이썬의 expression.split() 역할 수행\n    std::string token;\n\n    while (ss >> token) { // 파이썬의 for token in expression.split()와 유사함\n        // 토큰이 숫자인지 확인 (음수 처리 포함)\n        if (std::isdigit(token[0]) || (token.size() > 1 && token[0] == '-')) {\n            stack.push(std::stoi(token)); // 문자열을 정수로 변환\n        } \n        else {\n            // 스택에서 피연산자 2개를 꺼냄 (먼저 꺼낸 것이 오른쪽 피연산자 val2)\n            int val2 = stack.pop();\n            int val1 = stack.pop();\n\n            if (token == \"+\") stack.push(val1 + val2);\n            else if (token == \"-\") stack.push(val1 - val2);\n            else if (token == \"*\") stack.push(val1 * val2);\n            else if (token == \"/\") {\n                if (val2 == 0) {\n                    throw std::invalid_argument(\"Division by zero error\");\n                }\n                stack.push(val1 / val2);\n            }\n        }\n    }\n\n    // 최종 결과는 스택에 남아있는 마지막 값\n    return stack.pop();\n}\n\nint main() {\n    // 수식: (3 + 4) * 2 = 14\n    // 후위 표기: \"3 4 + 2 *\"\n    std::string expression = \"3 4 + 2 *\";\n    \n    try {\n        int result = evaluate_postfix(expression);\n        std::cout << \"수식 '\" << expression << \"'의 계산 결과: \" << result << std::endl;\n    } catch (const std::exception& e) {\n        std::cerr << \"오류 발생: \" << e.what() << std::endl;\n    }\n\n    return 0;\n}\n\n/*\n\"-3 4 + 2 *\" --> 2\n\"30 4 + 2 *\" --> 68\n*/", "#include <iostream>\n#include <vector>\n\nclass LinearQueue {\nprivate:\n    int _size;\n    std::vector<int> queue;\n    int front;\n    int rear;\n\npublic:\n    // 생성자: 파이썬의 __init__(self, size)\n    LinearQueue(int size) : _size(size), queue(size), front(-1), rear(-1) {}\n\n    // front와 rear가 같으면 큐는 비어있음\n    bool is_empty() const {\n        return front == rear;\n    }\n\n    // rear가 배열의 마지막 인덱스에 도달하면 큐는 가득 참\n    bool is_full() const {\n        return rear == _size - 1;\n    }\n\n    // enqueue(x): 데이터를 큐의 맨 뒤(Rear)에 삽입\n    void enqueue(int item) {\n        if (is_full()) {\n            std::cout << \"큐가 가득 찼습니다.\" << std::endl;\n            return;\n        }\n        rear++;\n        queue[rear] = item;\n    }\n\n    // dequeue(): 맨 앞 데이터를 제거하고 반환\n    int dequeue() {\n        if (is_empty()) {\n            std::cout << \"큐가 비어있습니다.\" << std::endl;\n            return -1; // 빈 상태 예외 처리값\n        }\n        front++;\n        int item = queue[front];\n        return item;\n    }\n\n    // peek(): 삭제 없이 가장 앞의 데이터를 확인\n    int peek() const {\n        if (is_empty()) {\n            std::cout << \"큐가 비어있습니다.\" << std::endl;\n            return -1;\n        }\n        return queue[front + 1]; // 실제 가장 앞선 원소의 위치인 (front + 1) 참조\n    }\n};\n\nint main() {\n    // --- 테스트 실행 ---\n    LinearQueue q(3);\n    q.enqueue(10);\n    q.enqueue(20);\n    q.enqueue(30);\n\n    std::cout << q.dequeue() << std::endl; // 출력: 10\n    std::cout << q.dequeue() << std::endl; // 출력: 20\n\n    q.enqueue(40); // 이 부분에서 큐가 가득 찼다고 나옴 (실제로는 공간이 있음에도)\n\n    return 0;\n}"]}, {"id": "c9", "no": 9, "name": "9장 트리·힙", "ref": "## 한눈에 보기\n- 트리 = 노드와 에지로 이루어진 **계층 구조**(가계도, 폴더, DOM, 게임 수 읽기). 사이클이 없다.\n- 쓰는 이유: ① 계층 표현 ② 탐색·삽입·삭제가 빠름(균형 잡힌 BST면 $O(\\log n)$).\n- **이진 트리**: 자식이 최대 2개. 배열(인덱스 규칙) 또는 연결(left/right 참조)로 구현.\n- **순회**: 전위(루트-왼-오), 중위(왼-루트-오), 후위(왼-오-루트).\n- **우선순위 큐**는 \"우선순위 높은 것부터 나간다\"는 규칙, **힙**은 그걸 구현하는 완전 이진 트리. 삽입·삭제 $O(\\log n)$.\n\n| 꼭 외울 공식 | |\n|---|---|\n| 노드 n개 → 에지 | $n - 1$ |\n| 레벨 $i$의 최대 노드 | $2^{i-1}$ |\n| 높이 $h$ 트리의 최대 노드 | $2^h - 1$ (최소 $h$개) |\n| 리프 수 | $n_0 = n_2 + 1$ |\n| 배열(1번부터) 왼쪽/오른쪽 자식, 부모 | $2i$, $2i+1$, $\\lfloor i/2 \\rfloor$ |\n\n## 트리가 필요한 이유\n- **계층 관계**: 파일 시스템, HTML/DOM, 의사 결정 트리, 게임 트리.\n- **탐색 속도**: 배열·연결 리스트는 최악 $O(n)$, 이진 탐색 트리는 한 번 비교할 때마다 절반을 버려 $O(\\log n)$.\n\n## 트리 기초\n- 정의(재귀적): 하나 이상의 노드 집합으로, **루트**가 있고 나머지는 서로 겹치지 않는 서브 트리 $T_1, \\dots, T_n$로 나뉜다. 공집합은 (일반) 트리가 아니다.\n\n### 용어\n| 용어 | 뜻 |\n|---|---|\n| 루트 | 가장 위 노드 |\n| 단말(리프) / 비단말 | 자식이 없는 노드 / 그 외 |\n| 부모·자식·형제 | 한 단계 위 / 아래 / 같은 부모 |\n| 조상 / 자손 | 루트에서 부모까지 경로상 모든 노드 / 모든 하위 노드 |\n| 서브 트리 | 자식을 루트로 하는 트리 |\n| 차수(degree) | 자식 개수 |\n| 레벨 | 루트에서의 거리 + 1 (**루트 = 레벨 1**) |\n| 트리 높이 | 최대 레벨 |\n| 포리스트 | 트리들의 집합 |\n\n- 종류: **일반 트리**(자식 수 제한 없음), **이진 트리**(최대 2개).\n\n## 이진 트리\n- 정의: **공집합**이거나, 루트 + 서로소인 왼쪽·오른쪽 이진 트리. (공집합을 포함해서 재귀 종료 조건 `if node is None`이 자연스러워진다. 서로소 = 노드를 공유하지 않음.)\n\n### 이진 트리의 종류\n| 종류 | 조건 | 비고 |\n|---|---|---|\n| 포화(perfect) | 모든 내부 노드가 자식 2개, 리프가 모두 같은 깊이 | $N = 2^h - 1$, 리프 $2^{h-1}$ |\n| 완전(complete) | 마지막 레벨 빼고 꽉 참, 마지막 레벨은 **왼쪽부터** | 힙의 모양. 포화 ⊂ 완전 |\n| 가득 찬(full) | 모든 노드의 자식이 0개 또는 2개 | 허프만, 수식 트리 |\n| 편향(skewed) | 모든 노드가 자식 1개 | 사실상 연결 리스트 |\n\n### 이진 트리의 특성\n- [정리 1] 노드 $n$개 → 에지 $n-1$개 (루트 빼고 모두 부모가 하나).\n- [정리 2] 레벨 $i$의 최대 노드 수 $2^{i-1}$ (귀납법).\n- [정리 3] 높이 $k$ → 최소 $k$개, 최대 $\\sum_{i=1}^{k} 2^{i-1} = 2^k - 1$개.\n- [정리 4] $n_0 = n_2 + 1$. 증명: $n = n_0 + n_1 + n_2$이고 $n = E + 1 = 1 + n_1 + 2n_2$.\n\n### 이진 트리 ADT\n- `create_tree()`, `is_empty()`, `get_root_data()`, `set_root_data(x)`, `get_left_child()`, `get_right_child()`, `set_left_child(sub)`, `set_right_child(sub)`\n\n### 배열로 구현\n- 0번은 비우고 루트 = 1번. 노드 $i$의 왼쪽 자식 $2i$, 오른쪽 자식 $2i+1$, 부모 $\\lfloor i/2 \\rfloor$ (`i // 2`).\n- 장점: 포인터 불필요, 인덱스 계산만으로 이동, **힙 구현의 기초**. 완전 이진 트리일 때 빈틈이 없어 효율적.\n- 단점: 완전 이진 트리가 아니면 빈칸 낭비(편향 트리 최악), 삽입·삭제로 구조 바꾸기 어려움.\n\n### 연결 구조로 구현\n- 노드 = 데이터 + 왼쪽 자식 참조 + 오른쪽 자식 참조. 있는 노드만 메모리 사용, 참조만 바꾸면 구조 변경.\n```python\nclass Node:\n    def __init__(self, data):\n        self.data = data\n        self.left = None\n        self.right = None\n\nroot = Node('A')\nroot.left = Node('B')\nroot.right = Node('C')\nroot.left.left = Node('D')\n```\n- C++ 참고: 생성자에 `explicit`을 붙이면 `Node n = 10;` 같은 암묵적 형변환을 막는다.\n\n## 이진 트리 순회\n| 순회 | 순서 | 활용 |\n|---|---|---|\n| 전위(pre-order) | **루트** → 왼 → 오 | 구조 복사(폴더 복사: 부모 먼저 만들기) |\n| 중위(in-order) | 왼 → **루트** → 오 | BST에서 **오름차순 출력** |\n| 후위(post-order) | 왼 → 오 → **루트** | 폴더 용량 계산, 트리 삭제(자식 먼저) |\n\n```python\ndef preorder(node):\n    if node is None:\n        return\n    print(node.data, end=\" \")   # 루트 먼저\n    preorder(node.left)\n    preorder(node.right)\n\ndef inorder(node):\n    if node is None:\n        return\n    inorder(node.left)\n    print(node.data, end=\" \")   # 가운데\n    inorder(node.right)\n\ndef postorder(node):\n    if node is None:\n        return\n    postorder(node.left)\n    postorder(node.right)\n    print(node.data, end=\" \")   # 마지막\n```\n- 예: A(B(D, E), C) → 전위 `A B D E C`, 중위 `D B E A C`, 후위 `D E B C A`.\n\n> 📝 빈칸 포인트: `print` 줄의 위치만 다르다. 재귀 종료 조건 `if node is None: return`.\n\n## 우선순위 큐\n- 들어온 순서가 아니라 **우선순위가 높은 것부터** 나간다(일반 큐 = 들어온 순서가 우선순위인 경우). 예: OS 프로세스 스케줄링.\n- ADT: `isEmpty()`, `insert(item)`, `delete()`(가장 높은 것 삭제·반환), `peek()`\n\n| 구현 | insert | delete |\n|---|---|---|\n| 정렬 안 된 배열/리스트 | $O(1)$ | $O(n)$ (최댓값 찾기) |\n| 정렬된 배열/리스트 | $O(n)$ (자리 찾고 이동) | $O(1)$ |\n| **힙** | $O(\\log n)$ | $O(\\log n)$ |\n\n## 힙\n- **완전 이진 트리** + 부모-자식 대소 규칙. \"느슨한 정렬\" 상태(형제끼리는 순서 없음).\n  - **최대 힙**: 부모 ≥ 자식 → 루트가 최댓값\n  - **최소 힙**: 부모 ≤ 자식 → 루트가 최솟값\n- 우선순위 큐 = \"무엇을 하나\"(인터페이스), 힙 = \"어떻게 하나\"(구현체).\n- 완전 이진 트리라서 **배열**로 구현(마지막 위치 = 배열 끝, 포인터 불필요).\n\n### 삽입 (Up-heap)\n1. **맨 마지막 자리**에 넣는다(완전 이진 트리 유지).\n2. 부모보다 크면 교환, 부모가 크거나 같아질 때까지 루트 쪽으로 올라간다.\n\n### 삭제 (Down-heap)\n1. 루트를 꺼내고 **마지막 노드를 루트 자리로** 옮긴다.\n2. 자식과 비교해 내려간다. 자식 둘 다 크면 **더 큰 자식**과 교환(작은 쪽과 바꾸면 규칙이 또 깨짐).\n\n### 구현 (최대 힙)\n```python\nclass MaxHeap:\n    def __init__(self):\n        self.heap = [None]                    # 0번은 안 씀\n    def size(self):\n        return len(self.heap) - 1\n    def insert(self, value):\n        self.heap.append(value)\n        current = self.size()\n        while current > 1:                    # Up-heap\n            parent = current // 2\n            if self.heap[parent] >= self.heap[current]:\n                break\n            self.heap[parent], self.heap[current] = self.heap[current], self.heap[parent]\n            current = parent\n    def delete(self):\n        if self.size() == 0:\n            return None\n        max_val = self.heap[1]\n        self.heap[1] = self.heap[-1]          # 마지막을 루트로\n        self.heap.pop()\n        self._down_heap(1)\n        return max_val\n    def _down_heap(self, current):\n        while current * 2 <= self.size():\n            left, right = current * 2, current * 2 + 1\n            larger = left\n            if right <= self.size() and self.heap[right] > self.heap[left]:\n                larger = right                # 더 큰 자식\n            if self.heap[current] >= self.heap[larger]:\n                break\n            self.heap[current], self.heap[larger] = self.heap[larger], self.heap[current]\n            current = larger\n```\n- C++에서는 `delete`가 키워드라 `push`/`pop` 이름 사용. 표준: `std::priority_queue`, Python: `heapq`(최소 힙).\n\n### 복잡도\n| 연산 | 시간 |\n|---|---|\n| peek | $O(1)$ |\n| insert / delete | $O(\\log n)$ (높이만큼) |\n| build_heap(bottom-up heapify) | **$O(n)$** |\n| insert를 n번 해서 만들기 | $O(n\\log n)$ ($\\log 1 + \\cdots + \\log n$) |\n\n### 힙 생성: bottom-up\n- 배열을 그대로 두고, **마지막 부모(`size // 2`)부터 루트까지 거꾸로** down-heap.\n- 노드 절반이 리프라 거의 안 내려가고, 많이 내려가는 루트 근처 노드는 극소수 → $\\frac{N}{2}\\sum \\frac{h}{2^h} \\le N$ → $O(n)$.\n```python\ndef heapify(self, arr):\n    self.heap = [None] + list(arr)\n    for current in range(self.size() // 2, 0, -1):\n        self._down_heap(current)\n```\n- 예: `[4, 1, 3, 5, 2, 8]` → 인덱스 3, 2, 1 순서로 down-heap → `[8, 5, 4, 1, 2, 3]`.\n\n### 연습 문제\n- 삭제 위치: 항상 **루트**. 마지막 노드를 루트로 옮기는 이유: **완전 이진 트리 모양을 유지**하려고.\n- 배열로 구현하는 이유: 완전 이진 트리라 빈칸 없이 인덱스로 부모·자식 계산 가능.\n- 삽입·삭제 비용은 **트리 높이($\\log n$)**에 비례.\n- `17, 10, 22, 15, 12, 20, 24, 11, 14` 순서로 최대 힙에 삽입 → `[24, 15, 22, 14, 12, 17, 20, 10, 11]`\n  - 2번 삭제 후 → `[20, 15, 17, 14, 12, 10, 11]`, 마지막 원소 **11**\n\n## [응용] 허프만 코딩\n- 무손실 압축. 자주 나오는 문자는 **짧은 코드**, 드문 문자는 긴 코드(가변 길이).\n- **접두사 조건**: 어떤 코드도 다른 코드의 앞부분이 아니다 → 문자를 **리프에만** 두면 자동 만족.\n- 알고리즘(그리디 + 최소 힙): 빈도를 최소 힙에 넣고, **가장 작은 두 개를 꺼내 합친 부모를 다시 넣기**를 하나 남을 때까지.\n- 예: A45 B13 C12 D16 E9 → E+C=21, B+D=29, 21+29=50, A+50=95. 왼쪽 0 / 오른쪽 1.\n\n| 문자 | A | B | C | D | E |\n|---|---|---|---|---|---|\n| 코드 | 0 | 110 | 101 | 111 | 100 |\n\n## 일반 트리의 구현\n- 자식 수가 제각각이라 직접 구현하면 지저분함(고정 배열은 낭비, 가변 배열은 재할당).\n- **LCRS(왼쪽 자식-오른쪽 형제)**: left = 첫째 자식, right = 바로 옆 형제 → 모든 일반 트리를 이진 트리로 표현.", "codes": ["#include <iostream>\n#include <vector>\n#include <optional>\n#include <stdexcept>\n#include <string>\n\ntemplate <typename T>\nclass ArrayBinaryTree {\nprivate:\n    size_t size;\n    std::vector<std::optional<T>> tree;\n\n    // --- 범위 검사 및 예외 처리 헬퍼 ---\n    void validate_index(size_t index) const {\n        if (index < 1 || index > size) {\n            throw std::out_of_range(\"트리 인덱스 범위 초과: \" + std::to_string(index) + \n                                    \" (허용 범위: 1 ~ \" + std::to_string(size) + \")\");\n        }\n    }\n\n    // 인덱스가 범위 내에 존재하고, 실제 노드 데이터가 존재하는지(has_value) 검사\n    bool is_valid_index(size_t index) const {\n        return (index >= 1 && index <= size) && tree[index].has_value();\n    }\n    \npublic:\n    explicit ArrayBinaryTree(size_t max_size = 7) \n        : size(max_size), tree(max_size + 1, std::nullopt) {}\n\n    // --- 데이터 접근 및 변경 ---\n    void set_data(size_t index, const T& data) {\n        validate_index(index);\n        tree[index] = data;\n    }\n\n    std::optional<T> get_data(size_t index) const {\n        validate_index(index);\n        return tree[index];\n    }\n\n    // --- 인덱스 계산 메서드 ---\n    std::optional<size_t> left_idx(size_t parent_idx) const {\n        validate_index(parent_idx);\n        size_t idx = parent_idx * 2;\n        if (is_valid_index(idx)) return idx;\n        return std::nullopt;\n    }\n\n    std::optional<size_t> right_idx(size_t parent_idx) const {\n        validate_index(parent_idx);\n        size_t idx = parent_idx * 2 + 1;\n        if (is_valid_index(idx)) return idx;\n        return std::nullopt;\n    }\n\n    std::optional<size_t> parent_idx(size_t child_idx) const {\n        validate_index(child_idx);\n        if (child_idx == 1) return std::nullopt; // 루트 노드는 부모가 없음\n        \n        size_t idx = child_idx / 2;\n        if (is_valid_index(idx)) return idx;\n        return std::nullopt;\n    }\n\n    void display() const {\n        std::cout << \"트리 배열 상태: [ \";\n        for (size_t i = 1; i <= size; ++i) {\n            if (tree[i].has_value()) {\n                std::cout << tree[i].value() << \" \";\n            } else {\n                std::cout << \"None \";\n            }\n        }\n        std::cout << \"]\\n\";\n    }\n};\n\n// --- 메인 실행 코드 ---\nint main() {\n    ArrayBinaryTree<char> tree(7);\n\n    // 1. 데이터 저장 및 출력\n    tree.set_data(1, 'A');\n    tree.set_data(2, 'B');\n    tree.set_data(3, 'C');\n    tree.set_data(4, 'D');\n    tree.display();\n\n    auto left_1 = tree.left_idx(1);\n    auto right_1 = tree.right_idx(1);\n    auto parent_2 = tree.parent_idx(2);\n    auto parent_1 = tree.parent_idx(1);\n\n    if (left_1.has_value()) {\n        std::cout << \"1번('A')의 왼쪽 자식 인덱스 : \" << left_1.value() \n                  << \" -> 데이터: \" << tree.get_data(left_1.value()).value_or('?') << \"\\n\";\n    }\n    if (right_1.has_value()) {\n        std::cout << \"1번('A')의 오른쪽 자식 인덱스: \" << right_1.value() \n                  << \" -> 데이터: \" << tree.get_data(right_1.value()).value_or('?') << \"\\n\";\n    }\n    if (!parent_1.has_value()) {\n        std::cout << \"1번('A')의 부모 인덱스       : std::nullopt (루트)\\n\";\n    }\n\n    return 0;\n}", "#include <iostream>\n#include <memory>\n#include <string>\n\n// 1. Node 구조체 정의\ntemplate <typename T>\nstruct Node {\n    T data;\n    std::shared_ptr<Node<T>> left{nullptr};   // 왼쪽 자식 노드\n    std::shared_ptr<Node<T>> right{nullptr};  // 오른쪽 자식 노드\n\n    explicit Node(const T& val) : data(val) {}\n};\n\n// 2. BinaryTree 클래스 정의\ntemplate <typename T>\nclass BinaryTree {\nprivate:\n    std::shared_ptr<Node<T>> root{nullptr};\n\n    // 내부 전용 생성자: 기존 노드 포인터로 서브 트리 객체를 포장(wrap)할 때 사용\n    // std::shared_ptr는 복사할 때마다 내부 참조 횟수(Reference Count)가 늘어나기 때문에 \n    // 약간의 오버헤드가 발생할 수 있다.\n    // std::move를 사용하면 복사 대신 소유권 자체를 그대로 이전(Move)한다.\n    // 즉, 인자로 넘어온 node가 가지고 있던 노드 제어권을 성능 저하 없이 \n    // root에게 넘겨준다.\n    explicit BinaryTree(std::shared_ptr<Node<T>> node) : root(std::move(node)) {}\n\npublic:\n    // 기본 생성자 (공집합 트리 생성)\n    BinaryTree() = default;\n\n    // 루트 데이터를 받아서 생성하는 생성자\n    explicit BinaryTree(const T& root_data) {\n        root = std::make_shared<Node<T>>(root_data);\n    }\n\n    // is_empty(): 현재 이진 트리가 공집합인지 확인\n    bool is_empty() const {\n        return root == nullptr;\n    }\n\n    // get_root_data(): 루트 노드의 데이터 반환\n    // template class여서 발행하는 문제를 해결하기 위해서, 디폴트 매개변수 필요함\n    T get_root_data(T default_val = T{}) const {\n        if (is_empty()) {\n            return default_val;\n        }\n        return root->data;\n    }\n\n    // set_root_data(x): 루트 노드의 데이터를 x로 설정하거나 신규 생성\n    void set_root_data(const T& x) {\n        if (is_empty()) {\n            root = std::make_shared<Node<T>>(x);\n        } else {\n            root->data = x;\n        }\n    }\n\n    // get_left_child(): 왼쪽 서브 트리 반환\n    BinaryTree get_left_child() const {\n        if (!is_empty() && root->left != nullptr) {\n            return BinaryTree(root->left);\n        }\n        return BinaryTree(); // 자식이 없으면 공집합 이진 트리 반환\n    }\n\n    // get_right_child(): 오른쪽 서브 트리 반환\n    BinaryTree get_right_child() const {\n        if (!is_empty() && root->right != nullptr) {\n            return BinaryTree(root->right);\n        }\n        return BinaryTree();\n    }\n\n    // set_left_child(sub): 왼쪽 자리에 새로운 서브 트리 sub 연결\n    void set_left_child(const BinaryTree& sub) {\n        if (is_empty()) {\n            std::cout << \"공집합 트리에는 자식 서브 트리를 연결할 수 없습니다.\\n\";\n            return;\n        }\n        root->left = (!sub.is_empty()) ? sub.root : nullptr;\n    }\n\n    // set_right_child(sub): 오른쪽 자리에 새로운 서브 트리 sub 연결\n    void set_right_child(const BinaryTree& sub) {\n        if (is_empty()) {\n            std::cout << \"공집합 트리에는 자식 서브 트리를 연결할 수 없습니다.\\n\";\n            return;\n        }\n        root->right = (!sub.is_empty()) ? sub.root : nullptr;\n    }\n};\n\n/*\n [트리 구조]\n         A\n       /   \\\n      B     C\n     / \\     \n    D   E     \n*/\n\nint main() {\n    // 1. 서브 트리 생성 (Bottom-up 방식)\n    BinaryTree<char> sub_d('D');\n    BinaryTree<char> sub_e('E');\n\n    BinaryTree<char> sub_b('B');\n    sub_b.set_left_child(sub_d);\n    sub_b.set_right_child(sub_e);\n\n    BinaryTree<char> sub_c('C');\n\n    // 2. 메인 트리 생성 및 연결\n    BinaryTree<char> tree;\n    tree.set_root_data('A');\n    tree.set_left_child(sub_b);\n    tree.set_right_child(sub_c);\n\n    // 3. 데이터 조회 및 탐색\n    std::cout << \"루트 데이터: \" << tree.get_root_data() << \"\\n\";\n\n    BinaryTree<char> left_sub = tree.get_left_child();\n    std::cout << \"루트의 왼쪽 자식 데이터: \" << left_sub.get_root_data() << \"\\n\";\n\n    BinaryTree<char> left_left_sub = left_sub.get_left_child();\n    std::cout << \"왼쪽 자식의 왼쪽 자식 데이터: \" << left_left_sub.get_root_data() << \"\\n\";\n\n    return 0;\n}", "// 전위 순회 (Preorder): Root -> Left -> Right\ntemplate <typename T>\nvoid preorder(const BinaryTree<T>& tree) {\n    if (tree.is_empty()) return;\n\n    std::cout << tree.get_root_data() << \" \"; // 1. 루트 방문\n    preorder(tree.get_left_child());          // 2. 왼쪽 서브 트리 순회\n    preorder(tree.get_right_child());         // 3. 오른쪽 서브 트리 순회\n}\n\n// 중위 순회 (Inorder): Left -> Root -> Right\ntemplate <typename T>\nvoid inorder(const BinaryTree<T>& tree) {\n    if (tree.is_empty()) return;\n\n    inorder(tree.get_left_child());           // 1. 왼쪽 서브 트리 순회\n    std::cout << tree.get_root_data() << \" \"; // 2. 루트 방문\n    inorder(tree.get_right_child());          // 3. 오른쪽 서브 트리 순회\n}\n\n// 후위 순회 (Postorder): Left -> Right -> Root\ntemplate <typename T>\nvoid postorder(const BinaryTree<T>& tree) {\n    if (tree.is_empty()) return;\n\n    postorder(tree.get_left_child());         // 1. 왼쪽 서브 트리 순회\n    postorder(tree.get_right_child());        // 2. 오른쪽 서브 트리 순회\n    std::cout << tree.get_root_data() << \" \"; // 3. 루트 방문\n}\n\n/*\n [트리 구조]\n         A\n       /   \\\n      B     C\n     / \\     \n    D   E     \n*/\n\n/*\n전위 순회 (Preorder) : A B D E C \n중위 순회 (Inorder)  : D B E A C \n후위 순회 (Postorder) : D E B C A \n*/\n\n\nint main() {\n    BinaryTree<char> sub_d('D');\n    BinaryTree<char> sub_e('E');\n\n    BinaryTree<char> sub_b('B');\n    sub_b.set_left_child(sub_d);\n    sub_b.set_right_child(sub_e);\n\n    BinaryTree<char> sub_c('C');\n\n    BinaryTree<char> tree;\n    tree.set_root_data('A');\n    tree.set_left_child(sub_b);\n    tree.set_right_child(sub_c);\n\n    std::cout << \"전위 순회 (Preorder) : \";\n    preorder(tree);\n    std::cout << \"\\n\";\n\n    std::cout << \"중위 순회 (Inorder)  : \";\n    inorder(tree);\n    std::cout << \"\\n\";\n\n    std::cout << \"후위 순회 (Postorder) : \";\n    postorder(tree);\n    std::cout << \"\\n\";\n\n    return 0;\n}", "template <typename T>\nclass BinaryTree {\n    // ... 기존 코드 유지 ...\n    \n    \n    \n    \n\npublic:\n    // 전위 순회 메서드\n    void preorder() const {\n        if (is_empty()) return;\n        std::cout << get_root_data() << \" \";\n        get_left_child().preorder();\n        get_right_child().preorder();\n    }\n\n    // 중위 순회 메서드\n    void inorder() const {\n        if (is_empty()) return;\n        get_left_child().inorder();\n        std::cout << get_root_data() << \" \";\n        get_right_child().inorder();\n    }\n\n    // 후위 순회 메서드\n    void postorder() const {\n        if (is_empty()) return;\n        get_left_child().postorder();\n        get_right_child().postorder();\n        std::cout << get_root_data() << \" \";\n    }\n};\n\n\nint main() {\n    BinaryTree<char> sub_d('D');\n    BinaryTree<char> sub_e('E');\n\n    BinaryTree<char> sub_b('B');\n    sub_b.set_left_child(sub_d);\n    sub_b.set_right_child(sub_e);\n\n    BinaryTree<char> sub_c('C');\n\n    BinaryTree<char> tree;\n    tree.set_root_data('A');\n    tree.set_left_child(sub_b);\n    tree.set_right_child(sub_c);\n\n    std::cout << \"전위 순회 (Preorder) : \";\n    tree.preorder();\n    std::cout << \"\\n\";\n\n    std::cout << \"중위 순회 (Inorder)  : \";\n    tree.inorder();\n    std::cout << \"\\n\";\n\n    std::cout << \"후위 순회 (Postorder) : \";\n    tree.postorder();\n    std::cout << \"\\n\";\n\n    return 0;\n}\n\n\n/*\n전위 순회 (Preorder) : A B D E C \n중위 순회 (Inorder)  : D B E A C \n후위 순회 (Postorder) : D E B C A \n*/", "#include <iostream>\n#include <vector>\n#include <cstddef>   // std::size_t\n#include <utility>   // std::swap\n\ntemplate <typename T>\nclass MaxHeap {\nprivate:\n    std::vector<T> heap; // 0번 인덱스는 사용하지 않음\n\npublic:\n    // 생성자: 0번 인덱스를 비워두기 위해 기본값 1개 삽입\n    // T{}: 템플릿 타입 T에 대한 값 초기화(Value-Initialization) 표현. \n    // 만약 T가 int라면 0으로 초기화됨. \n    // T가 사용자가 정의한 클래스나 구조체라면, \n    // 해당 타입의 기본 생성자(Default Constructor)를 호출하여 초기화된 객체를 반환\n    MaxHeap() {\n        heap.push_back(T{});\n    }\n\n    bool is_empty() const {\n        return heap.size() <= 1;\n    }\n\n    std::size_t size() const {\n        return heap.size() - 1;\n    }\n\n    // Up-Heap (부모와 비교하여 위로 올림)\n    void push(const T& value) {\n        heap.push_back(value); // 마지막에 노드를 추가\n        std::size_t current = size(); // 추가된 노드의 현재 위치\n\n        while (current > 1) {\n            std::size_t parent = current / 2;\n            if (heap[parent] >= heap[current]) {\n                break;\n            }\n            std::swap(heap[parent], heap[current]);\n            current = parent;\n        }\n    }\n\n    // Down-Heap (더 큰 자식과 비교하여 아래로 내림)\n    T pop() {\n        if (is_empty()) {\n            return T{}; // 비어있는 경우 기본값 반환 (또는 예외 처리)\n        }\n\n        T max_val = heap[1];\n\n        // 마지막 요소를 루트로 이동\n        T last_val = heap.back();\n        heap.pop_back();\n\n        if (!is_empty()) {\n            heap[1] = last_val;\n            std::size_t current = 1;\n\n            // Down-Heap (더 큰 자식과 비교해서 아래로 내림)\n            while (current * 2 <= size()) { // 일단 여기에서는 왼쪽 자식의 존재 여부만 체크한다.\n                std::size_t left = current * 2;\n                std::size_t right = current * 2 + 1;\n                std::size_t larger = left;\n\n                // 오른쪽 자식의 존재 여부를 별도로 여기서 확인한다.\n                if (right <= size() && heap[right] > heap[left]) {\n                    larger = right;\n                }\n\n                if (heap[current] >= heap[larger]) {\n                    break;\n                }\n\n                std::swap(heap[current], heap[larger]);\n                current = larger;\n            }\n        }\n\n        return max_val;\n    }\n    \n    // 우선순위가 가장 높은 요소를 삭제하지 않고 반환\n    T peek() const {\n        if (is_empty()) {\n            return T{};\n        }\n        return heap[1];\n    }    \n\n    // 힙 배열의 현재 상태 출력 (1번 인덱스부터)\n    void display() const {\n        std::cout << \"힙 배열: [\";\n        for (std::size_t i = 1; i <= size(); ++i) {\n            std::cout << heap[i];\n            if (i < size()) std::cout << \", \";\n        }\n        std::cout << \"]\\n\";\n    }\n};\n\nint main() {\n    MaxHeap<int> heap;\n\n    for (int val : {10, 40, 30, 5, 12, 50}) {\n        heap.push(val);\n    }\n\n    // 1. 힙 배열 상태 출력\n    heap.display(); // 힙 배열: [50, 12, 40, 5, 10, 30]\n    \n    // 2. Peek 결과 출력\n    std::cout << \"Peek 결과 (최댓값 확인): \" << heap.peek() << \"\\n\"; // 50 (삭제되지 않음)\n    \n    // 3. Pop 결과 출력\n    std::cout << \"Pop 결과: [\";\n    std::size_t initial_size = heap.size();\n    for (std::size_t i = 0; i < initial_size; ++i) {\n        std::cout << heap.pop();\n        if (i < initial_size - 1) std::cout << \", \";\n    }\n    std::cout << \"]\\n\"; // Pop 결과: [50, 40, 30, 12, 10, 5]\n\n    return 0;\n}\n\n/*\n출력 결과 \n힙 배열: [50, 12, 40, 5, 10, 30]\nPeek 결과 (최댓값 확인): 50\nPop 결과: [50, 40, 30, 12, 10, 5]\n*/", "#include <iostream>\n#include <vector>\n#include <cstddef>   // std::size_t\n#include <utility>   // std::swap\n\ntemplate <typename T>\nclass MaxHeap {\nprivate:\n    std::vector<T> heap; // 0번 인덱스는 사용하지 않음\n\n    // 공통으로 사용되는 Down-Heap (더 큰 자식과 비교하여 아래로 내림)\n    void down_heap(std::size_t current) {\n        while (current * 2 <= size()) {\n            std::size_t left = current * 2;\n            std::size_t right = current * 2 + 1;\n            std::size_t larger = left;\n\n            if (right <= size() && heap[right] > heap[left]) {\n                larger = right;\n            }\n\n            if (heap[current] >= heap[larger]) {\n                break;\n            }\n\n            std::swap(heap[current], heap[larger]);\n            current = larger;\n        }\n    }\n\npublic:\n    // 기본 생성자: 0번 인덱스를 비워두기 위해 기본값 1개 삽입\n    MaxHeap() {\n        heap.push_back(T{});\n    }\n\n    // 벡터를 인자로 받는 생성자 (heapify 수행)\n    MaxHeap(const std::vector<T>& arr) {\n        heap.push_back(T{}); // 0번 인덱스 더미 삽입\n        heapify(arr);\n    }\n\n    bool is_empty() const {\n        return heap.size() <= 1;\n    }\n\n    std::size_t size() const {\n        return heap.size() - 1;\n    }\n\n    // Up-Heap (부모와 비교하여 위로 올림)\n    void push(const T& value) {\n        heap.push_back(value); // 마지막에 노드를 추가\n        std::size_t current = size(); // 추가된 노드의 현재 위치\n\n        while (current > 1) {\n            std::size_t parent = current / 2;\n            if (heap[parent] >= heap[current]) {\n                break;\n            }\n            std::swap(heap[parent], heap[current]);\n            current = parent;\n        }\n    }\n\n    // Pop (최댓값 추출)\n    T pop() {\n        if (is_empty()) {\n            return T{}; \n        }\n\n        T max_val = heap[1];\n        T last_val = heap.back();\n        heap.pop_back();\n\n        if (!is_empty()) {\n            heap[1] = last_val;\n            down_heap(1);\n        }\n\n        return max_val;\n    }\n    \n    // 임의의 배열을 O(N) 만에 힙으로 변환하는 바텀업(Bottom-up) 메서드\n    void heapify(const std::vector<T>& arr) {\n        // 기존 데이터를 초기화하고 0번 더미 뒤에 배열 통째로 복사\n        heap.resize(1);\n        heap.insert(heap.end(), arr.begin(), arr.end());\n\n        // 가장 마지막 부모 노드부터 루트(1)까지 역순으로 순회\n        // signed 타입(long long)을 사용하여 unsigned 언더플로 방지\n        for (long long current = static_cast<long long>(size() / 2); current >= 1; --current) {\n            down_heap(static_cast<std::size_t>(current));\n        }\n    }\n\n    // 우선순위가 가장 높은 요소를 삭제하지 않고 반환\n    T peek() const {\n        if (is_empty()) {\n            return T{};\n        }\n        return heap[1];\n    }    \n\n    // 힙 배열의 현재 상태 출력 (1번 인덱스부터)\n    void display() const {\n        std::cout << \"힙 배열: [\";\n        for (std::size_t i = 1; i <= size(); ++i) {\n            std::cout << heap[i];\n            if (i < size()) std::cout << \", \";\n        }\n        std::cout << \"]\\n\";\n    }\n};\n\nint main() {\n    // 1. heapify 생성자를 이용한 O(N) 힙 구축 테스트\n    std::vector<int> data = {10, 40, 30, 5, 12, 50};\n    MaxHeap<int> heap(data);\n\n    // 힙 배열 상태 출력\n    heap.display(); // 힙 배열: [50, 12, 40, 5, 10, 30]\n    \n    // Peek 결과 출력\n    std::cout << \"Peek 결과 (최댓값 확인): \" << heap.peek() << \"\\n\"; // 50\n    \n    // Pop 결과 출력\n    std::cout << \"Pop 결과: [\";\n    std::size_t initial_size = heap.size();\n    for (std::size_t i = 0; i < initial_size; ++i) {\n        std::cout << heap.pop();\n        if (i < initial_size - 1) std::cout << \", \";\n    }\n    std::cout << \"]\\n\"; // Pop 결과: [50, 40, 30, 12, 10, 5]\n\n    return 0;\n}"]}, {"id": "c10", "no": 10, "name": "10장 탐색·BST·해싱", "ref": "## 한눈에 보기\n- 탐색 방법은 **데이터가 정렬돼 있는지**, **어떤 자료구조에 담겼는지**로 고른다.\n\n| 방법 | 조건 | 평균 | 최악 |\n|---|---|---|---|\n| 선형(순차) 탐색 | 없음 | $O(n)$ | $O(n)$ |\n| 센티널 선형 탐색 | 없음 | $O(n)$ (비교 횟수 절반) | $O(n)$ |\n| 정렬된 순차 탐색 | 정렬 | $O(n)$ (조기 종료) | $O(n)$ |\n| **이진 탐색** | 정렬 + 연속 메모리 | $O(\\log n)$ | $O(\\log n)$ |\n| 보간 탐색 | 정렬 + 균등 분포 | $O(\\log\\log n)$ | $O(n)$ |\n| **이진 탐색 트리(BST)** | BST 규칙 | $O(\\log n)$ | $O(n)$ (편향) |\n| 균형 트리(AVL, RB) | 자동 균형 | $O(\\log n)$ | $O(\\log n)$ |\n| **해싱** | 해시 함수 | $O(1)$ | $O(n)$ (충돌 몰림) |\n| 트라이 | 문자열 | $O(M)$ (문자열 길이) | $O(M)$ |\n\n> 📝 시험 포인트: 이진 탐색의 `left/right/mid` 갱신, BST의 탐색·삽입·삭제(자식 2개일 때 후계자), 해시 체이닝의 `add/search`.\n\n## Python · C++ 검색 함수\n| 대상 | 방법 | 비고 |\n|---|---|---|\n| list/tuple | `x in a`, `a.index(x)`, `a.count(x)` | `index`는 없으면 `ValueError`, 모두 $O(n)$ |\n| 문자열 | `s.find(sub)` / `s.index(sub)` | `find`는 없으면 **-1**, `index`는 예외 |\n| set/dict | `x in s` | 해시라서 평균 $O(1)$ |\n| C++ | `std::find`(선형), `std::binary_search`·`lower_bound`(정렬 필요), `map::find` | |\n\n## 선형 탐색\n- 처음부터 하나씩 비교. 찾으면 인덱스, 없으면 -1.\n```python\ndef search(arr, search_key):\n    for i in range(len(arr)):\n        if arr[i] == search_key:\n            return i\n    return -1\n```\n- 최선 $O(1)$, 최악 $O(n)$, 평균 비교 $\\frac{1+2+\\cdots+n}{n} = \\frac{n+1}{2}$ → $O(n)$.\n- 배열과 연결 리스트 모두 $O(n)$이지만 실제로는 배열이 빠르다(**캐시 적중**, 공간 지역성).\n\n### 센티널 선형 탐색\n- 일반 루프는 매번 **두 번 비교**: `i < len(arr)`(경계) + `arr[i] == key`(값).\n- 찾는 값을 **배열 끝에 보초(sentinel)로 추가** → 반드시 찾게 되므로 경계 검사를 없앤다.\n```python\ndef sentinel_search(arr, search_key):\n    arr.append(search_key)           # 보초\n    index = 0\n    while arr[index] != search_key:  # 비교 1번만\n        index += 1\n    if index == len(arr) - 1:        # 찾은 게 보초면 실패\n        return -1\n    return index\n```\n- 복잡도는 같고 실제 시간만 줄어든다.\n\n### 정렬된 리스트의 순차 탐색\n- 오름차순이면 `arr[i] > key`인 순간 **조기 종료**(-1). 대신 루프 안 비교가 하나 늘어난다.\n\n## 이진 탐색\n- 정렬된 배열에서 **가운데와 비교**해 절반을 버린다(UP/DOWN 숫자 맞히기).\n```python\ndef binary_search(arr, search_key):\n    left, right = 0, len(arr) - 1\n    while left <= right:\n        mid = left + (right - left) // 2\n        if arr[mid] == search_key:\n            return mid\n        elif arr[mid] < search_key:\n            left = mid + 1           # 왼쪽 절반 버림\n        else:\n            right = mid - 1          # 오른쪽 절반 버림\n    return -1\n\ndef binary_search_recursive(arr, left, right, key):\n    if left > right:\n        return -1\n    mid = left + (right - left) // 2\n    if arr[mid] == key:\n        return mid\n    elif arr[mid] < key:\n        return binary_search_recursive(arr, mid + 1, right, key)\n    else:\n        return binary_search_recursive(arr, left, mid - 1, key)\n```\n- 최선 $O(1)$(한 번에), 최악·평균 $O(\\log n)$. `mid = left + (right-left)//2`는 오버플로 방지 습관.\n- 단점: **정렬 필수**, **연속 메모리**(인덱스 접근) 필요 → 연결 리스트에는 못 쓴다.\n\n## 이진 탐색 트리 (BST)\n- 규칙: 모든 노드에 대해 **왼쪽 서브 트리 < 노드 < 오른쪽 서브 트리**, 서브 트리도 BST. 보통 중복 키는 허용하지 않는다(필요하면 count 변수, 연결 리스트, \"같으면 오른쪽\" 규칙).\n- **중위 순회하면 오름차순**.\n\n### BST ADT 🆕\n- `create_bst()`, `is_empty()`, `search(x)`, `insert(x)`(정렬 규칙 유지), `delete(x)`(삭제 후 규칙 유지하도록 재구성). 기본은 중복 불허.\n\n### 탐색\n```python\ndef search(self, node, key):            # 재귀\n    if node is None or node.data == key:\n        return node\n    if key < node.data:\n        return self.search(node.left, key)\n    return self.search(node.right, key)\n\ndef search_iterative(self, key):        # 반복 (스택 오버플로 걱정 없음)\n    current = self.root\n    while current is not None:\n        if key == current.data:\n            return current\n        elif key < current.data:\n            current = current.left\n        else:\n            current = current.right\n    return None\n```\n\n### 삽입\n- **탐색이 실패한 자리**(None)가 새 노드 자리. 재귀 버전은 \"서브 트리의 (새) 루트를 반환해서 다시 연결\"하는 구조.\n```python\ndef _insert(self, node, key):\n    if node is None:\n        return Node(key)                 # 빈 자리에 새 노드\n    if key < node.data:\n        node.left = self._insert(node.left, key)\n    elif key > node.data:\n        node.right = self._insert(node.right, key)\n    return node                          # 같으면 그대로\n\ndef insert(self, key):\n    self.root = self._insert(self.root, key)\n```\n- 반복 버전: `parent`를 기록하며 내려가다가, 끝에서 `key < parent.data`면 `parent.left`, 아니면 `parent.right`에 연결.\n\n| | 시간 | 모양 |\n|---|---|---|\n| 최선 | $O(1)$ | 빈 트리 |\n| 평균 | $O(\\log n)$ | 무작위 입력, 균형 |\n| 최악 | $O(n)$ | **정렬된 순서로 입력** → 편향 트리 |\n\n- 공간: 재귀 $O(h)$(콜 스택), 반복 $O(1)$.\n\n### 삭제\n| 삭제할 노드 | 처리 |\n|---|---|\n| 리프 | 그냥 삭제 |\n| 자식 1개 | 그 자식을 자기 자리로 올림 |\n| 자식 2개 | **오른쪽 서브 트리의 최솟값**(중위 후계자) 또는 왼쪽 서브 트리의 최댓값을 복사한 뒤, 그 노드를 삭제 |\n\n- 왜 그 값? 복사해 와도 \"왼쪽 < 노드 < 오른쪽\" 규칙이 유지되는 유일한 후보이기 때문(그리고 그 노드는 자식이 최대 1개).\n```python\ndef _delete(self, node, key):\n    if node is None:\n        return None\n    if key < node.data:\n        node.left = self._delete(node.left, key)\n    elif key > node.data:\n        node.right = self._delete(node.right, key)\n    else:\n        if node.left is None:            # 자식 0개 또는 오른쪽만\n            return node.right\n        if node.right is None:           # 왼쪽만\n            return node.left\n        succ = node.right                # 자식 2개: 후계자 찾기\n        while succ.left is not None:\n            succ = succ.left\n        node.data = succ.data\n        node.right = self._delete(node.right, succ.data)\n    return node\n```\n- 시간 $O(h)$: 평균 $O(\\log n)$, 편향이면 $O(n)$.\n\n## [고찰] 검색 알고리즘 선택\n- 데이터 크기·형태, 정렬 여부, 요구 속도(최악 보장?), 메모리, 구현 복잡도, 추가 제약을 함께 본다.\n\n## 해싱\n- 키를 **비교하지 않고**, 해시 함수로 **위치(인덱스)를 계산해 바로 접근** → 평균 $O(1)$. 배열 인덱스 접근과 같은 원리.\n- Python `dict`/`set`이 해시 테이블. C++은 `std::unordered_map`(참고: `std::map`은 레드-블랙 트리).\n```python\nd = {'a': 1, 'b': 2}\nd.keys(); d.values(); d.items()\nif 'b' in d:\n    print(d['b'])\n```\n\n### 해싱 ADT\n- 데이터: (key, value) 쌍. key는 고유하고 hashable.\n- 연산(🆕 교재 개정): `create_hash_table()`, `is_empty()`, `insert(key, value)`, `search(key)`, `delete(key)`\n- 같은 key를 다시 넣으면 값을 **갱신**하는 것이 일반적(아래 구현 예).\n\n### 해시 함수\n- **해시 함수**: 임의 길이의 키 → 고정 범위의 인덱스. **해시 테이블**: 그 인덱스(해시 주소)의 버킷/슬롯에 저장하는 배열.\n- $index = hash(key, size)$. 요건(🆕): ① **결정성**(같은 키 → 항상 같은 값) ② **균등 분포**(충돌 최소) ③ **고속 연산**.\n- 숫자 키: `key % 10` (끝자리만 봐서 쏠릴 수 있음. 10점 단위 점수는 전부 0 → 자릿수 합 `(score // 10 + score % 10) % 10`이 더 고르다).\n- 문자열 키: 문자 코드 합 % 크기. `sum(ord(c) for c in s) % size` → 예: 크기 40에서 `True`와 `elif`가 둘 다 16(충돌).\n\n### 충돌 해결\n- **충돌**: 다른 키가 같은 인덱스로 가는 것. 피할 수 없으니 대처법이 필요하다.\n\n| | 체이닝 | 오픈 어드레싱 |\n|---|---|---|\n| 방법 | 각 버킷에 **리스트**로 줄줄이 저장 | 다른 **빈 버킷**을 찾아 저장 |\n| 탐사 | — | 선형 `(i+1) % size`, 이차, 이중 해싱 |\n| 꽉 참 | 없음 | 한 바퀴 돌면 Full |\n| 주의 | 리스트가 길어지면 느려짐 | 검색은 **빈칸을 만날 때까지**, 삭제 시 빈칸으로 만들면 검색이 끊김 |\n\n```python\n# 체이닝 (정수 키, 크기 10)\ndef add(self, key, value):\n    bucket = self._table[key % 10]\n    for i, (k, v) in enumerate(bucket):\n        if k == key:\n            bucket[i] = (key, value)     # 같은 key → 갱신\n            return\n    bucket.append((key, value))          # 충돌해도 뒤에 붙임\n    self._length += 1\n\ndef search(self, key):\n    for k, v in self._table[key % 10]:\n        if k == key:\n            return v\n    return None\n```\n- 예: `add(12)`, `add(22)` → 둘 다 2번 버킷(충돌, 체이닝). `add(12, \"도윤\")`은 개수 그대로 값만 갱신.\n\n```python\n# 오픈 어드레싱(선형 탐사) 삽입\nindex = start = hash(key)\nwhile self.table[index] is not None:\n    index = (index + 1) % self.size\n    if index == start:\n        return                           # 가득 참\nself.table[index] = (key, value)\n```\n\n### 해싱이 쓰이는 곳\n- 비밀번호 저장, DB 인덱스, 무결성 검사·암호화, 캐시, 분산 시스템(어느 서버에 둘지).", "codes": ["#include <iostream>\n#include <vector>\n\nint search(const std::vector<int>& arr, int search_key) {\n    for (int i = 0; i < arr.size(); ++i) {\n        if (arr[i] == search_key) {\n            return i;\n        }\n    }\n    return -1;\n}\n\nint main() {\n    std::vector<int> arr = {2, 3, 4, 10, 40};\n    int item = 10;\n\n    int index = search(arr, item);\n    if (index == -1) {\n        std::cout << item << \" is not present in array\\n\";\n    } else {\n        std::cout << item << \" is at index \" << index << \"\\n\";\n    }\n\n    return 0;\n}", "#include <iostream>\n#include <vector>\n\nint sentinel_search(std::vector<int>& arr, int search_key) {\n    // 1. search_key를 보초(Sentinel)로 추가\n    arr.push_back(search_key);\n    int size = arr.size();\n\n    int index = 0;\n    // 2. 루프 내에서 경계 검사(index < size) 없이 조건 판단\n    while (arr[index] != search_key) {\n        index++;\n    }\n\n    // 3. 보초 원소를 제거하여 원래 배열 상태 복구\n    arr.pop_back();\n\n    // 4. 찾은 위치가 보초 위치(size - 1)인지 확인\n    if (index == size - 1) {\n        return -1; // 보초에서 멈춘 것이므로 원래 배열엔 없음\n    } else {\n        return index;\n    }\n}\n\nint main() {\n    std::vector<int> arr = {10, 20, 180, 30, 60, 50, 110, 100, 70};\n    int item = 80;\n\n    int index = sentinel_search(arr, item);\n    if (index == -1) {\n        std::cout << item << \" is not present in array\\n\";\n    } else {\n        std::cout << item << \" is at index \" << index << \"\\n\";\n    }\n\n    return 0;\n}", "#include <iostream>\n#include <vector>\n#include <algorithm> // std::sort 사용\n\nint binary_search(const std::vector<int>& arr, int search_key) {\n    int left = 0;\n    int right = arr.size() - 1;\n\n    while (left <= right) {\n        // 정수 오버플로를 방지하는 중간값 계산 방식\n        int mid = left + (right - left) / 2;\n\n        if (arr[mid] == search_key) {\n            return mid; // search_key 찾음\n        } \n        else if (arr[mid] < search_key) {\n            left = mid + 1;  // 오른쪽 반쪽으로 탐색 범위 축소\n        } \n        else {\n            right = mid - 1; // 왼쪽 반쪽으로 탐색 범위 축소\n        }\n    }\n\n    return -1; // 존재하지 않음\n}\n\nint main() {\n    std::vector<int> arr = {10, 20, 180, 30, 60, 50, 110, 100, 70};\n\n    // 1. 배열 정렬 (std::sort 사용)\n    std::sort(arr.begin(), arr.end());\n\n    // 정렬된 배열 출력\n    std::cout << \"sorted array: \";\n    for (int num : arr) {\n        std::cout << num << \" \";\n    }\n    std::cout << \"\\n\";\n\n    int item = 50;\n    int index = binary_search(arr, item);\n\n    if (index == -1) {\n        std::cout << item << \" is not present in array\\n\";\n    } else {\n        std::cout << item << \" is at index \" << index << \"\\n\";\n    }\n\n    return 0;\n}", "#include <iostream>\n#include <memory>\n#include <string>\n\n// 1. std::shared_ptr 기반 템플릿 노드 구조체\ntemplate <typename T>\nstruct Node {\n    T data;\n    std::shared_ptr<Node<T>> left{nullptr};   // 왼쪽 자식 노드\n    std::shared_ptr<Node<T>> right{nullptr};  // 오른쪽 자식 노드\n\n    explicit Node(const T& val) : data(val) {}\n};\n\n// 2. std::shared_ptr 기반 템플릿 이진 탐색 트리(BST) 클래스\ntemplate <typename T>\nclass BST {\npublic:\n    std::shared_ptr<Node<T>> root;\n\n    explicit BST(const T& root_data) {\n        root = std::make_shared<Node<T>>(root_data);\n    }\n\n    // 스마트 포인터 사용으로 소멸자를 직접 구현할 필요가 없음 (자동 메모리 해제)\n\n    // 재귀적 검색 방식\n    std::shared_ptr<Node<T>> search_recur(std::shared_ptr<Node<T>> node, const T& key) const {\n        if (node == nullptr) {\n            return nullptr;\n        }\n        if (node->data == key) {\n            return node;\n        }\n\n        if (key < node->data) {\n            return search_recur(node->left, key);\n        } else {\n            return search_recur(node->right, key);\n        }\n    }\n\n    // 반복적 검색 방식\n    std::shared_ptr<Node<T>> search_iterative(const T& key) const {\n        std::shared_ptr<Node<T>> current = root;\n        while (current != nullptr) {\n            if (key == current->data) {\n                return current;\n            } else if (key < current->data) {\n                current = current->left;\n            } else {\n                current = current->right;\n            }\n        }\n        return nullptr;\n    }\n};\n\nint main() {\n    // --- 1. 정수형(int) BST 생성 ---\n    BST<int> bst(50);\n\n    // std::make_shared를 통한 노드 생성 (RAII 지원 및 안전한 메모리 할당)\n    auto node30 = std::make_shared<Node<int>>(30);\n    auto node70 = std::make_shared<Node<int>>(70);\n    auto node20 = std::make_shared<Node<int>>(20);\n    auto node40 = std::make_shared<Node<int>>(40);\n\n    // 포인터 직접 연결 (구조 구성)\n    //      50\n    //     /  \\\n    //    30  70\n    //   /  \\\n    //  20  40\n    bst.root->left = node30;\n    bst.root->right = node70;\n\n    bst.root->left->left = node20;\n    bst.root->left->right = node40;\n\n    // --- 2. 검색 테스트 (반복문 이용) ---\n    int target = 40;\n    auto result1 = bst.search_iterative(target);\n\n    if (result1 != nullptr) {\n        std::cout << \"[반복] 찾았습니다: \" << result1->data << \"\\n\";\n    } else {\n        std::cout << \"[반복] 찾지 못했습니다.\\n\";\n    }\n\n    // --- 3. 검색 테스트 (재귀함수 이용) ---\n    auto result2 = bst.search_recur(bst.root, target);\n\n    if (result2 != nullptr) {\n        std::cout << \"[재귀] 찾았습니다: \" << result2->data << \"\\n\";\n    } else {\n        std::cout << \"[재귀] 찾지 못했습니다.\\n\";\n    }\n\n    return 0;\n}", "#include <iostream>\n#include <memory>\n#include <string>\n\n// 1. std::shared_ptr 기반 템플릿 노드 구조체\ntemplate <typename T>\nstruct Node {\n    T data;\n    std::shared_ptr<Node<T>> left{nullptr};   // 왼쪽 자식 노드\n    std::shared_ptr<Node<T>> right{nullptr};  // 오른쪽 자식 노드\n\n    explicit Node(const T& val) : data(val) {}\n};\n\n// 2. std::shared_ptr 기반 템플릿 이진 탐색 트리(BST) 클래스\ntemplate <typename T>\nclass BST {\n\n// =========================================================\n// --- 실제 재귀 호출이 일어나는 내부 헬퍼 함수 ---\n// =========================================================\nprivate:\n    std::shared_ptr<Node<T>> _insert_rec(std::shared_ptr<Node<T>> node, const T& data) {\n        // 1. 기저 조건(Base Case): 빈자리를 발견하면 새 노드 생성 후 반환\n        if (node == nullptr) {\n            return std::make_shared<Node<T>>(data);\n        }\n\n        // 2. 재귀 단계(Recursive Step): 값 비교 후 적절한 서브트리로 재귀 호출 및 포인터 재연결\n        if (data < node->data) {\n            node->left = _insert_rec(node->left, data);\n        } else if (data > node->data) {\n            node->right = _insert_rec(node->right, data);\n        }\n        // data == node->data 인 경우(중복 값)는 변화 없이 진행\n\n        // 3. 갱신된 현재 노드 반환\n        return node;\n    }\n\npublic:\n    std::shared_ptr<Node<T>> root;\n\n    // 루트 데이터를 입력받는 생성자\n    explicit BST(const T& root_data) {\n        root = std::make_shared<Node<T>>(root_data);\n    }\n\n    // 스마트 포인터 사용으로 소멸자를 직접 구현할 필요가 없음 (자동 메모리 해제)\n\n    // 재귀적 검색 방식\n    std::shared_ptr<Node<T>> search(std::shared_ptr<Node<T>> node, const T& key) const {\n        if (node == nullptr) {\n            return nullptr;\n        }\n        if (node->data == key) {\n            return node;\n        }\n\n        if (key < node->data) {\n            return search(node->left, key);\n        } else {\n            return search(node->right, key);\n        }\n    }\n\n    // 반복적 검색 방식\n    std::shared_ptr<Node<T>> search_iterative(const T& key) const {\n        std::shared_ptr<Node<T>> current = root;\n        while (current != nullptr) {\n            if (key == current->data) {\n                return current;\n            } else if (key < current->data) {\n                current = current->left;\n            } else {\n                current = current->right;\n            }\n        }\n        return nullptr;\n    }\n\n    // =========================================================\n    // --- 추가된 재귀적 노드 삽입(insert) 메서드 ---\n    // =========================================================\n    void insert(const T& data) {\n        root = _insert_rec(root, data);\n    }\n\n    // =========================================================\n    // --- [추가] 반복적 노드 삽입(insert_iterative) 메서드 ---\n    // =========================================================\n    void insert_iterative(const T& data) {\n        // 1. 예외 처리: 트리가 비어있는 경우\n        if (root == nullptr) {\n            root = std::make_shared<Node<T>>(data);\n            return;\n        }\n\n        std::shared_ptr<Node<T>> parent = nullptr;\n        std::shared_ptr<Node<T>> current = root;\n\n        // 2. 탐색 및 위치 추적: 빈자리에 도달할 때까지 아래로 이동\n        while (current != nullptr) {\n            parent = current; // 이동하기 전 부모 노드 기록\n\n            if (data < current->data) {\n                current = current->left;\n            } else if (data > current->data) {\n                current = current->right;\n            }\n        }\n\n        // 3. 노드 연결: parent 노드의 자식으로 새 노드 연결\n        if (data < parent->data) {\n            parent->left = std::make_shared<Node<T>>(data);\n        } else {\n            parent->right = std::make_shared<Node<T>>(data);\n        }\n    }\n};\n\nint main() {\n    // --- 1. 루트 생성 (50) ---\n    BST<int> bst(50);\n\n    // --- 2. 재귀적 insert()를 통한 노드 자동 삽입 ---\n    //      50\n    //     /  \\\n    //    30  70\n    bst.insert(30);\n    bst.insert(70);\n\n    // --- 3. 반복적 insert_iterative()를 통한 노드 추가 삽입 ---\n    //      50\n    //     /  \\\n    //    30  70\n    //   /  \\\n    //  20  40\n    bst.insert_iterative(20);\n    bst.insert_iterative(40);\n\n    // --- 4. 검색 테스트 (반복문 이용) ---\n    int target1 = 40;\n    auto result1 = bst.search_iterative(target1);\n\n    if (result1 != nullptr) {\n        std::cout << \"[반복] 찾았습니다: \" << result1->data << \"\\n\";\n    } else {\n        std::cout << \"[반복] 찾지 못했습니다.\\n\";\n    }\n\n    // --- 5. 검색 테스트 (재귀함수 이용) ---\n    int target2 = 20;\n    auto result2 = bst.search(bst.root, target2);\n\n    if (result2 != nullptr) {\n        std::cout << \"[재귀] 찾았습니다: \" << result2->data << \"\\n\";\n    } else {\n        std::cout << \"[재귀] 찾지 못했습니다.\\n\";\n    }\n\n    return 0;\n}", "#include <iostream>\n#include <algorithm>\nusing namespace std;\n\nstruct Node {\n    int data;\n    Node *left = nullptr, *right = nullptr;\n    explicit Node(int d) : data(d) {}\n};\n\nNode* insert(Node* node, int key) {\n    if (node == nullptr) return new Node(key);\n    if (key < node->data) node->left = insert(node->left, key);\n    else if (key > node->data) node->right = insert(node->right, key);\n    return node;\n}\n\nint height(Node* node) {\n    return node == nullptr ? 0 : 1 + max(height(node->left), height(node->right));\n}\n\nint main() {\n    Node* balanced = nullptr;\n    for (int x : {50, 30, 70, 20, 40, 60, 80}) balanced = insert(balanced, x);\n    Node* skewed = nullptr;\n    for (int x : {10, 20, 30, 40}) skewed = insert(skewed, x);\n    cout << \"균형: \" << height(balanced) << \"\\n\";   // 3\n    cout << \"편향: \" << height(skewed) << \"\\n\";     // 4\n    return 0;\n}"]}, {"id": "c11", "no": 11, "name": "11장 그래프 탐색·최단 경로", "ref": "## 한눈에 보기\n- 그래프 $G = (V, E)$: 정점(객체)과 간선(관계)의 집합. 트리와 달리 **사이클이 있어도 되고 계층이 없다**(지하철 노선도, SNS).\n- 구현: **인접 행렬**(2차원 배열) / **인접 리스트**(정점마다 이웃 목록).\n- 탐색: **DFS**(스택·재귀, 깊이 먼저) / **BFS**(큐, 가까운 것부터 → 최단 경로).\n- **최단 경로**: 가중치 없으면 BFS, 가중치(음수 없음)면 **다익스트라**(최소 힙), 목표가 하나면 A*. 🆕\n- **최소 신장 트리(MST)**: 모든 정점을 최소 비용으로 잇는 트리. **크루스칼** = 가중치 작은 간선부터, 사이클 생기면 버림(Union-Find).\n\n| | 인접 행렬 | 인접 리스트 |\n|---|---|---|\n| 공간 | $O(V^2)$ | $O(V + E)$ |\n| 간선 (u, v) 있나? | **$O(1)$** | $O(\\deg(u))$ |\n| u의 이웃 전부 | $O(V)$ | **$O(\\deg(u))$** |\n| 정점 추가 | 어려움(행렬 재할당 $O(V^2)$) | 쉬움 (dict면 평균 $O(1)$) |\n| 잘 맞는 그래프 | 밀집 | **희소** |\n\n> 📝 시험 포인트: 그래프를 주고 인접 행렬/리스트로 바꾸기, DFS·BFS 방문 순서 쓰기, 크루스칼로 고르는 간선 순서, 코드의 `visited`·`stack`·`queue` 빈칸.\n\n## 그래프 기초\n- **방향 그래프**(A가 B를 팔로우) / **비방향 그래프**(친구 관계). **가중치 그래프(네트워크)**: 간선에 거리·비용.\n- 관계를 다대다로 자유롭게 표현 → 최단 경로, 네트워크 분석의 기반.\n\n### 트리 vs 그래프\n| | 트리 | 그래프 |\n|---|---|---|\n| 정체 | **사이클 없고 연결된** 특수한 그래프 | 일반 |\n| 계층 | 부모-자식(조직도) | 없음(지하철, SNS) |\n| 사이클 | 불가 | 가능 |\n| 두 노드 사이 경로 | 유일 | 여러 개 가능 |\n\n### 용어 · 종류\n- **인접 노드**: 간선 하나로 직접 연결된 노드.\n- **차수**: 비방향은 이웃 수. 방향은 **진입 차수**(들어오는) / **진출 차수**(나가는).\n- **경로**: 간선을 따라가는 노드 나열. **연결 그래프**: 모든 노드 사이에 경로가 있는 그래프.\n- **부분 그래프**: V와 E의 부분 집합. **완전 그래프**: 모든 두 정점 사이에 간선(비방향이면 $\\frac{V(V-1)}{2}$개).\n\n## 그래프 ADT\n- `create()`, `destroy(A)`, `insert_node`, `delete_node`, `insert_edge(A, from, to)`, `delete_edge(A, from, to)`, `adjacent(A, from)`\n\n## 그래프 구현\n\n### 인접 행렬\n- `adj[i][j] = 1`이면 i→j 간선. **비방향이면 대칭**(`adj[i][j] == adj[j][i]`). 가중치 그래프면 1 대신 가중치.\n```python\nclass Graph:\n    def __init__(self, size):\n        self.size = size\n        self.matrix = [[0] * size for _ in range(size)]\n    def add_edge(self, u, v):          # O(1)\n        self.matrix[u][v] = 1\n        self.matrix[v][u] = 1          # 비방향: 양쪽\n    def delete_edge(self, u, v):\n        self.matrix[u][v] = 0\n        self.matrix[v][u] = 0\n    def adjacent(self, u):             # O(V): 행 전체 훑기\n        return [i for i, val in enumerate(self.matrix[u]) if val == 1]\n```\n- 단점: 희소 그래프면 메모리 낭비, 전체 간선 수 세기 $O(V^2)$, 노드 추가가 비쌈.\n- 주의: `[[0] * size] * size`로 만들면 **모든 행이 같은 리스트**를 가리킨다 → 반드시 컴프리헨션.\n\n### 인접 리스트\n```python\nclass AdjacencyListGraph:\n    def __init__(self, size):\n        self.size = size\n        self.adj_list = [[] for _ in range(size)]\n    def add_edge(self, u, v):          # O(deg): 중복 검사 때문\n        if v not in self.adj_list[u]:\n            self.adj_list[u].append(v)\n        if u not in self.adj_list[v]:\n            self.adj_list[v].append(u)\n    def adjacent(self, u):             # O(1)로 목록 참조\n        return self.adj_list[u]\n```\n- 비방향이면 간선 하나가 두 번 저장 → 공간 $O(V + 2E)$. 중복 검사를 빠르게 하려면 이웃 목록을 `set`으로.\n- list 버전 한계: 노드 번호가 **0부터 연속된 정수**여야 한다(\"Seoul\" 같은 이름, 띄엄띄엄한 번호는 곤란).\n\n### 인접 리스트: dictionary 사용 🆕\n- 노드 이름이 무엇이든 **존재하는 노드만 키로 등록** → 크기를 미리 정할 필요 없음.\n```python\nclass DynamicGraph:\n    def __init__(self):\n        self.adj_list = {}                 # {노드: [이웃, ...]}\n    def add_vertex(self, u):\n        if u not in self.adj_list:\n            self.adj_list[u] = []\n    def add_edge(self, u, v):              # 노드가 없으면 자동 생성\n        self.add_vertex(u)\n        self.add_vertex(v)\n        if v not in self.adj_list[u]:\n            self.adj_list[u].append(v)\n        if u not in self.adj_list[v]:\n            self.adj_list[v].append(u)\n    def adjacent(self, u):\n        return self.adj_list.get(u, [])    # 없으면 빈 리스트\n```\n- `dict.get(key, 기본값)`: 키가 없으면 None 대신 기본값.\n\n| 연산 | list 버전 | dict 버전 |\n|---|---|---|\n| 정점 추가 | 크기 고정 | 평균 $O(1)$ |\n| 간선 추가 | $O(\\deg(u) + \\deg(v))$ | $O(\\deg(u) + \\deg(v))$ |\n| 인접 노드 조회 | $O(1)$ | 평균 $O(1)$ |\n| 공간 | $O(V + E)$ | $O(V + E)$ |\n\n## 그래프 탐색\n- START에서 GOAL까지 길이 있는지, 최단 경로는 무엇인지 찾는 문제. 장기판 상태 공간도 그래프.\n- 핵심 도구: **`visited`** (이미 간 곳을 다시 안 가서 사이클에서 무한 루프 방지).\n\n### 깊이 우선 탐색 (DFS)\n- 갈 수 있는 데까지 깊이 들어갔다가 막히면 **되돌아가서(backtracking)** 다른 길. 지나온 길을 **스택**(또는 재귀의 콜 스택)에 보관.\n```python\ndef dfs_recur_search(self, v, goal, visited):   # 재귀\n    visited[v] = True\n    if v == goal:\n        return True\n    for neighbor in self.adj_list[v]:\n        if not visited[neighbor]:\n
