figure class=\"code extra\" data-bid=\"8547429a-7caa-4226-a972-fffe3b036a18:x:cpp\"><div class=\"code-h\"><span>C++<\/span><b class=\"xtag\">추가 구현<\/b><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-cpp\">#include &lt;iostream&gt;\n#include &lt;string&gt;\n#include &lt;stack&gt;\n#include &lt;unordered_map&gt;\nusing namespace std;\n\nbool is_balanced(const string&amp; s) {\n    stack&lt;char&gt; st;\n    unordered_map&lt;char, char&gt; mapping = {{&#x27;)&#x27;, &#x27;(&#x27;}, {&#x27;}&#x27;, &#x27;{&#x27;}, {&#x27;]&#x27;, &#x27;[&#x27;}};   // 닫는 -&gt; 여는\n    for (char ch : s) {\n        if (ch == &#x27;(&#x27; || ch == &#x27;{&#x27; || ch == &#x27;[&#x27;) st.push(ch);   // 1. 여는 괄호\n        else if (mapping.count(ch)) {                            // 2. 닫는 괄호\n            if (st.empty()) return false;\n            char top = st.top(); st.pop();\n            if (mapping[ch] != top) return false;                // 짝이 안 맞음\n        }\n    }\n    return st.empty();\n}\n\nint main() {\n    cout &lt;&lt; boolalpha;\n    cout &lt;&lt; is_balanced(&quot;({[]})&quot;) &lt;&lt; &quot;\\n&quot;;   // true\n    cout &lt;&lt; is_balanced(&quot;([)]&quot;) &lt;&lt; &quot;\\n&quot;;     // false\n    return 0;\n}<\/code><\/pre><\/figure><div class=\"gap\"><\/div><h6 class=\"bh bh3\">3. 알고리즘 복잡도<\/h6><ul><li><strong>시간 복잡도:<\/strong> 문자열을 한 번만 순회하므로 O(N)<\/li><li><strong>공간 복잡도:<\/strong> 최악의 경우 모든 문자가 여는 괄호일 때 스택에 모두 쌓이므로 O(N)<\/li><li><strong>확장성:<\/strong> 괄호 종류가 추가되어도 <code>mapping<\/code> 딕셔너리에 기호만 추가하면 되므로 코드를 수정할 필요가 거의 없다.<\/li><\/ul><\/div><\/section>"}, {"id": "383713e35a7d80758311f848888c6580", "title": "응용 문제: The Geneva Confection", "tag": "스택", "html": "<div class=\"sb\"><aside class=\"callout\"><span class=ic aria-hidden=true>💡<\/span><div class=\"cb\"><h6 class=\"bh bh3\">기출문제: The Geneva Confection (CCC 2014 S3)<\/h6><\/div><\/aside><div class=\"gap\"><\/div><p><strong>문제 설명<\/strong><\/p><p>당신은 제네바 과자 공장의 철도 관리자입니다. 산 정상에는 1부터 N까지 번호가 매겨진 기차 칸들이 무작위 순서로 일렬로 대기하고 있습니다. 당신의 임무는 이 기차 칸들을 산 아래 호수로 보내는 것인데, <strong>반드시 1번부터 N번까지 오름차순 순서대로<\/strong> 호수에 도착해야 합니다.<\/p><p>다행히 기차를 재배열할 수 있도록 산 중턱에 &#x27;지선(Branch Line)&#x27;이 하나 있습니다.<\/p><p>산 정상에서 내려오는 기차 칸은 두 가지 선택을 할 수 있습니다:<\/p><ol><li>호수로 바로 간다.<\/li><li>지선으로 들어간다.<\/li><\/ol><p>또한, 지선에 있는 기차 칸은 언제든 호수로 갈 수 있습니다. <strong>하지만 지선은 한쪽이 막혀있는 좁은 터널이라서, 마지막에 지선으로 들어간 기차 칸이 가장 먼저 나와야만 합니다.<\/strong> (즉, 지선 = 스택)<\/p><p>과연 주어진 기차 칸들을 1부터 $N$까지 올바른 순서대로 호수에 보낼 수 있을지 판별하세요.<\/p><div class=\"gap\"><\/div><p><strong>입력 명세<\/strong><\/p><ul><li>첫 줄에는 테스트 케이스의 수 T (<span class=\"mx\" data-tex=\"1 \\le T \\le 10\">1 \\le T \\le 10<\/span> )가 주어집니다.<\/li><li>각 테스트 케이스의 첫 줄에는 기차 칸의 수 N (<span class=\"mx\" data-tex=\"1 \\le N \\le 100,000\">1 \\le N \\le 100,000<\/span>)이 주어집니다.<\/li><li>다음 N개의 줄에는 산 정상에 있는 기차 칸들의 번호가 꼭대기부터 아래 순서대로(즉, 제일 먼저 내려오는 차례대로) 주어집니다.<\/li><\/ul><p><strong>출력 명세<\/strong><\/p><ul><li>올바른 순서로 보낼 수 있다면 <code>Y<\/code>, 불가능하다면 <code>N<\/code>을 출력합니다.<\/li><\/ul><div class=\"gap\"><\/div><p><strong>샘플 입력<\/strong><\/p><figure class=\"code\" data-bid=\"79421024-da62-4069-8a13-5fd270e9133b\"><div class=\"code-h\"><span>Plain Text<\/span><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-plaintext\">2\n4\n2\n3\n1\n4\n4\n4\n1\n3\n2<\/code><\/pre><\/figure><p><strong>샘플 출력<\/strong><\/p><figure class=\"code\" data-bid=\"51df0dc9-f455-4ca9-8e46-12fc5931377d\"><div class=\"code-h\"><span>Plain Text<\/span><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-plaintext\">Y\nN<\/code><\/pre><\/figure><div class=\"gap\"><\/div><p><strong>테스트 용 대용량 데이터<\/strong><\/p><div class=\"file\"><span class=\"fi\" aria-hidden=\"true\">📎<\/span><span class=\"fn\"><b>5.zip<\/b><small>1.1 MiB · 첨부 파일은 원본 노션에서 받을 수 있습니다<\/small><\/span><a class=\"btn btn-weak sm\" href=\"https://unibookco.notion.site/383713e35a7d80758311f848888c6580\" target=\"_blank\" rel=\"noopener\">노션 열기 ↗<\/a><\/div><div class=\"gap\"><\/div><\/div><section class=\"sec d3\" id=\"p383713e35a7d8084b808f35a21b4bf95\" data-depth=\"3\"><header class=\"sec-h d3\"><div class=\"crumb\">스택 › 응용 문제: The Geneva Confection<\/div><h4 class=\"st\">해결 방법<\/h4><\/header><div class=\"sb\"><figure class=\"code\" data-bid=\"383713e3-5a7d-8056-8a41-f00cf460292a\"><div class=\"code-h\"><span>Python<\/span><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-python\"># 스택을 이용한 문제\nimport sys\n\ndef solve():\n    # 모든 입력을 한 번에 읽어옵니다.\n    input_data = sys.stdin.read().split()\n    if not input_data:\n        return\n    \n    # 테스트 케이스 개수 T\n    T = int(input_data[0])\n    idx = 1\n    \n    for _ in range(T):\n        N = int(input_data[idx])\n        idx += 1\n        \n        # 1. 산 정상(Mountain) 초기화\n        # 입력은 위에서 아래 순서지만, 리스트에서 빠르게 pop() 하기 위해 역순으로 저장합니다.\n        mountain = []\n        for _ in range(N):\n            mountain.append(int(input_data[idx]))\n            idx += 1\n        mountain.reverse() # 리스트의 맨 끝([-1])이 산의 꼭대기가 됨\n        \n        # 2. 지선(Branch Line, Stack) 초기화\n        branch = []\n        \n        # 3. 호수로 보내야 할 다음 타겟 번호\n        target = 1\n        possible = True\n        \n        # 타겟 번호가 N이 될 때까지 반복\n        while target &lt;= N:\n            # 1순위: 지선(스택)의 맨 끝이 타겟 번호인지 확인\n            if branch and branch[-1] == target:\n                branch.pop()\n                target += 1\n            \n            # 2순위: 산 정상의 꼭대기가 타겟 번호인지 확인\n            elif mountain and mountain[-1] == target:\n                mountain.pop()\n                target += 1\n                \n            # 3순위: 둘 다 아니면 산 정상의 기차를 지선으로 이동\n            elif mountain:\n                branch.append(mountain.pop())\n                \n            # 위 3가지가 모두 불가능하면 더 이상 해결할 수 없음\n            else:\n                possible = False\n                break\n                \n        # 결과 출력\n        if possible:\n            print(&quot;Y&quot;)\n        else:\n            print(&quot;N&quot;)\n\n# 함수 실행\nsolve()<\/code><\/pre><\/figure><figure class=\"code extra\" data-bid=\"383713e3-5a7d-8056-8a41-f00cf460292a:x:cpp\"><div class=\"code-h\"><span>C++<\/span><b class=\"xtag\">추가 구현<\/b><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-cpp\">#include &lt;iostream&gt;\n#include &lt;vector&gt;\n#include &lt;stack&gt;\n#include &lt;algorithm&gt;\nusing namespace std;\n\nint main() {\n    int T;\n    cin &gt;&gt; T;\n    while (T--) {\n        int N;\n        cin &gt;&gt; N;\n        vector&lt;int&gt; mountain(N);\n        for (int&amp; x : mountain) cin &gt;&gt; x;\n        reverse(mountain.begin(), mountain.end());     // back()이 산의 꼭대기\n        stack&lt;int&gt; branch;                              // 지선 = 스택\n        int target = 1;                                 // 다음으로 호수에 보낼 번호\n        bool possible = true;\n        while (target &lt;= N) {\n            if (!branch.empty() &amp;&amp; branch.top() == target) {           // 1순위: 지선\n                branch.pop(); target++;\n            } else if (!mountain.empty() &amp;&amp; mountain.back() == target) { // 2순위: 산 꼭대기\n                mountain.pop_back(); target++;\n            } else if (!mountain.empty()) {                              // 3순위: 지선으로 이동\n                branch.push(mountain.back()); mountain.pop_back();\n            } else {                                                     // 더 이상 불가능\n                possible = false;\n                break;\n            }\n        }\n        cout &lt;&lt; (possible ? &quot;Y&quot; : &quot;N&quot;) &lt;&lt; &quot;\\n&quot;;\n    }\n    return 0;\n}<\/code><\/pre><\/figure><\/div><\/section>"}, {"id": "383713e35a7d80369886ebd0508aa6b1", "title": "응용 문제: postfix 수식 계산", "tag": "스택", "html": "<div class=\"sb\"><p>수식 계산은 스택(Stack)의 진가가 가장 잘 드러나는 대표적인 활용 분야입니다. 우리가 흔히 쓰는 수식(예: <code>3 + 4<\/code>) 대신, 연산자가 뒤에 오는 후위 표기법(Postfix Notation)을 사용하면 괄호나 우선순위 없이도 스택 하나로 아주 깔끔하게 계산할 수 있습니다.<\/p><h5 class=\"bh bh2\">문제: Postfix Calculator<\/h5><p><strong>문제 설명<\/strong><\/p><p><strong>후위 표기법(Postfix expression) <\/strong>(예: <code>3 4 +<\/code>) 계산기를 만들자<\/p><p>이 방식의 장점은 괄호가 전혀 필요 없다는 것입니다. 예를 들어, 우리 식의 <code>(5 + 2) * 3<\/code>은 외계인 표기법으로 <code>5 2 + 3 *<\/code>가 됩니다.<\/p><p>이 수식을 계산하여 최종 결과값을 출력하는 프로그램을 작성하세요.<\/p><div class=\"gap\"><\/div><p><strong>입력 명세<\/strong><\/p><ul><li>첫 번째 줄에 수식을 구성하는 요소(토큰)의 개수 N(<span class=\"mx\" data-tex=\"1 \\le N \\le 100,000\">1 \\le N \\le 100,000<\/span> )이 주어집니다.<\/li><li>두 번째 줄에 수식이 공백으로 구분되어 주어집니다.<\/li><li>수식의 요소는 양의 정수이거나 덧셈(<code>+<\/code>), 뺄셈(<code>-<\/code>), 곱셈(<code>*<\/code>), 나눗셈(<code>/<\/code>) 기호 중 하나입니다.<\/li><li>주어지는 수식은 항상 올바른 계산이 가능한 수식임이 보장됩니다.<\/li><\/ul><div class=\"gap\"><\/div><p><strong>출력 명세<\/strong><\/p><ul><li>수식을 계산한 최종 결과값을 정수로 한 줄에 출력합니다.<\/li><\/ul><p><strong>샘플 입력 1<\/strong><\/p><figure class=\"code\" data-bid=\"6eaace0f-8fd2-4c6e-80da-ddc558a8c5fd\"><div class=\"code-h\"><span>Plain Text<\/span><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-plaintext\">5\n5 2 + 3 *<\/code><\/pre><\/figure><p><strong>샘플 출력 1<\/strong><\/p><figure class=\"code\" data-bid=\"fdce7f59-67aa-4a74-8a5a-f02453b58da4\"><div class=\"code-h\"><span>Plain Text<\/span><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-plaintext\">21<\/code><\/pre><\/figure><p><em>(설명: 5와 2를 더한 7에 3을 곱하여 21이 됩니다.)<\/em><\/p><div class=\"gap\"><\/div><p><strong>샘플 입력 2<\/strong><\/p><figure class=\"code\" data-bid=\"db3b405e-a79a-40fc-99fc-5357c8f100fa\"><div class=\"code-h\"><span>Plain Text<\/span><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-plaintext\">7\n10 5 2 * - 3 +<\/code><\/pre><\/figure><p><strong>샘플 출력 2<\/strong><\/p><figure class=\"code\" data-bid=\"f98ba8f4-21c7-48c7-a8c3-35470b78cdae\"><div class=\"code-h\"><span>Plain Text<\/span><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-plaintext\">3<\/code><\/pre><\/figure><p><em>(설명: 5와 2를 곱해 10을 만들고, 앞의 10에서 10을 빼서 0이 된 후, 3을 더해 3이 됩니다. 일반 수식으로는 <\/em><em><code>10 - (5 * 2) + 3<\/code><\/em><em>과 같습니다.)<\/em><\/p><\/div><section class=\"sec d3\" id=\"p383713e35a7d80738825ecdf76a06aa2\" data-depth=\"3\"><header class=\"sec-h d3\"><div class=\"crumb\">스택 › 응용 문제: postfix 수식 계산<\/div><h4 class=\"st\">해결 방법<\/h4><\/header><div class=\"sb\"><p>이 문제는 전형적인 스택 문제로, 규칙은 단 두 가지입니다. 수식을 왼쪽부터 오른쪽으로 하나씩 읽으면서:<\/p><ol><li><strong>숫자를 만나면:<\/strong> 무조건 스택에 넣습니다 (Push).<\/li><li><strong>연산자를 만나면:<\/strong> 스택에서 <strong>두 개의 숫자<\/strong>를 꺼내어(Pop) 계산한 뒤, <strong>그 결과를 다시 스택에 넣습니다 (Push).<\/strong> * <em>주의:<\/em> 뺄셈의 경우 먼저 꺼낸 숫자가 뒤로, 나중에 꺼낸 숫자가 앞으로 가야 합니다. (예: 스택에 <code>[10, 5]<\/code>가 있을 때 를 만나면 <code>10 - 5<\/code>를 해야 함)<\/li><\/ol><p>모든 수식 처리가 끝나면, 스택에는 최종 결과값 딱 하나만 남게 됩니다.<\/p><div class=\"gap\"><\/div><figure class=\"code\" data-bid=\"c02082e8-3c8f-4a6e-84f1-056f49f725c5\"><div class=\"code-h\"><span>Python<\/span><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-python\">import sys\n\ndef solve():\n    # 입력 처리\n    N = int(input())\n    tokens = input().split()\n\n    stack = []\n\n    # 수식을 왼쪽부터 오른쪽으로 순회\n    for token in tokens:\n        if token.lstrip(&#x27;-&#x27;).isdigit():\n            # 토큰이 숫자인 경우 (음수 처리 포함) 스택에 추가\n            stack.append(int(token))\n        else:\n            # 토큰이 연산자인 경우 스택에서 두 개의 숫자를 꺼냄\n            # 주의: 나중에 넣은 숫자가 b(오른쪽 피연산자)가 됩니다.\n            b = stack.pop()\n            a = stack.pop()\n\n            # 연산자에 맞게 계산 후 결과를 다시 스택에 추가\n            if token == &#x27;+&#x27;:\n                stack.append(a + b)\n            elif token == &#x27;-&#x27;:\n                stack.append(a - b)\n            elif token == &#x27;*&#x27;:\n                stack.append(a * b)\n\n    # 모든 연산이 끝나면 스택에 남은 유일한 값이 정답\n    print(stack[0])\n\n# 함수 실행\nif __name__ == &quot;__main__&quot;:\n    solve()<\/code><\/pre><\/figure><figure class=\"code extra\" data-bid=\"c02082e8-3c8f-4a6e-84f1-056f49f725c5:x:cpp\"><div class=\"code-h\"><span>C++<\/span><b class=\"xtag\">추가 구현<\/b><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-cpp\">#include &lt;iostream&gt;\n#include &lt;string&gt;\n#include &lt;stack&gt;\nusing namespace std;\n\nint main() {\n    int N;\n    cin &gt;&gt; N;\n    stack&lt;long long&gt; st;\n    for (int i = 0; i &lt; N; i++) {\n        string token;\n        cin &gt;&gt; token;\n        bool is_number = isdigit(token.back());        // &quot;-3&quot;처럼 음수도 마지막 글자는 숫자\n        if (is_number) st.push(stoll(token));\n        else {\n            long long b = st.top(); st.pop();          // 나중에 넣은 값이 오른쪽 피연산자\n            long long a = st.top(); st.pop();\n            if (token == &quot;+&quot;) st.push(a + b);\n            else if (token == &quot;-&quot;) st.push(a - b);\n            else if (token == &quot;*&quot;) st.push(a * b);\n        }\n    }\n    cout &lt;&lt; st.top() &lt;&lt; &quot;\\n&quot;;                          // 남은 하나가 정답\n    return 0;\n}<\/code><\/pre><\/figure><div class=\"gap\"><\/div><h6 class=\"bh bh3\">코드 분석<\/h6><ul><li><strong>시간 복잡도:<\/strong> O(N). 수식을 나타내는 리스트를 딱 한 번만 순회하며, 스택의 <code>push<\/code>와 <code>pop<\/code> 연산은 모두 O(1)의 시간이 걸립니다.<\/li><li><strong>공간 복잡도:<\/strong> O(N). 숫자들만 주어지는 최악의 경우 스택에 모든 숫자가 쌓일 수 있습니다.<\/li><\/ul><\/div><\/section>"}, {"id": "383713e35a7d8003bd52cf4eaebc138d", "title": "응용 문제: 수식 계산 문제의 변형: Twenty Four", "tag": "스택", "html": "<div class=\"sb\"><h6 class=\"bh bh3\">문제 설명 (Problem Statement)<\/h6><p><strong>목표:<\/strong> 주어진 4개의 숫자 카드와 사칙연산(+, -, *, /) 및 괄호를 모두 사용하여 계산했을 때, <strong>24 이하이면서 가장 큰 정수<\/strong>를 구하는 프로그램을 작성하세요.<\/p><p><strong>조건:<\/strong><\/p><ul><li>4개의 카드는 각각 <strong>정확히 한 번씩<\/strong> 사용해야 합니다.<\/li><li>연산 과정에서 나눗셈(<code>/<\/code>)은 <strong>나누어떨어지는 경우(결과가 정수일 때)에만<\/strong> 수행할 수 있습니다. 중간 계산에서 분수나 소수가 나오는 것은 허용되지 않습니다.<\/li><li>계산 결과가 24를 넘으면 안 됩니다.<\/li><\/ul><div class=\"gap\"><\/div><p><strong>입력:<\/strong><\/p><ul><li>첫 줄에 테스트 케이스의 개수 <code>N<\/code> (1에서 5 사이)이 주어집니다.<\/li><li>다음 <code>N<\/code>개의 줄 각각에는 1부터 13 사이의 정수 4개가 공백으로 구분되어 주어집니다.<\/li><\/ul><figure class=\"code\" data-bid=\"383713e3-5a7d-80b9-a8e3-dbf12789d7c2\"><div class=\"code-h\"><span>Python<\/span><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-python\">3\n3\n3\n3\n3\n1\n1\n1\n1\n12\n5\n13\n1<\/code><\/pre><\/figure><p><strong>출력:<\/strong><\/p><ul><li>각 테스트 케이스마다 4개의 숫자를 조합해 만들 수 있는 24 이하의 최대 정수 결과값을 한 줄에 하나씩 출력합니다.<\/li><\/ul><figure class=\"code\" data-bid=\"383713e3-5a7d-8009-903c-fb98bd466f58\"><div class=\"code-h\"><span>Python<\/span><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-python\">24\n4\n21<\/code><\/pre><\/figure><\/div><section class=\"sec d3\" id=\"p383713e35a7d80329a0cd64e4f5a02c0\" data-depth=\"3\"><header class=\"sec-h d3\"><div class=\"crumb\">스택 › 응용 문제: 수식 계산 문제의 변형: Twenty Four<\/div><h4 class=\"st\">해결 방법(back tracking)<\/h4><\/header><div class=\"sb\"><p>이 문제는 입력의 크기가 매우 작기 때문에(카드 딱 4장), 모든 경우의 수를 탐색하는 <strong>완전 탐색(Brute Force)<\/strong> 계열의 알고리즘으로 해결할 수 있습니다. <\/p><p><strong>방법 1: 백트래킹을 이용한 배열 축소 (DFS / Array Reduction)<\/strong><br>가장 직관적이고 구현이 쉬운 방법입니다. <br>괄호의 위치를 신경 쓸 필요 없이, &quot;4개의 숫자 중 2개를 뽑아 연산하고, 그 결과를 남은 숫자들과 합쳐 다시 새로운 집합을 만드는 과정&quot;을 반복합니다.<br><\/p><p><strong>동작 방식:<\/strong><br>    1. 현재 배열에 K개의 숫자가 있습니다. (초기 K=4)<br>    2. 서로 다른 두 숫자 A와 B를 선택하여 배열에서 뺍니다.<br>    3. A+B, A-B, A * B, A/B (단, A 나머지 B == 0일 때만)를 계산하고, 그 결과를 배열에 추가합니다 (K가 1개 줄어듭니다).<br>    4. 배열의 길이가 1이 될 때까지 이 과정을 재귀적으로 반복합니다.<br>    5. 마지막 남은 1개의 값이 24 이하라면 최대값을 갱신합니다.<br><\/p><p><strong>특징:<\/strong> 숫자 두 개를 합치는 순서 자체가 괄호를 씌우는 행위와 동일하게 동작하기 때문에, 연산자 우선순위나 괄호를 처리하는 복잡한 로직이 통째로 생략됩니다.<\/p><div class=\"gap\"><\/div><figure class=\"code\" data-bid=\"383713e3-5a7d-8009-9597-e38aa7f175a2\"><div class=\"code-h\"><span>Python<\/span><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-python\">import sys\n\ndef solve():\n       \n    N = int(input())\n    idx = 1\n    \n    for _ in range(N):\n        # 4개의 숫자 카드를 리스트로 받습니다\n        cards = [int(input()) for i in range(4)]\n        idx += 4\n        \n        max_val = -float(&#x27;inf&#x27;)\n        \n        # DFS 백트래킹 함수 정의\n        def dfs(current_nums):\n            nonlocal max_val\n            \n            # 숫자가 하나만 남았을 때 (모든 연산 종료)\n            if len(current_nums) == 1:\n                val = current_nums[0]\n                # 결과가 24 이하인 경우에만 최대값 갱신\n                if val &lt;= 24 and val &gt; max_val:\n                    max_val = val\n                return\n            \n            # 현재 배열에서 임의의 서로 다른 두 숫자 선택\n            for i in range(len(current_nums)):\n                for j in range(len(current_nums)):\n                    if i != j:\n                        a = current_nums[i]\n                        b = current_nums[j]\n                        \n                        # 선택한 두 숫자를 제외한 나머지 숫자들만 모은 새로운 리스트\n                        next_nums = [current_nums[k] for k in range(len(current_nums)) if k != i and k != j]\n                        \n                        # 두 숫자를 연산한 결과를 리스트에 더해 재귀 호출\n                        dfs(next_nums + [a + b])\n                        dfs(next_nums + [a - b])\n                        dfs(next_nums + [a * b])\n                        \n                        # 문제의 특수 조건: 나누어 떨어질 때만 나눗셈 허용 (그리고 0으로 나누기 방지)\n                        if b != 0 and a % b == 0:\n                            dfs(next_nums + [a // b])\n        \n        # 탐색 시작\n        dfs(cards)\n        print(max_val)\n\n&quot;&quot;&quot;\nSample Input\n3\n3\n3\n3\n3\n1\n1\n1\n1\n12\n5\n13\n1\n\nOutput for Sample Input\n24\n4\n21\n&quot;&quot;&quot;\n\nsolve()\n\n\n<\/code><\/pre><\/figure><figure class=\"code extra\" data-bid=\"383713e3-5a7d-8009-9597-e38aa7f175a2:x:cpp\"><div class=\"code-h\"><span>C++<\/span><b class=\"xtag\">추가 구현<\/b><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-cpp\">#include &lt;iostream&gt;\n#include &lt;vector&gt;\n#include &lt;climits&gt;\nusing namespace std;\n\nint max_val;\n\nvoid dfs(const vector&lt;int&gt;&amp; current_nums) {\n    if (current_nums.size() == 1) {                    // 숫자가 하나 남으면 연산 끝\n        int val = current_nums[0];\n        if (val &lt;= 24 &amp;&amp; val &gt; max_val) max_val = val; // 24 이하 중 최대\n        return;\n    }\n    int n = current_nums.size();\n    for (int i = 0; i &lt; n; i++)\n        for (int j = 0; j &lt; n; j++) {\n            if (i == j) continue;\n            int a = current_nums[i], b = current_nums[j];\n            vector&lt;int&gt; next_nums;                     // 고른 두 수를 뺀 나머지\n            for (int k = 0; k &lt; n; k++) if (k != i &amp;&amp; k != j) next_nums.push_back(current_nums[k]);\n            for (int r : {a + b, a - b, a * b}) {\n                next_nums.push_back(r);\n                dfs(next_nums);\n                next_nums.pop_back();                  // 백트래킹\n            }\n            if (b != 0 &amp;&amp; a % b == 0) {                // 나누어떨어질 때만 나눗셈\n                next_nums.push_back(a / b);\n                dfs(next_nums);\n                next_nums.pop_back();\n            }\n        }\n}\n\nint main() {\n    int N;\n    cin &gt;&gt; N;\n    for (int t = 0; t &lt; N; t++) {\n        vector&lt;int&gt; cards(4);\n        for (int&amp; c : cards) cin &gt;&gt; c;\n        max_val = INT_MIN;\n        dfs(cards);\n        cout &lt;&lt; max_val &lt;&lt; &quot;\\n&quot;;\n    }\n    return 0;\n}<\/code><\/pre><\/figure><\/div><\/section>"}, {"id": "3ea713e35a7d80ea9c68e6b0bd2985ee", "title": "응용 문제: Escape Room", "tag": "큐", "html": "<div class=\"sb\"><aside class=\"callout\"><span class=ic aria-hidden=true>💡<\/span><div class=\"cb\"><p>CCC Senior 2020, #2<\/p><\/div><\/aside><h5 class=\"bh bh2\">문제 J5/S2: 방 탈출 (Escape Room)<\/h5><h6 class=\"bh bh4\">문제 설명<\/h6><p>당신은 어떤 방에서 탈출하는 것이 가능한지 여부를 판단해야 합니다. 방은 양의 정수가 적힌 M * N 크기의 격자판으로 이루어져 있습니다. 행은 1, 2, …, M으로, 열은 1, 2, …, N으로 번호가 매겨져 있습니다. r행 c열에 위치한 칸은 (r, c)로 표기합니다.<\/p><p>당신은 맨 왼쪽 위 칸인 (1, 1)에서 시작하여 맨 오른쪽 아래 칸인 (M, N)으로 탈출해야 합니다. 만약 현재 위치한 칸에 값 x가 적혀 있다면, <strong>a * b = x를 만족하는 임의의 칸 (a, b)로 점프<\/strong>할 수 있습니다.<\/p><p>예를 들어, 현재 위치한 칸에 6이 적혀 있다면 (2, 3) 칸으로 점프할 수 있습니다. 만약 방의 크기가 5 * 6 격자라면, 6이 적힌 칸에서는 최대 4개의 칸 (2, 3), (3, 2), (1, 6), (6, 1)로 점프할 수 있습니다. (단, 이 방은 5행까지밖에 없으므로 6행인 (6, 1)은 존재하지 않아 실제로는 앞의 3개 칸으로만 점프가 가능합니다.)<\/p><h6 class=\"bh bh4\">입력 형식<\/h6><ul><li>첫 번째 줄에는 행의 개수를 나타내는 정수 M이 주어집니다 (1 ≤ M ≤ 1000).<\/li><li>두 번째 줄에는 열의 개수를 나타내는 정수 N이 주어집니다 (1 ≤ N ≤ 1000).<\/li><li>나머지 입력은 M개의 행과 N개의 열로 구성된 격자판의 양의 정수들입니다. 총 M개의 줄에 걸쳐 각 줄마다 N개의 양의 정수가 공백으로 구분되어 주어집니다. (각 칸의 정수는 1,000,000 이하입니다.)<\/li><\/ul><h6 class=\"bh bh4\">출력 형식<\/h6><ul><li>방을 탈출하는 것이 가능하면 <code>yes<\/code>를, 불가능하면 <code>no<\/code>를 출력합니다.<\/li><\/ul><h6 class=\"bh bh4\">입출력 예시<\/h6><figure class=\"code\" data-bid=\"b0540965-727e-477b-9163-a2a1eebc4425\"><div class=\"code-h\"><span>Plain Text<\/span><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-plaintext\">3\n4\n3 10  8 14\n1 11 12 12\n6  2  3  9<\/code><\/pre><\/figure><p><strong>출력 예시<\/strong><\/p><figure class=\"code\" data-bid=\"00cc0d78-4516-4a09-85fc-3cddc66b8aca\"><div class=\"code-h\"><span>Plain Text<\/span><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-plaintext\">yes<\/code><\/pre><\/figure><blockquote><strong>예시 설명:<\/strong><ol><li>(1, 1)에서 시작합니다. 칸의 값은 3입니다.<\/li><li>3의 약수 조합으로 점프할 수 있는 칸 중 하나인 (3, 1)로 이동합니다. (3 * 1 = 3)<\/li><li>(3, 1) 칸의 값은 6입니다.<\/li><li>6의 약수 조합 중 하나인 (2, 3)으로 이동합니다. (2 * 3 = 6)<\/li><li>(2, 3) 칸의 값은 12입니다.<\/li><li>12의 약수 조합 중 하나인 (3, 4)로 이동합니다. (3 * 4 = 12)<\/li><li>(3, 4)는 목적지인 (M, N)이므로 탈출에 성공합니다! (<code>yes<\/code>)<\/li><\/ol><\/blockquote><div class=\"gap\"><\/div><p><strong>테스트 용 대용량 데이터<\/strong><\/p><div class=\"file\"><span class=\"fi\" aria-hidden=\"true\">📎<\/span><span class=\"fn\"><b>2020_2.in<\/b><small>6.4 MiB · 첨부 파일은 원본 노션에서 받을 수 있습니다<\/small><\/span><a class=\"btn btn-weak sm\" href=\"https://unibookco.notion.site/3ea713e35a7d80ea9c68e6b0bd2985ee\" target=\"_blank\" rel=\"noopener\">노션 열기 ↗<\/a><\/div><div class=\"file\"><span class=\"fi\" aria-hidden=\"true\">📎<\/span><span class=\"fn\"><b>2020_2.out<\/b><small>4 B · 첨부 파일은 원본 노션에서 받을 수 있습니다<\/small><\/span><a class=\"btn btn-weak sm\" href=\"https://unibookco.notion.site/3ea713e35a7d80ea9c68e6b0bd2985ee\" target=\"_blank\" rel=\"noopener\">노션 열기 ↗<\/a><\/div><div class=\"gap\"><\/div><\/div><section class=\"sec d3\" id=\"p3ea713e35a7d8010a504e5e6fcc063c6\" data-depth=\"3\"><header class=\"sec-h d3\"><div class=\"crumb\">큐 › 응용 문제: Escape Room<\/div><h4 class=\"st\">해결 방법<\/h4><\/header><\/section>"}, {"id": "3fb713e35a7d80fcb5a3f91bd20a123e", "title": "응용 문제: Harvest", "tag": "큐", "html": "<div class=\"sb\"><aside class=\"callout\"><span class=ic aria-hidden=true>💡<\/span><div class=\"cb\"><p>CCC Junior 2024, #5<\/p><\/div><\/aside><h5 class=\"bh bh2\"><strong>문제 J5: 하베스트 (Harvest)<\/strong><\/h5><h6 class=\"bh bh3\"><strong>문제 설명<\/strong><\/h6><p>하베스트 워털루라는 엄청나게 인기 있는 새로운 수확 시뮬레이션 게임이 있습니다. 이 게임은 건초더미와 다양한 크기의 호박들이 들어 있는 직사각형 호박 밭에서 진행됩니다. 게임을 시작할 때, 농부는 특정 호박의 위치에 배치됩니다.<\/p><p>농부는 밭 전체에서 왼쪽, 오른쪽, 위쪽, 아래쪽으로 이동하여 자신이 도달할 수 있는 모든 호박을 수확합니다. 농부는 대각선으로 이동할 수 없습니다. 또한, 농부는 건초더미를 통과하거나 밭 밖으로 나갈 수 없습니다.<\/p><p>여러분의 임무는 농부가 수확한 모든 호박의 총가치를 구하는 것입니다. 작은 호박은 $1, 중간 호박은 $5, 큰 호박은 $10의 가치를 가집니다.<\/p><h6 class=\"bh bh3\"><strong>입력 형식 (Input Specification)<\/strong><\/h6><ul><li>첫 번째 줄에는 밭의 행 개수를 나타내는 정수 R &gt; 0이 주어집니다.<\/li><li>두 번째 줄에는 밭의 열 개수를 나타내는 정수 C &gt; 0이 주어집니다.<\/li><li>다음 $R$개의 줄은 밭의 상태를 설명합니다. 각 줄은 C개의 문자를 포함하며, 각 문자는 호박의 크기 또는 건초더미를 나타냅니다. 작은 호박은 <code>S<\/code>, 중간 호박은 <code>M<\/code>, 큰 호박은 <code>L<\/code>, 건초 더미는 <code>*<\/code>로 표시됩니다.<\/li><li>그 다음 줄에는 <span class=\"mx\" data-tex=\"0 \\le A &lt; R\">0 \\le A &lt; R<\/span>인 정수 A가 주어지고, 마지막 줄에는 <span class=\"mx\" data-tex=\"0 \\le B &lt; C\">0 \\le B &lt; C<\/span>인 정수 B가 주어집니다. 행 A와 열 B는 농부의 시작 위치이며, 밭의 맨 왼쪽 위 모퉁이는 행 0, 열 0입니다.<\/li><\/ul><h6 class=\"bh bh3\"><strong>출력 형식 (Output Specification)<\/strong><\/h6><ul><li>농부가 수확한 모든 호박의 총가치(달러)를 나타내는 정수 V를 출력합니다.<\/li><\/ul><h6 class=\"bh bh3\"><strong>입출력 예시<\/strong><\/h6><h6 class=\"bh bh4\"><strong>예제 입력 1<\/strong><\/h6><figure class=\"img\" style=\"max-width:409px\"><img src=\"img/3fb713e3385d.webp\" alt=\"그림\" loading=\"lazy\" decoding=\"async\" width=\"426\" height=\"335\"><\/figure><figure class=\"code\" data-bid=\"e8d9c1de-bc19-4138-a641-1a9eb051b22b\"><div class=\"code-h\"><span>Plain Text<\/span><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-plaintext\">6\n6\n**LMLS\nS*LMMS\nS*SMSM\n******\nLLM*MS\nSSL*SS\n5\n1<\/code><\/pre><\/figure><h6 class=\"bh bh4\"><strong>예제 출력 1<\/strong><\/h6><figure class=\"code\" data-bid=\"bad53149-7585-4c9d-acde-e8d93e72a4fa\"><div class=\"code-h\"><span>Plain Text<\/span><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-plaintext\">37<\/code><\/pre><\/figure><div class=\"gap\"><\/div><h6 class=\"bh bh4\"><strong>예제 1 설명<\/strong><\/h6><p>행 5, 열 1에서 시작하여 농부는 강조 표시된 구역에 있는 6개의 호박에 도달할 수 있습니다. 작은 호박 2개, 중간 호박 1개, 큰 호박 3개를 수확합니다. 이 수확의 총가치는 <span class=\"mx\" data-tex=\"2 \\times 1 + 1 \\times 5 + 3 \\times 10 = 37\">2 \\times 1 + 1 \\times 5 + 3 \\times 10 = 37<\/span>달러입니다.<\/p><div class=\"gap\"><\/div><p><strong>테스트 용 대용량 데이터<\/strong><\/p><div class=\"file\"><span class=\"fi\" aria-hidden=\"true\">📎<\/span><span class=\"fn\"><b>2024_j5.zip<\/b><small>392.1 KiB · 첨부 파일은 원본 노션에서 받을 수 있습니다<\/small><\/span><a class=\"btn btn-weak sm\" href=\"https://unibookco.notion.site/3fb713e35a7d80fcb5a3f91bd20a123e\" target=\"_blank\" rel=\"noopener\">노션 열기 ↗<\/a><\/div><\/div>"}]}]};
const $ = s => document.querySelector(s);
const esc = Gen.esc;
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
const newSeed = () => (Math.random() * 2 ** 31) >>> 0;

/* ---------- tabs ---------- */
let TAB = store.get('ex-tab2', 'exam');
let SAMPLE = null;
const TABS = () => ['exam', 'theory', 'exer', ...(SAMPLE ? ['ai'] : [])];
function setTab(t) { if (!TABS().includes(t)) t = 'exam'; TAB = t; store.set('ex-tab2', t); document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === t)); ['exam', 'theory', 'exer', 'ai'].forEach(x => $('#v-' + x).hidden = x !== t); if (t === 'exer' && !$('#v-exer').dataset.built) renderExer(); if (t === 'theory' && !$('#v-theory').dataset.built) renderTheory(); if (t === 'exam' && !$('#v-exam').dataset.built) renderSetup(); if (t === 'ai' && !$('#v-ai').dataset.built) renderAI(); }
document.querySelector('.tabs').onclick = e => { const b = e.target.closest('button'); if (b) setTab(b.dataset.t); };

/* ---------- problem card (shared by trace + exam) ---------- */
function problemHTML(p, opts = {}) {
  const small = p.fields.every(f => f.small);
  const figs = [p.fig && `<div class="fig">${p.figCap ? `<small>${esc(p.figCap)}</small>` : ''}${p.fig}</div>`].filter(Boolean).join('');
  return `<div class="ph"><span class="tg">${esc(p.ch)}</span>${opts.tag ? `<span class="tp">${opts.tag}</span>` : ''}<h2>${esc(p.title)}</h2></div>
    <div class="intro">${p.intro}</div>${figs ? `<div class="figs">${figs}</div>` : ''}
    <div class="fields${small ? ' small' : ''}">${p.fields.map((f, i) => `<div class="fld" data-i="${i}"><label for="f${opts.id || ''}${i}">${esc(f.label)}</label><input id="f${opts.id || ''}${i}" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false"><div class="ans">${esc(Gen.show(f))}</div></div>`).join('')}</div>
    <p class="hint">쉼표나 공백으로 구분해서 쓰면 됩니다. 빈 칸은 <code>_</code> 또는 None.</p>`;
}
function stepsHTML(p) {
  const figs = [p.fig2 && `<div class="fig">${p.fig2Cap ? `<small>${esc(p.fig2Cap)}</small>` : ''}${p.fig2}</div>`].filter(Boolean).join('');
  return `<div class="steps"><b class="h">풀이 과정</b><ol>${p.steps.map(s => `<li>${s}</li>`).join('')}</ol>${figs ? `<div class="figs">${figs}</div>` : ''}</div>`;
}
function grade(card, p) {
  let ok = 0;
  card.querySelectorAll('.fld').forEach(el => { const f = p.fields[+el.dataset.i]; const good = Gen.check(f, el.querySelector('input').value); el.classList.toggle('ok', good); el.classList.toggle('no', !good); if (good) ok++; });
  return ok;
}

/* ---------- 이론 문제 ---------- */
/* 객관식 보기 순서를 섞어서 출제 (정답 번호가 매번 달라짐) */
function shuffleQ(q, rand = Math.random) {
  if (q.t !== 'mc') return q;
  const perm = q.o.map((_, i) => i);
  for (let i = perm.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [perm[i], perm[j]] = [perm[j], perm[i]]; }
  return { ...q, o: perm.map(i => q.o[i]), a: perm.indexOf(q.a), src: q };
}
const normA = s => String(s).toLowerCase().replace(/[²]/g, '2').replace(/[³]/g, '3').replace(/ⁿ/g, 'n').replace(/[\s\[\]\^]/g, '').replace(/₂/g, '2');
function theoryBody(q, pre) {
  const qs = esc(q.q).replace(/\n/g, '<br>');
  const code = q.q.includes('\n') ? `<h2 class="thq">${esc(q.q.split('\n')[0])}</h2><pre class="thc">${esc(q.q.split('\n').slice(1).join('\n'))}</pre>` : `<h2 class="thq">${qs}</h2>`;
  let ui = '';
  if (q.t === 'mc') ui = `<div class="opts">${q.o.map((o, k) => `<button type="button" class="opt" data-k="${k}"><span class="on">${'①②③④⑤'[k]}</span> ${esc(o)}</button>`).join('')}</div>`;
  if (q.t === 'ox') ui = `<div class="oxs"><button type="button" class="opt ox" data-k="O">O</button><button type="button" class="opt ox" data-k="X">X</button></div>`;
  if (q.t === 'short') ui = `<div class="sh"><input id="th${pre}" type="text" autocomplete="off" spellcheck="false" placeholder="답 입력" aria-label="답"><button type="button" class="btn pri" data-sh>확인</button></div>`;
  return code + ui + `<div class="thex" hidden></div>`;
}
function revealTheory(box, q, ok, chosen) {
  if (q.t === 'mc') box.querySelectorAll('.opt').forEach(o => { o.disabled = true; const k = +o.dataset.k; if (k === q.a) o.classList.add('ok'); else if (k === chosen) o.classList.add('no'); });
  if (q.t === 'ox') box.querySelectorAll('.opt').forEach(o => { o.disabled = true; if (o.dataset.k === q.a) o.classList.add('ok'); else if (o.dataset.k === chosen) o.classList.add('no'); });
  if (q.t === 'short') { const inp = box.querySelector('.sh input'); inp.disabled = true; inp.parentElement.classList.add(ok ? 'ok' : 'no'); const b = box.querySelector('[data-sh]'); if (b) b.hidden = true; }
  const ex = box.querySelector('.thex'); ex.hidden = false;

let EX = null;
function buildTheory(r, topic) {
  const pool = THEORY.filter(q => q.tp === topic); if (!pool.length) return null;
  const base = pool[Math.floor(r() * pool.length)];

  return { type: 'th', topic, th, base, title: base.q.split('\n')[0], ch: base.ch };
}
function buildFill(r, topic) {
  const re = TOPIC_MAP[topic].fill;
  const pool = FILL.filter(p => re.test(p.ch) && (ES.lang === 'both' || p.lang === ES.lang)); if (!pool.length) return null;
  const p = pool[Math.floor(r() * pool.length)];
  const core = p.core; const fn = core[Math.floor(r() * core.length)];
  return { type: 'fill', topic, p, fn, title: `메서드 ${fn}() 본문 쓰기`, ch: p.chs };
}

}

  refused: '이 조건으로는 출제가 안 됐어. 추가 요청을 바꿔서 다시 해 봐.',
  empty_completion: '빈 응답이 왔어. 개수를 줄이거나 조건을 바꿔 봐.',
  prompt_too_large: '고른 단원이 너무 많아. 단원을 줄여 줘.',
};
const AI_OFF = ['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'];

function aiPrompt() {
  const chs = AIREF.filter(c => AS.chs.includes(c.id));
  const budget = Math.floor(90000 / chs.length);
  const ref = chs.map(c => {
    let t = `### ${c.name}\n${c.ref}`;
    if (c.codes.length) t += `\n\n[교재 C++ 코드 예시]\n` + c.codes.slice(0, 3).map(x => '```cpp\n' + x + '\n```').join('\n');
    return t.slice(0, budget);
  }).join('\n\n');
  const tw = { trace: '상태 추적·단답(short)', fill: '코드 빈칸(fill)', mc: '객관식(mc)', essay: '서술형(essay)' };
  const lv = ['기본: 교재 예제 수준, 개념 확인', '실전: 실제 중간·기말 시험 수준. 데이터를 주고 연산 결과를 추적하게 하거나 메서드 본문 핵심 줄을 비움', '고난도: 여러 연산을 섞거나 경계 조건(빈 구조, 가득 참, 루트 삭제, 자식 둘인 노드 삭제 등)을 노림'][AS.lvl];
  const hist = AIHIST.slice(-20);
  return `너는 대학 2학년 「자료구조」 과목 교수야. 아래 [교재 요약]만 근거로 시험 문제 ${AS.n}개를 한국어로 출제해.

[교수님 출제 스타일]
- 데이터를 주고 자료구조를 주고, 실제로 어떻게 동작하는지(연산 후 상태, 출력, 순회 결과 등)를 묻는다.
- 특정 메서드 본문을 비워 두고 채워 넣게 한다. 코드는 C++.
- 기본적인 메서드 동작 원리 이해를 확인한다. 암기형 말장난, 지엽적인 문제는 내지 않는다.

[출제 범위 — 반드시 지켜]
- 단원: ${chs.map(c => c.name).join(', ')}
- 교재 요약에 없는 내용, [참고]·[중급] 내용(보간 탐색, AVL, 트라이, 분할상환 분석, 점화식, 꼬리 재귀, 중위→후위 변환 등), 정렬·선택 단원(6·7장), 신장 트리·크루스칼·Union-Find는 절대 내지 않는다.
- 교재 관례를 따른다: 힙은 1번 인덱스부터 쓰는 배열 기반 최대 힙(따로 말하지 않으면), 원형 큐는 한 칸을 비워 가득 참을 구분(front==rear면 공백, (rear+1)%cap==front면 포화), BST 삭제에서 자식이 둘이면 오른쪽 서브트리의 최솟값(중위 후속자)으로 대체, 트리의 레벨/높이 정의는 교재 요약대로, 그래프 탐색에서 인접 정점이 여럿이면 번호(알파벳)가 작은 정점부터 방문.

[난이도] ${lv}
[유형] ${AS.types.map(t => tw[t]).join(', ')} 중에서 고루 섞어.
${AS.extra.trim() ? `[학생 추가 요청] ${AS.extra.trim().slice(0, 300)}\n` : ''}${hist.length ? `[최근에 이미 낸 문제 — 겹치지 않게 다른 데이터·다른 메서드로]\n${hist.map(h => '- ' + h).join('\n')}\n` : ''}
[각 유형 규칙]
- short: 데이터와 연산 순서를 주고 결과를 한 줄로 쓰게 한다. 답 쓰는 형식을 문제에 명시(예: "공백으로 구분해 앞에서부터 쓰시오"). a에는 허용 정답 문자열 배열(표기만 다른 동치 답 포함).
- fill: code에 교재 스타일 C++ 클래스/함수를 주고 빈칸을 [[1]], [[2]] … 로 표시(최대 3개, 각 빈칸은 식이나 한 줄). a에는 빈칸 순서대로 정답 문자열 배열.
- mc: 보기 4개(o), a는 정답 인덱스(0~3). 정답이 하나뿐이도록.
- essay: 2~4문장으로 답할 서술형. a에는 모범 답안 문자열, ex에 채점 기준.
- 모든 문제의 ex에는 풀이 과정을 단계별로(상태 추적이면 연산마다 상태 변화) 쓴다.
- 데이터는 매번 새로 만든다(작은 정수 5~9개 정도). 출제 전에 반드시 직접 끝까지 추적해서 정답이 맞는지 검산한다.

[출력 형식] 다른 말 없이 JSON 하나만:
{"questions":[{"type":"short|fill|mc|essay","ch":"8장","topic":"원형 큐","q":"문제 본문(줄바꿈은 \\n)","code":"코드나 데이터(없으면 빈 문자열)","o":["보기",...],"a":...,"ex":"풀이"}]}

[교재 요약]
${ref}`;
}

function aiValid(q) {
  if (!q || typeof q !== 'object' || typeof q.q !== 'string' || !q.q.trim()) return null;
  const t = q.type; const base = { type: t, ch: String(q.ch || ''), topic: String(q.topic || ''), q: q.q, code: typeof q.code === 'string' ? q.code : '', ex: String(q.ex || '') };
  if (t === 'mc') { if (!Array.isArray(q.o) || q.o.length < 3 || !Number.isInteger(+q.a) || +q.a < 0 || +q.a >= q.o.length) return null; return shuffleQ({ ...base, t: 'mc', o: q.o.map(String), a: +q.a }); }
  if (t === 'short') { const a = (Array.isArray(q.a) ? q.a : [q.a]).filter(x => x != null && String(x).trim()).map(String); return a.length ? { ...base, a } : null; }
  if (t === 'fill') { const a = (Array.isArray(q.a) ? q.a : [q.a]).map(x => String(x ?? '')); const n = (base.code.match(/\[\[\d+\]\]/g) || []).length; return a.length && n ? { ...base, a: a.slice(0, Math.max(n, 1)) } : null; }
  if (t === 'essay') { return q.a ? { ...base, a: String(q.a) } : null; }
  return null;
}

const normT = s => normA(s).replace(/[,;'"`]/g, '').replace(/->|→/g, '>');
const normC = s => String(s).replace(/\s+/g, '').replace(/;+$/, '').replace(/this->/g, '');
const codeHTML = c => esc(c).replace(/\[\[(\d+)\]\]/g, '<span class="blk">($1)</span>');

function aiCardHTML(q, i) {
  const tag = { short: '상태 추적·단답', fill: '코드 빈칸', mc: '객관식', essay: '서술형' }[q.type];
  let ui = '';
  if (q.type === 'mc') ui = `<div class="opts">${q.o.map((o, k) => `<button type="button" class="opt" data-k="${k}"><span class="on">${'①②③④⑤'[k]}</span> ${esc(o)}</button>`).join('')}</div>`;
  if (q.type === 'short') ui = `<div class="sh"><input type="text" autocomplete="off" spellcheck="false" placeholder="답 입력" aria-label="답"><button type="button" class="btn pri" data-go>확인</button></div>`;
  if (q.type === 'fill') ui = `<div class="aifl">${q.a.map((_, k) => `<div class="fld" data-k="${k}"><label for="ai${i}f${k}">(${k + 1})</label><input id="ai${i}f${k}" type="text" autocomplete="off" spellcheck="false" autocapitalize="off"><div class="ans">${esc(q.a[k])}</div></div>`).join('')}</div><div class="row"><button type="button" class="btn pri" data-go>채점</button><button type="button" class="btn" data-skip>모르겠음</button></div>`;
  if (q.type === 'essay') ui = `<textarea class="ait" aria-label="답안" placeholder="답안을 써 봐"></textarea><div class="row"><button type="button" class="btn pri" data-grade>AI 채점</button><button type="button" class="btn" data-skip>모범 답안 보기</button></div>`;
  return `<article class="pcard" data-i="${i}"><div class="ph"><span class="tg">${esc(q.ch)}</span><span class="tp">${tag}</span>${q.topic ? `<span class="tp">${esc(q.topic)}</span>` : ''}</div>
    <p class="aiq">${i + 1}. ${esc(q.q)}</p>${q.code ? `<pre class="aicode">${codeHTML(q.code)}</pre>` : ''}${ui}
    <div class="thex aiex" hidden></div><div class="aigr" hidden></div></article>`;
}

function exHTML(q, ok) {
  const head = ok === undefined ? '' : `<b class="${ok ? 'ok' : 'no'}">${ok ? '정답' : '오답'}</b> `;
  const ans = q.type === 'mc' ? '' : q.type === 'short' ? `답: <code>${esc(q.a[0])}</code>\n` : q.type === 'fill' ? q.a.map((a, k) => `(${k + 1}) <code>${esc(a)}</code>`).join('  ') + '\n' : `모범 답안: ${esc(q.a)}\n`;
  return head + ans + esc(q.ex).replace(/```(?:\w+)?\n?([\s\S]*?)```/g, (_, c) => `<pre>${c}</pre>`);
}

async function aiGrade(card, q, answer) {
  const gr = card.querySelector('.aigr'); gr.hidden = false; gr.innerHTML = '<span class="aistat"><span class="dot"></span>채점 중…</span>';
  try {
    const r = await SAMPLE.json(`자료구조 시험 채점자로서 학생 답을 채점해. 표현이 달라도 의미·동작이 같으면 정답으로 인정해.
문제: ${q.q}\n${q.code ? '코드/데이터:\n' + q.code + '\n' : ''}모범 답안: ${Array.isArray(q.a) ? q.a.map((a, k) => `(${k + 1}) ${a}`).join(' ') : q.a}\n채점 기준·풀이: ${q.ex}\n학생 답: ${answer}
JSON 하나만: {"ok": true|false, "score": 0~100 정수, "feedback": "한국어 반말 2~3문장, 틀린 부분과 고칠 점"}`, { cache: false });
    const ok = !!r.ok;
    gr.innerHTML = `<b class="res ${ok ? 'ok' : 'no'}">AI 채점: ${ok ? '정답' : '오답'}${Number.isFinite(+r.score) ? ` (${+r.score}점)` : ''}</b>\n${esc(String(r.feedback || ''))}`;
    return ok;
  } catch (e) {
    if (AI_OFF.includes(e.code)) aiOff();
    gr.innerHTML = e.code === 'cancelled' ? '' : `<span class="aistat err">${esc(AI_ERR[e.code] || '채점 중 오류가 났어. 다시 눌러 줘.')}</span>`;
    return null;
  }
}

function wireAI(card, q) {
  const ex = card.querySelector('.aiex');
  const reveal = ok => { ex.hidden = false; ex.innerHTML = exHTML(q, ok); };
  if (q.type === 'mc') card.querySelectorAll('.opt').forEach(o => o.onclick = () => { const k = +o.dataset.k; card.querySelectorAll('.opt').forEach(x => { x.disabled = true; const j = +x.dataset.k; if (j === q.a) x.classList.add('ok'); else if (j === k) x.classList.add('no'); }); reveal(k === q.a); });
  if (q.type === 'short') {
    const inp = card.querySelector('.sh input'), go = card.querySelector('[data-go]');
    const run = () => { if (!inp.value.trim()) return; const ok = q.a.some(a => normT(a) === normT(inp.value)); inp.disabled = true; go.hidden = true; inp.parentElement.classList.add(ok ? 'ok' : 'no'); reveal(ok); if (!ok) { const b = document.createElement('button'); b.type = 'button'; b.className = 'btn'; b.textContent = '내 답도 맞는지 AI에게 물어보기'; b.style.marginTop = '10px'; b.onclick = () => { b.remove(); aiGrade(card, q, inp.value); }; ex.after(b); } };
    go.onclick = run; inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); run(); } });
  }
  if (q.type === 'fill') {
    const flds = [...card.querySelectorAll('.aifl .fld')];
    const done = ok => { flds.forEach(f => f.querySelector('input').disabled = true); card.querySelector('.row').hidden = true; reveal(ok); };
    card.querySelector('[data-go]').onclick = () => {
      let all = true; flds.forEach(f => { const k = +f.dataset.k; const good = normC(f.querySelector('input').value) === normC(q.a[k]); f.classList.toggle('ok', good); f.classList.toggle('no', !good); if (!good) all = false; });
      done(all);
      if (!all) { const b = document.createElement('button'); b.type = 'button'; b.className = 'btn'; b.textContent = '다르게 썼는데 맞는지 AI에게 물어보기'; b.style.marginTop = '10px'; b.onclick = () => { b.remove(); aiGrade(card, q, flds.map((f, k) => `(${k + 1}) ${f.querySelector('input').value}`).join(' ')); }; ex.after(b); }
    };
    card.querySelector('[data-skip]').onclick = () => { card.classList.add('reveal'); flds.forEach(f => f.classList.add('no')); done(false); };
    card.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); const ins = flds.map(f => f.querySelector('input')); const i = ins.indexOf(e.target); if (i < ins.length - 1) ins[i + 1].focus(); else card.querySelector('[data-go]').click(); } });
  }
  if (q.type === 'essay') {
    const ta = card.querySelector('.ait');
    card.querySelector('[data-grade]').onclick = async ev => { if (!ta.value.trim()) { ta.focus(); return; } ev.target.disabled = true; const ok = await aiGrade(card, q, ta.value); ev.target.disabled = false; if (ok !== null) reveal(); };
    card.querySelector('[data-skip]').onclick = () => reveal();
  }
}

function aiOff() {
  AIDEAD = true;
  const st = $('#aiSt'); if (st) { st.className = 'aistat err'; st.textContent = '이 화면에서는 AI 출제를 쓸 수 없어. (허용을 거절했거나 계정에서 꺼져 있어)'; }
  const g = $('#aiGo'); if (g) g.disabled = true;
}

function renderAIList() {
  const box = $('#aiList'); if (!box) return;
  box.innerHTML = AIQ.map((q, i) => aiCardHTML(q, i)).join('');
  box.querySelectorAll('.pcard').forEach(c => wireAI(c, AIQ[+c.dataset.i]));
}

function renderAI() {
  const v = $('#v-ai'); v.dataset.built = '1';
  v.innerHTML = `<div class="aibox">
    <p class="ainote">Claude가 시험 범위(교재 요약) 안에서 매번 새 데이터로 문제를 만들어 줘. 네 claude.ai 계정 사용량을 쓰고, 처음 누를 때 허용할지 물어봐. AI가 만든 문제라 가끔 틀릴 수 있으니 이상하면 교재로 확인해.</p>
    <div><h3>단원</h3><div class="chips" id="aiCh" style="flex-wrap:wrap">${AIREF.map(c => `<button type="button" class="chip${AS.chs.includes(c.id) ? ' on' : ''}" data-c="${c.id}">${esc(c.name)}</button>`).join('')}</div></div>
    <div><h3>유형</h3><div class="chips" id="aiTy" style="flex-wrap:wrap">${AI_TYPES.map(t => `<button type="button" class="chip${AS.types.includes(t.id) ? ' on' : ''}" data-t="${t.id}">${t.name}</button>`).join('')}</div></div>
    <div class="row" style="gap:18px;align-items:flex-start">
      <div><h3>난이도</h3><div class="seg" id="aiLv">${['기본', '실전', '고난도'].map((t, k) => `<button type="button" data-l="${k}" class="${AS.lvl === k ? 'on' : ''}">${t}</button>`).join('')}</div></div>
      <div><h3>문제 수</h3><div class="seg" id="aiN">${[3, 5, 8].map(n => `<button type="button" data-n="${n}" class="${AS.n === n ? 'on' : ''}">${n}</button>`).join('')}</div></div>
    </div>
    <div><h3>추가 요청 <span style="font-weight:500;color:var(--fg-subtle);font-size:13px">(선택)</span></h3><input class="aiin" id="aiEx" maxlength="300" placeholder="예: 원형 큐 is_full 위주로, BST 삭제 꼭 하나" value="${esc(AS.extra)}"></div>
    <div class="row"><button type="button" class="btn pri" id="aiGo">${AIQ.length ? '새 문제 뽑기' : '문제 뽑기'}</button><button type="button" class="btn" id="aiStop" hidden>중지</button><span class="aistat" id="aiSt" aria-live="polite"></span></div>
  </div><div class="ailist" id="aiList"></div>`;
  const save = () => store.set('ex-ai', AS);
  const tog = (arr, id) => arr.includes(id) ? arr.filter(x => x !== id) : [...arr, id];
  const can = () => { $('#aiGo').disabled = AIDEAD || !AS.chs.length || !AS.types.length; };
  v.querySelector('#aiCh').onclick = e => { const b = e.target.closest('[data-c]'); if (!b) return; AS.chs = tog(AS.chs, b.dataset.c); b.classList.toggle('on'); save(); can(); };
  v.querySelector('#aiTy').onclick = e => { const b = e.target.closest('[data-t]'); if (!b) return; AS.types = tog(AS.types, b.dataset.t); b.classList.toggle('on'); save(); can(); };
  v.querySelector('#aiLv').onclick = e => { const b = e.target.closest('[data-l]'); if (!b) return; AS.lvl = +b.dataset.l; v.querySelectorAll('#aiLv button').forEach(x => x.classList.toggle('on', x === b)); save(); };
  v.querySelector('#aiN').onclick = e => { const b = e.target.closest('[data-n]'); if (!b) return; AS.n = +b.dataset.n; v.querySelectorAll('#aiN button').forEach(x => x.classList.toggle('on', x === b)); save(); };
  v.querySelector('#aiEx').oninput = e => { AS.extra = e.target.value; save(); };
  v.querySelector('#aiStop').onclick = () => AICTL?.abort();
  v.querySelector('#aiGo').onclick = aiGenerate;
  can(); if (AIDEAD) aiOff();
  renderAIList();
}

async function aiGenerate() {
  if (!SAMPLE || AIDEAD) return;
  const go = $('#aiGo'), stop = $('#aiStop'), st = $('#aiSt');
  go.disabled = true; stop.hidden = false; st.className = 'aistat';
  st.innerHTML = '<span class="dot"></span>출제 중… (보통 30초~1분)';
  const ctl = AICTL = new AbortController();
  try {
    const r = await SAMPLE.json(aiPrompt(), {
      cache: false, signal: ctl.signal,
      onText: ({ text }) => { const n = (text.match(/"type"\s*:/g) || []).length; if (n) st.innerHTML = `<span class="dot"></span>${n}번 문제 쓰는 중…`; },
    });
    const list = (Array.isArray(r) ? r : r?.questions || []).map(aiValid).filter(Boolean);
    if (!list.length) throw { code: 'invalid_json' };
    AIQ = list; store.set('ex-ai-q', AIQ);
    AIHIST.push(...list.map(q => (q.topic ? q.topic + ': ' : '') + q.q.split('\n')[0].slice(0, 70))); while (AIHIST.length > 40) AIHIST.shift(); store.set('ex-ai-h', AIHIST);
    st.textContent = `${list.length}문제 나왔어.`;
    go.textContent = '새 문제 뽑기';
    renderAIList();
    $('#aiList').scrollIntoView({ behavior: 'smooth', block: 'start' });
  } catch (e) {
    if (AI_OFF.includes(e.code)) { aiOff(); return; }
    st.className = e.code === 'cancelled' ? 'aistat' : 'aistat err';
    st.textContent = e.code === 'cancelled' ? '중지했어.' : (AI_ERR[e.code] || '일시적인 오류가 났어. 다시 눌러 줘.');
  } finally {
    if (AICTL === ctl) AICTL = null;
    stop.hidden = true; if (!AIDEAD) go.disabled = !AS.chs.length || !AS.types.length;
  }
}

(async () => {
  if (!window.claude || typeof window.claude.use !== 'function') return;
