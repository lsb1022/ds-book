\n반복문 함수 실행 시간: 0.0 초<\/code><\/pre><\/figure><div class=\"gap\"><\/div><aside class=\"callout\"><span class=ic aria-hidden=true>💡<\/span><div class=\"cb\"><p>재귀 함수의 경우에는 재귀 호출에 따른 함수 호출 스택의 증가로 인해 메모리 부하가 있을 수 있으므로, 일반적으로 반복문을 사용한 구현이 더 효율적입니다. 그리고 피보나치 수열은 재귀 함수로 구할때 불필요한 작업들이 중복해서 실행되는 문제검이 있다. 이는 향후에 Dynamic Programming 알고리즘에서 살펴보자.<\/p><\/div><\/aside><div class=\"gap\"><\/div><h5 class=\"bh bh2\">Time complexity<\/h5><p><strong>substitution method<\/strong><\/p><div class=\"mx-d\" data-tex=\"\\begin{align} \n&amp;T(n) = T(n-1) + T(n-2) + 1\\\\\n&amp;use\\; approximation\\\\\n&amp;T(n-1) \\simeq T(n-2)\\\\\n&amp;then\\\\\n&amp;T(n) = 2T(n-2) + 1\\\\\n&amp;T(n-2) = 2T(n-4) + 1 \\\\\n&amp;so,\\; \nT(n) = 2^2T(n-2*2) + 2\\\\\n&amp;...\\\\\n&amp;T(n) = 2^kT(n-2*k) + k\\\\\n&amp;when\\; 2k = n\\\\\n&amp;T(n) = 2^{n/2}T(n-n) + n/2\\\\\n&amp;T(n) = 2^{n/2}T(0) + n/2\\\\\n&amp;T(n) = 2^{n/2}\\\\\n\\end{align}\">\\begin{align} \n&amp;T(n) = T(n-1) + T(n-2) + 1\\\\\n&amp;use\\; approximation\\\\\n&amp;T(n-1) \\simeq T(n-2)\\\\\n&amp;then\\\\\n&amp;T(n) = 2T(n-2) + 1\\\\\n&amp;T(n-2) = 2T(n-4) + 1 \\\\\n&amp;so,\\; \nT(n) = 2^2T(n-2*2) + 2\\\\\n&amp;...\\\\\n&amp;T(n) = 2^kT(n-2*k) + k\\\\\n&amp;when\\; 2k = n\\\\\n&amp;T(n) = 2^{n/2}T(n-n) + n/2\\\\\n&amp;T(n) = 2^{n/2}T(0) + n/2\\\\\n&amp;T(n) = 2^{n/2}\\\\\n\\end{align}<\/div><p>위와 같이 time complexity가 지수 함수가 되기 때문에, 아주 느린 알고리즘이다. 피보나치를 구하는 dynamic programming 기법을 이책의 후반부에서 배워보자.<\/p><\/div>"}, {"id": "a432c5acd07249d3be41a873897b9fcb", "title": "Reverse of a string", "tag": "초급", "html": "<div class=\"sb\"><h5 class=\"bh bh2\">목표<\/h5><p>문자열을 역순으로 반환하는 함수<\/p><div class=\"gap\"><\/div><p><strong>built-in<\/strong><\/p><figure class=\"code\" data-bid=\"1d731938-6d6f-472c-b284-c2ae49c2807c\"><div class=\"code-h\"><span>Python<\/span><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-python\">def reverse_stirng(s):\n    return s[::-1]\n\n# 예시 사용\ns = &quot;Hello&quot;\nprint(reverse_stirng(s)) # &quot;olleH&quot;<\/code><\/pre><\/figure><figure class=\"code extra\" data-bid=\"1d731938-6d6f-472c-b284-c2ae49c2807c:x:cpp\"><div class=\"code-h\"><span>C++<\/span><b class=\"xtag\">추가 구현<\/b><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-cpp\">#include &lt;iostream&gt;\n#include &lt;string&gt;\nusing namespace std;\n\nstring reverse_string(const string&amp; s) {\n    return string(s.rbegin(), s.rend());   // 역방향 반복자로 새 문자열 생성 (s[::-1])\n}\n\nint main() {\n    cout &lt;&lt; reverse_string(&quot;Hello&quot;) &lt;&lt; &quot;\\n&quot;;  // olleH\n    return 0;\n}<\/code><\/pre><\/figure><div class=\"gap\"><\/div><p><strong>reduce( ) 함수 사용<\/strong><\/p><figure class=\"code\" data-bid=\"2ed4b739-d6d8-46fc-97c9-80e2d1d6086e\"><div class=\"code-h\"><span>Python<\/span><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-python\">def reverse_stirng(s):\n    return reduce(lambda x, y: y + x, s)\n\n# 예시 사용\ns = &quot;Hello, World!&quot;\nprint(reverse_stirng(s)) # &quot;olleH&quot;<\/code><\/pre><\/figure><figure class=\"code extra\" data-bid=\"2ed4b739-d6d8-46fc-97c9-80e2d1d6086e:x:cpp\"><div class=\"code-h\"><span>C++<\/span><b class=\"xtag\">추가 구현<\/b><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-cpp\">#include &lt;iostream&gt;\n#include &lt;string&gt;\n#include &lt;numeric&gt;\nusing namespace std;\n\nstring reverse_string(const string&amp; s) {\n    return accumulate(s.begin(), s.end(), string(&quot;&quot;),\n                      [](const string&amp; x, char y) { return string(1, y) + x; });\n}\n\nint main() {\n    cout &lt;&lt; reverse_string(&quot;Hello, World!&quot;) &lt;&lt; &quot;\\n&quot;;  // !dlroW ,olleH\n    return 0;\n}<\/code><\/pre><\/figure><div class=\"gap\"><\/div><p><strong>iterative method<\/strong><\/p><figure class=\"code\" data-bid=\"064c820c-97d3-45da-ae56-0b6f752cb72e\"><div class=\"code-h\"><span>Python<\/span><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-python\">def reverse_string(s):\n    reversed_str = &#x27;&#x27;\n    for char in s:\n        reversed_str = char + reversed_str\n    return reversed_str\n\n# 예제 사용\ns = &quot;Hello&quot;\nreversed_string = reverse_string(s)\nprint(reversed_string) #&quot;olleH&quot;<\/code><\/pre><\/figure><figure class=\"code extra\" data-bid=\"064c820c-97d3-45da-ae56-0b6f752cb72e:x:cpp\"><div class=\"code-h\"><span>C++<\/span><b class=\"xtag\">추가 구현<\/b><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-cpp\">#include &lt;iostream&gt;\n#include &lt;string&gt;\nusing namespace std;\n\nstring reverse_string(const string&amp; s) {\n    string reversed_str = &quot;&quot;;\n    for (char ch : s)\n        reversed_str = ch + reversed_str;   // 새 글자를 앞에 붙인다\n    return reversed_str;\n}\n\nint main() {\n    cout &lt;&lt; reverse_string(&quot;Hello&quot;) &lt;&lt; &quot;\\n&quot;;  // olleH\n    return 0;\n}<\/code><\/pre><\/figure><div class=\"gap\"><\/div><p><strong>recursive method(1)<\/strong><\/p><figure class=\"code\" data-bid=\"d502adcb-be40-4db8-bead-ced612434258\"><div class=\"code-h\"><span>Python<\/span><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-python\">def reverse_string(s):\n    # 종료 조건: 문자열이 비어있거나 길이가 1인 경우\n    if len(s) == 1:\n        return s\n    else:\n        # 첫 번째 문자를 제외한 나머지 문자열을 재귀적으로 역순으로 만들어서,\n        # 첫 번째 문자와 결합하여 반환합니다.\n        return reverse_string(s[1:]) + s[0]\n\n# 예제 문자열\ns = &quot;Hello&quot;\nreversed_string = reverse_string(s)\nprint(reversed_string) # &quot;olleH&quot;<\/code><\/pre><\/figure><figure class=\"code extra\" data-bid=\"d502adcb-be40-4db8-bead-ced612434258:x:cpp\"><div class=\"code-h\"><span>C++<\/span><b class=\"xtag\">추가 구현<\/b><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-cpp\">#include &lt;iostream&gt;\n#include &lt;string&gt;\nusing namespace std;\n\nstring reverse_string(const string&amp; s) {\n    if (s.length() &lt;= 1)                         // 종료 조건\n        return s;\n    return reverse_string(s.substr(1)) + s[0];   // 나머지를 뒤집고 첫 글자를 뒤에\n}\n\nint main() {\n    cout &lt;&lt; reverse_string(&quot;Hello&quot;) &lt;&lt; &quot;\\n&quot;;  // olleH\n    return 0;\n}<\/code><\/pre><\/figure><div class=\"gap\"><\/div><p><strong>recursive method(2)<\/strong><\/p><figure class=\"code\" data-bid=\"053ecc53-ad54-4708-8647-828f8db6599a\"><div class=\"code-h\"><span>Python<\/span><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-python\">def reverse_string(s):\n    # 종료 조건: 문자열이 비어있거나 길이가 1인 경우\n    if len(s) == 1:\n        return s\n    else:\n        # 첫 번째 문자를 제외한 나머지 문자열을 재귀적으로 역순으로 만들어서,\n        # 첫 번째 문자와 결합하여 반환합니다.\n        return s[-1] + reverse_string(s[0:-1])\n\n# 예제 문자열\ns = &quot;Hello&quot;\nreversed_string = reverse_string(s)\nprint(reversed_string) # &quot;olleH&quot;<\/code><\/pre><\/figure><figure class=\"code extra\" data-bid=\"053ecc53-ad54-4708-8647-828f8db6599a:x:cpp\"><div class=\"code-h\"><span>C++<\/span><b class=\"xtag\">추가 구현<\/b><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-cpp\">#include &lt;iostream&gt;\n#include &lt;string&gt;\nusing namespace std;\n\nstring reverse_string(const string&amp; s) {\n    if (s.length() &lt;= 1)\n        return s;\n    // 마지막 글자 + 나머지(앞부분)를 뒤집은 것\n    return s.back() + reverse_string(s.substr(0, s.length() - 1));\n}\n\nint main() {\n    cout &lt;&lt; reverse_string(&quot;Hello&quot;) &lt;&lt; &quot;\\n&quot;;  // olleH\n    return 0;\n}<\/code><\/pre><\/figure><div class=\"gap\"><\/div><h5 class=\"bh bh2\">동작 방식<\/h5><figure class=\"img\" style=\"max-width:288px\"><img src=\"img/89169f6bb9d9.webp\" alt=\"그림\" loading=\"lazy\" decoding=\"async\" width=\"583\" height=\"405\"><\/figure><\/div>"}, {"id": "0a699ab3010d4dafb0fd3b178c90bfcd", "title": "Decimal to binary", "tag": "중급", "html": "<div class=\"sb\"><h5 class=\"bh bh2\">목표<\/h5><p>10진수를 2진수로 반환하는 함수<\/p><div class=\"gap\"><\/div><p><strong>내장 함수 bin( ) 소개<\/strong><\/p><figure class=\"code\" data-bid=\"00974274-cab3-43ee-a8e1-4b2afd142e15\"><div class=\"code-h\"><span>Python<\/span><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-python\">print(bin(10)) # 0b1010\nprint(bin(11)) # 0b1011\nprint(bin(12)) # 0b1100\n\nprint(type(bin(10))) # &lt;class &#x27;str&#x27;&gt;<\/code><\/pre><\/figure><figure class=\"code extra\" data-bid=\"00974274-cab3-43ee-a8e1-4b2afd142e15:x:cpp\"><div class=\"code-h\"><span>C++<\/span><b class=\"xtag\">추가 구현<\/b><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-cpp\">#include &lt;iostream&gt;\n#include &lt;bitset&gt;\n#include &lt;string&gt;\nusing namespace std;\n\nint main() {\n    // C++에는 bin()이 없다. bitset&lt;비트수&gt;로 고정 길이 2진 문자열을 얻을 수 있다.\n    cout &lt;&lt; bitset&lt;8&gt;(10) &lt;&lt; &quot;\\n&quot;;   // 00001010\n    cout &lt;&lt; bitset&lt;8&gt;(11) &lt;&lt; &quot;\\n&quot;;   // 00001011\n    cout &lt;&lt; bitset&lt;8&gt;(12) &lt;&lt; &quot;\\n&quot;;   // 00001100\n    string s = bitset&lt;8&gt;(10).to_string();   // string 타입\n    cout &lt;&lt; s &lt;&lt; &quot;\\n&quot;;\n    return 0;\n}<\/code><\/pre><\/figure><div class=\"gap\"><\/div><p><strong>built-in function(1)<\/strong><\/p><figure class=\"code\" data-bid=\"01597c0c-18ff-49d4-aba5-1e0e8b6197c2\"><div class=\"code-h\"><span>Python<\/span><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-python\">def dec2bin(n):\n    # bin() 함수를 사용하여 10진수 n을 2진수로 변환하고, &#x27;0b&#x27; 접두어를 제거하여 반환\n    return bin(n)[2:]\n\n# 예시 사용\nnumber = 25\nbinary = dec2bin(number)\nprint(f&quot;{number}의 2진수 표현은 &#x27;{binary}&#x27;입니다.&quot;) # 25의 2진수 표현은 &#x27;11001&#x27;입니다.<\/code><\/pre><\/figure><figure class=\"code extra\" data-bid=\"01597c0c-18ff-49d4-aba5-1e0e8b6197c2:x:cpp\"><div class=\"code-h\"><span>C++<\/span><b class=\"xtag\">추가 구현<\/b><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-cpp\">#include &lt;iostream&gt;\n#include &lt;bitset&gt;\n#include &lt;string&gt;\nusing namespace std;\n\nstring dec2bin(int n) {\n    string s = bitset&lt;32&gt;(n).to_string();          // 32자리 2진 문자열\n    size_t first = s.find(&#x27;1&#x27;);                     // 앞쪽의 0을 잘라낸다 (&#x27;0b&#x27; 제거와 같은 역할)\n    return first == string::npos ? &quot;0&quot; : s.substr(first);\n}\n\nint main() {\n    int number = 25;\n    cout &lt;&lt; number &lt;&lt; &quot;의 2진수 표현은 &#x27;&quot; &lt;&lt; dec2bin(number) &lt;&lt; &quot;&#x27;입니다.\\n&quot;;  // 11001\n    return 0;\n}<\/code><\/pre><\/figure><div class=\"gap\"><\/div><p><strong>내장 함수 format( )  소개<\/strong><\/p><figure class=\"code\" data-bid=\"18a26a71-ed9f-4b34-a38a-005ada32b575\"><div class=\"code-h\"><span>Python<\/span><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-python\"># binary(2진법)\nprint(format(10, &#x27;b&#x27;)) # 1010\nprint(format(11, &#x27;b&#x27;)) # 1011\nprint(format(12, &#x27;b&#x27;)) # 1100\n\n# hexadecimal(16진법)\nprint(format(10, &#x27;x&#x27;)) # a\nprint(format(11, &#x27;x&#x27;)) # b\nprint(format(12, &#x27;x&#x27;)) # c\n\n# octal(8진법)\nprint(format(10, &#x27;o&#x27;)) # 12\nprint(format(11, &#x27;o&#x27;)) # 13\nprint(format(12, &#x27;o&#x27;)) # 14<\/code><\/pre><\/figure><figure class=\"code extra\" data-bid=\"18a26a71-ed9f-4b34-a38a-005ada32b575:x:cpp\"><div class=\"code-h\"><span>C++<\/span><b class=\"xtag\">추가 구현<\/b><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-cpp\">#include &lt;iostream&gt;\n#include &lt;bitset&gt;\nusing namespace std;\n\nint main() {\n    // binary(2진법): bitset 사용\n    cout &lt;&lt; bitset&lt;4&gt;(10) &lt;&lt; &quot;\\n&quot;;   // 1010\n    cout &lt;&lt; bitset&lt;4&gt;(11) &lt;&lt; &quot;\\n&quot;;   // 1011\n    cout &lt;&lt; bitset&lt;4&gt;(12) &lt;&lt; &quot;\\n&quot;;   // 1100\n    // hexadecimal(16진법): hex 조작자\n    cout &lt;&lt; hex &lt;&lt; 10 &lt;&lt; &quot;\\n&quot; &lt;&lt; 11 &lt;&lt; &quot;\\n&quot; &lt;&lt; 12 &lt;&lt; &quot;\\n&quot;;   // a b c\n    // octal(8진법): oct 조작자\n    cout &lt;&lt; oct &lt;&lt; 10 &lt;&lt; &quot;\\n&quot; &lt;&lt; 11 &lt;&lt; &quot;\\n&quot; &lt;&lt; 12 &lt;&lt; &quot;\\n&quot;;   // 12 13 14\n    return 0;\n}<\/code><\/pre><\/figure><div class=\"gap\"><\/div><p><strong>built-in function(2)<\/strong><\/p><figure class=\"code\" data-bid=\"3f13880d-a9aa-4254-8494-2d1b0076064e\"><div class=\"code-h\"><span>Python<\/span><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-python\">def dec2bin(n):\n    # format() 함수를 사용하여 10진수 n을 2진수(binary) 문자열로 변환\n    return format(n, &#x27;b&#x27;)\n\n# 예시 사용\nnumber = 25\nbinary = dec2bin(number)\nprint(f&quot;{number}의 2진수 표현은 &#x27;{binary}&#x27;입니다.&quot;) # 25의 2진수 표현은 &#x27;11001&#x27;입니다.<\/code><\/pre><\/figure><figure class=\"code extra\" data-bid=\"3f13880d-a9aa-4254-8494-2d1b0076064e:x:cpp\"><div class=\"code-h\"><span>C++<\/span><b class=\"xtag\">추가 구현<\/b><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-cpp\">#include &lt;iostream&gt;\n#include &lt;bitset&gt;\n#include &lt;string&gt;\nusing namespace std;\n\nstring dec2bin(int n) {\n    string s = bitset&lt;32&gt;(n).to_string();\n    size_t first = s.find(&#x27;1&#x27;);\n    return first == string::npos ? &quot;0&quot; : s.substr(first);\n}\n\nint main() {\n    int number = 25;\n    cout &lt;&lt; number &lt;&lt; &quot;의 2진수 표현은 &#x27;&quot; &lt;&lt; dec2bin(number) &lt;&lt; &quot;&#x27;입니다.\\n&quot;;  // 11001\n    return 0;\n}<\/code><\/pre><\/figure><div class=\"gap\"><\/div><p>아래 그림은 정수를 2진수로 변환하는 예시이다. 이 그림을 바탕으로 2진수로의 변환 방법을 이해해보자.<\/p><div class=\"gap\"><\/div><figure class=\"img\" style=\"max-width:192px\"><img src=\"img/a7ef5556a229.webp\" alt=\"그림\" loading=\"lazy\" decoding=\"async\" width=\"263\" height=\"439\"><\/figure><div class=\"gap\"><\/div><p><strong>iterative method<\/strong><\/p><figure class=\"code\" data-bid=\"ea717380-23fa-4c2b-bbdc-97d48fbced4f\"><div class=\"code-h\"><span>Python<\/span><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-python\">def dec2bin(n):\n    bin_conv = []\n\n    while n != 0:\n        bin_conv.insert(0, str(n % 2))\n        n //= 2\n\n    return &quot;&quot;.join(bin_conv)\n    \n    \nprint(dec2bin(8))  # 1000\nprint(dec2bin(9))  # 1001\nprint(dec2bin(10)) # 1010<\/code><\/pre><\/figure><figure class=\"code extra\" data-bid=\"ea717380-23fa-4c2b-bbdc-97d48fbced4f:x:cpp\"><div class=\"code-h\"><span>C++<\/span><b class=\"xtag\">추가 구현<\/b><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-cpp\">#include &lt;iostream&gt;\n#include &lt;string&gt;\nusing namespace std;\n\nstring dec2bin(int n) {\n    string bin_conv = &quot;&quot;;\n    while (n != 0) {\n        bin_conv.insert(bin_conv.begin(), char(&#x27;0&#x27; + n % 2));  // 나머지를 앞에 붙인다\n        n /= 2;\n    }\n    return bin_conv;\n}\n\nint main() {\n    cout &lt;&lt; dec2bin(8) &lt;&lt; &quot;\\n&quot;;   // 1000\n    cout &lt;&lt; dec2bin(9) &lt;&lt; &quot;\\n&quot;;   // 1001\n    cout &lt;&lt; dec2bin(10) &lt;&lt; &quot;\\n&quot;;  // 1010\n    return 0;\n}<\/code><\/pre><\/figure><div class=\"gap\"><\/div><p><strong>recursive method<\/strong><\/p><figure class=\"code\" data-bid=\"e15adb98-3f7e-48aa-bf02-b4f384307c5d\"><div class=\"code-h\"><span>Python<\/span><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-python\">def dec2bin(n):\n    if n == 0:\n        return &quot;&quot;    \n    else:\n        return dec2bin(n // 2) + str(n % 2)\n        \nprint(dec2bin(8))  # 1000\nprint(dec2bin(9))  # 1001\nprint(dec2bin(10)) # 1010<\/code><\/pre><\/figure><figure class=\"code extra\" data-bid=\"e15adb98-3f7e-48aa-bf02-b4f384307c5d:x:cpp\"><div class=\"code-h\"><span>C++<\/span><b class=\"xtag\">추가 구현<\/b><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-cpp\">#include &lt;iostream&gt;\n#include &lt;string&gt;\nusing namespace std;\n\nstring dec2bin(int n) {\n    if (n == 0)\n        return &quot;&quot;;\n    else\n        return dec2bin(n / 2) + to_string(n % 2);\n}\n\nint main() {\n    cout &lt;&lt; dec2bin(8) &lt;&lt; &quot;\\n&quot;;   // 1000\n    cout &lt;&lt; dec2bin(9) &lt;&lt; &quot;\\n&quot;;   // 1001\n    cout &lt;&lt; dec2bin(10) &lt;&lt; &quot;\\n&quot;;  // 1010\n    return 0;\n}<\/code><\/pre><\/figure><div class=\"gap\"><\/div><\/div>"}, {"id": "e2707405c91a475cafa3cd354b22c247", "title": "Sum of digits of a number", "tag": "중급", "html": "<div class=\"sb\"><h5 class=\"bh bh2\">목표<\/h5><p>정수의 각 자릿수의 숫자들의 합을 반환하는 함수<\/p><figure class=\"code\" data-bid=\"22e95fc8-33eb-4a04-8ca1-730687763f07\"><div class=\"code-h\"><span>Python<\/span><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-python\">예제)\ninput: 12\noutput: 3\n\ninput: 123\noutput: 6\n\ninput: 12345\noutput: 15 <\/code><\/pre><\/figure><div class=\"gap\"><\/div><p><strong>built-in<\/strong><\/p><figure class=\"code\" data-bid=\"75d7dc54-6024-41fe-a6e0-3db2730c6b9e\"><div class=\"code-h\"><span>Python<\/span><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-python\">def sum_of_digits(n):\n    # 정수를 문자열로 변환한 후, 각 자릿수의 숫자(문자로 된)를 정수형 숫자로 변환 후, 합 계산\n    return sum(map(int, str(n)))\n\n# 예시 사용\nnumber = 12345\n# 음수일 경우 양수로 변환\nnumber = abs(number)\nresult = sum_of_digits(number)\nprint(f&quot;{number}의 각 자릿수 숫자들의 합은 {result}입니다.&quot;)<\/code><\/pre><\/figure><figure class=\"code extra\" data-bid=\"75d7dc54-6024-41fe-a6e0-3db2730c6b9e:x:cpp\"><div class=\"code-h\"><span>C++<\/span><b class=\"xtag\">추가 구현<\/b><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-cpp\">#include &lt;iostream&gt;\n#include &lt;string&gt;\n#include &lt;cstdlib&gt;\nusing namespace std;\n\nint sum_of_digits(int n) {\n    // 정수를 문자열로 바꾼 뒤, 각 문자에서 &#x27;0&#x27;을 빼서 숫자로 변환해 더한다\n    string s = to_string(n);\n    int total = 0;\n    for (char c : s) total += c - &#x27;0&#x27;;\n    return total;\n}\n\nint main() {\n    int number = 12345;\n    number = abs(number);   // 음수일 경우 양수로 변환\n    cout &lt;&lt; number &lt;&lt; &quot;의 각 자릿수 숫자들의 합은 &quot; &lt;&lt; sum_of_digits(number) &lt;&lt; &quot;입니다.\\n&quot;;  // 15\n    return 0;\n}<\/code><\/pre><\/figure><div class=\"gap\"><\/div><p><strong>iterative method<\/strong><\/p><figure class=\"code\" data-bid=\"4515e683-fb05-4628-97e1-3b2366744c1c\"><div class=\"code-h\"><span>Python<\/span><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-python\">def sum_of_digits(n):\n    total_sum = 0\n    while n &gt; 0:\n        # n을 10으로 나눈 나머지는 가장 낮은 자릿수의 숫자 구하기\n        total_sum += n % 10\n        \n        # n을 10으로 나누어서 자릿수 하나씩 줄임\n        n //= 10\n    \n    return total_sum\n\n# 예시 사용\nnumber = 12345\n# 음수일 경우 양수로 변환\nnumber = abs(number)\nresult = sum_of_digits(number)\nprint(f&quot;{number}의 각 자릿수 숫자들의 합은 {result}입니다.&quot;)\n<\/code><\/pre><\/figure><figure class=\"code extra\" data-bid=\"4515e683-fb05-4628-97e1-3b2366744c1c:x:cpp\"><div class=\"code-h\"><span>C++<\/span><b class=\"xtag\">추가 구현<\/b><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-cpp\">#include &lt;iostream&gt;\n#include &lt;cstdlib&gt;\nusing namespace std;\n\nint sum_of_digits(int n) {\n    int total_sum = 0;\n    while (n &gt; 0) {\n        total_sum += n % 10;   // 가장 낮은 자릿수\n        n /= 10;               // 자릿수 하나 줄이기\n    }\n    return total_sum;\n}\n\nint main() {\n    int number = abs(12345);\n    cout &lt;&lt; number &lt;&lt; &quot;의 각 자릿수 숫자들의 합은 &quot; &lt;&lt; sum_of_digits(number) &lt;&lt; &quot;입니다.\\n&quot;;  // 15\n    return 0;\n}<\/code><\/pre><\/figure><div class=\"gap\"><\/div><p><strong>recursive method<\/strong><\/p><figure class=\"code\" data-bid=\"9c71b5bd-efc7-4287-a939-1f1daa59cb62\"><div class=\"code-h\"><span>Python<\/span><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-python\">def sum_of_digits(n):\n    # base case: n이 한 자리 숫자일 경우\n    if n == 0:\n        return 0\n    else:\n        # n을 10으로 나눈 몫과 나머지를 이용하여 재귀적으로 처리\n        return n % 10 + sum_of_digits(n // 10)\n<\/code><\/pre><\/figure><figure class=\"code extra\" data-bid=\"9c71b5bd-efc7-4287-a939-1f1daa59cb62:x:cpp\"><div class=\"code-h\"><span>C++<\/span><b class=\"xtag\">추가 구현<\/b><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-cpp\">#include &lt;iostream&gt;\nusing namespace std;\n\nint sum_of_digits(int n) {\n    if (n == 0)                              // base case\n        return 0;\n    else\n        return n % 10 + sum_of_digits(n / 10);\n}\n\nint main() {\n    cout &lt;&lt; sum_of_digits(12345) &lt;&lt; &quot;\\n&quot;;   // 15\n    return 0;\n}<\/code><\/pre><\/figure><div class=\"gap\"><\/div><p>아래와 같이 할 수 도 있다.<\/p><figure class=\"code\" data-bid=\"59ae8d9b-57f6-4b8b-a5b5-6bc932374b96\"><div class=\"code-h\"><span>Python<\/span><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-python\">def sum_of_digits(n):\n    # base case: n이 한 자리 숫자일 경우\n    if n &lt; 10:\n        return n\n    else:\n        # n을 10으로 나눈 몫과 나머지를 이용하여 재귀적으로 처리\n        return n % 10 + sum_of_digits(n // 10)\n\n# 예시 사용\nnumber = 12345\nnumber = abs(number)\nresult = sum_of_digits(number)\nprint(f&quot;{number}의 각 자릿수 숫자들의 합은 {result}입니다.&quot;)\n<\/code><\/pre><\/figure><figure class=\"code extra\" data-bid=\"59ae8d9b-57f6-4b8b-a5b5-6bc932374b96:x:cpp\"><div class=\"code-h\"><span>C++<\/span><b class=\"xtag\">추가 구현<\/b><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-cpp\">#include &lt;iostream&gt;\n#include &lt;cstdlib&gt;\nusing namespace std;\n\nint sum_of_digits(int n) {\n    if (n &lt; 10)                              // base case: 한 자리 숫자\n        return n;\n    else\n        return n % 10 + sum_of_digits(n / 10);\n}\n\nint main() {\n    int number = abs(12345);\n    cout &lt;&lt; number &lt;&lt; &quot;의 각 자릿수 숫자들의 합은 &quot; &lt;&lt; sum_of_digits(number) &lt;&lt; &quot;입니다.\\n&quot;;  // 15\n    return 0;\n}<\/code><\/pre><\/figure><\/div>"}, {"id": "8af391f930c0474ead8bb4a9a0c8b805", "title": "Average of array", "tag": "중급", "html": "<div class=\"sb\"><h5 class=\"bh bh2\">목표<\/h5><p>배열의 항목들의 평균을 반환하는 함수를 만들어보자.<\/p><div class=\"gap\"><\/div><h5 class=\"bh bh2\">구현<\/h5><p><strong>built-in function<\/strong><\/p><figure class=\"code\" data-bid=\"c14e0786-2166-45ad-95ca-33b000187454\"><div class=\"code-h\"><span>Python<\/span><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-python\">def array_average(arr):\n    if not arr:\n        return 0  # 빈 배열인 경우 0을 반환한다. 평균을 구할 때 0으로 나눌 수 없기 때문이다.\n    \n    return sum(arr) / len(arr)\n\n# 예시 사용\narr = [1, 2, 3, 4, 5]\naverage = array_average(arr)\nprint(&quot;평균:&quot;, average) # 평균: 3.0\n\narr = []\naverage = array_average(arr)\nprint(&quot;평균:&quot;, average) # 평균: 0<\/code><\/pre><\/figure><figure class=\"code extra\" data-bid=\"c14e0786-2166-45ad-95ca-33b000187454:x:cpp\"><div class=\"code-h\"><span>C++<\/span><b class=\"xtag\">추가 구현<\/b><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-cpp\">#include &lt;iostream&gt;\n#include &lt;vector&gt;\n#include &lt;numeric&gt;\nusing namespace std;\n\ndouble array_average(const vector&lt;int&gt;&amp; arr) {\n    if (arr.empty())\n        return 0;   // 0으로 나눌 수 없으므로 빈 배열은 0\n    return (double)accumulate(arr.begin(), arr.end(), 0) / arr.size();   // 정수 나눗셈 방지\n}\n\nint main() {\n    cout &lt;&lt; &quot;평균: &quot; &lt;&lt; array_average({1, 2, 3, 4, 5}) &lt;&lt; &quot;\\n&quot;;   // 평균: 3\n    cout &lt;&lt; &quot;평균: &quot; &lt;&lt; array_average({}) &lt;&lt; &quot;\\n&quot;;                // 평균: 0\n    return 0;\n}<\/code><\/pre><\/figure><div class=\"gap\"><\/div><p><strong>iterative method<\/strong><\/p><figure class=\"code\" data-bid=\"19197f94-0a19-4381-ab31-4babb23f861d\"><div class=\"code-h\"><span>Python<\/span><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-python\">def array_average(arr):\n    if not arr:\n        return 0  # 빈 배열인 경우 0을 반환한다.\n    \n    total = 0\n    for num in arr:\n        total += num\n    \n    return total / len(arr)\n\n# 예시 사용\narr = [1, 2, 3, 4, 5]\naverage = array_average(arr)\nprint(&quot;평균:&quot;, average) # 평균: 3.0\n\narr = []\naverage = array_average(arr)\nprint(&quot;평균:&quot;, average) # 평균: 0<\/code><\/pre><\/figure><figure class=\"code extra\" data-bid=\"19197f94-0a19-4381-ab31-4babb23f861d:x:cpp\"><div class=\"code-h\"><span>C++<\/span><b class=\"xtag\">추가 구현<\/b><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-cpp\">#include &lt;iostream&gt;\n#include &lt;vector&gt;\nusing namespace std;\n\ndouble array_average(const vector&lt;int&gt;&amp; arr) {\n    if (arr.empty())\n        return 0;\n    int total = 0;\n    for (int num : arr)\n        total += num;\n    return (double)total / arr.size();\n}\n\nint main() {\n    cout &lt;&lt; &quot;평균: &quot; &lt;&lt; array_average({1, 2, 3, 4, 5}) &lt;&lt; &quot;\\n&quot;;   // 평균: 3\n    cout &lt;&lt; &quot;평균: &quot; &lt;&lt; array_average({}) &lt;&lt; &quot;\\n&quot;;                // 평균: 0\n    return 0;\n}<\/code><\/pre><\/figure><div class=\"gap\"><\/div><p><strong>recursive method(I)<\/strong><\/p><figure class=\"code\" data-bid=\"a7f0a314-6190-4f6c-b2c2-37cd57e50815\"><div class=\"code-h\"><span>Python<\/span><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-python\">def array_average(arr):\n    if not arr:\n        return 0  # 빈 배열인 경우 0을 반환한다.\n    \n    # 재귀 함수 정의\n    def sum_array(arr):\n        if not arr:\n            return 0\n        return arr[0] + sum_array(arr[1:])\n    \n    total_sum = sum_array(arr)\n    return total_sum / len(arr)\n\n# 예시 사용\narr = [1, 2, 3, 4, 5]\naverage = array_average(arr)\nprint(&quot;평균:&quot;, average) # 평균: 3.0\n\narr = []\naverage = array_average(arr)\nprint(&quot;평균:&quot;, average) # 평균: 0<\/code><\/pre><figcaption>&lt;배열의 합을 재귀 함수로 구하고, 항목 개수로 나누어서 평균을 구하는 방법&gt;<\/figcaption><\/figure><figure class=\"code extra\" data-bid=\"a7f0a314-6190-4f6c-b2c2-37cd57e50815:x:cpp\"><div class=\"code-h\"><span>C++<\/span><b class=\"xtag\">추가 구현<\/b><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-cpp\">#include &lt;iostream&gt;\n#include &lt;vector&gt;\nusing namespace std;\n\nint sum_array(const vector&lt;int&gt;&amp; arr, size_t i) {   // arr[i:]의 합\n    if (i == arr.size())\n        return 0;\n    return arr[i] + sum_array(arr, i + 1);\n}\n\ndouble array_average(const vector&lt;int&gt;&amp; arr) {\n    if (arr.empty())\n        return 0;\n    int total_sum = sum_array(arr, 0);\n    return (double)total_sum / arr.size();\n}\n\nint main() {\n    cout &lt;&lt; &quot;평균: &quot; &lt;&lt; array_average({1, 2, 3, 4, 5}) &lt;&lt; &quot;\\n&quot;;   // 평균: 3\n    cout &lt;&lt; &quot;평균: &quot; &lt;&lt; array_average({}) &lt;&lt; &quot;\\n&quot;;                // 평균: 0\n    return 0;\n}<\/code><\/pre><\/figure><div class=\"gap\"><\/div><aside class=\"callout\"><span class=ic aria-hidden=true>💡<\/span><div class=\"cb\"><p>아래의 구현 방식이 중요한 내용이다.<\/p><\/div><\/aside><div class=\"gap\"><\/div><p><strong>recursive method(II)<\/strong><\/p><p>아래 식을 이용해서 구현해보자.<\/p><div class=\"mx-d\" data-tex=\"sum\\ of\\ first\\ (N-1)\\ elements = mean\\ of\\ (N-1)\\ elements\\  \\times (N-1)\">sum\\ of\\ first\\ (N-1)\\ elements = mean\\ of\\ (N-1)\\ elements\\  \\times (N-1)<\/div><div class=\"mx-d\" data-tex=\"mean\\ of\\ N\\ elements = \\frac{sum\\ of\\ first\\ (N-1)\\ elements\\ + N-th\\ element}{N}\">mean\\ of\\ N\\ elements = \\frac{sum\\ of\\ first\\ (N-1)\\ elements\\ + N-th\\ element}{N}<\/div><figure class=\"code\" data-bid=\"a2870194-efa3-4113-8b0a-010037981a05\"><div class=\"code-h\"><span>Python<\/span><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-python\">def array_mean(arr): \n    if len(arr) == 1: \n        return arr[0] \n    else: \n        return (array_mean(arr[:-1]) * (len(arr)-1) + arr[-1]) / len(arr) \n  \n# 예시 코드\narr = [1] \nprint(array_mean(arr)) # 평균: 1\n\narr = [1, 2, 3, 4, 5] \nprint(array_mean(arr)) # 평균: 3.0<\/code><\/pre><figcaption>&lt;배열의 평균을 재귀 함수로 바로 구하는 방법&gt;<\/figcaption><\/figure><figure class=\"code extra\" data-bid=\"a2870194-efa3-4113-8b0a-010037981a05:x:cpp\"><div class=\"code-h\"><span>C++<\/span><b class=\"xtag\">추가 구현<\/b><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-cpp\">#include &lt;iostream&gt;\n#include &lt;vector&gt;\nusing namespace std;\n\n// 앞의 n개 원소의 평균 = (앞의 n-1개 평균 * (n-1) + 마지막 원소) / n\ndouble array_mean(const vector&lt;int&gt;&amp; arr, int n) {\n    if (n == 1)\n        return arr[0];\n    else\n        return (array_mean(arr, n - 1) * (n - 1) + arr[n - 1]) / n;\n}\n\nint main() {\n    vector&lt;int&gt; a = {1};\n    cout &lt;&lt; array_mean(a, a.size()) &lt;&lt; &quot;\\n&quot;;   // 1\n    vector&lt;int&gt; b = {1, 2, 3, 4, 5};\n    cout &lt;&lt; array_mean(b, b.size()) &lt;&lt; &quot;\\n&quot;;   // 3\n    return 0;\n}<\/code><\/pre><\/figure><div class=\"gap\"><\/div><p>위의 코드를 재귀 함수의 형식을 간단하게 하기 위해서, 빈 배열인 경우를 고려하지 않았다. 이를 고려하려면 아래와 같이 코드를 추가해야 한다.<\/p><figure class=\"code\" data-bid=\"c1f23c6a-5af4-472a-b5e2-9bf1a4189d2b\"><div class=\"code-h\"><span>Python<\/span><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-python\">def array_mean(arr): \n    if len(arr) == 0: \n        return 0\n    elif len(arr) == 1: \n        return arr[0] \n    else: \n        return (array_mean(arr[:-1]) * (len(arr)-1) + arr[-1]) / len(arr) \n  \n# 예시 코드\narr = [] \nprint(&quot;평균:&quot;, array_mean(arr)) # 평균: 0\n\narr = [1] \nprint(&quot;평균:&quot;, array_mean(arr)) # 평균: 1\n\narr = [1, 2, 3, 4, 5] \nprint(&quot;평균:&quot;, array_mean(arr)) # 평균: 3.0<\/code><\/pre><\/figure><figure class=\"code extra\" data-bid=\"c1f23c6a-5af4-472a-b5e2-9bf1a4189d2b:x:cpp\"><div class=\"code-h\"><span>C++<\/span><b class=\"xtag\">추가 구현<\/b><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-cpp\">#include &lt;iostream&gt;\n#include &lt;vector&gt;\nusing namespace std;\n\ndouble array_mean(const vector&lt;int&gt;&amp; arr, int n) {\n    if (n == 0)\n        return 0;\n    else if (n == 1)\n        return arr[0];\n    else\n        return (array_mean(arr, n - 1) * (n - 1) + arr[n - 1]) / n;\n}\n\nint main() {\n    vector&lt;int&gt; a = {}, b = {1}, c = {1, 2, 3, 4, 5};\n    cout &lt;&lt; &quot;평균: &quot; &lt;&lt; array_mean(a, a.size()) &lt;&lt; &quot;\\n&quot;;   // 평균: 0\n    cout &lt;&lt; &quot;평균: &quot; &lt;&lt; array_mean(b, b.size()) &lt;&lt; &quot;\\n&quot;;   // 평균: 1\n    cout &lt;&lt; &quot;평균: &quot; &lt;&lt; array_mean(c, c.size()) &lt;&lt; &quot;\\n&quot;;   // 평균: 3\n    return 0;\n}<\/code><\/pre><\/figure><\/div>"}, {"id": "b59a8e73ee6042f594f0f4c4136a5490", "title": "Palindrome", "tag": "중급", "html": "<div class=\"sb\"><h5 class=\"bh bh2\">목표<\/h5><p>문자열이 palindrome(앞에서 읽어도 뒤에서 읽어도 동일한 문자열)이면  True를 반환하는 함수<\/p><div class=\"gap\"><\/div><p><strong>예제<\/strong><\/p><figure class=\"code\" data-bid=\"cdb7ea8e-2708-434c-af8d-5b9482ea045e\"><div class=\"code-h\"><span>Python<\/span><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-python\">print(is_palindrome(&quot;radar&quot;))  # True\nprint(is_palindrome(&quot;Hello&quot;))  # False<\/code><\/pre><\/figure><h5 class=\"bh bh2\">구현<\/h5><p><strong>[참고] 내장 함수 filter( ) 예제: 20 이상인 숫자만 필터링<\/strong><\/p><figure class=\"code\" data-bid=\"94631ed2-f6b5-463e-86d2-36b59df6a25e\"><div class=\"code-h\"><span>Python<\/span><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-python\">ages = [5, 12, 17, 18, 24, 32]\n\ndef myFunc(x):\n  if x &gt;= 20:\n    return True\n  else:\n    return False\n\nadults = list(filter(myFunc, ages))\nprint(adults) #[24, 32]<\/code><\/pre><\/figure><figure class=\"code extra\" data-bid=\"94631ed2-f6b5-463e-86d2-36b59df6a25e:x:cpp\"><div class=\"code-h\"><span>C++<\/span><b class=\"xtag\">추가 구현<\/b><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-cpp\">#include &lt;iostream&gt;\n#include &lt;vector&gt;\n#include &lt;algorithm&gt;\n#include &lt;iterator&gt;\nusing namespace std;\n\nbool myFunc(int x) {\n    return x &gt;= 20;\n}\n\nint main() {\n    vector&lt;int&gt; ages = {5, 12, 17, 18, 24, 32};\n    vector&lt;int&gt; adults;\n    copy_if(ages.begin(), ages.end(), back_inserter(adults), myFunc);\n    cout &lt;&lt; &quot;[&quot;;\n    for (size_t i = 0; i &lt; adults.size(); i++) cout &lt;&lt; adults[i] &lt;&lt; (i + 1 &lt; adults.size() ? &quot;, &quot; : &quot;&quot;);\n    cout &lt;&lt; &quot;]\\n&quot;;   // [24, 32]\n    return 0;\n}<\/code><\/pre><\/figure><div class=\"gap\"><\/div><p><strong>built-in 함수 사용<\/strong><\/p><figure class=\"code\" data-bid=\"c4c25820-9eab-4fcd-827f-90d6572dd0ad\"><div class=\"code-h\"><span>Python<\/span><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-python\">def is_palindrome(s):\n    # 문자열을 알파벳만 남긴 후\n    # 공백을 제거하고,\n    # 모두 소문자로 변경\n    #s = &#x27;&#x27;.join(filter(str.isalnum, s)).lower()\n    \n    # 문자열을 뒤집어서 원래 문자열과 비교\n    return s == s[::-1]\n\n# 예시 사용\nprint(is_palindrome(&quot;radar&quot;))  # True\nprint(is_palindrome(&quot;hello&quot;))  # False\n<\/code><\/pre><\/figure><figure class=\"code extra\" data-bid=\"c4c25820-9eab-4fcd-827f-90d6572dd0ad:x:cpp\"><div class=\"code-h\"><span>C++<\/span><b class=\"xtag\">추가 구현<\/b><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-cpp\">#include &lt;iostream&gt;\n#include &lt;string&gt;\nusing namespace std;\n\nbool is_palindrome(const string&amp; s) {\n    // 문자열을 뒤집어서 원래 문자열과 비교\n    return s == string(s.rbegin(), s.rend());\n}\n\nint main() {\n    cout &lt;&lt; boolalpha;\n    cout &lt;&lt; is_palindrome(&quot;radar&quot;) &lt;&lt; &quot;\\n&quot;;  // true\n    cout &lt;&lt; is_palindrome(&quot;hello&quot;) &lt;&lt; &quot;\\n&quot;;  // false\n    return 0;\n}<\/code><\/pre><\/figure><div class=\"gap\"><\/div><p><strong>iterative method<\/strong><\/p><figure class=\"code\" data-bid=\"28ad0869-6f30-46b3-bfbd-1cea46f05633\"><div class=\"code-h\"><span>Python<\/span><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-python\">def is_palindrome(s):\n    n = len(s)\n    \n    # 반복문으로 문자열의 앞과 뒤를 비교\n    for i in range(n // 2):\n        if s[i] != s[n - 1 - i]:\n            return False\n    \n    return True\n\n# 예시 사용\nprint(is_palindrome(&quot;radar&quot;))  # True\nprint(is_palindrome(&quot;hello&quot;))  # False<\/code><\/pre><\/figure><figure class=\"code extra\" data-bid=\"28ad0869-6f30-46b3-bfbd-1cea46f05633:x:cpp\"><div class=\"code-h\"><span>C++<\/span><b class=\"xtag\">추가 구현<\/b><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-cpp\">#include &lt;iostream&gt;\n#include &lt;string&gt;\nusing namespace std;\n\nbool is_palindrome(const string&amp; s) {\n    int n = s.size();\n    // 앞과 뒤를 하나씩 비교\n    for (int i = 0; i &lt; n / 2; i++) {\n        if (s[i] != s[n - 1 - i])\n            return false;\n    }\n    return true;\n}\n\nint main() {\n    cout &lt;&lt; boolalpha;\n    cout &lt;&lt; is_palindrome(&quot;radar&quot;) &lt;&lt; &quot;\\n&quot;;  // true\n    cout &lt;&lt; is_palindrome(&quot;hello&quot;) &lt;&lt; &quot;\\n&quot;;  // false\n    return 0;\n}<\/code><\/pre><\/figure><div class=\"gap\"><\/div><p><strong>recursive method<br><\/strong>아래 그림과 같이 양쪽 문자들이 동일하고, 중간의 부분 문자열을 재귀적으로 체크하면 된다.<\/p><figure class=\"img\" style=\"max-width:372px\"><img src=\"img/d564165fa067.webp\" alt=\"그림\" loading=\"lazy\" decoding=\"async\" width=\"372\" height=\"188\"><\/figure><figure class=\"code\" data-bid=\"3e71d23f-77b7-4d70-9edf-81f16e4670fd\"><div class=\"code-h\"><span>Python<\/span><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-python\">def is_palindrome(s):\n    if len(s) &lt;= 1:\n        return True\n    elif s[0] != s[-1]:\n        return False\n    else:\n        return is_palindrome(s[1:-1])\n\nprint(is_palindrome(&quot;radar&quot;))  # True\nprint(is_palindrome(&quot;hello&quot;))  # False<\/code><\/pre><\/figure><figure class=\"code extra\" data-bid=\"3e71d23f-77b7-4d70-9edf-81f16e4670fd:x:cpp\"><div class=\"code-h\"><span>C++<\/span><b class=\"xtag\">추가 구현<\/b><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-cpp\">#include &lt;iostream&gt;\n#include &lt;string&gt;\nusing namespace std;\n\n// s[left..right]가 회문인가?  (s[1:-1] 대신 양 끝 인덱스를 좁힌다)\nbool is_palindrome(const string&amp; s, int left, int right) {\n    if (right - left + 1 &lt;= 1)\n        return true;\n    else if (s[left] != s[right])\n        return false;\n    else\n        return is_palindrome(s, left + 1, right - 1);\n}\n\nbool is_palindrome(const string&amp; s) { return is_palindrome(s, 0, (int)s.size() - 1); }\n\nint main() {\n    cout &lt;&lt; boolalpha;\n    cout &lt;&lt; is_palindrome(&quot;radar&quot;) &lt;&lt; &quot;\\n&quot;;  // true\n    cout &lt;&lt; is_palindrome(&quot;hello&quot;) &lt;&lt; &quot;\\n&quot;;  // false\n    return 0;\n}<\/code><\/pre><\/figure><div class=\"gap\"><\/div><p><strong>조금 더 간단하게…(저는 아래의 코드 형식을 더 좋아합니다)<\/strong><\/p><figure class=\"code\" data-bid=\"0432a9cf-6034-4bdb-a6f5-4f66ca72ad7b\"><div class=\"code-h\"><span>Python<\/span><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-python\">def is_palindrome(s):\n    if len(s) &lt;= 1:\n        return True\n    \n    return s[0] == s[-1] and is_palindrome(s[1:-1])\n\nprint(is_palindrome(&quot;radar&quot;))  # True\nprint(is_palindrome(&quot;hello&quot;))  # False<\/code><\/pre><\/figure><figure class=\"code extra\" data-bid=\"0432a9cf-6034-4bdb-a6f5-4f66ca72ad7b:x:cpp\"><div class=\"code-h\"><span>C++<\/span><b class=\"xtag\">추가 구현<\/b><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-cpp\">#include &lt;iostream&gt;\n#include &lt;string&gt;\nusing namespace std;\n\nbool is_palindrome(const string&amp; s, int left, int right) {\n    if (right - left + 1 &lt;= 1)\n        return true;\n    return s[left] == s[right] &amp;&amp; is_palindrome(s, left + 1, right - 1);\n}\n\nint main() {\n    cout &lt;&lt; boolalpha;\n    string a = &quot;radar&quot;, b = &quot;hello&quot;;\n    cout &lt;&lt; is_palindrome(a, 0, a.size() - 1) &lt;&lt; &quot;\\n&quot;;  // true\n    cout &lt;&lt; is_palindrome(b, 0, b.size() - 1) &lt;&lt; &quot;\\n&quot;;  // false\n    return 0;\n}<\/code><\/pre><\/figure><div class=\"gap\"><\/div><p><strong>조금 더 간단하게…(or과 and 연산자의 우선 순위에 신경쓰세요)<\/strong><\/p><figure class=\"code\" data-bid=\"adc25552-0354-42ab-a22f-63481dbbf198\"><div class=\"code-h\"><span>Python<\/span><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-python\">def is_palindrome(s):\n    return (len(s) &lt;= 1) or (s[0] == s[-1] and is_palindrome(s[1:-1]))\n\nprint(is_palindrome(&quot;radar&quot;))  # True\nprint(is_palindrome(&quot;hello&quot;))  # False<\/code><\/pre><\/figure><figure class=\"code extra\" data-bid=\"adc25552-0354-42ab-a22f-63481dbbf198:x:cpp\"><div class=\"code-h\"><span>C++<\/span><b class=\"xtag\">추가 구현<\/b><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-cpp\">#include &lt;iostream&gt;\n#include &lt;string&gt;\nusing namespace std;\n\nbool is_palindrome(const string&amp; s) {\n    return s.size() &lt;= 1 || (s.front() == s.back() &amp;&amp; is_palindrome(s.substr(1, s.size() - 2)));\n}\n\nint main() {\n    cout &lt;&lt; boolalpha;\n    cout &lt;&lt; is_palindrome(&quot;radar&quot;) &lt;&lt; &quot;\\n&quot;;  // true\n    cout &lt;&lt; is_palindrome(&quot;hello&quot;) &lt;&lt; &quot;\\n&quot;;  // false\n    return 0;\n}<\/code><\/pre><\/figure><\/div>"}, {"id": "f8e4ae3a76e2427abbbd59e850dd7b7b", "title": "Product 2 numbers", "tag": "중급", "html": "<div class=\"sb\"><h5 class=\"bh bh2\">목표<\/h5><p>두 수의 곱을 반환하는 함수<\/p><div class=\"gap\"><\/div><h5 class=\"bh bh2\">구현<\/h5><p><strong>built-in<\/strong><\/p><figure class=\"code\" data-bid=\"58a33c59-0cbf-4994-81ec-114c669729fd\"><div class=\"code-h\"><span>Python<\/span><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-python\">def multiply(x, y):\n    return x * y\n\n# 예시\nresult = multiply(3, 5)\nprint(result)  # Output: 15<\/code><\/pre><\/figure><figure class=\"code extra\" data-bid=\"58a33c59-0cbf-4994-81ec-114c669729fd:x:cpp\"><div class=\"code-h\"><span>C++<\/span><b class=\"xtag\">추가 구현<\/b><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-cpp\">#include &lt;iostream&gt;\nusing namespace std;\n\nint multiply(int x, int y) {\n    return x * y;\n}\n\nint main() {\n    cout &lt;&lt; multiply(3, 5) &lt;&lt; &quot;\\n&quot;;  // Output: 15\n    return 0;\n}<\/code><\/pre><\/figure><div class=\"gap\"><\/div><p><strong>iterative method(1)<\/strong><\/p><figure class=\"code\" data-bid=\"cf17a1e6-14d3-4785-81ab-671c4f8dfb18\"><div class=\"code-h\"><span>Python<\/span><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-python\">def multiply_for(x, y):\n    result = 0\n    for _ in range(y):\n        result += x\n    return result\n\n# 예시\nresult = multiply_for(3, 5)\nprint(result)  # Output: 15<\/code><\/pre><\/figure><figure class=\"code extra\" data-bid=\"cf17a1e6-14d3-4785-81ab-671c4f8dfb18:x:cpp\"><div class=\"code-h\"><span>C++<\/span><b class=\"xtag\">추가 구현<\/b><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-cpp\">#include &lt;iostream&gt;\nusing namespace std;\n\nint multiply_for(int x, int y) {\n    int result = 0;\n    for (int i = 0; i &lt; y; i++)\n        result += x;\n    return result;\n}\n\nint main() {\n    cout &lt;&lt; multiply_for(3, 5) &lt;&lt; &quot;\\n&quot;;  // Output: 15\n    return 0;\n}<\/code><\/pre><\/figure><div class=\"gap\"><\/div><p><strong>iterative method(2)<\/strong><\/p><figure class=\"code\" data-bid=\"eb28ab44-ac31-4a1b-911c-feeb5649551c\"><div class=\"code-h\"><span>Python<\/span><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-python\">def multiply_while(x, y):\n    result = 0\n    count = 0\n    while count &lt; y:\n        result += x\n        count += 1\n    return result\n\n# 예시\nresult = multiply_while(3, 5)\nprint(result)  # Output: 15<\/code><\/pre><\/figure><figure class=\"code extra\" data-bid=\"eb28ab44-ac31-4a1b-911c-feeb5649551c:x:cpp\"><div class=\"code-h\"><span>C++<\/span><b class=\"xtag\">추가 구현<\/b><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-cpp\">#include &lt;iostream&gt;\nusing namespace std;\n\nint multiply_while(int x, int y) {\n    int result = 0;\n    int count = 0;\n    while (count &lt; y) {\n        result += x;\n        count += 1;\n    }\n    return result;\n}\n\nint main() {\n    cout &lt;&lt; multiply_while(3, 5) &lt;&lt; &quot;\\n&quot;;  // Output: 15\n    return 0;\n}<\/code><\/pre><\/figure><div class=\"gap\"><\/div><p><strong>iterative method(3)<\/strong><\/p><p>위의 방법은 값이 음수인 경우는 작동하지 않을 수 있다. 값이 음수인 경우를 고려하면 아래와 같이 구현할 수 있다.<\/p><figure class=\"code\" data-bid=\"9ab1883e-09fe-470e-8209-740aa988520b\"><div class=\"code-h\"><span>Python<\/span><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-python\">def multiply_for(x, y):\n    # 두 수 중 하나라도 음수인 경우, 절대값으로 처리하여 계산\n    result = 0\n    sign = 1 if (x &gt;= 0 and y &gt;= 0) or (x &lt; 0 and y &lt; 0) else -1\n    x = abs(x)\n    y = abs(y)\n    for _ in range(y):\n        result += x\n    return result if sign &gt; 0 else -result\n\n# 예시\nresult = multiply_for(3, 5)\nprint(result)  # Output: 15\n\nresult = multiply_for(-3, 5)\nprint(result)  # Output: -15\n\nresult = multiply_for(3, -5)\nprint(result)  # Output: -15\n\nresult = multiply_for(-3, -5)\nprint(result)  # Output: 15<\/code><\/pre><\/figure><figure class=\"code extra\" data-bid=\"9ab1883e-09fe-470e-8209-740aa988520b:x:cpp\"><div class=\"code-h\"><span>C++<\/span><b class=\"xtag\">추가 구현<\/b><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-cpp\">#include &lt;iostream&gt;\n#include &lt;cstdlib&gt;\nusing namespace std;\n\nint multiply_for(int x, int y) {\n    // 부호를 따로 기억하고 절댓값으로 계산\n    int result = 0;\n    int sign = ((x &gt;= 0 &amp;&amp; y &gt;= 0) || (x &lt; 0 &amp;&amp; y &lt; 0)) ? 1 : -1;\n    x = abs(x);\n    y = abs(y);\n    for (int i = 0; i &lt; y; i++)\n        result += x;\n    return sign &gt; 0 ? result : -result;\n}\n\nint main() {\n    cout &lt;&lt; multiply_for(3, 5) &lt;&lt; &quot;\\n&quot;;    // 15\n    cout &lt;&lt; multiply_for(-3, 5) &lt;&lt; &quot;\\n&quot;;   // -15\n    cout &lt;&lt; multiply_for(3, -5) &lt;&lt; &quot;\\n&quot;;   // -15\n    cout &lt;&lt; multiply_for(-3, -5) &lt;&lt; &quot;\\n&quot;;  // 15\n    return 0;\n}<\/code><\/pre><\/figure><div class=\"gap\"><\/div><p><strong>iterative method(4)<\/strong><\/p><figure class=\"code\" data-bid=\"095e574d-7636-42c3-a5bc-5a34ab8aa6d5\"><div class=\"code-h\"><span>Python<\/span><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-python\">def multiply_while(x, y):\n    # 두 수 중 하나라도 음수인 경우, 절대값으로 처리하여 계산\n    result = 0\n    sign = 1 if (x &gt;= 0 and y &gt;= 0) or (x &lt; 0 and y &lt; 0) else -1\n    x = abs(x)\n    y = abs(y)\n    count = 0\n    while count &lt; y:\n        result += x\n        count += 1\n    return result if sign &gt; 0 else -result\n\n# 예시\nresult = multiply_while(3, 5)\nprint(result)  # Output: 15\n\nresult = multiply_while(-3, 5)\nprint(result)  # Output: -15\n\nresult = multiply_while(3, -5)\nprint(result)  # Output: -15\n\nresult = multiply_while(-3, -5)\nprint(result)  # Output: 15<\/code><\/pre><\/figure><figure class=\"code extra\" data-bid=\"095e574d-7636-42c3-a5bc-5a34ab8aa6d5:x:cpp\"><div class=\"code-h\"><span>C++<\/span><b class=\"xtag\">추가 구현<\/b><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-cpp\">#include &lt;iostream&gt;\n#include &lt;cstdlib&gt;\nusing namespace std;\n\nint multiply_while(int x, int y) {\n    int result = 0;\n    int sign = ((x &gt;= 0 &amp;&amp; y &gt;= 0) || (x &lt; 0 &amp;&amp; y &lt; 0)) ? 1 : -1;\n    x = abs(x);\n    y = abs(y);\n    int count = 0;\n    while (count &lt; y) {\n        result += x;\n        count += 1;\n    }\n    return sign &gt; 0 ? result : -result;\n}\n\nint main() {\n    cout &lt;&lt; multiply_while(3, 5) &lt;&lt; &quot;\\n&quot;;    // 15\n    cout &lt;&lt; multiply_while(-3, 5) &lt;&lt; &quot;\\n&quot;;   // -15\n    cout &lt;&lt; multiply_while(3, -5) &lt;&lt; &quot;\\n&quot;;   // -15\n    cout &lt;&lt; multiply_while(-3, -5) &lt;&lt; &quot;\\n&quot;;  // 15\n    return 0;\n}<\/code><\/pre><\/figure><div class=\"gap\"><\/div><p><strong>recursive method<\/strong><\/p><p>재귀 함수에서는 파라미터가 모두 양수인 경우만을 고려하였다(음수인 경우를 고려하면 재귀 함수 본연의 핵심을 강조하기 위해서이다).<\/p><figure class=\"code\" data-bid=\"681743aa-e411-4279-a58e-f94c6d1b8d4e\"><div class=\"code-h\"><span>Python<\/span><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-python\">def product(x , y): \n    if y == 0:\n\t      return 0\n\t  else:\n        return (x + product(x, y - 1)) \n\nprint(product(3, 10)) # 30<\/code><\/pre><\/figure><figure class=\"code extra\" data-bid=\"681743aa-e411-4279-a58e-f94c6d1b8d4e:x:cpp\"><div class=\"code-h\"><span>C++<\/span><b class=\"xtag\">추가 구현<\/b><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-cpp\">#include &lt;iostream&gt;\nusing namespace std;\n\nint product(int x, int y) {\n    if (y == 0)\n        return 0;\n    else\n        return x + product(x, y - 1);   // x * y = x + x * (y - 1)\n}\n\nint main() {\n    cout &lt;&lt; product(3, 10) &lt;&lt; &quot;\\n&quot;;   // 30\n    return 0;\n}<\/code><\/pre><\/figure><div class=\"gap\"><\/div><p>그런데 위의 코드는 3 * 10의 경우와 10 * 3의 경우를 생각하면, 3 * 10으로 계산하는 속도가 더 느리다.<\/p><p>이를 개선하려면 아래와 같이 하면 된다.<\/p><figure class=\"code\" data-bid=\"4919ba14-da5c-4307-91f3-92c01da396aa\"><div class=\"code-h\"><span>Python<\/span><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-python\">def product(x , y): \n    # To reduce the number of function calls\n    if x &lt; y:\n        return product(y, x)\n    if y == 0: \n        return 0\n    else:\n        return (x + product(x, y - 1)) \n\nprint(product(3, 10)) # 30<\/code><\/pre><\/figure><figure class=\"code extra\" data-bid=\"4919ba14-da5c-4307-91f3-92c01da396aa:x:cpp\"><div class=\"code-h\"><span>C++<\/span><b class=\"xtag\">추가 구현<\/b><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-cpp\">#include &lt;iostream&gt;\nusing namespace std;\n\nint product(int x, int y) {\n    if (x &lt; y)                  // 호출 횟수를 줄이려고 작은 수를 y로\n        return product(y, x);\n    if (y == 0)\n        return 0;\n    else\n        return x + product(x, y - 1);\n}\n\nint main() {\n    cout &lt;&lt; product(3, 10) &lt;&lt; &quot;\\n&quot;;   // 30\n    return 0;\n}<\/code><\/pre><\/figure><\/div>"}, {"id": "937ed35bc0f64ebd8c4b40713fe37ad1", "title": "Tower of Hanoi", "tag": "중급", "html": "<div class=\"sb\"><h5 class=\"bh bh2\">목표<\/h5><p>Tower of Hanoi 문제를 이해하기 위해서, 아래의 사이트를 방문해보자.<\/p><a class=\"bm\" href=\"https://www.mathsisfun.com/games/towerofhanoi.html\" target=\"_blank\" rel=\"noopener\"><b>Play Tower of Hanoi<\/b><span>Play Tower of Hanoi. Object of the game is to move all the disks over to Tower 3 (with your mouse). But you cannot place a larger disk onto a smaller disk.<\/span><small>https://www.mathsisfun.com/games/towerofhanoi.html<\/small><\/a><div class=\"gap\"><\/div><p>Tower of Hanoi 문제는 다음과 같은 규칙이 있다:<\/p><ol><li>세 개의 기둥 중 1 번째 기둥에 있는 원판을 3 번째 기둥으로 모두 옮겨야한다.<\/li><li>한 번에 하나의 원판만 옮길 수 있다.<\/li><li>큰 원판이 작은 원판 위에 있어서는 안된다.<\/li><\/ol><div class=\"gap\"><\/div><p>Tower of Hanoi 문제를 재귀함수로 풀어보자(이를 위해서는 세부적(iterative)하게 생각하지 말고 재귀적으로 생각해야한다).<\/p><ol><li>A 기둥의 2개의 디스크를 B로 옮긴다(2개의 디스크를 어떻게 옮길지는 생각하지 말자. 재귀적으로 해결할 것이다).<\/li><li>A 기둥의 디스크를 C로 옮긴다.<\/li><li>B 기둥의 2개의 디스크를 C로 옮긴다(재귀적으로)<figure class=\"img\" style=\"max-width:1104px\"><img src=\"img/386b2a7ceb2c.webp\" alt=\"그림\" loading=\"lazy\" decoding=\"async\" width=\"1400\" height=\"175\"><\/figure><\/li><\/ol><div class=\"gap\"><\/div><div class=\"gap\"><\/div><h5 class=\"bh bh2\">구현<\/h5><p><strong>recursive method<\/strong><\/p><figure class=\"code\" data-bid=\"aeca1e8b-0599-4aed-95c7-4ec840641cf1\"><div class=\"code-h\"><span>Python<\/span><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-python\"># 이 함수는 from_rod에서 to_rod로 옮겨준다\n# 따라서 함수를 실행할 때, A에서 C로 옮기기 위해서 아래와 같이 호출해야한다.\n# TowerOfHanoi(3, &#x27;A&#x27;, &#x27;C&#x27;, &#x27;B&#x27;)\ndef TowerOfHanoi(n, from_rod, to_rod, aux_rod):\n    if n == 0:\n        return\n    TowerOfHanoi(n-1, from_rod, aux_rod, to_rod) # 상단의 n-1개의 디스크를 B로 옮김\n    print(&quot;Move disk&quot;, n, &quot;from rod&quot;, from_rod, &quot;to rod&quot;, to_rod) # 1개의 C로 옮김\n    TowerOfHanoi(n-1, aux_rod, to_rod, from_rod) # B의 n-1개의 디스크를 C로 옮김\n\n\n# Driver code\n# mode disks from A to C. B is aux rods\nTowerOfHanoi(3, &#x27;A&#x27;, &#x27;C&#x27;, &#x27;B&#x27;)\n<\/code><\/pre><\/figure><figure class=\"code extra\" data-bid=\"aeca1e8b-0599-4aed-95c7-4ec840641cf1:x:cpp\"><div class=\"code-h\"><span>C++<\/span><b class=\"xtag\">추가 구현<\/b><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-cpp\">#include &lt;iostream&gt;\nusing namespace std;\n\n// from_rod에 있는 n개의 원판을 to_rod로 옮긴다 (aux_rod는 보조 기둥)\nvoid TowerOfHanoi(int n, char from_rod, char to_rod, char aux_rod) {\n    if (n == 0)\n        return;\n    TowerOfHanoi(n - 1, from_rod, aux_rod, to_rod);   // 위의 n-1개를 보조 기둥으로\n    cout &lt;&lt; &quot;Move disk &quot; &lt;&lt; n &lt;&lt; &quot; from rod &quot; &lt;&lt; from_rod &lt;&lt; &quot; to rod &quot; &lt;&lt; to_rod &lt;&lt; &quot;\\n&quot;;\n    TowerOfHanoi(n - 1, aux_rod, to_rod, from_rod);   // 보조 기둥의 n-1개를 목적지로\n}\n\nint main() {\n    TowerOfHanoi(3, &#x27;A&#x27;, &#x27;C&#x27;, &#x27;B&#x27;);\n    return 0;\n}<\/code><\/pre><\/figure><\/div><section class=\"sec d3\" id=\"p7a7344528fb44da280fa82cea2efa9f3\" data-depth=\"3\"><header class=\"sec-h d3\"><div class=\"crumb\">중급 문제 › Tower of Hanoi <\/div><h4 class=\"st\">Tower of Hanoi(Time complexity analysis)<\/h4><\/header><div class=\"sb\"><p>디스크의 이동 횟수를 나타내는 재귀식은 아래와 같다.<\/p><div class=\"mx-d\" data-tex=\"T(n) = 2T(n-1) + 1\">T(n) = 2T(n-1) + 1<\/div><p>대입을 통해서 식을 계속적으로 전개하면서, 식에서 규칙성을 찾아보자.<\/p><div class=\"mx-d\" data-tex=\"T(n-1) = 2T(n-2) + 1\">T(n-1) = 2T(n-2) + 1<\/div><div class=\"mx-d\" data-tex=\"T(n-2) = 2T(n-3) + 1\">T(n-2) = 2T(n-3) + 1<\/div><p>위의 2개의 식을 대입하면,<\/p><div class=\"mx-d\" data-tex=\"T(n-1) = 2(2T(n-3) + 1) + 1\">T(n-1) = 2(2T(n-3) + 1) + 1<\/div><div class=\"gap\"><\/div><p>이 식을 첫번째 식에 대입하면,<\/p><div class=\"mx-d\" data-tex=\"T(n) = 2(2(2T(n-3) + 1) + 1) + 1\">T(n) = 2(2(2T(n-3) + 1) + 1) + 1<\/div><p>위의 식을 정리해보자.<\/p><div class=\"mx-d\" data-tex=\"T(n) = 2(2(2T(n-3) + 1) + 1) + 1 \\\\\n= 2^3T(n-3)+2^2+2^1+1\">T(n) = 2(2(2T(n-3) + 1) + 1) + 1 \\\\\n= 2^3T(n-3)+2^2+2^1+1<\/div><p>이를 일반화하면,<\/p><div class=\"mx-d\" data-tex=\"T(n) = 2^kT(n-k)+2^{k-1}+2^{k-2}+ ... + 2^2+2^1+1\">T(n) = 2^kT(n-k)+2^{k-1}+2^{k-2}+ ... + 2^2+2^1+1<\/div><p>base case로써 <span class=\"mx\" data-tex=\"T(1) = 1\">T(1) = 1<\/span><\/p><div class=\"mx-d\" data-tex=\"n-k = 1\">n-k = 1<\/div><div class=\"mx-d\" data-tex=\"k = n-1\">k = n-1<\/div><p>이를 위의 식에 대입하면<\/p><div class=\"mx-d\" data-tex=\"T(n) = 2^{n-1}T(1)+2^{n-2}+2^{n-3}+ ... + 2^2+2^1+1\">T(n) = 2^{n-1}T(1)+2^{n-2}+2^{n-3}+ ... + 2^2+2^1+1<\/div><p>위는 초기항이 1, 공비가 2인 등비수열(geometric sequence)의 합이다.<\/p><div class=\"mx-d\" data-tex=\"T(n) = \\frac{1-2^{n}}{1-2}=2^n -1\">T(n) = \\frac{1-2^{n}}{1-2}=2^n -1<\/div><p>따라서 디스크가 3개이면 7번, 디스크가 5개이면 31번이 최적의 횟수이다.<\/p><\/div><\/section>"}, {"id": "65e99c67af02482aa0b89661a31ec996", "title": "Power set", "tag": "고급", "html": "<div class=\"sb\"><h5 class=\"bh bh2\">멱집합이란?<\/h5><p>집합 <code>{1, 2, 3}<\/code> 의 모든 부분 집합은 <code>{}, {1}, {2}, {3}, {1, 2}, {1, 3}, {2, 3}, {1, 2, 3}<\/code> 으로 나열할 수 있고, 이 부분 집합의 총 개수는 8개다. 그리고 이 모든 부분 집합을 통틀어 멱집합(power set)이라고 한다.<\/p><div class=\"gap\"><\/div><p>예제:<\/p><p>집합 <code>{1, 2, 3}<\/code> 의 멱집합(power set)은 <code>{{}, {1}, {2}, {3}, {1, 2}, {1, 3}, {2, 3}, {1, 2, 3}}<\/code> 이다.<\/p><div class=\"gap\"><\/div><div class=\"gap\"><\/div><h5 class=\"bh bh2\">멱집합의 개수<\/h5><p>집합의 원소가 n개 일 때 멱집합의 원소 갯수는 몇 개일까?<\/p><figure class=\"img\" style=\"max-width:864px\"><img src=\"img/170bee484313.webp\" alt=\"그림\" loading=\"lazy\" decoding=\"async\" width=\"531\" height=\"256\"><\/figure><p>위 그림을 다시 그리면…<\/p><div class=\"nest\"><figure class=\"img\" style=\"max-width:1536px\"><img src=\"img/580d857751ea.webp\" alt=\"그림\" loading=\"lazy\" decoding=\"async\" width=\"1400\" height=\"562\"><\/figure><\/div><div class=\"gap\"><\/div><p>집합의 각 항목은 2개의 옵션이 있다.<\/p><ol><li>subset에 포함되거나<\/li><li>subset에 포함되지 않거나<\/li><\/ol><div class=\"gap\"><\/div><p>따라서, <span class=\"mx\" data-tex=\"2^n\">2^n<\/span>개의 원소를 가진다.<\/p><aside class=\"callout\"><span class=ic aria-hidden=true>💡<\/span><div class=\"cb\"><p>파워셋(Power Set: 멱집합)은 주어진 집합의 모든 부분집합들의 집합을 의미합니다. 원래 집합 S에 <span class=\"mx\" data-tex=\"n\">n<\/span>개의 원소가 있다면, 파워셋은 <span class=\"mx\" data-tex=\"2^n\">2^n<\/span>개의 부분집합을 포함한다. 이는 각 원소가 부분집합에 포함되거나 포함되지 않는 두 가지 경우의 수가 있기 때문이다.<br><br>예제) 집합 {1, 2, 3}의 모든 부분집합은 <code>{}, {1}, {2}, {3}, {1, 2}, {1, 3}, {2, 3}, {1, 2, 3}<\/code> 으로 나열할 수 있고, 이 부분집합의 총 개수는 8개다.<br>여기서 파워셋은<code> {{}, {1}, {2}, {3}, {1, 2}, {1, 3}, {2, 3}, {1, 2, 3}}<\/code> 이라고 표기할 수 있다.<br><br>즉, 집합 S의 파워셋은 집합 S의 부분집합들을 원소로 하는 집합이다.<\/p><\/div><\/aside><div class=\"gap\"><\/div><h5 class=\"bh bh2\">목표<\/h5><p>멱집합을 재귀 함수로 어떻게 찾을 수 있을까?<\/p><p>위의 개념을 그대로 이용하여 아래와 같이 재귀함수를 만들 수 있다.<\/p><div class=\"gap\"><\/div><h5 class=\"bh bh2\">구현<\/h5><p><strong>recursive method<\/strong><\/p><figure class=\"code\" data-bid=\"d948c8e8-ffc1-40c5-8648-2560a13995cb\"><div class=\"code-h\"><span>Python<\/span><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-python\">def subsets(lis):\n    if lis == []:\n        return [[]]\n\n    not_include_subset = subsets(lis[1:])\n    return not_include_subset + [[lis[0]] + s for s in not_include_subset]\n\n# 사용 예시\narray = [1, 2, 3]\nprint(subsets(array)) # [[], [3], [2], [2, 3], [1], [1, 3], [1, 2], [1, 2, 3]]<\/code><\/pre><\/figure><figure class=\"code extra\" data-bid=\"d948c8e8-ffc1-40c5-8648-2560a13995cb:x:cpp\"><div class=\"code-h\"><span>C++<\/span><b class=\"xtag\">추가 구현<\/b><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-cpp\">#include &lt;iostream&gt;\n#include &lt;vector&gt;\nusing namespace std;\n\n// lis[start:]의 모든 부분집합\nvector&lt;vector&lt;int&gt;&gt; subsets(const vector&lt;int&gt;&amp; lis, size_t start = 0) {\n    if (start == lis.size())\n        return {{}};                                     // 공집합 하나\n    vector&lt;vector&lt;int&gt;&gt; not_include_subset = subsets(lis, start + 1);\n    vector&lt;vector&lt;int&gt;&gt; result = not_include_subset;     // lis[start]를 안 넣은 것들\n    for (auto s : not_include_subset) {                  // lis[start]를 넣은 것들\n        s.insert(s.begin(), lis[start]);\n        result.push_back(s);\n    }\n    return result;\n}\n\nint main() {\n    vector&lt;int&gt; array = {1, 2, 3};\n    auto ps = subsets(array);\n    cout &lt;&lt; &quot;[&quot;;\n    for (size_t i = 0; i &lt; ps.size(); i++) {\n        cout &lt;&lt; &quot;[&quot;;\n        for (size_t j = 0; j &lt; ps[i].size(); j++) cout &lt;&lt; ps[i][j] &lt;&lt; (j + 1 &lt; ps[i].size() ? &quot;, &quot; : &quot;&quot;);\n        cout &lt;&lt; &quot;]&quot; &lt;&lt; (i + 1 &lt; ps.size() ? &quot;, &quot; : &quot;&quot;);\n    }\n    cout &lt;&lt; &quot;]\\n&quot;;   // [[], [3], [2], [2, 3], [1], [1, 3], [1, 2], [1, 2, 3]]\n    return 0;\n}<\/code><\/pre><\/figure><div class=\"gap\"><\/div><div class=\"gap\"><\/div><aside class=\"callout\"><span class=ic aria-hidden=true>💡<\/span><div class=\"cb\"><p>이 문제는 향후 backtracking algorithm을 이용해서 조금 다르게 해결하는 방법을 살펴볼 것이다.<\/p><\/div><\/aside><\/div>"}, {"id": "042f62c34e8b4999891906d42b23e48a", "title": "Length of power set", "tag": "고급", "html": "<div class=\"sb\"><h5 class=\"bh bh2\">목표<\/h5><p>멱집합의 개수<\/p><div class=\"gap\"><\/div><h5 class=\"bh bh2\">구현<\/h5><figure class=\"code\" data-bid=\"b77d09da-0e07-4e4d-bf5e-01efae680288\"><div class=\"code-h\"><span>Python<\/span><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-python\">def length_powerset(lis):\n    if lis == []:\n        return 1\n\n    return 2 * length_powerset(lis[1:])\n\n# 사용 예시\narray = [1, 2, 3]\nprint(length_powerset(array)) # 8<\/code><\/pre><\/figure><figure class=\"code extra\" data-bid=\"b77d09da-0e07-4e4d-bf5e-01efae680288:x:cpp\"><div class=\"code-h\"><span>C++<\/span><b class=\"xtag\">추가 구현<\/b><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-cpp\">#include &lt;iostream&gt;\n#include &lt;vector&gt;\nusing namespace std;\n\nint length_powerset(const vector&lt;int&gt;&amp; lis, size_t start = 0) {\n    if (start == lis.size())\n        return 1;\n    return 2 * length_powerset(lis, start + 1);   // 원소 하나마다 넣는다/안 넣는다 2가지\n}\n\nint main() {\n    vector&lt;int&gt; array = {1, 2, 3};\n    cout &lt;&lt; length_powerset(array) &lt;&lt; &quot;\\n&quot;;  // 8\n    return 0;\n}<\/code><\/pre><\/figure><div class=\"gap\"><\/div><\/div>"}, {"id": "97d4dd27a68f4de6ace0c9fef63fc16c", "title": "Combinational sum(조합의 합)", "tag": "고급", "html": "<div class=\"sb\"><h5 class=\"bh bh2\">목표<\/h5><p>주어진 숫자 집합에서 특정 합을 만들 수 있는지 확인하는 문제를 살펴보자.<br>예를 들어, 숫자 집합 [2, 4, 5]와 숫자 9가 주어졌을 때, 이 리스트들의 숫자([2, 4, 5])들을 더하여 특정한 합(9)을 만들 수 있는지 확인하는 문제이다.<\/p><div class=\"gap\"><\/div><p>이 문제를 재귀 함수를 사용하여 해결할 수 있는데, 각 단계에서는 주어진 숫자 집합에서 현재 숫자를 <u>포함하거나<\/u>, 또는 <u>포함하지 않는<\/u> 두 가지 경우를 고려한다. 이 2가지 경우를 고려하여, 재귀적인 방식으로 모든 가능한 조합을 시도하고, 합이 목표값과 일치하는지 확인한다.<\/p><div class=\"gap\"><\/div><p>아래 그림에서, 좌측의 노드부터 DFS로 탐색한다고 가정해보자.<\/p><p>그림의 빨간선을 따라가면 DFS 탐색이 된다. 빨간 화살표가 마치는 노드에서 탐색이 종료하는 방식이다. <\/p><div class=\"gap\"><\/div><figure class=\"img\" style=\"max-width:672px\"><img src=\"img/88570cf63d4e.webp\" alt=\"그림\" loading=\"lazy\" decoding=\"async\" width=\"1400\" height=\"854\"><\/figure><div class=\"gap\"><\/div><h5 class=\"bh bh2\">구현<\/h5><p>아래의 코드를 살펴보자. <\/p><p>아래의 코드에서 <code>make_sum( )<\/code> 함수가 재귀적으로 호출되고 있다.<\/p><p>이 함수는 리스트의 항목을 순서대로 포함하는 경우와 포함하지 않는 경우를 재귀적으로 탐색해나가고 있다.<\/p><p>아래의 코드를 각자 자세히 살펴보자.<\/p><div class=\"gap\"><\/div><figure class=\"code\" data-bid=\"fba08de1-1f59-450c-9c71-9d687360b6c6\"><div class=\"code-h\"><span>Python<\/span><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-python\">def can_make_sum(nums, target):\n    def make_sum(index, current_sum):\n\t\t    # base cases\n        if current_sum == target: # 해답을 찾았으면 True\n            return True\n        if current_sum &gt; target or index == len(nums): # target 값보다 크거나, 모든 항목을 다 검색했으면 False\n            return False\n        \n        # recursions\n        if make_sum(index + 1, current_sum + nums[index]): # 현재 숫자를 포함하는 경우\n            return True\n        \n        if make_sum(index + 1, current_sum): # 현재 숫자를 포함하지 않는 경우\n            return True\n        \n        return False\n    \n    return make_sum(0, 0) # 초기 상태에서 출발\n\n# 테스트\nnums = [2, 4, 5]\ntarget = 9\nprint(can_make_sum(nums, target))  # 출력: True\n\nnums = [2, 4, 6]\ntarget = 9\nprint(can_make_sum(nums, target))  # 출력: False<\/code><\/pre><\/figure><figure class=\"code extra\" data-bid=\"fba08de1-1f59-450c-9c71-9d687360b6c6:x:cpp\"><div class=\"code-h\"><span>C++<\/span><b class=\"xtag\">추가 구현<\/b><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-cpp\">#include &lt;iostream&gt;\n#include &lt;vector&gt;\n#include &lt;functional&gt;\nusing namespace std;\n\nbool can_make_sum(const vector&lt;int&gt;&amp; nums, int target) {\n    function&lt;bool(size_t, int)&gt; make_sum = [&amp;](size_t index, int current_sum) -&gt; bool {\n        // base cases\n        if (current_sum == target)                          // 해답을 찾았으면 true\n            return true;\n        if (current_sum &gt; target || index == nums.size())   // 넘었거나 다 봤으면 false\n            return false;\n        // recursions\n        if (make_sum(index + 1, current_sum + nums[index])) // 현재 숫자를 포함\n            return true;\n        if (make_sum(index + 1, current_sum))               // 현재 숫자를 포함하지 않음\n            return true;\n        return false;\n    };\n    return make_sum(0, 0);\n}\n\nint main() {\n    cout &lt;&lt; boolalpha;\n    cout &lt;&lt; can_make_sum({2, 4, 5}, 9) &lt;&lt; &quot;\\n&quot;;  // true\n    cout &lt;&lt; can_make_sum({2, 4, 6}, 9) &lt;&lt; &quot;\\n&quot;;  // false\n    return 0;\n}<\/code><\/pre><\/figure><div class=\"gap\"><\/div><p>또는 아래와 같이 조금 간결하게 수정할 수 있다.<\/p><figure class=\"code\" data-bid=\"80ffb98d-5e64-4913-b93d-6942c74e6490\"><div class=\"code-h\"><span>Python<\/span><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-python\">def can_make_sum(nums, target):\n    def make_sum(index, current_sum):\n\t\t    # base cases\n        if current_sum == target: # 해답을 찾았으면 True\n            return True\n        if current_sum &gt; target or index == len(nums): # target 값보다 크거나, 모든 항목을 다 검색했으면 False\n            return False\n        \n        # recursions\n        return make_sum(index + 1, current_sum + nums[index]) or make_sum(index + 1, current_sum)\n            \n    return make_sum(0, 0) # 초기 상태에서 출발\n\n# 테스트\nnums = [2, 4, 5]\ntarget = 9\nprint(can_make_sum(nums, target))  # 출력: True\n\nnums = [2, 4, 6]\ntarget = 9\nprint(can_make_sum(nums, target))  # 출력: False<\/code><\/pre><\/figure><figure class=\"code extra\" data-bid=\"80ffb98d-5e64-4913-b93d-6942c74e6490:x:cpp\"><div class=\"code-h\"><span>C++<\/span><b class=\"xtag\">추가 구현<\/b><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-cpp\">#include &lt;iostream&gt;\n#include &lt;vector&gt;\nusing namespace std;\n\nbool make_sum(const vector&lt;int&gt;&amp; nums, int target, size_t index, int current_sum) {\n    if (current_sum == target) return true;\n    if (current_sum &gt; target || index == nums.size()) return false;\n    return make_sum(nums, target, index + 1, current_sum + nums[index])\n        || make_sum(nums, target, index + 1, current_sum);\n}\n\nbool can_make_sum(const vector&lt;int&gt;&amp; nums, int target) {\n    return make_sum(nums, target, 0, 0);   // 초기 상태에서 출발\n}\n\nint main() {\n    cout &lt;&lt; boolalpha;\n    cout &lt;&lt; can_make_sum({2, 4, 5}, 9) &lt;&lt; &quot;\\n&quot;;  // true\n    cout &lt;&lt; can_make_sum({2, 4, 6}, 9) &lt;&lt; &quot;\\n&quot;;  // false\n    return 0;\n}<\/code><\/pre><\/figure><div class=\"gap\"><\/div><\/div>"}]}, {"name": "5장 배열과 연결 리스트", "items": [{"id": "39c713e35a7d80e090e5f1ae2443125c", "title": "[연습문제: 사고력 확장]", "tag": "", "html": "<div class=\"sb\"><ol><li><strong>연산 확장:<\/strong> 위에서 정의한 함수들 이외에, 배열을 더 다루기 쉽게 만들기 위해 추가하고 싶은 연산(예: <code>sort<\/code> 등)이 있다면 무엇인가? 그 연산이 배열의 ADT로서 왜 유용한지 설명하라.<\/li><\/ol><div class=\"gap\"><\/div><\/div>"}, {"id": "3d0713e35a7d801185f3c688fc90f773", "title": "[연습 문제] 사고력 확장", "tag": "", "html": "<div class=\"sb\"><h5 class=\"bh bh3\"><strong>[연습문제: 사고력 확장]<\/strong><\/h5><p>1. <strong>메모리 시각화:<\/strong> 길이가 5인 정수형 배열과 5개의 노드로 구성된 연결 리스트를 각각 메모리 상에 그려보라. 3번째 위치에 데이터를 삽입할 때, 배열과 연결 리스트가 수행하는 &#x27;데이터 이동 과정&#x27;을 시각적으로 묘사하라.<br>2. <strong>알고리즘 설계:<\/strong> 사용자가 텍스트 에디터에서 타이핑을 할 때마다 글자가 추가된다. &#x27;실행 취소(Undo)&#x27; 기능은 마지막에 입력한 문자를 제거하는 작업이다. 이 에디터의 데이터를 저장할 때 배열과 연결 리스트 중 어떤 구조가 효율적일지, 시간 복잡도를 근거로 논하라.<\/p><div class=\"gap\"><\/div><\/div>"}]}, {"name": "9장 트리", "items": [{"id": "39d713e35a7d80cdbe68c4497a638d19", "title": "[연습 문제]", "tag": "우선순위 큐", "html": "<div class=\"sb\"><ol><li>힙에서 노드의 삭제가 이루어지는 곳은 어디인가?<\/li><li>힙에서 노드가 삭제될 때, 가장 끝의 노드를 삭제된 곳으로 옮겨서 처리하는 이유가 무엇인가?<\/li><li>힙은 1차원 배열을 이용해서 구현한다. 그 이유는 무엇인가?<\/li><li>힙의 연산 중에서 항목을 추가하거나 삭제하는 연산은 무엇에 비례하는가?<\/li><li>아래의 데이터를 순차적으로 입력하여 생성한 힙을 그리시오. 17, 10, 22, 15, 12, 20, 24, 11, 14<\/li><li>위에서 생성한 힙에서 데이터를 2개 삭제한 후의 힙에서 가장 마지막 원소는 무엇인가?<\/li><\/ol><\/div>"}]}, {"name": "실전 문제 (자료 구조)", "items": [{"id": "383713e35a7d80228cc3c388c6dfe66d", "title": "응용 문제: Snail Path", "tag": "배열", "html": "<div class=\"sb\"><aside class=\"callout\"><span class=ic aria-hidden=true>💡<\/span><div class=\"cb\"><p>CCC Junior 2026, #4<\/p><\/div><\/aside><h5 class=\"bh bh2\"><strong>문제 J4: 달팽이의 길 (Snail Path)<\/strong><\/h5><h6 class=\"bh bh3\"><strong>문제 설명<\/strong><\/h6><p>달팽이 한 마리가 동일한 크기의 칸들로 이루어진 무한한 격자 위를 기어가고 있습니다. 달팽이는 수평 방향(동쪽, 서쪽)이나 수직 방향(남쪽, 북쪽)으로 기어갈 수 있지만, 대각선으로는 기어갈 수 없습니다.<\/p><p>달팽이가 기어갈 때, 끈적끈적한 점액 자국을 남겨 달팽이가 지난 격자의 모든 칸을 끈적하게 만들어 버립니다. 예를 들어, 달팽이가 동쪽으로 3칸 기어가면 아래 이미지처럼 4개의 끈적끈적한 칸이 생기게 됩니다.<\/p><p>달팽이가 이동한 경로가 주어졌을 때, <strong>달팽이가 이미 끈적해진 칸에 진입한 총 횟수<\/strong>를 구하는 프로그램을 작성하세요.<\/p><h6 class=\"bh bh3\"><strong>입력 형식 (Input Specification)<\/strong><\/h6><ul><li>첫 번째 줄에는 달팽이가 이동한 횟수를 나타내는 양의 정수 M이 주어집니다.<\/li><li>다음 M개의 줄에는 달팽이의 이동 경로가 순서대로 주어집니다. 각 이동은 대문자 방향 문자(<code>N<\/code>: 북, <code>E<\/code>: 동, <code>S<\/code>: 남, <code>W<\/code>: 서)와 달팽이가 해당 방향으로 기어간 칸 수를 나타내는 20 이하의 양의 정수로 구성됩니다.<\/li><\/ul><h6 class=\"bh bh3\"><strong>출력 형식 (Output Specification)<\/strong><\/h6><ul><li>달팽이가 이미 끈적해진 칸에 진입한 횟수를 나타내는 음이 아닌 정수 T를 출력합니다.<\/li><\/ul><h6 class=\"bh bh3\"><strong>입출력 예시<\/strong><\/h6><h6 class=\"bh bh4\"><strong>예제 입력 1<\/strong><\/h6><figure class=\"code\" data-bid=\"5685401e-cf65-43da-b5a7-e713b8ad03f1\"><div class=\"code-h\"><span>Plain Text<\/span><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-plaintext\">3\nS2\nN2\nS3<\/code><\/pre><\/figure><h6 class=\"bh bh4\"><strong>예제 출력 1<\/strong><\/h6><figure class=\"code\" data-bid=\"d6e42e29-e255-45ad-84f9-a82708bfaf34\"><div class=\"code-h\"><span>Plain Text<\/span><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-plaintext\">4<\/code><\/pre><\/figure><div class=\"gap\"><\/div><h6 class=\"bh bh4\"><strong>예제 1 설명<\/strong><\/h6><p>달팽이의 이동 경로는 다음과 같습니다.<\/p><figure class=\"img\" style=\"max-width:240px\"><img src=\"img/3fb713e3a816.webp\" alt=\"그림\" loading=\"lazy\" decoding=\"async\" width=\"329\" height=\"571\"><\/figure><ol><li>시작점 (0, 0)에서 시작하여 남쪽으로 2칸 이동: (0, -1), (0, -2) 방문 (새로운 칸 2개 끈적해짐)<\/li><li>북쪽으로 2칸 이동: (0, -1), (0, 0) 진입 (<strong>이미 끈적해진 칸 2번 진입<\/strong>)<\/li><li>남쪽으로 3칸 이동: (0, -1), (0, -2) 진입 후 (0, -3) 진입 (<strong>이미 끈적해진 칸 2번 진입<\/strong> + 새로운 칸 1개 방문)<\/li><\/ol><p>따라서 이미 끈적해진 칸에 진입한 총 횟수는 <strong>2 + 2 = 4회<\/strong>입니다. <em>(단일 끈적한 칸에 여러 번 진입할 수 있습니다.)<\/em><\/p><div class=\"gap\"><\/div><p><strong>테스트 용 대용량 데이터<\/strong><\/p><div class=\"file\"><span class=\"fi\" aria-hidden=\"true\">📎<\/span><span class=\"fn\"><b>2026_j4.zip<\/b><small>2.1 MiB · 첨부 파일은 원본 노션에서 받을 수 있습니다<\/small><\/span><a class=\"btn btn-weak sm\" href=\"https://unibookco.notion.site/383713e35a7d80228cc3c388c6dfe66d\" target=\"_blank\" rel=\"noopener\">노션 열기 ↗<\/a><\/div><div class=\"gap\"><\/div><p><strong>풀이 방법 힌트?<\/strong><\/p><ul><li>2차원 배열을 이용한 방법<\/li><li>1차원 배열을 이용한 방법<\/li><\/ul><div class=\"gap\"><\/div><\/div>"}, {"id": "383713e35a7d806da7c2d954ae177203", "title": "응용 문제: Zero that out", "tag": "스택", "html": "<div class=\"sb\"><aside class=\"callout\"><span class=ic aria-hidden=true>💡<\/span><div class=\"cb\"><p>CCC Senior 2015, #1<\/p><\/div><\/aside><div class=\"gap\"><\/div><p><strong>문제 설명<\/strong><\/p><p>상사는 당신에게 회사가 작년에 얼마나 많은 돈을 벌었는지 계산하기 위해 일련의 양수들을 더해달라고 요청했습니다.<\/p><p>불행하게도, 상사는 때때로 숫자를 잘못 읽습니다.<\/p><p>다행히도, 상사는 잘못된 숫자를 읽었을 때 이를 깨닫고 &quot;zero&quot;라고 말하며, 이는 &quot;현재까지의 마지막 숫자를 무시하라&quot;는 뜻입니다.<\/p><p>불행하게도, 상사는 실수를 반복할 수 있으며, 각 실수마다 &quot;zero&quot;라고 말합니다.<\/p><p>예를 들어, 상사가 &quot;One, three, five, four, zero, zero, seven, zero, zero, six&quot;라고 말한다면, 아래 표와 같이 합계는 7이 됩니다.<\/p><div class=\"tbl\"><table><tbody><tr><td><strong>상사의 발언<\/strong><\/td><td><strong>현재 숫자들<\/strong><\/td><td><strong>설명<\/strong><\/td><\/tr><tr><td>&quot;One, three, five, four&quot;<\/td><td>1, 3, 5, 4<\/td><td>처음 네 숫자를 기록합니다.<\/td><\/tr><tr><td>&quot;zero, zero&quot;<\/td><td>1, 3<\/td><td>마지막 두 숫자를 무시합니다.<\/td><\/tr><tr><td>&quot;seven&quot;<\/td><td>1, 3, 7<\/td><td>마지막에 숫자 7을 기록합니다.<\/td><\/tr><tr><td>&quot;zero, zero&quot;<\/td><td>1<\/td><td>마지막 두 숫자를 무시합니다.<\/td><\/tr><tr><td>&quot;six&quot;<\/td><td>1, 6<\/td><td>모든 숫자를 읽었으며, 최종 합계는 7입니다.<\/td><\/tr><\/tbody><\/table><\/div><p>언제든 상사가 말한 &quot;zero&quot;의 횟수는 그전에 말한 양수의 횟수보다 많지 않습니다. 만약 모든 양수가 무시되었다면, 합계는 0입니다.<\/p><p>상사의 발언을 읽고 올바른 합계를 계산하는 프로그램을 작성하세요.<\/p><div class=\"gap\"><\/div><p><strong>입력 명세<\/strong><\/p><ul><li>입력의 첫 번째 줄에는 상사가 말할 정수(0 포함)의 개수 K (1 ≤e K ≤ 100,000)가 주어집니다.<\/li><li>다음 K개의 줄 각각에는 1에서 100 사이의 정수 또는 숫자 0이 주어집니다.<\/li><\/ul><div class=\"gap\"><\/div><p><strong>출력 명세<\/strong><\/p><ul><li>출력은 &quot;zero&quot; 문장을 고려하여 읽은 정수들의 올바른 합계를 나타내는 정수 하나를 한 줄에 출력합니다. 결과 합계는 0에서 1,000,000 사이의 정수라고 가정할 수 있습니다.<\/li><\/ul><div class=\"gap\"><\/div><p><strong>샘플 입력 1<\/strong><\/p><p><code>4<br>3<br>0<br>4<br>0<\/code><\/p><p><strong>샘플 출력 1<\/strong><\/p><p><code>0<\/code><\/p><div class=\"gap\"><\/div><p><strong>샘플 입력 2<\/strong><\/p><p><code>10<br>1<br>3<br>5<br>4<br>0<br>0<br>7<br>0<br>0<br>6<\/code><\/p><p><strong>샘플 출력 2<\/strong><\/p><p><code>7<\/code><\/p><\/div><section class=\"sec d3\" id=\"p383713e35a7d80f1a49adb93a6651c13\" data-depth=\"3\"><header class=\"sec-h d3\"><div class=\"crumb\">스택 › 응용 문제: Zero that out<\/div><h4 class=\"st\">간단한 방법<\/h4><\/header><div class=\"sb\"><figure class=\"code\" data-bid=\"383713e3-5a7d-80e8-9c3b-d85d6eede5b9\"><div class=\"code-h\"><span>Python<\/span><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-python\">import sys\n\nK = int(input())\nstack = []\n\nfor _ in range(K):\n    num = int(input())\n    if num == 0:\n        stack.pop()  # zero가 나올 때마다 가장 최근 숫자 제거\n    else:\n        stack.append(num)\n\nprint(sum(stack)) # 남은 숫자들의 합 출력<\/code><\/pre><\/figure><figure class=\"code extra\" data-bid=\"383713e3-5a7d-80e8-9c3b-d85d6eede5b9:x:cpp\"><div class=\"code-h\"><span>C++<\/span><b class=\"xtag\">추가 구현<\/b><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-cpp\">#include &lt;iostream&gt;\n#include &lt;stack&gt;\nusing namespace std;\n\nint main() {\n    int K;\n    cin &gt;&gt; K;\n    stack&lt;int&gt; st;\n    for (int i = 0; i &lt; K; i++) {\n        int num;\n        cin &gt;&gt; num;\n        if (num == 0) st.pop();      // 0이 나오면 가장 최근 숫자 제거\n        else st.push(num);\n    }\n    long long sum = 0;\n    while (!st.empty()) { sum += st.top(); st.pop(); }   // 남은 숫자들의 합\n    cout &lt;&lt; sum &lt;&lt; &quot;\\n&quot;;\n    return 0;\n}<\/code><\/pre><\/figure><\/div><\/section>"}, {"id": "383713e35a7d80aea3abf7830690d5f2", "title": "응용 문제: 괄호 쌍 검사", "tag": "스택", "html": "<div class=\"sb\"><h5 class=\"bh bh2\">문제: Balanced Bracket Strings (균형 잡힌 괄호 문자열)<\/h5><div class=\"gap\"><\/div><p><strong>문제 설명<\/strong><\/p><p>당신은 최근 프로그래밍 언어의 구문 분석기(Parser)를 개발하고 있습니다. 가장 기본이 되는 작업은 프로그램 코드 내의 괄호 <code>(<\/code>와 <code>)<\/code>가 올바르게 짝을 이루고 있는지 확인하는 것입니다.<\/p><p>괄호 문자열이 &quot;균형 잡혀 있다&quot;는 것은 다음 규칙을 만족하는 것을 의미합니다:<\/p><ol><li>모든 여는 괄호 <code>(<\/code>는 그보다 뒤에 나오는 대응하는 닫는 괄호 <code>)<\/code>를 가져야 합니다.<\/li><li>모든 닫는 괄호 <code>)<\/code>는 그보다 앞에 나오는 대응하는 여는 괄호 <code>(<\/code>를 가져야 합니다.<\/li><li>괄호들이 서로 겹치지 않고 올바르게 중첩되어야 합니다. (예: <code>(())<\/code>는 균형, <code>)(<\/code>는 불균형)<\/li><\/ol><p>주어진 문자열이 균형 잡힌 괄호 문자열인지 판별하는 프로그램을 작성하세요.<\/p><div class=\"gap\"><\/div><p><strong>입력 명세<\/strong><\/p><ul><li>첫 번째 줄에는 테스트할 문자열의 길이 N(<span class=\"mx\" data-tex=\"1 \\le N \\le 100,000\">1 \\le N \\le 100,000<\/span> )이 주어집니다.<\/li><li>두 번째 줄에는 <code>(<\/code> 또는 <code>)<\/code>로만 구성된 길이 N의 문자열이 주어집니다.<\/li><\/ul><p><strong>출력 명세<\/strong><\/p><ul><li>주어진 문자열이 균형 잡혀 있다면 <code>YES<\/code>를, 그렇지 않다면 <code>NO<\/code>를 출력합니다.<\/li><\/ul><div class=\"gap\"><\/div><p><strong>샘플 입력 1<\/strong><\/p><p><code>6<br>(()())<\/code><\/p><p><strong>샘플 출력 1<\/strong><\/p><p><code>YES<\/code><\/p><p><strong>샘플 입력 2<\/strong><\/p><p><code>4<br>)(()<\/code><\/p><p><strong>샘플 출력 2<\/strong><\/p><p><code>NO<\/code><\/p><\/div><section class=\"sec d3\" id=\"p383713e35a7d80c3bf91f2812ee0f294\" data-depth=\"3\"><header class=\"sec-h d3\"><div class=\"crumb\">스택 › 응용 문제: 괄호 쌍 검사<\/div><h4 class=\"st\">요점<\/h4><\/header><div class=\"sb\"><h6 class=\"bh bh3\">문제 해결을 위한 힌트 (스택 활용)<\/h6><p>이 문제는 스택을 사용하여 다음과 같이 해결할 수 있습니다.<\/p><ul><li>문자열을 앞에서부터 한 글자씩 읽습니다.<\/li><li><code>(<\/code>를 만나면 스택에 푸시(Push)합니다.<\/li><li><code>)<\/code>를 만나면:<ul><li>스택이 비어 있다면, 대응할 <code>(<\/code>가 없으므로 즉시 <code>NO<\/code>를 출력합니다.<\/li><li>스택이 비어 있지 않다면, 스택에서 팝(Pop)하여 짝을 맞춰줍니다.<\/li><\/ul><\/li><li>모든 문자를 처리한 후:<ul><li>스택이 비어 있다면 모든 괄호의 짝이 맞으므로 <code>YES<\/code>를 출력합니다.<\/li><li>스택에 요소가 남아 있다면 닫히지 않은 괄호가 있다는 뜻이므로 <code>NO<\/code>를 출력합니다.<\/li><\/ul><\/li><\/ul><\/div><\/section><section class=\"sec d3\" id=\"p383713e35a7d80cb9471cf118345e7dd\" data-depth=\"3\"><header class=\"sec-h d3\"><div class=\"crumb\">스택 › 응용 문제: 괄호 쌍 검사<\/div><h4 class=\"st\">간단한 방법<\/h4><\/header><div class=\"sb\"><figure class=\"code\" data-bid=\"383713e3-5a7d-8013-a731-f8f70042b266\"><div class=\"code-h\"><span>Python<\/span><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-python\">import sys\n\ndef solve():\n    # 입력 받기\n    n = int(input())\n    brackets = input()\n\n    stack = []\n    is_balanced = True\n\n    for char in brackets:\n        if char == &#x27;(&#x27;:\n            # 여는 괄호는 스택에 넣음\n            stack.append(char)\n        elif char == &#x27;)&#x27;:\n            # 닫는 괄호를 만났을 때\n            if not stack:\n                # 스택이 비어있다면 대응하는 여는 괄호가 없음\n                is_balanced = False\n                break\n            else:\n                # 스택에서 하나를 꺼내 짝을 맞춤\n                stack.pop()\n\n    # 모든 처리가 끝난 후, 스택이 비어 있어야 균형 잡힌 것\n    if is_balanced and not stack:\n        print(&quot;YES&quot;)\n    else:\n        print(&quot;NO&quot;)\n\nsolve()<\/code><\/pre><\/figure><figure class=\"code extra\" data-bid=\"383713e3-5a7d-8013-a731-f8f70042b266:x:cpp\"><div class=\"code-h\"><span>C++<\/span><b class=\"xtag\">추가 구현<\/b><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-cpp\">#include &lt;iostream&gt;\n#include &lt;string&gt;\n#include &lt;stack&gt;\nusing namespace std;\n\nint main() {\n    int n;\n    string brackets;\n    cin &gt;&gt; n &gt;&gt; brackets;\n    stack&lt;char&gt; st;\n    bool is_balanced = true;\n    for (char ch : brackets) {\n        if (ch == &#x27;(&#x27;) st.push(ch);              // 여는 괄호는 push\n        else if (ch == &#x27;)&#x27;) {\n            if (st.empty()) {                    // 짝이 될 여는 괄호가 없음\n                is_balanced = false;\n                break;\n            }\n            st.pop();                            // 짝 맞추기\n        }\n    }\n    cout &lt;&lt; (is_balanced &amp;&amp; st.empty() ? &quot;YES&quot; : &quot;NO&quot;) &lt;&lt; &quot;\\n&quot;;   // 끝나고 스택이 비어야 균형\n    return 0;\n}<\/code><\/pre><\/figure><\/div><\/section><section class=\"sec d3\" id=\"p38e713e35a7d80ca8807d58c4aea3280\" data-depth=\"3\"><header class=\"sec-h d3\"><div class=\"crumb\">스택 › 응용 문제: 괄호 쌍 검사<\/div><h4 class=\"st\">다양한 종류의 괄호들을 사용하는 경우<\/h4><\/header><div class=\"sb\"><p>괄호의 종류가 여러 개(<code>()<\/code>, <code>{}<\/code>, <code>[]<\/code>)로 늘어나도 &#x27;가장 최근에 열린 괄호가 가장 먼저 닫혀야 한다&#x27;는 LIFO(후입선출) 원칙은 동일하다.<\/p><div class=\"gap\"><\/div><h6 class=\"bh bh3\">1. 핵심 알고리즘: 스택 활용<\/h6><ol><li><strong>여는 괄호(<\/strong><strong><code>(<\/code><\/strong><strong>, <\/strong><strong><code>{<\/code><\/strong><strong>, <\/strong><strong><code>[<\/code><\/strong><strong>):<\/strong> 무조건 스택에 넣는다(push).<\/li><li><strong>닫는 괄호(<\/strong><strong><code>)<\/code><\/strong><strong>, <\/strong><strong><code>}<\/code><\/strong><strong>, <\/strong><strong><code>]<\/code><\/strong><strong>):<\/strong><ul><li>스택이 비어 있다면? → 짝이 맞는 여는 괄호가 없으므로 <strong>실패<\/strong>.<\/li><li>스택에서 꺼낸(pop) 괄호와 현재의 닫는 괄호가 짝이 맞는지 확인한다.<\/li><li>짝이 맞지 않는다면? → <strong>실패<\/strong>.<\/li><\/ul><\/li><li><strong>문자열 끝:<\/strong> 모든 처리가 끝난 후 스택이 비어 있다면? → <strong>성공<\/strong>, 남아 있다면? → <strong>실패<\/strong>.<\/li><\/ol><div class=\"gap\"><\/div><h6 class=\"bh bh3\">2. 파이썬 코드 구현<\/h6><p>여러 종류의 괄호를 처리하기 위해 딕셔너리(Dictionary)를 사용하여 짝을 관리하면 코드가 매우 간결해진다.<\/p><figure class=\"code\" data-bid=\"8547429a-7caa-4226-a972-fffe3b036a18\"><div class=\"code-h\"><span>Python<\/span><button type=\"button\" class=\"cp\">복사<\/button><\/div><pre><code class=\"language-python\">def is_balanced(s):\n    stack = []\n    # 닫는 괄호를 키로, 여는 괄호를 값으로 매핑\n    mapping = {&#x27;)&#x27;: &#x27;(&#x27;, &#x27;}&#x27;: &#x27;{&#x27;, &#x27;]&#x27;: &#x27;[&#x27;}\n\n    for char in s:\n        # 1. 여는 괄호인 경우\n        if char in mapping.values():\n            stack.append(char)\n        # 2. 닫는 괄호인 경우\n        elif char in mapping:\n            if not stack:  # 스택이 비어있는데 닫는 괄호가 나옴\n                return False\n            top = stack.pop()\n            if mapping[char] != top:  # 짝이 맞지 않음\n                return False\n\n    # 최종적으로 스택이 비어있어야 모두 짝이 맞는 것\n    return len(stack) == 0\n\n# 테스트\nprint(is_balanced(&quot;({[]})&quot;))  # True\nprint(is_balanced(&quot;([)]&quot;))    # False<\/code><\/pre><\/figure><
