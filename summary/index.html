<!doctype html>
<html lang="ko">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#18181b" media="(prefers-color-scheme: dark)">
<meta charset="utf-8">
<title>자료구조와 알고리즘 요약</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap">
<style>
@font-face{font-family:'Pretendard Variable';font-weight:45 920;font-style:normal;font-display:swap;src:url(pretendard.woff2) format('woff2-variations'),url(pretendard.woff2) format('woff2')}
/* Layout: Karrot-style reader — sticky top bar, chapter rail on the left (drawer on phones), white sheets on a gray ground, one chapter per view. */
:root{
  --bg:#ffffff; --bg-muted:#f7f8f9; --bg-weak:#f3f4f5; --divider:#f3f4f5;
  --line:#eeeff1; --line-strong:#dcdee3;
  --fg:#1a1c20; --fg-muted:#555d6d; --fg-subtle:#868b94; --fg-disabled:#b0b3ba;
  --brand:#ff6600; --brand-press:#e14d00; --brand-fg:#e14d00; --brand-weak:#fff2ec; --brand-line:#ffd5c0;
  --info:#217cf9; --info-fg:#135fcd; --info-weak:#eff6ff;
  --pos:#079171; --pos-weak:#edfaf6;
  --crit:#fa342c; --crit-fg:#d92b24; --crit-weak:#fdf0f0;
  --warn-fg:#9b7821; --warn-weak:#fff7de;
  --purple:#7c3aed; --purple-weak:#f4effe;
  --on-solid:#ffffff;
  --scrim:rgba(0,0,0,.36);
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 28px rgba(0,0,0,.10);
  --c-kw:#c2410c; --c-str:#047857; --c-num:#1d4ed8; --c-com:#868b94; --c-fn:#7c3aed; --c-bi:#0e7490;
  --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"D2Coding",monospace;
  --r-s:8px; --r-m:12px; --r-l:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16171b; --bg-muted:#1d2025; --bg-weak:#2b2e35; --divider:#000000;
  --line:#2b2e35; --line-strong:#393d46;
  --fg:#f3f4f5; --fg-muted:#dcdee3; --fg-subtle:#b0b3ba; --fg-disabled:#5b606a;
  --brand:#ff6600; --brand-press:#ff9e65; --brand-fg:#ff9e65; --brand-weak:#31241f; --brand-line:#6b311c;
  --info:#41a2f9; --info-fg:#83bcf9; --info-weak:#202742;
  --pos:#22b27f; --pos-weak:#202926;
  --crit:#ff6e60; --crit-fg:#ff8a7e; --crit-weak:#322323;
  --warn-fg:#dab156; --warn-weak:#302819;
  --purple:#b89cff; --purple-weak:#2a2340;
  --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.45);
  --c-kw:#ff9e65; --c-str:#5fd0a3; --c-num:#83bcf9; --c-com:#8a909a; --c-fn:#c4b0ff; --c-bi:#67d3e6;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16171b; --bg-muted:#1d2025; --bg-weak:#2b2e35; --divider:#000000;
  --line:#2b2e35; --line-strong:#393d46;
  --fg:#f3f4f5; --fg-muted:#dcdee3; --fg-subtle:#b0b3ba; --fg-disabled:#5b606a;
  --brand:#ff6600; --brand-press:#ff9e65; --brand-fg:#ff9e65; --brand-weak:#31241f; --brand-line:#6b311c;
  --info:#41a2f9; --info-fg:#83bcf9; --info-weak:#202742;
  --pos:#22b27f; --pos-weak:#202926;
  --crit:#ff6e60; --crit-fg:#ff8a7e; --crit-weak:#322323;
  --warn-fg:#dab156; --warn-weak:#302819;
  --purple:#b89cff; --purple-weak:#2a2340;
  --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.45);
  --c-kw:#ff9e65; --c-str:#5fd0a3; --c-num:#83bcf9; --c-com:#8a909a; --c-fn:#c4b0ff; --c-bi:#67d3e6;
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;scroll-padding-top:72px}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.75;letter-spacing:-0.01em;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
button,input{font:inherit;color:inherit;letter-spacing:inherit}
:focus-visible{outline:2px solid var(--info);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4,h5,h6,p{margin:0}
h1,h2,h3,h4,h5,h6{text-wrap:balance;letter-spacing:-0.025em}
a{color:var(--info-fg)}
.num{font-variant-numeric:tabular-nums}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.topbar-in{display:flex;align-items:center;gap:10px;height:56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.iconbtn{flex:none;width:40px;height:40px;border:0;border-radius:10px;background:none;display:grid;place-items:center;cursor:pointer;color:var(--fg)}
.iconbtn:hover{background:var(--bg-weak)}
.iconbtn svg{width:22px;height:22px}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:16px;white-space:nowrap;color:var(--fg);text-decoration:none;min-width:0}
.logo-mark{flex:none;width:28px;height:28px;border-radius:8px;background:var(--brand);color:var(--on-solid);display:grid;place-items:center;font-size:12px;font-weight:800;font-family:var(--mono);letter-spacing:0}
.logo .t{overflow:hidden;text-overflow:ellipsis}
.searchbtn{margin-left:auto;display:flex;align-items:center;gap:8px;height:40px;min-width:0;width:min(320px,42vw);padding:0 12px;border:0;border-radius:10px;background:var(--bg-weak);color:var(--fg-subtle);font-size:14px;cursor:pointer;text-align:left}
.searchbtn svg{flex:none;width:18px;height:18px}
.searchbtn span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.searchbtn kbd{margin-left:auto;font-family:var(--mono);font-size:11px;border:1px solid var(--line-strong);border-radius:5px;padding:1px 5px;color:var(--fg-subtle)}
.extlink{flex:none;font-size:14px;font-weight:700;color:var(--fg-muted);text-decoration:none;padding:8px 10px;border-radius:999px;white-space:nowrap}
.extlink:hover{background:var(--bg-weak)}
.progress{position:absolute;left:0;right:0;bottom:-1px;height:2px;background:transparent}
.progress i{display:block;height:100%;width:0;background:var(--brand);transition:width .1s linear}
.logo .ts{display:none}
.rail-links{display:none}
@media (max-width:720px){.extlink{display:none}.searchbtn{width:auto;flex:0 1 auto}.searchbtn span,.searchbtn kbd{display:none}.logo .t{display:none}.logo .ts{display:inline;font-size:16px}
  .rail-links{display:flex;gap:8px;padding:4px 16px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}
  .rail-links a{flex:1;text-align:center;padding:10px 12px;border-radius:var(--r-m);background:var(--bg-muted);color:var(--fg);font-size:14px;font-weight:700;text-decoration:none}}
@media (min-width:1080px){#menu{display:none}}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:1fr;max-width:1240px;margin:0 auto}
@media (min-width:1080px){.shell{grid-template-columns:288px minmax(0,1fr);gap:0}}
.rail{background:var(--bg);border-right:1px solid var(--line)}
@media (min-width:1080px){.rail{position:sticky;top:calc(57px + env(safe-area-inset-top,0px));height:calc(100vh - 57px - env(safe-area-inset-top,0px));overflow:auto;overscroll-behavior:contain;scrollbar-width:thin}}
@media (max-width:1079px){
  .rail{position:fixed;z-index:50;top:0;bottom:0;left:0;width:min(330px,88vw);overflow:auto;transform:translateX(-102%);transition:transform .22s ease;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px)}
  body.drawer .rail{transform:none}
  .scrim{position:fixed;inset:0;z-index:45;background:var(--scrim)}
}
.rail-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px}
.rail-head b{font-size:13px;color:var(--fg-subtle);font-weight:700;letter-spacing:.02em}
@media (min-width:1080px){.rail-head .iconbtn{display:none}}
.toc{list-style:none;margin:0;padding:4px 10px 28px}
.toc .part{font-size:12.5px;font-weight:800;color:var(--fg-subtle);padding:16px 8px 6px;letter-spacing:.01em;line-height:1.4}
.toc .part button{all:unset;cursor:pointer;display:block}
.toc .part button:hover{color:var(--fg)}
.toc .part button:focus-visible{outline:2px solid var(--info);border-radius:4px}
.ch{display:flex;align-items:flex-start;gap:8px;width:100%;border:0;background:none;text-align:left;padding:8px 10px;border-radius:10px;cursor:pointer;color:var(--fg-muted);font-size:14.5px;font-weight:600;line-height:1.45}
.ch:hover{background:var(--bg-weak);color:var(--fg)}
.ch .n{flex:none;min-width:22px;font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--fg-subtle);padding-top:2px}
.ch .tt{min-width:0;flex:1}
.ch.on{background:var(--brand-weak);color:var(--brand-fg)}
.ch.on .n{color:var(--brand-fg)}
.tag-a{display:inline-block;font-size:11px;font-weight:700;padding:0 6px;border-radius:5px;background:var(--purple-weak);color:var(--purple);margin-left:4px;vertical-align:1px;white-space:nowrap}
.subtoc{list-style:none;margin:2px 0 8px 30px;padding:0 0 0 10px;border-left:1.5px solid var(--line-strong)}
.subtoc a{display:block;font-size:13.5px;color:var(--fg-subtle);text-decoration:none;padding:4px 8px;border-radius:7px;line-height:1.45}
.subtoc a.d2{padding-left:20px;font-size:13px}
.subtoc a:hover{color:var(--fg);background:var(--bg-weak)}
.subtoc a.on{color:var(--fg);font-weight:700;background:var(--bg-weak)}

main{min-width:0}
.sheet{background:var(--bg)}
.sheet-in{max-width:800px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:36px 40px}
@media (max-width:600px){.sheet-in{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 32px}}

/* ---------- home ---------- */
.eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--brand-fg);margin-bottom:8px}
.hero h1{font-size:clamp(30px,6vw,42px);line-height:1.25;font-weight:800}
.lead{color:var(--fg-muted);font-size:17px;margin-top:12px;max-width:58ch}
.meta-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.chip{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 11px;border-radius:999px;font-size:13px;font-weight:700;background:var(--bg-weak);color:var(--fg-muted);white-space:nowrap}
.chip-brand{background:var(--brand-weak);color:var(--brand-fg)}
.chip-purple{background:var(--purple-weak);color:var(--purple)}
.chip-pos{background:var(--pos-weak);color:var(--pos)}
.resume{display:flex;align-items:center;gap:14px;margin-top:22px;padding:16px 18px;border-radius:var(--r-m);background:var(--brand-weak);border:0;width:100%;text-align:left;cursor:pointer;color:var(--fg)}
.resume:hover{background:var(--brand-line)}
.resume .k{flex:none;font-size:13px;font-weight:800;color:var(--brand-fg)}
.resume .v{min-width:0;flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.resume .go{flex:none;font-weight:800;color:var(--brand-fg)}
.home-h{font-size:22px;font-weight:800;margin-bottom:6px}
.home-sub{color:var(--fg-subtle);font-size:14.5px;margin-bottom:18px}
.partblock{margin-top:32px}
.partblock h3{font-size:14px;font-weight:800;color:var(--fg-subtle);margin-bottom:10px}
.cards{display:flex;flex-direction:column}
.card{display:flex;align-items:baseline;gap:14px;padding:11px 8px;margin:0 -8px;border:0;border-radius:var(--r-s,8px);background:none;text-align:left;cursor:pointer;color:var(--fg);font:inherit}
.card:hover{background:var(--bg-muted)}
.card .cn{flex:none;width:22px;font-size:14px;font-weight:600;color:var(--fg-subtle);text-align:right}
.card .ct{font-size:16px;font-weight:600;line-height:1.45}
.card .alg{flex:none;font-size:12px;font-weight:600;color:var(--purple)}

/* ---------- chapter ---------- */
.ch-head{padding-bottom:28px}
.ch-head h1{font-size:clamp(28px,5.4vw,38px);line-height:1.28;font-weight:800}
.ch-tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 16px;border-radius:var(--r-s);border:0;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn.sm{height:34px;padding:0 12px;font-size:13px}
.btn-brand{background:var(--brand);color:var(--on-solid)} .btn-brand:hover{background:var(--brand-press)}
.btn-weak{background:var(--bg-weak);color:var(--fg)} .btn-weak:hover{background:var(--line-strong)}
.loading{color:var(--fg-subtle);padding:40px 0}

/* sections: every top-level part of a chapter is its own white sheet */
.blk{background:var(--bg);padding-block:36px 40px;padding-left:max(20px,env(safe-area-inset-left,0px),calc((100% - 760px)/2));padding-right:max(20px,env(safe-area-inset-right,0px),calc((100% - 760px)/2))}
@media (max-width:600px){.blk{padding-block:28px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}
.sb>*:first-child{margin-top:0}
.sec-h{margin-bottom:14px}
.crumb{font-size:13px;font-weight:700;color:var(--brand-fg);margin-bottom:4px;line-height:1.4}
.sec-h .st{font-weight:800;line-height:1.35}
.sec-h.d1 .st{font-size:clamp(23px,4.4vw,28px)}
.sec.d2{margin-top:40px;padding-top:28px;border-top:1px solid var(--line)}
.sec-h.d2 .st{font-size:21px}
.sec.d3{margin-top:32px}
.sec-h.d3 .st{font-size:18px}
.sec-h.d3 .st::before{content:"";display:inline-block;width:6px;height:6px;border-radius:2px;background:var(--brand);margin-right:9px;vertical-align:4px}

/* prose */
.sb p{margin:12px 0 0}
.sb .gap{height:8px}
.sb ul,.sb ol{margin:10px 0 0;padding-left:24px}
.sb li{margin:5px 0}
.sb li>ul,.sb li>ol{margin-top:4px}
.sb li::marker{color:var(--fg-subtle)}
.sb ol>li::marker{font-weight:700;font-variant-numeric:tabular-nums}
.sb strong{font-weight:700}
.sb .nest{margin-left:22px}
.bh{margin:30px 0 4px;font-weight:800;line-height:1.4}
.bh1{font-size:21px}.bh2{font-size:19px}.bh3{font-size:17px}.bh4{font-size:16px;font-weight:700;color:var(--fg-muted)}
.sb code{font-family:var(--mono);font-size:.84em;background:var(--bg-weak);padding:1px 3px;border-radius:4px;color:var(--crit-fg);-webkit-box-decoration-break:clone;box-decoration-break:clone}
.sb a.ext{color:var(--info-fg);text-underline-offset:3px}
.sb a.pm{color:var(--fg);font-weight:600;text-decoration:none;background:var(--bg-weak);padding:1px 7px;border-radius:6px}
.sb a.pm::before{content:"↳ ";color:var(--fg-subtle)}
.sb a.pm:hover{background:var(--line-strong)}
.pm.off{color:var(--fg-subtle)}
.fg-red{color:var(--crit-fg)}.fg-blue{color:var(--info-fg)}.fg-green,.fg-teal{color:var(--pos)}.fg-orange{color:var(--brand-fg)}.fg-yellow,.fg-brown{color:var(--warn-fg)}.fg-purple,.fg-pink{color:var(--purple)}.fg-gray{color:var(--fg-subtle)}
.bg-red{background:var(--crit-weak)}.bg-blue{background:var(--info-weak)}.bg-green,.bg-teal{background:var(--pos-weak)}.bg-orange{background:var(--brand-weak)}.bg-yellow,.bg-brown{background:var(--warn-weak)}.bg-purple,.bg-pink{background:var(--purple-weak)}.bg-gray{background:var(--bg-weak)}
.callout{display:flex;gap:12px;align-items:flex-start;margin:16px 0 0;padding:14px 16px;border-radius:var(--r-m);background:var(--bg-muted)}
.callout .ic{flex:none;font-size:18px;line-height:1.5}
.callout .cb{min-width:0;flex:1;font-size:15.5px}
.callout .cb>p:first-child,.callout .cb>*:first-child{margin-top:0}
blockquote{margin:16px 0 0;padding:2px 0 2px 16px;border-left:3px solid var(--fg);color:var(--fg-muted)}
hr{border:0;border-top:1px solid var(--line);margin:24px 0}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:12px}
.cols>.col{min-width:0}
.cols>.col>*:first-child{margin-top:0}

figure{margin:18px 0 0}
figure.img{margin-inline:auto;max-width:100%}
figure.img img{display:block;width:100%;height:auto;border-radius:var(--r-s);background:#fff;border:1px solid var(--line)}
figcaption{font-size:13.5px;color:var(--fg-subtle);margin-top:8px;text-align:center;line-height:1.5}
.imgmiss{display:inline-block;padding:10px 14px;border-radius:var(--r-s);background:var(--bg-weak);font-size:14px}

figure.code{border-radius:var(--r-m);background:var(--bg-muted);border:1px solid var(--line);overflow:hidden}
.code-h{display:flex;align-items:center;justify-content:space-between;padding:6px 8px 6px 14px;border-bottom:1px solid var(--line);font-size:12px;font-weight:700;color:var(--fg-subtle);font-family:var(--mono)}
.cp{border:0;background:none;color:var(--fg-subtle);font-size:12px;font-weight:700;padding:4px 9px;border-radius:6px;cursor:pointer;font-family:var(--font)}
.cp:hover{background:var(--bg-weak);color:var(--fg)}
figure.code pre{margin:0;padding:14px 16px;overflow-x:auto;font-family:var(--mono);font-size:13.5px;line-height:1.65;tab-size:4}
figure.code pre code{font-family:inherit;background:none;padding:0;color:var(--fg);font-size:inherit}
figure.code figcaption{text-align:left;padding:0 14px 10px}
.hljs-keyword,.hljs-meta .hljs-keyword,.hljs-selector-tag,.hljs-literal{color:var(--c-kw);font-weight:600}
.hljs-string,.hljs-regexp,.hljs-meta .hljs-string{color:var(--c-str)}
.hljs-number,.hljs-symbol{color:var(--c-num)}
.hljs-comment,.hljs-quote{color:var(--c-com);font-style:italic}
.hljs-title,.hljs-title.function_,.hljs-title.class_,.hljs-section{color:var(--c-fn)}
.hljs-built_in,.hljs-type,.hljs-params .hljs-type{color:var(--c-bi)}
.hljs-meta{color:var(--c-com)}

.tbl{overflow-x:auto;margin-top:16px;border:1px solid var(--line);border-radius:var(--r-m)}
.tbl table{border-collapse:collapse;width:100%;font-size:15px;line-height:1.6}
.tbl th,.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:left;vertical-align:top;min-width:80px}
.tbl tr>*:last-child{border-right:0}
.tbl tbody tr:last-child>*{border-bottom:0}
.tbl thead th{background:var(--bg-muted);font-weight:700;color:var(--fg-muted);font-size:14px}
.tbl tbody th{font-weight:700;background:var(--bg-muted)}

.mx-d{margin:16px 0 0;overflow-x:auto;overflow-y:hidden;text-align:center;padding:6px 0}
.mx,.mx-d{font-family:var(--mono);font-size:.95em}
.mx.ok,.mx-d.ok{font-family:inherit;font-size:inherit}
.mx svg{vertical-align:-0.2em;max-width:100%}
mjx-container[display="true"]{margin:0!important}
mjx-assistive-mml{display:none!important}
.nw{white-space:nowrap}

.file{display:flex;align-items:center;gap:12px;margin-top:14px;padding:12px 14px;border-radius:var(--r-m);border:1px solid var(--line)}
.file .fi{flex:none;font-size:18px}
.file .fn{min-width:0;flex:1;display:flex;flex-direction:column;line-height:1.45}
.file .fn small{color:var(--fg-subtle);font-size:13px}
.bm{display:flex;flex-direction:column;gap:2px;margin-top:14px;padding:14px 16px;border-radius:var(--r-m);border:1px solid var(--line);text-decoration:none;color:var(--fg)}
.bm:hover{background:var(--bg-muted)}
.bm span{font-size:14px;color:var(--fg-muted)}
.bm small{font-size:12.5px;color:var(--fg-subtle);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.pager{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pager button{display:flex;flex-direction:column;gap:4px;padding:16px;border-radius:var(--r-m);background:var(--bg-muted);border:1.5px solid transparent;cursor:pointer;text-align:left;color:var(--fg);min-width:0}
.pager button:hover{border-color:var(--line-strong)}
.pager button.next{text-align:right;align-items:flex-end}
.pager small{font-size:13px;font-weight:700;color:var(--fg-subtle)}
.pager b{font-size:15px;line-height:1.4}
.pager button:disabled{visibility:hidden}
.foot{color:var(--fg-subtle);font-size:13px;line-height:1.6}

/* ---------- search ---------- */
.dlg{position:fixed;inset:0;z-index:60;background:var(--scrim);display:flex;justify-content:center;align-items:flex-start;padding:calc(64px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 12px max(12px,env(safe-area-inset-left,0px))}
.dlg-box{width:min(680px,100%);max-height:calc(100vh - 100px);display:flex;flex-direction:column;background:var(--bg);border-radius:var(--r-l);box-shadow:var(--shadow);overflow:hidden}
.dlg-top{display:flex;align-items:center;gap:8px;padding:10px 10px 10px 16px;border-bottom:1px solid var(--line)}
.dlg-top svg{flex:none;width:20px;height:20px;color:var(--fg-subtle)}
#q{flex:1;min-width:0;border:0;background:none;height:40px;font-size:17px;outline:none}
.res{overflow:auto;padding:6px}
.res .hint{padding:18px 12px;color:var(--fg-subtle);font-size:14.5px}
.hit{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:10px;cursor:pointer;color:var(--fg)}
.hit:hover,.hit.sel{background:var(--bg-weak)}
.hit .hp{font-size:12.5px;font-weight:700;color:var(--brand-fg);line-height:1.4}
.hit .ht{font-weight:700;font-size:15.5px;line-height:1.45}
.hit .hs{font-size:13.5px;color:var(--fg-muted);line-height:1.55;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hit mark{background:var(--brand-weak);color:var(--brand-fg);border-radius:3px;padding:0 1px}
.res .count{font-size:12.5px;color:var(--fg-subtle);padding:6px 12px 2px;font-weight:700}

.totop{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--bg);box-shadow:var(--shadow);display:grid;place-items:center;cursor:pointer;color:var(--fg)}
.totop svg{width:20px;height:20px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:700}

.vz-more{margin:8px 0 0;font-size:14px;text-align:right}
.vz-more a{color:var(--brand-fg);font-weight:700;text-decoration:none}
.vz-more a:hover{text-decoration:underline}
.vz{margin:22px 0 4px;border:1.5px solid var(--brand-line);border-radius:var(--r-l);background:var(--bg);overflow:hidden;font-size:15px;line-height:1.6}
.vz *{box-sizing:border-box}
.vz-head{display:flex;flex-direction:column;gap:2px;padding:16px 18px 12px;background:var(--brand-weak)}
.vz-kick{font-size:12.5px;font-weight:800;color:var(--brand-fg);letter-spacing:.02em}
.vz-title{font-size:17px;font-weight:800;color:var(--fg);line-height:1.4}
.vz-sub{font-size:14px;color:var(--fg-muted)}
.vz-sub code{font-family:var(--mono);font-size:.86em;background:var(--bg);padding:0 5px;border-radius:4px;color:var(--fg)}
.vz-ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;padding:12px 18px;border-bottom:1px solid var(--line)}
.vz-row{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;width:100%}
.vz-f{display:flex;flex-direction:column;gap:3px;font-size:12.5px;font-weight:700;color:var(--fg-subtle)}
.vz-f input,.vz-f select{height:36px;min-width:0;width:6.5em;max-width:100%;border:1px solid var(--line-strong);border-radius:8px;background:var(--bg);color:var(--fg);padding:0 10px;font:inherit;font-size:14px;font-weight:600;font-family:var(--mono)}
.vz-f select{width:auto;font-family:var(--font)}
.vz-chk{display:flex;align-items:center;gap:6px;height:36px;font-size:14px;font-weight:600;color:var(--fg-muted)}
.vz-b{height:36px;padding:0 13px;border-radius:8px;border:0;background:var(--bg-weak);color:var(--fg);font:inherit;font-size:13.5px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:var(--mono)}
.vz-b:hover{background:var(--line-strong)}
.vz-b.pri{background:var(--brand);color:var(--on-solid)}
.vz-b.pri:hover{background:var(--brand-press)}
.vz-b.ghost{background:none;color:var(--fg-subtle);font-family:var(--font)}
.vz-b.ghost:hover{background:var(--bg-weak);color:var(--fg)}
.vz-seg{display:inline-flex;gap:2px;padding:3px;border-radius:10px;background:var(--bg-weak);flex-wrap:wrap}
.vz-seg button{border:0;background:none;height:30px;padding:0 12px;border-radius:7px;font:inherit;font-size:13.5px;font-weight:700;color:var(--fg-muted);cursor:pointer}
.vz-seg button[aria-pressed="true"]{background:var(--bg);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.vz-presets{display:flex;flex-wrap:wrap;gap:6px}
.vz-chip{height:30px;padding:0 10px;border-radius:999px;border:1px solid var(--line-strong);background:var(--bg);color:var(--fg-muted);font-family:var(--mono);font-size:12.5px;cursor:pointer}
.vz-chip:hover{border-color:var(--fg-subtle);color:var(--fg)}
.vz-body{display:grid;grid-template-columns:minmax(0,1fr);gap:0}
@media (min-width:1180px){.vz-body.wide{grid-template-columns:minmax(0,1fr) 340px}}
.vz-left{min-width:0;padding:16px 18px 14px;display:flex;flex-direction:column;gap:12px}
.vz-stage{min-width:0;display:flex;flex-direction:column;gap:12px;overflow-x:auto}
.vz-say{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-m);background:var(--fg);color:var(--bg);min-height:52px}
.vz-say .vz-step{flex:none;font-size:12px;font-weight:800;padding:2px 8px;border-radius:999px;background:rgba(127,127,127,.3);margin-top:2px;white-space:nowrap}
.vz-say .vz-msg{min-width:0;flex:1;font-size:15px;font-weight:600;line-height:1.55}
.vz-say .vz-msg b{color:var(--brand)}
.vz-say .vz-msg code{font-family:var(--mono);font-size:.88em;background:rgba(127,127,127,.25);padding:0 4px;border-radius:4px;color:inherit}
.vz-say[data-tone="good"]{background:var(--pos)}
.vz-say[data-tone="good"] .vz-msg b{color:#fff;text-decoration:underline;text-underline-offset:3px}
.vz-say[data-tone="bad"]{background:var(--crit)}
.vz-say[data-tone="bad"] .vz-msg b{color:#fff;text-decoration:underline;text-underline-offset:3px}
.vz-say[data-tone="good"],.vz-say[data-tone="bad"]{color:#fff}
.vz-play{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.vz-ib{width:38px;height:34px;border:0;border-radius:8px;background:var(--bg-weak);color:var(--fg);font-size:13px;cursor:pointer}
.vz-ib:hover{background:var(--line-strong)}
.vz-ib.vz-go{background:var(--fg);color:var(--bg);width:46px}
.vz-count{font-size:13px;color:var(--fg-subtle);font-weight:700;margin:0 4px;font-variant-numeric:tabular-nums}
.vz-speed{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--fg-subtle);font-weight:700}
.vz-speed select{height:32px;border:1px solid var(--line-strong);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit;font-size:13px;padding:0 6px}
.vz-code{border-top:1px solid var(--line);background:var(--bg-muted);min-width:0}
.vz-code summary{cursor:pointer;padding:10px 18px;font-size:13px;font-weight:800;color:var(--fg-muted);list-style:none}
.vz-code summary::-webkit-details-marker{display:none}
.vz-code summary::before{content:"▸ "}
.vz-code[open] summary::before{content:"▾ "}
.vz-code-t{padding:0 18px 6px;font-size:12.5px;font-weight:700;color:var(--brand-fg);font-family:var(--mono)}
.vz-code pre{margin:0;padding:4px 0 14px;max-height:300px;overflow:auto;font-family:var(--mono);font-size:12.5px;line-height:1.7;scroll-behavior:smooth}
.vz-code .ln{display:block;padding:0 14px 0 0;white-space:pre;color:var(--fg-muted);border-left:3px solid transparent}
.vz-code .ln i{display:inline-block;width:34px;text-align:right;padding-right:10px;color:var(--fg-disabled);font-style:normal;user-select:none}
.vz-code .ln.on{background:var(--brand-weak);color:var(--fg);border-left-color:var(--brand);font-weight:600}
@media (min-width:1180px){.vz-body.wide .vz-code{border-top:0;border-left:1px solid var(--line)}.vz-body.wide .vz-code pre{max-height:520px}}
.vz-meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px;color:var(--fg-muted);align-items:center}
.vz-meta b{color:var(--fg);font-variant-numeric:tabular-nums}
.vz-meta .good{color:var(--pos);font-weight:700}.vz-meta .bad{color:var(--crit-fg);font-weight:700}
.vz-meta .pill{font-size:12.5px;font-weight:700;padding:1px 9px;border-radius:999px;background:var(--bg-weak);color:var(--fg-subtle);font-family:var(--mono)}
.vz-meta .pill.on{background:var(--info-weak);color:var(--info-fg)}
.vz-meta .pill.on.bad{background:var(--crit-weak);color:var(--crit-fg)}
.vz-cap{font-size:12.5px;font-weight:800;color:var(--fg-subtle);margin-bottom:6px}
.vz-two{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;align-items:start}
.vz-two>*{min-width:0}
.vz-empty{color:var(--fg-subtle);padding:20px 0;text-align:center}
.vz-err{color:var(--crit-fg);padding:12px 18px}

/* array cells */
.vz-strip{display:flex;flex-wrap:wrap;gap:4px}
.vz-cell{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:46px;height:52px;padding:0 6px;border-radius:9px;background:var(--bg-muted);border:1.5px solid var(--line-strong);transition:background .2s,border-color .2s,transform .2s}
.vz-strip.big .vz-cell{min-width:54px;height:60px}
.vz-cell .v{font-size:17px;font-weight:800;font-family:var(--mono);line-height:1.1;font-variant-numeric:tabular-nums}
.vz-cell .i{position:absolute;bottom:-1px;font-size:10.5px;color:var(--fg-subtle);font-family:var(--mono);transform:translateY(100%)}
.vz-strip{padding-bottom:18px}
.vz-cell.empty{background:transparent;border-style:dashed}
.vz-cell.out{opacity:.55}
.vz-cell.ghost{opacity:.6;border-style:dotted;background:transparent;min-width:34px}
.vz-cell.hit{background:var(--pos-weak);border-color:var(--pos)}
.vz-cell.cmp{background:var(--info-weak);border-color:var(--info)}
.vz-cell.mark,.vz-cell.cur{background:var(--brand-weak);border-color:var(--brand)}
.vz-cell.from{background:var(--warn-weak);border-color:var(--warn-fg)}
.vz-cell.to,.vz-cell.in{background:var(--brand);border-color:var(--brand);color:var(--on-solid)}
.vz-cell.to .v,.vz-cell.in .v{color:var(--on-solid)}
.vz-cell.gone,.vz-cell.out2{background:var(--crit-weak);border-color:var(--crit)}
.vz-cell.swap{background:var(--purple-weak);border-color:var(--purple)}
.vz-cell.pick{border-color:var(--purple);border-width:2.5px}
.vz-cell.par{background:var(--info-weak);border-color:var(--info)}
.vz-cell.kid{background:var(--pos-weak);border-color:var(--pos)}
.vz-cell .tg{position:absolute;top:-2px;left:50%;transform:translate(-50%,-100%);display:flex;gap:2px;white-space:nowrap}
.vz-cell .tg b{font-size:10.5px;font-weight:800;padding:0 5px;border-radius:5px;line-height:1.6}
.qf{background:var(--info);color:#fff}.qr{background:var(--brand);color:#fff}
.vz-strip.q{padding-top:22px}

/* matrix (sparse) */
.vz-mat{display:grid;grid-template-columns:repeat(6,minmax(0,40px));gap:4px}
.vz-mc{height:40px;border:1px solid var(--line-strong);border-radius:8px;background:var(--bg);color:var(--fg-disabled);font-family:var(--mono);font-weight:700;font-size:15px;cursor:pointer;padding:0}
.vz-mc.nz{background:var(--brand-weak);border-color:var(--brand);color:var(--brand-fg)}
.vz-mc.hl{outline:2px solid var(--info);outline-offset:1px}
.vz-tbl{overflow-x:auto}
.vz-tbl table{border-collapse:collapse;font-family:var(--mono);font-size:13.5px}
.vz-tbl th,.vz-tbl td{border:1px solid var(--line);padding:5px 12px;text-align:center}
.vz-tbl th{background:var(--bg-muted);color:var(--fg-muted);font-family:var(--font);font-size:12.5px}
.vz-tbl tr.hl td{background:var(--info-weak)}

/* linked list */
.ll{display:flex;align-items:center;flex-wrap:wrap;row-gap:44px;padding:30px 4px 32px;min-height:120px}
.ll-node{position:relative;transition:transform .25s}
.ll-box{display:flex;border:2px solid var(--fg);border-radius:10px;overflow:hidden;background:var(--bg)}
.ll-box .d{min-width:46px;padding:8px 10px;text-align:center;font-weight:800;font-family:var(--mono);font-size:16px}
.ll-box .nx{width:26px;display:grid;place-items:center;border-left:2px solid var(--fg);background:var(--bg-muted);font-size:12px;color:var(--fg-subtle)}
.ll-node.new .ll-box{border-style:dashed;border-color:var(--brand);background:var(--brand-weak)}
.ll-node.new .ll-box .nx{border-color:var(--brand)}
.ll-node.hit .ll-box{border-color:var(--pos);background:var(--pos-weak)}
.ll-node.cmp .ll-box{border-color:var(--info);background:var(--info-weak)}
.ll-node.gone{opacity:.45}
.ll-node.gone .ll-box{border-color:var(--crit);border-style:dashed}
.ll-node.lift{transform:translateY(-30px)}
.ll-ptr{position:absolute;left:50%;transform:translateX(-50%);font-size:11.5px;font-weight:800;white-space:nowrap;padding:1px 7px;border-radius:999px}
.ll-ptr.top{top:-26px;background:var(--fg);color:var(--bg)}
.ll-ptr.bot{bottom:-26px;background:var(--brand);color:var(--on-solid)}
.ll-head{font-size:11.5px;font-weight:800;padding:1px 7px;border-radius:999px;background:var(--fg);color:var(--bg);margin-right:8px}
.ll-arrow{width:34px;height:2px;background:var(--fg);position:relative;flex:none;margin:0 2px}
.ll-arrow::after{content:"";position:absolute;right:-1px;top:-5px;border:6px solid transparent;border-left:8px solid var(--fg);border-right:0}
.ll-arrow.off{background:transparent;border-top:2px dashed var(--fg-disabled);height:0}
.ll-arrow.off::after{display:none}
.ll-arrow.skip{width:60px;background:var(--brand)}
.ll-arrow.skip::after{border-left-color:var(--brand)}
.ll-none{font-family:var(--mono);font-size:13px;color:var(--fg-subtle);padding:0 4px}

/* stack */
.sk-col{display:flex;flex-direction:column;gap:3px;width:min(220px,100%);border:2px solid var(--fg);border-top:0;border-radius:0 0 12px 12px;padding:6px}
.sk-cell{position:relative;display:flex;align-items:center;gap:10px;height:36px;border-radius:7px;padding:0 10px;background:var(--bg-muted);border:1.5px solid var(--line-strong);transition:background .2s}
.sk-cell .i{font-size:11px;color:var(--fg-subtle);font-family:var(--mono);width:12px}
.sk-cell .v{font-weight:800;font-family:var(--mono);font-size:16px}
.sk-cell .t{margin-left:auto;font-size:11.5px;font-weight:800;color:var(--brand-fg)}
.sk-cell.empty{background:transparent;border-style:dashed;border-color:var(--line)}
.sk-cell.top{border-color:var(--fg)}
.sk-cell.in{background:var(--brand);border-color:var(--brand);color:var(--on-solid)}
.sk-cell.in .t,.sk-cell.in .i{color:var(--on-solid)}
.sk-cell.out{background:var(--crit-weak);border-color:var(--crit)}
.sk-cell.hit{background:var(--pos-weak);border-color:var(--pos)}
.sk-side{display:flex;flex-direction:column;gap:12px}
.tape{display:flex;flex-wrap:wrap;gap:4px}
.tape span{min-width:30px;height:36px;padding:0 8px;display:grid;place-items:center;border-radius:7px;background:var(--bg-muted);border:1.5px solid var(--line-strong);font-family:var(--mono);font-weight:800}
.tape span.on{background:var(--brand);border-color:var(--brand);color:var(--on-solid)}
.tape span.done{opacity:.45}
.tape.out span{background:var(--pos-weak);border-color:var(--pos);color:var(--fg)}
.tape .ph{background:none!important;border:0!important;color:var(--fg-subtle);font-weight:600;font-family:var(--font)}
.sk-out{align-self:flex-start;padding:8px 14px;border-radius:10px;font-family:var(--mono);font-weight:800;font-size:16px;background:var(--bg-weak)}
.sk-out.good{background:var(--pos-weak);color:var(--pos)}
.sk-out.bad{background:var(--crit-weak);color:var(--crit-fg)}

/* queue ring */
.ring .rs{fill:var(--bg-muted);stroke:var(--line-strong);stroke-width:1.5}
.ring .rs.used{fill:var(--brand-weak);stroke:var(--brand-line)}
.ring .rs.mark{fill:var(--warn-weak);stroke:var(--warn-fg)}
.ring .rs.in{fill:var(--brand);stroke:var(--brand)}
.ring .rs.hit{fill:var(--pos-weak);stroke:var(--pos)}
.ring .rv{text-anchor:middle;font-family:var(--mono);font-weight:800;font-size:15px;fill:var(--fg)}
.ring .ri{text-anchor:middle;font-family:var(--mono);font-size:11px;fill:var(--fg-subtle)}
.ring .fmk line{stroke:var(--info);stroke-width:3;stroke-linecap:round}
.ring .rmk line{stroke:var(--brand);stroke-width:3;stroke-linecap:round}
.ring .fmk text,.ring .rmk text{text-anchor:middle;font-weight:800;font-size:12px}
.ring .fmk text{fill:var(--info-fg)}.ring .rmk text{fill:var(--brand-fg)}
.ring .hub{fill:var(--fg)}
.q-right{display:flex;flex-direction:column;gap:10px}

/* trees */
.tree-wrap,.graph-wrap,.grid-wrap{overflow-x:auto}
.vz-svg{display:block;width:100%;height:auto;margin:0 auto}
.vz-svg .e{stroke:var(--line-strong);stroke-width:2}
.vz-svg .n circle{fill:var(--bg);stroke:var(--fg);stroke-width:2;transition:fill .2s}
.vz-svg .n text{text-anchor:middle;font-family:var(--mono);font-weight:800;font-size:15px;fill:var(--fg)}
.vz-svg .n text.ix{font-size:10.5px;font-weight:600;fill:var(--fg-subtle)}
.vz-svg .n text.badge{font-size:11px;fill:var(--pos)}
.vz-svg .n{cursor:pointer;outline:none}
.vz-svg .n:focus-visible circle{stroke:var(--info);stroke-width:3}
.vz-svg .n.cur circle,.vz-svg .n.mark circle{fill:var(--brand);stroke:var(--brand)}
.vz-svg .n.cur text:not(.ix):not(.badge),.vz-svg .n.mark text:not(.ix){fill:var(--on-solid)}
.vz-svg .n.done circle,.vz-svg .n.hit circle{fill:var(--pos-weak);stroke:var(--pos)}
.vz-svg .n.onstack circle{fill:var(--warn-weak);stroke:var(--warn-fg)}
.vz-svg .n.cmp circle,.vz-svg .n.par circle{fill:var(--info-weak);stroke:var(--info)}
.vz-svg .n.kid circle{fill:var(--pos-weak);stroke:var(--pos)}
.vz-svg .n.swap circle{fill:var(--purple-weak);stroke:var(--purple)}
.vz-svg .n.pick circle{stroke:var(--purple);stroke-width:3.5}
.vz-svg .n.gone circle{fill:var(--crit-weak);stroke:var(--crit);stroke-dasharray:4 3}
.callstack{display:flex;flex-direction:column;gap:3px}
.callstack div{font-family:var(--mono);font-size:13px;padding:5px 10px;border-radius:7px;background:var(--bg-muted);border:1px solid var(--line);color:var(--fg-muted)}
.callstack div.top{background:var(--warn-weak);border-color:var(--warn-fg);color:var(--fg);font-weight:700}
.callstack .empty{color:var(--fg-subtle)}

/* graph */
.graph .ge{stroke:var(--line-strong);stroke-width:2.5;transition:stroke .2s}
.graph .ge.tree{stroke:var(--pos);stroke-width:4}
.graph .ge.look{stroke:var(--brand);stroke-width:4;stroke-dasharray:6 4}
.graph .ge.rej{stroke:var(--crit);stroke-dasharray:3 4;opacity:.7}
.graph .garh{fill:var(--fg-subtle)}
.graph .gn>circle{fill:var(--bg);stroke:var(--fg);stroke-width:2}

<script>/* ===== DSViz core: player, helpers ===== */
const DSViz = (() => {
  const REG = {};
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const clone = o => JSON.parse(JSON.stringify(o));
  let uid = 0;
  const nid = p => `${p}-${++uid}`;

  function el(tag, cls, html) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  }

  /* A widget shell: header, controls slot, stage, message bar, step player, code panel */
  function shell(root, { title, sub, kicker = '직접 해보기' }) {
    root.classList.add('vz');
    root.innerHTML = '';
    const head = el('div', 'vz-head', `<span class="vz-kick">${esc(kicker)}</span><b class="vz-title">${esc(title)}</b>${sub ? `<span class="vz-sub">${sub}</span>` : ''}`);
    const ctrl = el('div', 'vz-ctrl');
    const stage = el('div', 'vz-stage');
    const say = el('div', 'vz-say', '<span class="vz-step">준비</span><span class="vz-msg">버튼을 눌러 연산을 실행해 보세요.</span>');
    const play = el('div', 'vz-play');
    const code = el('details', 'vz-code');
    code.open = true;
    code.innerHTML = '<summary>코드 보기</summary><div class="vz-code-t"></div><pre></pre>';
    const body = el('div', 'vz-body');
    const left = el('div', 'vz-left');
    left.append(stage, say, play);
    body.append(left, code);
    if (root.dataset.wide) body.classList.add('wide');
    root.append(head, ctrl, body);
    return { root, head, ctrl, stage, say, play, code, body };
  }

  /* Player: steps through frames, calls render(frame) */
  class Player {
    constructor(ui, render) {
      this.ui = ui; this.render = render; this.frames = []; this.i = 0; this.timer = null; this.speed = 750; this.codeSrc = null;
      const id = nid('spd');
      ui.play.innerHTML = `
        <button type="button" class="vz-ib" data-a="first" aria-label="처음 단계">⏮</button>
        <button type="button" class="vz-ib" data-a="prev" aria-label="이전 단계">◀</button>
        <button type="button" class="vz-ib vz-go" data-a="toggle" aria-label="자동 재생">▶</button>
        <button type="button" class="vz-ib" data-a="next" aria-label="다음 단계">▶|</button>
        <span class="vz-count num">0 / 0</span>
        <label class="vz-speed" for="${id}">속도
          <select id="${id}"><option value="1300">느리게</option><option value="750" selected>보통</option><option value="300">빠르게</option></select></label>`;
      ui.play.addEventListener('click', e => {
        const a = e.target.closest('[data-a]'); if (!a) return;
        const k = a.dataset.a;
        if (k === 'first') { this.stop(); this.go(0); }
        if (k === 'prev') { this.stop(); this.go(this.i - 1); }
        if (k === 'next') { this.stop(); this.go(this.i + 1); }
        if (k === 'toggle') { this.timer ? this.stop() : this.start(); }
      });
      ui.play.querySelector('select').addEventListener('change', e => { this.speed = +e.target.value; if (this.timer) { this.stop(); this.start(); } });
    }
    setCode(title, src) {
      if (this.codeSrc === src) return;
      this.codeSrc = src;
      this.ui.code.querySelector('.vz-code-t').textContent = title || '';
      const lines = src.replace(/\n$/, '').split('\n');
      this.ui.code.querySelector('pre').innerHTML = lines.map((l, i) => `<span class="ln" data-l="${i + 1}"><i>${i + 1}</i>${esc(l) || ' '}</span>`).join('');
    }
    load(frames, { code, codeTitle, autoplay = true } = {}) {
      this.stop();
      if (code) this.setCode(codeTitle, code);
      this.frames = frames;
      this.go(0);
      if (autoplay && frames.length > 1) this.start();
    }
    go(i) {
      if (!this.frames.length) return;
      this.i = Math.max(0, Math.min(this.frames.length - 1, i));
      const f = this.frames[this.i];
      this.render(f);
      const s = this.ui.say;
      s.querySelector('.vz-step').textContent = f.tag || `${this.i + 1}단계`;
      s.querySelector('.vz-msg').innerHTML = f.msg || '';
      s.dataset.tone = f.tone || '';
      this.ui.play.querySelector('.vz-count').textContent = `${this.i + 1} / ${this.frames.length}`;
      this.ui.code.querySelectorAll('.ln').forEach(n => n.classList.toggle('on', (f.lines || [f.line]).includes(+n.dataset.l)));
      const on = this.ui.code.querySelector('.ln.on');
      if (on) { const pre = on.parentElement; const top = on.offsetTop - pre.clientHeight / 2; if (top > pre.scrollTop + pre.clientHeight - 30 || top < pre.scrollTop - 10 || true) pre.scrollTop = Math.max(0, top); }
      if (this.i >= this.frames.length - 1) this.stop();
    }
    start() {
      if (this.i >= this.frames.length - 1) this.go(0);
      const b = this.ui.play.querySelector('.vz-go'); b.textContent = '⏸'; b.setAttribute('aria-label', '일시 정지');
      this.timer = setInterval(() => { if (this.i >= this.frames.length - 1) this.stop(); else this.go(this.i + 1); }, this.speed);
    }
    stop() {
      clearInterval(this.timer); this.timer = null;
      const b = this.ui.play.querySelector('.vz-go'); if (b) { b.textContent = '▶'; b.setAttribute('aria-label', '자동 재생'); }
    }
  }

  /* small form helpers */
  function field(label, attrs) {
    const id = nid('f');
    return `<label class="vz-f" for="${id}"><span>${label}</span><input id="${id}" ${attrs}></label>`;
  }
  function btn(label, act, cls = '') { return `<button type="button" class="vz-b ${cls}" data-act="${act}">${label}</button>`; }
  function seg(name, opts, cur) {
    return `<div class="vz-seg" role="group" aria-label="${esc(name)}">` + opts.map(([v, l]) => `<button type="button" data-mode="${v}" aria-pressed="${v === cur}">${l}</button>`).join('') + '</div>';
  }
  const num = v => { const n = Number(String(v).trim()); return Number.isFinite(n) ? n : NaN; };

  /* tree layout in SVG: nodes = {idx:value} (1-based array), returns positions */
  function treeLayout(arr, W = 560) {
    const n = arr.length - 1;
    const exists = i => i <= n && arr[i] !== null && arr[i] !== undefined;
    let x = 0; const pos = {}; let maxD = 0;
    (function walk(i, d) {
      if (!exists(i)) return;
      walk(2 * i, d + 1);
      pos[i] = { x: x++, d };
      maxD = Math.max(maxD, d);
      walk(2 * i + 1, d + 1);
    })(1, 0);
    const cnt = Math.max(1, x);
    const gap = Math.min(64, (W - 40) / cnt);
    const ox = (W - gap * (cnt - 1)) / 2;
    for (const k in pos) { pos[k].px = ox + pos[k].x * gap; pos[k].py = 34 + pos[k].d * 66; }
    return { pos, h: 34 + maxD * 66 + 40, W };
  }
  function treeSVG(arr, { W = 560, cls = {}, sub = {}, labelIdx = true } = {}) {
    const { pos, h } = treeLayout(arr, W);
    let edges = '', nodes = '';
    for (const k in pos) {
      const i = +k, p = pos[k];
      const par = i >> 1;
      if (i > 1 && pos[par]) edges += `<line x1="${pos[par].px}" y1="${pos[par].py}" x2="${p.px}" y2="${p.py}" class="e ${cls['e' + i] || ''}"/>`;
      nodes += `<g class="n ${cls[i] || ''}" data-i="${i}" transform="translate(${p.px},${p.py})" tabindex="0" role="button" aria-label="노드 ${esc(arr[i])}, 인덱스 ${i}"><circle r="20"/><text dy=".35em">${esc(arr[i])}</text>${labelIdx ? `<text class="ix" dy="34">${i}</text>` : ''}${sub[i] ? `<text class="badge" dx="22" dy="-16">${esc(sub[i])}</text>` : ''}</g>`;
    }
    return `<svg class="vz-svg" viewBox="0 0 ${W} ${h}" style="max-width:${W}px">${edges}${nodes}</svg>`;
  }
  function arrayStrip(arr, { from = 1, cls = {}, label = 'index', cap } = {}) {
    const end = cap != null ? cap : arr.length;
    let cells = '';
    for (let i = from; i < end; i++) {
      const v = arr[i];
      cells += `<div class="vz-cell ${v === null || v === undefined ? 'empty' : ''} ${cls[i] || ''}"><span class="v">${v === null || v === undefined ? '' : esc(v)}</span><span class="i">${i}</span></div>`;
    }
    return `<div class="vz-strip" aria-label="${esc(label)}">${cells}</div>`;
  }

  function register(name, fn) { REG[name] = fn; }
  function mount(node) {
    if (node.dataset.mounted) return;
    const fn = REG[node.dataset.viz];
    if (!fn) return;
    node.dataset.mounted = '1';
    try { fn(node, node.dataset.vmode || ''); } catch (e) { node.innerHTML = '<p class="vz-err">시각화를 불러오지 못했습니다.</p>'; console.error(e); }
  }
  function mountAll(root = document) { root.querySelectorAll('[data-viz]').forEach(mount); }

  return { register, mount, mountAll, shell, Player, field, btn, seg, num, esc, clone, el, treeSVG, treeLayout, arrayStrip, nid };
})();

/* ===== 배열 ===== */
DSViz.register('array', (root) => {
  const { shell, Player, field, btn, num, esc, clone } = DSViz;
  const CAP = 8;
  const ui = shell(root, { title: '배열: 연속된 칸에서 읽기·삽입·삭제', sub: '크기 8짜리 배열. 중간에 넣거나 빼면 뒤쪽 원소가 한 칸씩 움직입니다.' });
  ui.ctrl.innerHTML = field('위치 i', 'type="number" min="0" max="7" value="1" data-k="i"') + field('값', 'type="number" value="10" data-k="v"') +
    btn('a[i] 읽기', 'get') + btn('i에 삽입', 'ins', 'pri') + btn('i 삭제', 'del') + btn('값 찾기', 'find') + btn('처음 상태로', 'reset', 'ghost');
  let st = { a: [3, 8, 12, 5, 7, null, null, null], n: 5 };
  const CODE = {
    get: ['읽기 a[i]', 'def get(a, i):\n    # 주소 = 시작 주소 + i × 칸 크기\n    return a[i]            # O(1)'],
    ins: ['삽입 insert(i, v)', 'def insert(a, n, i, v):\n    if n == len(a):\n        raise OverflowError("가득 참")\n    for j in range(n - 1, i - 1, -1):\n        a[j + 1] = a[j]    # 한 칸 뒤로\n    a[i] = v\n    n += 1                 # O(n)'],
    del: ['삭제 remove(i)', 'def remove(a, n, i):\n    v = a[i]\n    for j in range(i, n - 1):\n        a[j] = a[j + 1]    # 한 칸 앞으로\n    a[n - 1] = None\n    n -= 1\n    return v               # O(n)'],
    find: ['찾기 find(v)', 'def find(a, n, v):\n    for j in range(n):\n        if a[j] == v:      # 비교\n            return j\n    return -1              # O(n)'],
  };
  const P = new Player(ui, f => {
    let cells = '';
    for (let i = 0; i < CAP; i++) {
      const v = f.a[i];
      const c = (f.hl || {})[i] || '';
      cells += `<div class="vz-cell ${v == null ? 'empty' : ''} ${c} ${i >= f.n ? 'out' : ''}"><span class="v">${v == null ? '' : esc(v)}</span><span class="i">${i}</span></div>`;
    }
    ui.stage.innerHTML = `<div class="vz-strip big">${cells}</div>
      <div class="vz-meta"><span>원소 수 n = <b>${f.n}</b> / ${CAP}</span><span>이동 <b>${f.mv || 0}</b>번</span><span>비교 <b>${f.cmp || 0}</b>번</span></div>`;
  });
  const fr = (s, o) => Object.assign(clone(s), o);
  function run(act) {
    const i = Math.floor(num(ui.ctrl.querySelector('[data-k=i]').value));
    const v = num(ui.ctrl.querySelector('[data-k=v]').value);
    const F = []; let s = clone(st);
    if (act === 'reset') { st = { a: [3, 8, 12, 5, 7, null, null, null], n: 5 }; P.load([fr(st, { msg: '처음 상태로 돌렸습니다: [3, 8, 12, 5, 7]', tag: '초기화' })], { code: CODE.ins[1], codeTitle: CODE.ins[0], autoplay: false }); return; }
    if (act === 'get') {
      if (!(i >= 0 && i < s.n)) { P.load([fr(s, { msg: `i는 0부터 ${s.n - 1} 사이여야 합니다.`, tone: 'bad' })], { code: CODE.get[1], codeTitle: CODE.get[0] }); return; }
      F.push(fr(s, { hl: { [i]: 'hit' }, line: 3, msg: `<b>a[${i}] = ${s.a[i]}</b>. 몇 번째 칸이든 주소 계산 한 번으로 바로 갑니다. <b>O(1)</b>`, tone: 'good' }));
      P.load(F, { code: CODE.get[1], codeTitle: CODE.get[0] }); return;
    }
    if (act === 'ins') {
      if (Number.isNaN(v)) return;
      if (s.n === CAP) { P.load([fr(s, { line: 3, msg: '배열이 가득 찼습니다. 고정 크기 배열은 더 넣을 수 없습니다.', tone: 'bad' })], { code: CODE.ins[1], codeTitle: CODE.ins[0] }); return; }
      if (!(i >= 0 && i <= s.n)) { P.load([fr(s, { msg: `삽입 위치는 0부터 ${s.n} 사이여야 합니다.`, tone: 'bad' })], { code: CODE.ins[1], codeTitle: CODE.ins[0] }); return; }
      let mv = 0;
      F.push(fr(s, { hl: { [i]: 'mark' }, line: 1, msg: `${i}번 칸에 ${v}를 넣으려면 ${i}번부터 끝(${s.n - 1}번)까지를 뒤로 밀어야 합니다.`, mv }));
      for (let j = s.n - 1; j >= i; j--) {
        F.push(fr(s, { hl: { [j]: 'from', [j + 1]: 'to' }, line: 5, msg: `a[${j + 1}] = a[${j}] → ${s.a[j]}을(를) 한 칸 뒤로`, mv }));
        s.a[j + 1] = s.a[j]; mv++;
        F.push(fr(s, { hl: { [j + 1]: 'to' }, line: 5, msg: `옮김 ${mv}번째`, mv }));
      }
      s.a[i] = v; s.n++;
      F.push(fr(s, { hl: { [i]: 'hit' }, line: 6, msg: `a[${i}] = ${v}. 원소 ${mv}개를 옮겼습니다. 앞쪽에 넣을수록 많이 옮깁니다 → <b>O(n)</b>`, mv, tone: 'good' }));
      st = s; P.load(F, { code: CODE.ins[1], codeTitle: CODE.ins[0] }); return;
    }
    if (act === 'del') {
      if (!(i >= 0 && i < s.n)) { P.load([fr(s, { msg: `삭제 위치는 0부터 ${s.n - 1} 사이여야 합니다.`, tone: 'bad' })], { code: CODE.del[1], codeTitle: CODE.del[0] }); return; }
      let mv = 0; const val = s.a[i];
      F.push(fr(s, { hl: { [i]: 'gone' }, line: 2, msg: `a[${i}] = ${val}을(를) 꺼냅니다. 이제 빈자리를 메워야 합니다.`, mv }));
      for (let j = i; j < s.n - 1; j++) {
        F.push(fr(s, { hl: { [j + 1]: 'from', [j]: 'to' }, line: 4, msg: `a[${j}] = a[${j + 1}] → ${s.a[j + 1]}을(를) 한 칸 앞으로`, mv }));
        s.a[j] = s.a[j + 1]; mv++;
      }
      s.a[s.n - 1] = null; s.n--;
      F.push(fr(s, { line: 5, msg: `삭제 끝: ${val}. 원소 ${mv}개를 앞으로 당겼습니다 → <b>O(n)</b>`, mv, tone: 'good' }));
      st = s; P.load(F, { code: CODE.del[1], codeTitle: CODE.del[0] }); return;
    }
    if (act === 'find') {
      if (Number.isNaN(v)) return;
      let cmp = 0;
      for (let j = 0; j < s.n; j++) {
        cmp++;

  function render(hlR = -1, hlC = -1) {

      }
    }
    g += '</div>';
    const rows = nz.map(([r, c, v]) => `<tr class="${r === hlR && c === hlC ? 'hl' : ''}"><td>${r}</td><td>${c}</td><td>${v}</td></tr>`).join('');
    const dense = R * C, sparse = 3 * nz.length;
    ui.stage.innerHTML = `<div class="vz-two">
      <div><div class="vz-cap">2차원 배열 (5행 × 6열)</div>${g}</div>

    ui.say.querySelector('.vz-step').textContent = '규칙';

  }

  });
  render();
});

  const INIT = [10, 20, 30];

  const CODE = {

    pb: ['push_back(value)  O(n)', 'def push_back(self, value):\n    new_node = Node(value)\n    if self.is_empty():\n        self._head = new_node\n    else:\n        current = self._head\n        while current.next is not None:\n            current = current.next\n        current.next = new_node\n    self._size += 1'],
    of: ['pop_front()  O(1)', 'def pop_front(self):\n    if self.is_empty():\n        raise IndexError("비어 있음")\n    value = self._head.data\n    self._head = self._head.next\n    self._size -= 1\n    return value'],
    ob: ['pop_back()  O(n)', 'def pop_back(self):\n    if self.is_empty():\n        raise IndexError("비어 있음")\n    if self._head.next is None:\n        return self.pop_front()\n    current = self._head\n    while current.next.next is not None:\n        current = current.next\n    value = current.next.data\n    current.next = None\n    self._size -= 1\n    return value'],
    find: ['find(value)  O(n)', 'def find(self, value):\n    current = self._head\n    while current is not None:\n        if current.data == value:\n            return current\n        current = current.next\n    return None'],
    rm: ['remove(value)  O(n)', 'def remove(self, value):\n    if self._head.data == value:\n        self.pop_front()\n        return\n    current = self._head\n    while current.next is not None:\n        if current.next.data == value:\n            current.next = current.next.next\n            self._size -= 1\n            return\n        current = current.next\n    raise ValueError("없음")'],
    ia: ['insert_after(node, value)  O(1)', 'node = ll.find(x)          # 먼저 노드를 찾고\nnew_node = Node(value)\nnew_node.next = node.next  # ① 새 노드가 뒤를 먼저 잡고\nnode.next = new_node       # ② 앞 노드가 새 노드를 가리킴\nself._size += 1'],
  };
  /* frame: items [{v, cls, lab}], link[k]: 'on' | 'off' | 'skip' ; head: index | -1 */

  });
  const F = [];
  const push = (fr, o) => F.push(Object.assign(clone(fr), o));
  function lab(fr, k, text, cls) { fr.items.forEach(i => { if (i.lab === text) i.lab = ''; }); if (k >= 0 && fr.items[k]) { fr.items[k].lab = text; if (cls) fr.items[k].cls = cls; } }

    const n = list.length;

      f.head = 0; push(f, { line: 4, msg: '<b>self._head = new_node</b>: head가 새 노드로 옮겨갑니다.' });

      f.head = n ? 0 : -1;
      push(f, { line: 2, msg: `새 노드 [${v}]를 만듭니다.` });

        for (let k = 0; k < n - 1; k++) { push(f, { line: 7, msg: `current.next(${list[k + 1]})가 None이 아니므로 계속 갑니다.` }); lab(f, k + 1, 'current'); push(f, { line: 8, msg: `current = current.next → [${list[k + 1]}]` }); }
        push(f, { line: 7, msg: 'current.next가 None입니다. 여기가 마지막 노드입니다.' });
        f.link[n - 1] = 'on'; push(f, { line: 9, msg: '<b>current.next = new_node</b>: 마지막 노드가 새 노드를 가리킵니다.' });
      }
      f.items.forEach(i => { i.lab = ''; i.cls = ''; }); f.size = n + 1;
      push(f, { line: 10, msg: `끝. 노드 ${Math.max(0, n - 1)}개를 건너 걸어가야 했습니다 → <b>O(n)</b>. tail 포인터가 있으면 O(1)이 됩니다.`, tone: 'good' });
      list = [...list, v];

      let f = mk(list); f.size = n;
      if (!n) { push(f, { line: 3, msg: '비어 있어서 IndexError가 납니다.', tone: 'bad' }); }
      else {

        const g = mk(list.slice(1)); g.size = n - 1; F.push(Object.assign(g, { line: 7, ret: list[0], msg: `${list[0]}을(를) 반환. <b>O(1)</b>`, tone: 'good' }));

      else if (n === 1) { push(f, { line: 5, msg: '노드가 하나뿐이면 pop_front()와 같습니다.' }); const g = mk([]); F.push(Object.assign(g, { line: 5, ret: list[0], msg: `${list[0]} 반환`, tone: 'good' })); list = []; }
      else {

        for (let k = 0; k < n - 2; k++) { push(f, { line: 7, msg: `current.next.next(${list[k + 2]})가 None이 아님 → 계속` }); lab(f, k + 1, 'current'); push(f, { line: 8, msg: `current = [${list[k + 1]}]` }); }
        push(f, { line: 7, msg: `current.next.next가 None → current [${list[n - 2]}]가 끝에서 두 번째입니다.` });
        f.items[n - 1].cls = 'hit'; push(f, { line: 9, msg: `value = current.next.data → ${list[n - 1]}` });
        f.link[n - 2] = 'off'; f.items[n - 1].cls = 'gone'; push(f, { line: 10, msg: '<b>current.next = None</b>: 마지막 노드와의 연결을 끊습니다.' });
        const g = mk(list.slice(0, -1)); g.size = n - 1; F.push(Object.assign(g, { line: 12, ret: list[n - 1], msg: `${list[n - 1]} 반환. 끝까지 걸어가야 하므로 <b>O(n)</b>`, tone: 'good' }));

      for (let k = 0; k < n; k++) {

          const x = q.items[nf]; q.front = nf; q.items[nf] = null;
          F.push(fr({ line: 24, out: `dequeue() → ${x}`, tone: 'good', msg: `${x} 반환. 가장 먼저 들어온 데이터가 나갔습니다. (그림에서는 꺼낸 칸을 비워 보여 줍니다)` }));

/* ===== 이진 트리: 배열 표현 + 전위/중위/후위 순회 ===== */
DSViz.register('tree', (root, mode0) => {
  const { shell, Player, field, btn, seg, esc, treeSVG, arrayStrip } = DSViz;
  const ui = shell(root, { title: '이진 트리: 배열 인덱스와 세 가지 순회', sub: '배열의 1번 칸이 루트. i번 노드의 왼쪽 자식은 2i, 오른쪽은 2i+1, 부모는 i // 2.' });
  let order = mode0 === 'index' ? 'pre' : (mode0 || 'pre');
  const DEF = 'A B C D E F - - - G';
  let arr = [null];
  const CODE = {
    pre: ['전위 순회: Root → Left → Right', 'def preorder(tree):\n    if tree is None or tree.is_empty():\n        return\n    print(tree.get_root_data())        # 1. 루트 방문\n    preorder(tree.get_left_child())    # 2. 왼쪽\n    preorder(tree.get_right_child())   # 3. 오른쪽'],
    in: ['중위 순회: Left → Root → Right', 'def inorder(tree):\n    if tree is None or tree.is_empty():\n        return\n    inorder(tree.get_left_child())     # 1. 왼쪽\n    print(tree.get_root_data())        # 2. 루트 방문\n    inorder(tree.get_right_child())    # 3. 오른쪽'],
    post: ['후위 순회: Left → Right → Root', 'def postorder(tree):\n    if tree is None or tree.is_empty():\n        return\n    postorder(tree.get_left_child())   # 1. 왼쪽\n    postorder(tree.get_right_child())  # 2. 오른쪽\n    print(tree.get_root_data())        # 3. 루트 방문'],
  };
  const NAME = { pre: 'preorder', in: 'inorder', post: 'postorder' };
  ui.ctrl.innerHTML = field('층별 순서 (빈 자리는 -)', `type="text" value="${DEF}" data-k="s" spellcheck="false" style="width:15em"`) + btn('트리 만들기', 'build', 'ghost') +
    '<div class="vz-row">' + seg('순회', [['pre', '전위'], ['in', '중위'], ['post', '후위']], order) + btn('순회 시작', 'run', 'pri') + '</div>';
  const exists = i => i < arr.length && arr[i] !== null && arr[i] !== undefined;
  function stats() {
    let n = 0, leaf = 0, h = 0;
    (function w(i, d) { if (!exists(i)) return; n++; h = Math.max(h, d); if (!exists(2 * i) && !exists(2 * i + 1)) leaf++; w(2 * i, d + 1); w(2 * i + 1, d + 1); })(1, 1);
    return { n, leaf, h };
  }
  const P = new Player(ui, f => {
    const cls = {}; const sub = {};
    (f.visited || []).forEach((i, k) => { cls[i] = 'done'; sub[i] = k + 1; });
    if (f.cur) cls[f.cur] = 'cur';
    (f.rel || []).forEach(([i, c]) => { cls[i] = c; });
    (f.stack || []).forEach(i => { if (!cls[i]) cls[i] = 'onstack'; });
    const st = stats();
    const stackHtml = f.stack ? `<div class="vz-cap">호출 스택 (위가 지금 실행 중)</div><div class="callstack">${f.stack.slice().reverse().map((i, k) => `<div class="${k === 0 ? 'top' : ''}">${NAME[order]}(${i === 0 ? 'None' : esc(arr[i])})</div>`).join('') || '<div class="empty">비어 있음</div>'}</div>` : '';
    const outHtml = f.visited ? `<div class="vz-cap">출력</div><div class="tape out">${f.visited.map(i => `<span>${esc(arr[i])}</span>`).join('') || '<span class="ph">아직 없음</span>'}</div>` : '';
    const scls = {}; (f.rel || []).forEach(([i, c]) => scls[i] = c); if (f.cur) scls[f.cur] = 'cur';
    ui.stage.innerHTML = `<div class="tree-wrap">${treeSVG(arr, { cls, sub })}</div>
      <div class="vz-cap">배열 표현 (0번 칸은 비움)</div>${arrayStrip(arr, { from: 1, cls: scls })}
      <div class="vz-two tr"><div>${outHtml}</div><div>${stackHtml}</div></div>
      <div class="vz-meta"><span>노드 <b>${st.n}</b>개</span><span>높이 <b>${st.h}</b></span><span>리프 <b>${st.leaf}</b>개</span><span>에지 <b>${Math.max(0, st.n - 1)}</b>개 = n − 1</span></div>`;
  });
  function build(showMsg = true) {
    const toks = ui.ctrl.querySelector('[data-k=s]').value.trim().split(/[\s,]+/).filter(Boolean).slice(0, 31);
    arr = [null, ...toks.map(t => (t === '-' || t === '_' || t.toLowerCase() === 'none') ? null : t)];
    // 부모가 없는 노드는 제거
    for (let i = 2; i < arr.length; i++) if (arr[i] !== null && !exists(i >> 1)) arr[i] = null;
    while (arr.length > 1 && arr[arr.length - 1] === null) arr.pop();
    if (showMsg) P.load([{ tag: '트리', msg: '노드를 누르면 배열 인덱스 관계(부모 i // 2, 자식 2i, 2i+1)를 보여 줍니다. <b>순회 시작</b>으로 방문 순서를 확인하세요.' }], { autoplay: false });
  }
  function traverse() {
    const F = []; const visited = []; const stack = [];
    const L = order === 'pre' ? { visit: 4, left: 5, right: 6 } : order === 'in' ? { left: 4, visit: 5, right: 6 } : { left: 4, right: 5, visit: 6 };
    const snap = (o) => F.push(Object.assign({ visited: visited.slice(), stack: stack.slice() }, o));
    (function rec(i, line) {
      stack.push(exists(i) ? i : 0);
      if (!exists(i)) { snap({ line: 3, msg: '빈 트리(None) → 바로 return', cur: 0 }); stack.pop(); return; }
      snap({ cur: i, line: 1, msg: `${NAME[order]}(${arr[i]}) 호출` });
      const visit = () => { visited.push(i); snap({ cur: i, line: L.visit, msg: `<b>${arr[i]}</b> 방문 → 출력` }); };
      const goL = () => { snap({ cur: i, line: L.left, msg: `${arr[i]}의 왼쪽 서브트리로` }); rec(2 * i); };
      const goR = () => { snap({ cur: i, line: L.right, msg: `${arr[i]}의 오른쪽 서브트리로` }); rec(2 * i + 1); };
      if (order === 'pre') { visit(); goL(); goR(); }
      else if (order === 'in') { goL(); visit(); goR(); }
      else { goL(); goR(); visit(); }
      stack.pop();
      snap({ cur: stack.length ? stack[stack.length - 1] : null, msg: `${NAME[order]}(${arr[i]}) 끝 → 호출한 곳으로 돌아감` });
    })(1);
    F.push({ visited: visited.slice(), stack: [], tone: 'good', tag: '결과', msg: `${{ pre: '전위', in: '중위', post: '후위' }[order]} 순회: <b>${visited.map(i => esc(arr[i])).join(' ')}</b>` });
    // drop None frames if too many? keep: they show recursion base case
    P.load(F, { code: CODE[order][1], codeTitle: CODE[order][0] });
  }
  ui.ctrl.addEventListener('click', e => {
    const m = e.target.closest('.vz-seg [data-mode]');
    if (m) { order = m.dataset.mode; ui.ctrl.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-pressed', b === m)); P.setCode(CODE[order][0], CODE[order][1]); return; }
    const b = e.target.closest('[data-act]'); if (!b) return;
    if (b.dataset.act === 'build') build(); else { build(false); traverse(); }
  });
  function nodeInfo(i) {
    i = +i; if (!exists(i)) return;
    const rel = [[i, 'cur']];
    const parts = [`<b>${esc(arr[i])}</b>는 인덱스 <b>${i}</b>`];
    if (i > 1) { rel.push([i >> 1, 'par']); parts.push(`부모 ${i} // 2 = ${i >> 1} (${esc(arr[i >> 1])})`); } else parts.push('루트라서 부모 없음');
    parts.push(exists(2 * i) ? `왼쪽 2×${i} = ${2 * i} (${esc(arr[2 * i])})` : `왼쪽 ${2 * i} 비어 있음`);
    parts.push(exists(2 * i + 1) ? `오른쪽 2×${i}+1 = ${2 * i + 1} (${esc(arr[2 * i + 1])})` : `오른쪽 ${2 * i + 1} 비어 있음`);
    if (exists(2 * i)) rel.push([2 * i, 'kid']); if (exists(2 * i + 1)) rel.push([2 * i + 1, 'kid']);
    P.stop(); P.frames = [{ rel, tag: '인덱스', msg: parts.join(' · ') }]; P.go(0);
  }
  ui.stage.addEventListener('click', e => { const g = e.target.closest('g.n'); if (g) nodeInfo(g.dataset.i); });
  ui.stage.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('g.n')) { e.preventDefault(); nodeInfo(e.target.dataset.i); } });
  P.setCode(CODE[order][0], CODE[order][1]);
  build();
  if (mode0 === 'index') nodeInfo(2);
});

/* ===== 힙 (우선순위 큐) ===== */
DSViz.register('heap', (root) => {
  const { shell, Player, field, btn, seg, num, esc, clone, treeSVG, arrayStrip } = DSViz;
  const ui = shell(root, { title: '힙: 넣으면 위로, 빼면 아래로', sub: '완전 이진 트리를 1번부터 배열에 담습니다. 삽입은 부모와 비교하며 올라가고(up-heap), 삭제는 마지막 노드를 루트로 올린 뒤 내려갑니다(down-heap).' });
  let kind = 'max';
  let H = [null];
  const better = (a, b) => kind === 'max' ? a > b : a < b;
  const CODE = {
    max: ['MaxHeap (heap[0]은 비워 둠)', 'def insert(self, item):              # up-heap\n    self.heap.append(item)\n    i = self.size()\n    while i > 1 and self.heap[i // 2] < self.heap[i]:\n        swap(i, i // 2)\n        i = i // 2\n\ndef delete(self):                     # down-heap\n    root = self.heap[1]\n    last = self.heap.pop()\n    if self.size() > 0:\n        self.heap[1] = last\n        i = 1\n        while 2 * i <= self.size():\n            child = 2 * i\n            if child + 1 <= self.size() and self.heap[child + 1] > self.heap[child]:\n                child += 1            # 더 큰 자식\n            if self.heap[i] >= self.heap[child]:\n                break\n            swap(i, child)\n            i = child\n    return root'],
    min: ['MinHeap (부등호만 반대)', 'def insert(self, item):              # up-heap\n    self.heap.append(item)\n    i = self.size()\n    while i > 1 and self.heap[i // 2] > self.heap[i]:\n        swap(i, i // 2)\n        i = i // 2\n\ndef delete(self):                     # down-heap\n    root = self.heap[1]\n    last = self.heap.pop()\n    if self.size() > 0:\n        self.heap[1] = last\n        i = 1\n        while 2 * i <= self.size():\n            child = 2 * i\n            if child + 1 <= self.size() and self.heap[child + 1] < self.heap[child]:\n                child += 1            # 더 작은 자식\n            if self.heap[i] <= self.heap[child]:\n                break\n            swap(i, child)\n            i = child\n    return root'],
  };
  ui.ctrl.innerHTML = seg('힙 종류', [['max', '최대 힙'], ['min', '최소 힙']], kind) +
    '<div class="vz-row">' + field('값', 'type="number" value="18" data-k="v"') + btn('insert', 'ins', 'pri') + btn('delete (루트 꺼내기)', 'del') + '</div>' +
    '<div class="vz-row">' + field('여러 값 차례로 넣기', 'type="text" value="17 10 22 15 12 20 24 11 14" data-k="s" spellcheck="false" style="width:15em"') + btn('처음부터 쌓기', 'build', 'ghost') + '</div>';
  const P = new Player(ui, f => {
    const cls = Object.assign({}, f.hl || {});
    ui.stage.innerHTML = `<div class="tree-wrap">${f.h.length > 1 ? treeSVG(f.h, { cls }) : '<p class="vz-empty">빈 힙</p>'}</div>
      <div class="vz-cap">배열 heap (인덱스 1부터)</div>${arrayStrip(f.h, { from: 1, cls })}
      <div class="vz-meta"><span>크기 <b>${f.h.length - 1}</b></span><span>비교 <b>${f.cmp || 0}</b>번</span><span>교환 <b>${f.sw || 0}</b>번</span>${f.out != null ? `<span class="good">꺼낸 값 <b>${esc(f.out)}</b></span>` : ''}</div>`;
  });
  const snap = (F, h, o) => F.push(Object.assign({ h: clone(h) }, o));
  function insertFrames(F, h, v, c) {
    h.push(v); let i = h.length - 1;
    snap(F, h, { line: 2, hl: { [i]: 'mark' }, msg: `${v}를 맨 끝(인덱스 ${i})에 붙입니다. 완전 이진 트리 모양을 지키기 위해서입니다.`, ...c });
    while (i > 1) {
      const p = i >> 1; c.cmp++;
      if (better(h[i], h[p])) {
        snap(F, h, { line: 4, hl: { [i]: 'mark', [p]: 'cmp' }, msg: `부모 heap[${i} // 2] = heap[${p}] = ${h[p]} ${kind === 'max' ? '<' : '>'} ${h[i]} → 자리를 바꿔야 합니다.`, ...c });
        [h[i], h[p]] = [h[p], h[i]]; c.sw++;
        snap(F, h, { line: 5, hl: { [p]: 'mark', [i]: 'swap' }, msg: `교환! ${h[p]}가 인덱스 ${p}로 올라갔습니다.`, ...c });
        i = p;
      } else {
        snap(F, h, { line: 4, hl: { [i]: 'hit', [p]: 'cmp' }, msg: `부모 ${h[p]} ${kind === 'max' ? '≥' : '≤'} ${h[i]} → 멈춥니다.`, ...c });
        return;
      }
    }
    snap(F, h, { line: 4, hl: { 1: 'hit' }, msg: `루트까지 올라왔습니다.`, ...c });
  }
  function run(act) {
    const F = []; const c = { cmp: 0, sw: 0 };
    if (act === 'ins') {
      const v = num(ui.ctrl.querySelector('[data-k=v]').value); if (Number.isNaN(v)) return;
      if (H.length > 31) { P.load([{ h: clone(H), msg: '그림이 넘치지 않도록 31개까지만 넣습니다.', tone: 'bad' }]); return; }
      insertFrames(F, H, v, c);
      F.push({ h: clone(H), ...c, tone: 'good', tag: '완료', msg: `삽입 끝. 비교 ${c.cmp}번, 교환 ${c.sw}번 — 많아야 트리 높이만큼 → <b>O(log n)</b>` });
      ui.ctrl.querySelector('[data-k=v]').value = Math.floor(Math.random() * 40) + 1;
    }
    if (act === 'del') {
      if (H.length <= 1) { P.load([{ h: clone(H), msg: '빈 힙에서는 꺼낼 수 없습니다.', tone: 'bad' }]); return; }
      const rootv = H[1];
      snap(F, H, { line: 9, hl: { 1: 'gone' }, msg: `삭제는 항상 <b>루트</b>에서: ${rootv}을(를) 꺼냅니다.`, ...c });
      const last = H.pop();
      if (H.length > 1) {
        H[1] = last;
        snap(F, H, { line: 12, hl: { 1: 'mark' }, msg: `마지막 노드 ${last}를 루트로 옮깁니다. (빈자리 없는 완전 이진 트리 유지)`, ...c });
        let i = 1; const n = H.length - 1;
        while (2 * i <= n) {
          let ch = 2 * i;
          if (ch + 1 <= n) { c.cmp++; if (better(H[ch + 1], H[ch])) ch++; }
          snap(F, H, { line: 16, hl: { [i]: 'mark', [2 * i]: 'cmp', ...(2 * i + 1 <= n ? { [2 * i + 1]: 'cmp' } : {}), [ch]: 'pick' }, msg: `자식 중 ${kind === 'max' ? '더 큰' : '더 작은'} 쪽은 heap[${ch}] = ${H[ch]}`, ...c });
          c.cmp++;
          if (!better(H[ch], H[i])) { snap(F, H, { line: 19, hl: { [i]: 'hit', [ch]: 'cmp' }, msg: `${H[i]} ${kind === 'max' ? '≥' : '≤'} ${H[ch]} → 멈춥니다.`, ...c }); break; }
          [H[i], H[ch]] = [H[ch], H[i]]; c.sw++;
          snap(F, H, { line: 20, hl: { [ch]: 'mark', [i]: 'swap' }, msg: `교환! ${H[ch]}가 인덱스 ${ch}로 내려갔습니다.`, ...c });
          i = ch;
        }
      }
      F.push({ h: clone(H), ...c, out: rootv, tone: 'good', tag: '완료', msg: `${rootv} 반환. 지금 배열의 마지막 원소는 <b>${H.length > 1 ? H[H.length - 1] : '없음'}</b>. <b>O(log n)</b>` });
    }
    if (act === 'build') {
      const vals = ui.ctrl.querySelector('[data-k=s]').value.split(/[\s,]+/).map(Number).filter(Number.isFinite).slice(0, 31);
      H = [null];
      F.push({ h: clone(H), tag: '시작', msg: `빈 힙에 ${vals.join(', ')}을 차례로 넣습니다.` });
      vals.forEach(v => insertFrames(F, H, v, c));
      F.push({ h: clone(H), ...c, tone: 'good', tag: '완료', msg: `완성: [${H.slice(1).join(', ')}]. 루트 ${H[1]}이 ${kind === 'max' ? '최댓값' : '최솟값'}입니다.` });
    }

  }
  ui.ctrl.addEventListener('click', e => {
    const m = e.target.closest('.vz-seg [data-mode]');
    if (m) { kind = m.dataset.mode; ui.ctrl.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-pressed', b === m)); H = [null]; P.setCode(CODE[kind][0], CODE[kind][1]); P.load([{ h: clone(H), tag: '준비', msg: `${kind === 'max' ? '최대' : '최소'} 힙으로 바꿨습니다. <b>처음부터 쌓기</b>를 눌러 보세요.` }], { autoplay: false }); return; }
    const b = e.target.closest('[data-act]'); if (b) run(b.dataset.act);
  });

  const vals0 = [17, 10, 22, 15, 12, 20, 24, 11, 14];
  vals0.forEach(v => insertFrames([], H, v, { cmp: 0, sw: 0 }));
  P.setCode(CODE.max[0], CODE.max[1]);
  P.load([{ h: clone(H), tag: '준비', msg: '교재 연습문제 데이터(17, 10, 22, 15, 12, 20, 24, 11, 14)로 쌓아 둔 최대 힙입니다. <b>delete</b>를 두 번 눌러 마지막 원소를 확인해 보세요.' }], { autoplay: false });
});
