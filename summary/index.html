const GraphPresets = {
  g1: { name: '예제 그래프 (7개 정점)', nodes: { A: [80, 60], B: [200, 40], C: [90, 190], D: [330, 40], E: [300, 150], F: [190, 220], G: [400, 230] }, edges: [['A', 'B'], ['A', 'C'], ['B', 'D'], ['B', 'E'], ['C', 'F'], ['E', 'F'], ['F', 'G']] },
  g2: { name: '사이클이 많은 그래프', nodes: { 1: [70, 130], 2: [170, 50], 3: [170, 210], 4: [290, 50], 5: [290, 210], 6: [400, 130] }, edges: [['1', '2'], ['1', '3'], ['2', '3'], ['2', '4'], ['3', '5'], ['4', '5'], ['4', '6'], ['5', '6']] },
  g3: { name: '떨어진 두 덩어리', nodes: { A: [70, 70], B: [180, 60], C: [120, 190], D: [300, 80], E: [400, 70], F: [350, 200] }, edges: [['A', 'B'], ['B', 'C'], ['A', 'C'], ['D', 'E'], ['E', 'F']] },
};
function graphSVG(g, f, { directed, weights } = {}) {
  const W = 470, Hh = 270;
  let e = '';
  const key = (a, b) => directed ? `${a}>${b}` : [a, b].sort().join('|');
  g.edges.forEach(ed => {
    const [a, b] = ed; const [x1, y1] = g.nodes[a], [x2, y2] = g.nodes[b];
    const k = key(a, b);
    const c = (f.ecls || {})[k] || '';
    let dx = x2 - x1, dy = y2 - y1; const L = Math.hypot(dx, dy) || 1; dx /= L; dy /= L;
    const sx = x1 + dx * 20, sy = y1 + dy * 20, ex = x2 - dx * (directed ? 24 : 20), ey = y2 - dy * (directed ? 24 : 20);
    e += `<line class="ge ${c}" x1="${sx}" y1="${sy}" x2="${ex}" y2="${ey}" ${directed ? 'marker-end="url(#gar)"' : ''}/>`;
    if (weights) { const mx = (x1 + x2) / 2, my = (y1 + y2) / 2; e += `<g class="gw ${c}"><rect x="${mx - 12}" y="${my - 10}" width="24" height="20" rx="6"/><text x="${mx}" y="${my}" dy=".35em">${ed[2]}</text></g>`; }
  });
  let n = '';
  for (const id in g.nodes) {
    const [x, y] = g.nodes[id];
    const c = (f.ncls || {})[id] || '';
    const b = (f.badge || {})[id];
    n += `<g class="gn ${c}" data-id="${DSViz.esc(id)}" transform="translate(${x},${y})" tabindex="0" role="button" aria-label="정점 ${DSViz.esc(id)}"><circle r="19"/><text dy=".35em">${DSViz.esc(id)}</text>${b != null ? `<g class="gb" transform="translate(16,-16)"><circle r="10"/><text dy=".35em">${b}</text></g>` : ''}</g>`;
  }
  return `<svg class="vz-svg graph" viewBox="0 0 ${W} ${Hh}" style="max-width:${W}px"><defs><marker id="gar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="garh"/></marker></defs>${e}${n}</svg>`;
}

DSViz.register('graph', (root, mode0) => {
  const { shell, Player, btn, seg, esc, clone } = DSViz;
  let mode = mode0 || 'dfs';
  let directed = false;
  let G = clone(GraphPresets.g1);
  const ui = shell(root, { title: '그래프: 표현하고 탐색하기', sub: '인접 행렬의 칸을 눌러 간선을 넣고 빼 보세요. DFS는 스택(또는 재귀), BFS는 큐로 다음 정점을 관리합니다.' });
  const CODE = {
    rep: ['인접 행렬 / 인접 리스트 만들기', 'n = len(V)\nadj = [[0] * n for _ in range(n)]   # 인접 행렬\nlst = {v: [] for v in V}            # 인접 리스트\nfor u, v in E:\n    adj[idx[u]][idx[v]] = 1\n    lst[u].append(v)\n    if not directed:                # 무방향이면 대칭\n        adj[idx[v]][idx[u]] = 1\n        lst[v].append(u)'],
    dfsr: ['DFS (재귀)', 'Algorithm DFS_Search(graph, current, goal, visited):\n    visited[current] = true\n    If current == goal:\n        Return true\n    For each neighbor of current.adjacent():\n        If not visited[neighbor]:\n            If DFS_Search(graph, neighbor, goal, visited):\n                Return true\n    Return false'],
    dfs: ['DFS (스택)', 'Algorithm DFS_Iterative(graph, start, goal):\n    visited = [false] * n\n    stack = EmptyStack()\n    stack.push(start)\n    While stack is not empty:\n        current = stack.pop()\n        If visited[current]:\n            Continue\n        visited[current] = true\n        If current == goal:\n            Return true\n        For neighbor in reverse(current.adjacent()):\n            If not visited[neighbor]:\n                stack.push(neighbor)\n    Return false'],
    bfs: ['BFS (큐)', 'Algorithm BFS_Search(graph, start, goal):\n    visited = [false] * n\n    queue = EmptyQueue()\n    queue.enqueue(start)\n    visited[start] = true\n    While queue is not empty:\n        current = queue.dequeue()\n        If current == goal:\n            Return true\n        For neighbor in current.adjacent():\n            If not visited[neighbor]:\n                visited[neighbor] = true   # 넣기 전에 표시\n                queue.enqueue(neighbor)\n    Return false'],
  };
  const ids = () => Object.keys(G.nodes);
  const adj = () => { const a = {}; ids().forEach(v => a[v] = []); G.edges.forEach(([u, v]) => { a[u].push(v); if (!directed) a[v].push(u); }); for (const k in a) a[k].sort((x, y) => String(x).localeCompare(String(y), 'ko', { numeric: true })); return a; };
  const ek = (a, b) => directed ? `${a}>${b}` : [a, b].sort().join('|');
  function controls() {
    const sel = (k, lab, opts) => `<label class="vz-f"><span>${lab}</span><select data-k="${k}">${opts}</select></label>`;
    ui.ctrl.innerHTML = seg('모드', [['rep', '행렬·리스트'], ['dfsr', 'DFS 재귀'], ['dfs', 'DFS 스택'], ['bfs', 'BFS']], mode) +
      '<div class="vz-row">' + sel('preset', '그래프', Object.entries(GraphPresets).map(([k, p]) => `<option value="${k}">${esc(p.name)}</option>`).join('')) +
      (mode === 'rep' ? `<label class="vz-chk"><input type="checkbox" data-k="dir" ${directed ? 'checked' : ''}> 방향 그래프</label>` :
        sel('start', '시작', ids().map(v => `<option>${esc(v)}</option>`).join('')) + sel('goal', '목표', '<option value="">(없음: 전부 방문)</option>' + ids().map(v => `<option>${esc(v)}</option>`).join('')) + btn('탐색 시작', 'run', 'pri')) + '</div>';
  }
  const P = new Player(ui, f => {
    const a = adj(); const V = ids();
    const g = graphSVG(G, f, { directed });
    if (mode === 'rep') {
      const sel = f.sel;
      let m = `<table class="mat"><thead><tr><th></th>${V.map(v => `<th class="${v === sel ? 'hl' : ''}">${esc(v)}</th>`).join('')}</tr></thead><tbody>`;
      V.forEach(r => { m += `<tr><th class="${r === sel ? 'hl' : ''}">${esc(r)}</th>` + V.map(c => { const on = G.edges.some(([u, v]) => (u === r && v === c) || (!directed && u === c && v === r)); return `<td><button type="button" class="mc ${on ? 'on' : ''} ${r === sel || c === sel ? 'rowhl' : ''}" data-r="${esc(r)}" data-c="${esc(c)}" ${r === c ? 'disabled' : ''} aria-label="${esc(r)}에서 ${esc(c)}로 간선 ${on ? '있음' : '없음'}">${on ? 1 : 0}</button></td>`; }).join('') + '</tr>'; });
      m += '</tbody></table>';
      const L = V.map(v => `<div class="al ${v === sel ? 'hl' : ''}"><b>${esc(v)}</b><span>→</span>${a[v].map(w => `<i>${esc(w)}</i>`).join('<span>→</span>') || '<em>없음</em>'}</div>`).join('');
      const E = G.edges.length;
      ui.stage.innerHTML = `<div class="graph-wrap">${g}</div><div class="vz-two gr"><div><div class="vz-cap">인접 행렬 (칸을 눌러 간선 추가·삭제)</div><div class="vz-tbl">${m}</div></div><div><div class="vz-cap">인접 리스트</div><div class="adjl">${L}</div></div></div>
        <div class="vz-meta"><span>정점 <b>${V.length}</b></span><span>간선 <b>${E}</b></span><span>행렬 칸 <b>${V.length * V.length}</b>개 중 1은 <b>${directed ? E : 2 * E}</b>개</span>${sel ? `<span>${esc(sel)}의 ${directed ? `진출 차수 <b>${a[sel].length}</b>, 진입 차수 <b>${G.edges.filter(e => e[1] === sel).length}</b>` : `차수 <b>${a[sel].length}</b>`}</span>` : ''}</div>`;
      return;
    }
    const isQ = mode === 'bfs';
    const ds = mode === 'dfsr' ? `<div class="vz-cap">호출 스택</div><div class="callstack">${(f.ds || []).slice().reverse().map((v, k) => `<div class="${k === 0 ? 'top' : ''}">DFS(${esc(v)})</div>`).join('') || '<div class="empty">비어 있음</div>'}</div>`
      : isQ ? `<div class="vz-cap">큐 (왼쪽이 front)</div><div class="qline">${(f.ds || []).map(v => `<span>${esc(v)}</span>`).join('') || '<em>비어 있음</em>'}</div>`
        : `<div class="vz-cap">스택 (위가 top)</div><div class="callstack">${(f.ds || []).slice().reverse().map((v, k) => `<div class="${k === 0 ? 'top' : ''}">${esc(v)}</div>`).join('') || '<div class="empty">비어 있음</div>'}</div>`;
    const vis = `<div class="vz-cap">visited</div><div class="vtab">${V.map(v => `<span class="${(f.vis || []).includes(v) ? 'on' : ''}"><b>${esc(v)}</b>${(f.vis || []).includes(v) ? 'T' : 'F'}</span>`).join('')}</div>`;
    const ord = `<div class="vz-cap">방문 순서</div><div class="tape out">${(f.order || []).map(v => `<span>${esc(v)}</span>`).join('') || '<span class="ph">아직 없음</span>'}</div>`;
    ui.stage.innerHTML = `<div class="graph-wrap">${g}</div><div class="vz-two gr"><div>${ds}</div><div>${vis}${ord}</div></div>`;
  });
  function search() {
    const a = adj(); const s = ui.ctrl.querySelector('[data-k=start]').value; const goal = ui.ctrl.querySelector('[data-k=goal]').value;
    const F = []; const vis = []; const order = []; const tree = {};
    const snap = (o) => {
      const ncls = {}, badge = {}, ecls = {};
      order.forEach((v, i) => { ncls[v] = 'done'; badge[v] = i + 1; });
      (o.ds || []).forEach(v => { if (!ncls[v]) ncls[v] = 'front'; });
      vis.forEach(v => { if (!ncls[v]) ncls[v] = 'seen'; });
      if (o.cur) ncls[o.cur] = 'cur';
      if (goal) ncls[goal] = (ncls[goal] || '') + ' goal';
      for (const k in tree) ecls[k] = 'tree';
      if (o.edge) ecls[ek(o.edge[0], o.edge[1])] = (ecls[ek(o.edge[0], o.edge[1])] || '') + ' look';
      F.push(Object.assign({ ncls, badge, ecls, vis: vis.slice(), order: order.slice() }, o, { ds: (o.ds || []).slice() }));
    };
    let found = false;
    if (mode === 'dfsr') {
      const cs = [];
      (function rec(v, from) {
        if (found) return;
        cs.push(v); vis.push(v); order.push(v); if (from) tree[ek(from, v)] = 1;
        snap({ cur: v, ds: cs, line: 2, msg: `DFS(${v}) 호출 → visited[${v}] = true` });
        if (goal && v === goal) { found = true; snap({ cur: v, ds: cs, line: 4, tone: 'good', msg: `목표 ${goal} 도착! true를 위로 전달합니다.` }); return; }
        for (const w of a[v]) {
          if (found) return;
          if (vis.includes(w)) { snap({ cur: v, ds: cs, edge: [v, w], line: 6, msg: `${v}의 이웃 ${w}는 이미 방문함 → 건너뜀` }); continue; }
          snap({ cur: v, ds: cs, edge: [v, w], line: 7, msg: `${v}의 이웃 ${w}는 처음 → DFS(${w})로 더 깊이` });
          rec(w, v);
          if (!found) snap({ cur: v, ds: cs, line: 5, msg: `${w}에서 돌아와 ${v}의 다음 이웃을 봅니다 (백트래킹)` });
        }
        if (!found) { cs.pop(); snap({ cur: cs[cs.length - 1], ds: cs, line: 9, msg: `${v}에서 더 갈 곳이 없습니다 → DFS(${v}) 끝` }); }
      })(s, null);
    } else if (mode === 'dfs') {
      const st = [s];
      snap({ ds: st, line: 4, msg: `stack.push(${s})` });
      while (st.length) {
        const v = st.pop();
        snap({ cur: v, ds: st, line: 6, msg: `pop → ${v}` });
        if (vis.includes(v)) { snap({ cur: v, ds: st, line: 8, msg: `${v}는 이미 방문함 → continue (스택에 중복으로 들어갔던 것)` }); continue; }
        vis.push(v); order.push(v);
        snap({ cur: v, ds: st, line: 9, msg: `visited[${v}] = true` });
        if (goal && v === goal) { found = true; snap({ cur: v, ds: st, line: 11, tone: 'good', msg: `목표 ${goal} 도착!` }); break; }
        const nb = a[v].slice().reverse();
        for (const w of nb) {
          if (!vis.includes(w)) { st.push(w); snap({ cur: v, ds: st, edge: [v, w], line: 14, msg: `이웃 ${w} push (역순으로 넣어야 작은 쪽이 먼저 나옵니다)` }); }
          else snap({ cur: v, ds: st, edge: [v, w], line: 13, msg: `이웃 ${w}는 방문함 → 넣지 않음` });
        }
      }
    } else {
      const q = [s]; vis.push(s);
      snap({ ds: q, line: 5, msg: `enqueue(${s}), visited[${s}] = true` });
      const from = {};
      while (q.length) {
        const v = q.shift(); order.push(v); if (from[v]) tree[ek(from[v], v)] = 1;
        snap({ cur: v, ds: q, line: 7, msg: `dequeue → ${v}` });
        if (goal && v === goal) { found = true; snap({ cur: v, ds: q, line: 9, tone: 'good', msg: `목표 ${goal} 도착!` }); break; }
        for (const w of a[v]) {
          if (!vis.includes(w)) { vis.push(w); from[w] = v; q.push(w); snap({ cur: v, ds: q, edge: [v, w], line: 13, msg: `이웃 ${w}: visited 표시하고 enqueue` }); }
          else snap({ cur: v, ds: q, edge: [v, w], line: 11, msg: `이웃 ${w}는 이미 표시됨 → 넣지 않음` });
        }
      }
    }
    const miss = ids().filter(v => !vis.includes(v));
    snap({ tag: '결과', tone: goal ? (found ? 'good' : 'bad') : 'good', msg: goal ? (found ? `${goal}까지 갈 수 있습니다. 방문 순서: <b>${order.join(' → ')}</b>` : `${goal}까지 가는 경로가 없습니다.`) : `방문 순서: <b>${order.join(' → ')}</b>${miss.length ? ` · 연결되지 않은 정점: ${miss.join(', ')}` : ''}`, ds: [] });
    P.load(F, { code: CODE[mode][1], codeTitle: CODE[mode][0] });
  }
  function setMode(m) {
    mode = m; controls(); P.setCode(CODE[mode][0], CODE[mode][1]);
    const hint = { rep: '정점을 누르면 그 행과 리스트가 강조됩니다. 행렬의 0/1 칸을 눌러 간선을 바꿔 보세요.', dfsr: '<b>탐색 시작</b>. 한 방향으로 끝까지 들어갔다가 막히면 돌아옵니다.', dfs: '스택에 같은 정점이 두 번 들어갈 수 있고, 꺼낼 때 방문 여부를 확인합니다.', bfs: '시작점에서 가까운 정점부터 층층이 방문합니다. 넣기 <b>전에</b> visited를 표시합니다.' }[mode];
    P.load([{ tag: '준비', msg: hint }], { autoplay: false });
  }
  ui.ctrl.addEventListener('click', e => {
    const m = e.target.closest('.vz-seg [data-mode]'); if (m) { setMode(m.dataset.mode); return; }
    const b = e.target.closest('[data-act]'); if (b) search();
  });
  ui.ctrl.addEventListener('change', e => {
    if (e.target.matches('[data-k=preset]')) { G = clone(GraphPresets[e.target.value]); const k = e.target.value; setMode(mode); ui.ctrl.querySelector('[data-k=preset]').value = k; }
    if (e.target.matches('[data-k=dir]')) { directed = e.target.checked; P.load([{ tag: directed ? '방향' : '무방향', msg: directed ? '방향 그래프: 행렬이 더 이상 대칭이 아닙니다. 간선은 행 → 열 방향입니다.' : '무방향 그래프: adj[i][j] == adj[j][i]' }], { autoplay: false }); }
  });
  ui.stage.addEventListener('click', e => {
    const c = e.target.closest('.mc');
    if (c) {
      const r = c.dataset.r, cc = c.dataset.c;
      const idx = G.edges.findIndex(([u, v]) => (u === r && v === cc) || (!directed && u === cc && v === r));
      if (idx >= 0) G.edges.splice(idx, 1); else G.edges.push([r, cc]);
      P.load([{ sel: r, tag: idx >= 0 ? '간선 삭제' : '간선 추가', msg: `${r} ${directed ? '→' : '—'} ${cc} 간선을 ${idx >= 0 ? '지웠습니다' : '넣었습니다'}. ${directed ? '' : `대칭 칸 [${cc}][${r}]도 함께 바뀝니다.`}` }], { autoplay: false });
      return;
    }
    const n = e.target.closest('.gn');
    if (n && mode === 'rep') { const id = n.dataset.id; const a = adj(); P.load([{ sel: id, ncls: { [id]: 'cur', ...Object.fromEntries(a[id].map(w => [w, 'front'])) }, tag: id, msg: `${id}의 인접 정점: ${a[id].join(', ') || '없음'}. 행렬에서는 ${id} 행 전체를 봐야 하므로 O(n), 리스트는 바로 꺼냅니다.` }], { autoplay: false }); }
  });
  setMode(mode);
});

/* ===== 크루스칼 MST + Union-Find ===== */
DSViz.register('kruskal', (root) => {
  const { shell, Player, btn, esc, clone } = DSViz;
  const PRE = {
    k1: { name: '교재 예제 (A~E)', nodes: { A: [70, 70], B: [210, 50], C: [160, 200], D: [330, 120], E: [400, 230] }, edges: [['A', 'B', 1], ['B', 'C', 2], ['A', 'C', 3], ['B', 'D', 4], ['C', 'D', 5], ['C', 'E', 6], ['D', 'E', 7]] },
    k2: { name: '마을 6곳 전선 잇기', nodes: { A: [60, 80], B: [190, 40], C: [150, 200], D: [320, 70], E: [290, 220], F: [420, 160] }, edges: [['A', 'B', 4], ['A', 'C', 2], ['B', 'C', 5], ['B', 'D', 10], ['C', 'E', 3], ['E', 'D', 4], ['D', 'F', 11], ['E', 'F', 6]] },
  };
  let G = clone(PRE.k1);
  const ui = shell(root, { title: '크루스칼: 가벼운 간선부터, 사이클만 피해서', sub: '간선을 가중치 순으로 보면서 두 끝점의 대표(find)가 다르면 채택하고 합칩니다(union).' });
  const CODE = ['kruskal (교재 Python 구현)', 'def kruskal(self):\n    parent = {v: v for v in self.vertices}\n    def find(x):\n        if parent[x] != x:\n            parent[x] = find(parent[x])   # 경로 압축\n        return parent[x]\n    def union(x, y):\n        root_x, root_y = find(x), find(y)\n        if root_x == root_y:\n            return False                  # 사이클!\n        parent[root_y] = root_x\n        return True\n    mst, total = [], 0\n    for weight, u, v in sorted(self.edges):\n        if union(u, v):\n            mst.append((weight, u, v))\n            total += weight\n            if len(mst) == self.size - 1:\n                break\n    return mst, total'];
  ui.ctrl.innerHTML = `<label class="vz-f"><span>그래프</span><select data-k="p">${Object.entries(PRE).map(([k, p]) => `<option value="${k}">${esc(p.name)}</option>`).join('')}</select></label>` + btn('MST 만들기', 'run', 'pri');
  const P = new Player(ui, f => {
    const ecls = {}, ncls = {};
    (f.status || []).forEach((s, i) => { const [u, v] = f.sorted[i]; ecls[[u, v].sort().join('|')] = s === 'ok' ? 'tree' : s === 'no' ? 'rej' : s === 'look' ? 'look' : ''; });
    (f.roots || []).forEach(v => ncls[v] = 'cur');
    const svg = graphSVG(G, { ecls, ncls }, { weights: true });
    const list = (f.sorted || []).map((e, i) => { const s = (f.status || [])[i] || ''; return `<div class="kl ${s}"><span class="w">${e[2]}</span><span>${esc(e[0])} — ${esc(e[1])}</span><em>${{ ok: '채택', no: '사이클 → 버림', look: '검사 중', '': '' }[s] || ''}</em></div>`; }).join('');

  function pick(cands, seed) {
    const r = rng(seed);
    const n = Math.max(2, Math.min(8, Math.round(cands.length * 0.35)));
    const pool = cands.map(c => ({ c, k: Math.pow(r(), 1 / c.w) }));
    pool.sort((a, b) => b.k - a.k);
    return new Set(pool.slice(0, Math.min(n, cands.length)).map(p => p.c.i));
  }

  const norm = s => s.replace(/\s+/g, '').replace(/'/g, '"').replace(/;$/, '').replace(/:$/, '');
  const stripCmt = (s, py) => s.replace(py ? /\s*#.*$/ : /\s*\/\/.*$/, '');

  /* ---------- UI ---------- */
  function mount(fig) {
    if (fig.dataset.drill) return; fig.dataset.drill = '1';
    const codeEl = fig.querySelector('code'); if (!codeEl) return;
    const cls = codeEl.className || '';
    const langLabel = (fig.querySelector('.code-h span') || {}).textContent || '';
    const lang = /python/.test(cls) || /^Python/i.test(langLabel) ? 'py' : (/cpp|language-c\b/.test(cls) || /^C\+\+|^C$/.test(langLabel) ? 'cpp' : null);
    if (!lang) return;
    const code = codeEl.textContent;
    if (lang === 'py' && !/\bdef\s+\w+\s*\(/.test(code)) return;
    const A = analyse(code, lang);
    if (A.cands.length < 3) return;
    const det = document.createElement('details');
    det.className = 'drill';
    det.innerHTML = `<summary><span class="dr-ic" aria-hidden="true">✍️</span><b>빈칸 연습</b><span class="dr-sub">시험처럼 직접 채워보기 · 빈칸 후보 ${A.cands.length}줄${A.funcs.length ? ` · 메소드 ${A.funcs.length}개` : ''}</span></summary><div class="dr-body"></div>`;
    fig.after(det);
    let built = false;
    det.addEventListener('toggle', () => { if (det.open && !built) { built = true; build(det.querySelector('.dr-body'), A, lang, code); } });
  }

  function build(body, A, lang, code) {
    const py = lang === 'py';
    let seed = hash(code), mode = 'blank', fnIdx = 0;
    body.innerHTML = `<div class="dr-tabs" role="tablist"><button type="button" data-m="blank" class="on">빈칸 채우기</button>${A.funcs.length ? '<button type="button" data-m="method">메소드 통째로</button>' : ''}${A.allFuncs.length > 1 ? '<button type="button" data-m="all">모든 메소드 한번에</button>' : ''}</div><div class="dr-pane"></div>`;
    const pane = body.querySelector('.dr-pane');
    body.querySelector('.dr-tabs').onclick = e => { const b = e.target.closest('button'); if (!b) return; mode = b.dataset.m; body.querySelectorAll('.dr-tabs button').forEach(x => x.classList.toggle('on', x === b)); render(); };

    function render() { mode === 'blank' ? renderBlank() : mode === 'all' ? renderAll() : renderMethod(); }

    function renderBlank() {
      const chosen = pick(A.cands, seed);
      const byLine = new Map(A.cands.filter(c => chosen.has(c.i)).map(c => [c.i, c]));
      let n = 0;
      const rows = A.lines.map((l, i) => {
        const c = byLine.get(i);
        if (!c) return `<div class="dl">${esc(l) || ' '}</div>`;
        n++;
        const w = Math.max(6, Math.ceil((c.ans.length + 2) / 4) * 4);
        return `<div class="dl hit">${esc(c.pre)}<span class="bx"><span class="bn">${n}</span><input class="bi" style="width:${w}ch" data-a="${esc(c.ans)}" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="빈칸 ${n}"></span>${esc(c.post)}</div>`;
      }).join('');
      pane.innerHTML = `<p class="dr-tip">${py ? '조건식·대입식·return 값' : '조건식·대입식·return 값'}이 빈칸입니다. 칸을 채우고 <b>채점</b>을 누르세요. 띄어쓰기와 따옴표 종류는 신경 쓰지 않아도 됩니다.</p>
        <div class="dr-bar"><button type="button" class="dbtn pri" data-act="check">채점</button><button type="button" class="dbtn" data-act="show">정답 보기</button><button type="button" class="dbtn" data-act="new">↻ 다른 빈칸</button><span class="dr-score" aria-live="polite"></span></div>
        <pre class="dr-code">${rows}</pre>`;
      const inputs = [...pane.querySelectorAll('.bi')];
      inputs.forEach((inp, k) => inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); (inputs[k + 1] || pane.querySelector('[data-act=check]')).focus(); } }));
      pane.querySelector('.dr-bar').onclick = e => {
        const act = (e.target.closest('[data-act]') || {}).dataset?.act; if (!act) return;
        if (act === 'new') { seed = (seed * 31 + 7) >>> 0; renderBlank(); return; }
        let ok = 0;
        inputs.forEach(inp => {
          const box = inp.parentElement; box.querySelector('.ans')?.remove();
          if (act === 'show') { inp.value = inp.dataset.a; box.className = 'bx shown'; return; }
          const good = norm(inp.value) === norm(inp.dataset.a);
          box.className = 'bx ' + (good ? 'ok' : 'no'); if (good) ok++;
          if (!good) { const s = document.createElement('button'); s.type = 'button'; s.className = 'ans'; s.textContent = '정답'; s.title = '정답 보기'; s.onclick = () => { s.outerHTML = `<span class="ans-t">${esc(inp.dataset.a)}</span>`; }; box.appendChild(s); }
        });
        if (act === 'check') pane.querySelector('.dr-score').textContent = `${ok} / ${inputs.length} 정답` + (ok === inputs.length ? ' 🎉' : '');
        else pane.querySelector('.dr-score').textContent = '';
      };
    }


    function splitBody(f) {
      const answer = A.lines.slice(f.start, f.end);
      let keep = 0;
      if (py) { const t0 = (answer[0] || '').trim(); if (/^("""|''')/.test(t0)) { keep = 1; if (!(t0.length > 3 && /("""|''')$/.test(t0.slice(3)))) { while (keep < answer.length && !/("""|''')/.test(answer[keep])) keep++; keep++; } } }
      return { given: answer.slice(0, keep), hidden: answer.slice(keep), ind: ' '.repeat(f.ind + 4) };
    }
    function setupTA(ta, ind) {
      ta.addEventListener('keydown', e => {
        if (e.key === 'Tab') { e.preventDefault(); const s = ta.selectionStart; ta.setRangeText('    ', s, ta.selectionEnd, 'end'); }
        else if (e.key === 'Enter') { const s = ta.selectionStart; const lineStart = ta.value.lastIndexOf('\n', s - 1) + 1; const cur = ta.value.slice(lineStart, s); let pad = cur.match(/^\s*/)[0]; if (py && /:\s*$/.test(cur)) pad += '    '; if (!py && /\{\s*$/.test(cur)) pad += '    '; if (!ta.value.trim()) pad = ind; e.preventDefault(); ta.setRangeText('\n' + pad, s, ta.selectionEnd, 'end'); }
      });
      ta.addEventListener('focus', () => { if (!ta.value) ta.value = ind; });
    }
    function compare(hidden, text) {
      const clean = arr => arr.map(l => stripCmt(l, py)).filter(l => l.trim());
      const want = clean(hidden), got = clean(text.split('\n'));
      const W = want.map(norm), G = got.map(norm);
      const dp = Array.from({ length: W.length + 1 }, () => new Array(G.length + 1).fill(0));
      for (let a = W.length - 1; a >= 0; a--) for (let b = G.length - 1; b >= 0; b--) dp[a][b] = W[a] === G[b] ? dp[a + 1][b + 1] + 1 : Math.max(dp[a + 1][b], dp[a][b + 1]);
      const matched = new Set(); let a = 0, b = 0;
      while (a < W.length && b < G.length) { if (W[a] === G[b]) { matched.add(a); a++; b++; } else if (dp[a + 1][b] >= dp[a][b + 1]) a++; else b++; }
      const html = `<pre class="dr-code">${want.map((l, k) => `<div class="dl ${matched.has(k) ? 'm-ok' : 'm-no'}">${esc(l)}</div>`).join('')}</pre>`;
      return { want, matched, html };
    }
    const LEGEND = '<span class="lg"><span class="sw g"></span>맞게 쓴 줄 <span class="sw r"></span>빠졌거나 다른 줄</span>';
    const ctx = arr => arr.length ? `<pre class="dr-code ctx">${arr.map(l => `<div class="dl">${esc(l) || ' '}</div>`).join('')}</pre>` : '';

    function renderAll() {
      // outermost methods only (nested helpers are part of their parent's body)
      const fs = []; A.allFuncs.slice().sort((x, y) => x.start - y.start).forEach(f => { if (!fs.some(g => f.head >= g.start && f.head < g.end)) fs.push(f); });
      const parts = fs.map(f => ({ f, ...splitBody(f) }));
      let html = '', pos = 0, total = 0;
      parts.forEach((p, k) => {
        html += ctx(A.lines.slice(pos, p.f.start).concat(p.given));
        const n = p.hidden.filter(l => l.trim() && !/^\s*(#|\/\/)/.test(l)).length; total += n;
        html += `<div class="dr-m"><div class="dr-m-h"><b>${esc(p.f.name)}()</b> 본문 · ${n}줄 안팎<span class="dr-m-s"></span></div>
          <textarea class="dr-ta" data-k="${k}" spellcheck="false" autocomplete="off" autocapitalize="off" rows="${Math.min(14, Math.max(3, p.hidden.length + 1))}" placeholder="${esc(p.ind)}${esc(p.f.name)}() 본문"></textarea><div class="dr-cmp" hidden></div></div>`;
        pos = p.f.end;
      });
      html += ctx(A.lines.slice(pos));
      pane.innerHTML = `<p class="dr-tip"><b>메소드 ${parts.length}개의 본문을 한꺼번에 비웠습니다.</b> 클래스 전체를 처음부터 다시 짜는 연습이에요. 다 쓰고 <b>전체 채점</b>을 누르면 메소드별로 맞은 줄을 보여줍니다. 주석은 채점에서 빠집니다.</p>
        <div class="dr-bar"><button type="button" class="dbtn pri" data-act="cmp">전체 채점</button><button type="button" class="dbtn" data-act="reset">모두 지우기</button><span class="dr-score" aria-live="polite">총 ${total}줄</span></div>
        <div class="dr-all">${html}</div>
        <div class="dr-bar"><button type="button" class="dbtn pri" data-act="cmp">전체 채점</button><span class="dr-score2" aria-live="polite"></span></div>`;
      const tas = [...pane.querySelectorAll('.dr-ta')];
      tas.forEach(ta => setupTA(ta, parts[+ta.dataset.k].ind));
      pane.querySelectorAll('.dr-bar').forEach(bar => bar.onclick = e => {
        const act = (e.target.closest('[data-act]') || {}).dataset?.act; if (!act) return;
        if (act === 'reset') { tas.forEach(ta => { ta.value = ''; ta.nextElementSibling.hidden = true; ta.parentElement.querySelector('.dr-m-s').textContent = ''; ta.parentElement.className = 'dr-m'; }); pane.querySelector('.dr-score').textContent = `총 ${total}줄`; pane.querySelector('.dr-score2').textContent = ''; return; }
        let ok = 0, all = 0, perfect = 0;
        tas.forEach(ta => {
          const p = parts[+ta.dataset.k]; const r = compare(p.hidden, ta.value);
          ok += r.matched.size; all += r.want.length; if (r.matched.size === r.want.length) perfect++;
          const c = ta.nextElementSibling; c.hidden = false; c.innerHTML = `<div class="dr-cmp-h"><span>정답</span>${LEGEND}</div>${r.html}`;
          ta.parentElement.querySelector('.dr-m-s').textContent = ` · ${r.matched.size}/${r.want.length}`;
          ta.parentElement.className = 'dr-m ' + (r.matched.size === r.want.length ? 'ok' : 'no');
        });
        const pct = all ? Math.round(ok / all * 100) : 0;
        const msg = `${ok} / ${all}줄 일치 (${pct}%) · 완벽한 메소드 ${perfect}/${parts.length}` + (pct === 100 ? ' 🎉' : '');
        pane.querySelector('.dr-score').textContent = msg; pane.querySelector('.dr-score2').textContent = msg;
      });
    }

    function renderMethod() {
      const f = A.funcs[fnIdx];
      const ind = ' '.repeat(f.ind + 4);
      const before = A.lines.slice(0, f.start), after = A.lines.slice(f.end);
      const answer = A.lines.slice(f.start, f.end);
      // keep the docstring as the method's spec (exam style)
      let keep = 0;
      if (py) { const t0 = (answer[0] || '').trim(); if (/^("""|''')/.test(t0)) { keep = 1; if (!(t0.length > 3 && /("""|''')$/.test(t0.slice(3)))) { while (keep < answer.length && !/("""|''')/.test(answer[keep])) keep++; keep++; } } }
      const given = answer.slice(0, keep), hidden = answer.slice(keep);
      const realLines = hidden.filter(l => l.trim() && !/^\s*(#|\/\/)/.test(l)).length;
      const opts = A.funcs.map((x, k) => `<option value="${k}"${k === fnIdx ? ' selected' : ''}>${esc(x.name)}()</option>`).join('');
      pane.innerHTML = `<p class="dr-tip">교수님 출제 방식처럼 <b>메소드 하나를 통째로 비웠습니다.</b> 시그니처${py ? '와 docstring' : ''}만 보고 본문(${realLines}줄 안팎)을 써 보세요. 주석은 채점에서 빠집니다.</p>
        <div class="dr-bar"><label class="dr-sel">메소드 <select>${opts}</select></label><button type="button" class="dbtn pri" data-act="cmp">정답과 비교</button><button type="button" class="dbtn" data-act="reset">지우기</button><span class="dr-score" aria-live="polite"></span></div>
        <pre class="dr-code ctx">${before.map(l => `<div class="dl">${esc(l) || ' '}</div>`).join('')}${given.map(l => `<div class="dl">${esc(l) || ' '}</div>`).join('')}</pre>
        <textarea class="dr-ta" spellcheck="false" autocomplete="off" autocapitalize="off" rows="${Math.min(18, Math.max(4, hidden.length + 1))}" placeholder="${esc(ind)}여기에 본문을 작성하세요"></textarea>
        <div class="dr-cmp" hidden></div>
        <pre class="dr-code ctx">${after.map(l => `<div class="dl">${esc(l) || ' '}</div>`).join('')}</pre>`;
      const ta = pane.querySelector('.dr-ta');
      ta.value = '';
      ta.addEventListener('keydown', e => {
        if (e.key === 'Tab') { e.preventDefault(); const s = ta.selectionStart; ta.setRangeText('    ', s, ta.selectionEnd, 'end'); }
        else if (e.key === 'Enter') { const s = ta.selectionStart; const lineStart = ta.value.lastIndexOf('\n', s - 1) + 1; const cur = ta.value.slice(lineStart, s); let pad = cur.match(/^\s*/)[0]; if (py && /:\s*$/.test(cur)) pad += '    '; if (!py && /\{\s*$/.test(cur)) pad += '    '; if (!ta.value.trim()) pad = ind; e.preventDefault(); ta.setRangeText('\n' + pad, s, ta.selectionEnd, 'end'); }
      });
      ta.addEventListener('focus', () => { if (!ta.value) ta.value = ind; });
      pane.querySelector('select').onchange = e => { fnIdx = +e.target.value; renderMethod(); };
      pane.querySelector('.dr-bar').onclick = e => {
        const act = (e.target.closest('[data-act]') || {}).dataset?.act; if (!act) return;
        const cmp = pane.querySelector('.dr-cmp');
        if (act === 'reset') { ta.value = ''; cmp.hidden = true; pane.querySelector('.dr-score').textContent = ''; return; }
        const clean = arr => arr.map(l => stripCmt(l, py)).filter(l => l.trim());
        const want = clean(hidden), got = clean(ta.value.split('\n'));
        const W = want.map(norm), G = got.map(norm);
        // LCS to align lines
        const dp = Array.from({ length: W.length + 1 }, () => new Array(G.length + 1).fill(0));
        for (let a = W.length - 1; a >= 0; a--) for (let b = G.length - 1; b >= 0; b--) dp[a][b] = W[a] === G[b] ? dp[a + 1][b + 1] + 1 : Math.max(dp[a + 1][b], dp[a][b + 1]);
        const matched = new Set(); let a = 0, b = 0;
        while (a < W.length && b < G.length) { if (W[a] === G[b]) { matched.add(a); a++; b++; } else if (dp[a + 1][b] >= dp[a][b + 1]) a++; else b++; }
        cmp.hidden = false;
        cmp.innerHTML = `<div class="dr-cmp-h"><span>정답 코드</span><span class="lg"><span class="sw g"></span>맞게 쓴 줄 <span class="sw r"></span>빠졌거나 다른 줄</span></div><pre class="dr-code">${want.map((l, k) => `<div class="dl ${matched.has(k) ? 'm-ok' : 'm-no'}">${esc(l)}</div>`).join('')}</pre>`;
        const pct = want.length ? Math.round(matched.size / want.length * 100) : 0;
        pane.querySelector('.dr-score').textContent = `${matched.size} / ${want.length}줄 일치 (${pct}%)` + (pct === 100 ? ' 🎉' : '');
      };
    }
    render();
  }

  function mountAll(root) {
    (root || document).querySelectorAll('figure.code').forEach(f => { try { mount(f); } catch (e) { /* skip block */ } });
  }
  return { mountAll, _analyse: analyse };
})();

</script>

const home=$('#home'), chap=$('#chap'), toc=$('#toc');

let bookP=null;
function loadBook(){ if(!bookP) bookP=fetch('book.json').then(r=>{if(!r.ok) throw new Error(r.status); return r.json()}).then(j=>{BOOK=j; return j}); return bookP; }

let SECMAP=null;

$('#menu').onclick=()=>setDrawer(true); $('#closeRail').onclick=()=>setDrawer(false); $('#scrim').onclick=()=>setDrawer(false);

function markToc(){
  toc.querySelectorAll('.ch').forEach(b=>{ const on=+b.dataset.i===cur; b.classList.toggle('on',on); b.setAttribute('aria-current',on?'page':'false'); });
  toc.querySelectorAll('.subtoc').forEach(u=>u.remove());
  if(cur<0||!BOOK) return;
  const c=BOOK.chapters[cur]; const subs=c.sections.filter(s=>s.depth===1||s.depth===2);

function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function showHome(push){
  cur=-1; chap.hidden=true; home.hidden=false; markToc(); renderResume();
  if(push) setHash('home'); window.scrollTo({top:0}); document.title='자료구조와 알고리즘 요약';
}
function setHash(h){ try{ history.replaceState(null,'','#'+h); }catch(e){} }

async function openChapter(i, secId, push=true){
  setDrawer(false);
  home.hidden=true; chap.hidden=false;
  if(!BOOK){ chap.innerHTML='<div class="sheet"><div class="sheet-in loading">불러오는 중…</div></div>'; try{ await loadBook(); }catch(e){ chap.innerHTML='<div class="sheet"><div class="sheet-in loading">본문을 불러오지 못했습니다. 페이지를 새로고침해 주세요.</div></div>'; return; } }
  if(i!==cur){
    cur=i; const c=BOOK.chapters[i];
    const prev=BOOK.chapters[i-1], next=BOOK.chapters[i+1];
    chap.innerHTML=`<article class="chap">
        <header class="ch-head blk"><h1>${esc(c.title)}</h1></header>
        <div class="pgtop blk" id="pgtop"></div>
        ${c.html}
      </article>
      <div class="blk"><div class="pager" id="pgnav"></div></div>`;
    document.title=c.title.replace(/^\d+\.\s*/,'')+' · 요약';
    markToc(); enhance(chap); buildPages();
  }
  const k=secId==='__last'?PAGES.length-1:pageFor(secId);
  showPage(k, secId&&secId!=='__last'&&PAGES[k]&&secId!==PAGES[k].id?secId:null, push);
}

/* ---- paging: one section per page ---- */
let PAGES=[], PG=0;
function buildPages(){
  PAGES=[];
  const c=BOOK.chapters[cur];
  const root=chap.querySelector('section.sec.d0');
  const own=root?[...root.children].find(e=>e.classList.contains('sb')):null;
  const ttl=el=>{ const h=[...el.children].find(x=>x.matches('header.sec-h')); return h?(h.querySelector('.st')||h).textContent.trim():''; };
  if(own||!chap.querySelector('section.sec.d1')) PAGES.push({id:c.id, el:null, kind:'intro', title:'들어가며'});
  chap.querySelectorAll('section.sec.d1').forEach(d1=>{
    const sb=[...d1.children].find(e=>e.classList.contains('sb'));
    const body=sb&&(sb.textContent.trim().length>=40||sb.querySelector('figure,table,[data-viz],.mx-d,aside,ul,ol'));
    const kids=[...d1.children].filter(e=>e.matches('section.sec.d2'));
    if(body||!kids.length) PAGES.push({id:d1.id, el:d1, kind:'d1', title:ttl(d1)});
    kids.forEach(d2=>PAGES.push({id:d2.id, el:d2, kind:'d2', parent:d1, title:ttl(d2), ptitle:ttl(d1)}));
  });
  if(!PAGES.length) PAGES.push({id:c.id, el:null, kind:'intro', title:'들어가며'});
}
function pageFor(id){
  if(!id) return 0;
  let k=PAGES.findIndex(p=>p.id===id); if(k>=0) return k;
  const el=document.getElementById(id); if(!el) return 0;
  k=PAGES.findIndex(p=>p.el&&p.el.contains(el)); if(k>=0) return k;
  k=PAGES.findIndex(p=>p.parent&&p.parent.id===id); return k>=0?k:0;
}
function showPage(k, scrollId, push=true){
  k=Math.max(0,Math.min(PAGES.length-1,k)); PG=k; const p=PAGES[k]; const c=BOOK.chapters[cur];
  chap.querySelectorAll('.pg-hide').forEach(e=>e.classList.remove('pg-hide'));
  chap.querySelectorAll('.pg-d2').forEach(e=>e.classList.remove('pg-d2'));
  const head=chap.querySelector('.ch-head'), top=$('#pgtop');
  const root=chap.querySelector('section.sec.d0');
  const own=root?[...root.children].find(e=>e.classList.contains('sb')):null;
  const d1s=[...chap.querySelectorAll('section.sec.d1')];
  if(p.kind==='intro'){ d1s.forEach(s=>s.classList.add('pg-hide')); }
  else{
    if(own) own.classList.add('pg-hide');
    const d1=p.kind==='d1'?p.el:p.parent;
    if(p.kind==='d2') d1.classList.add('pg-d2');
    d1s.forEach(s=>{ if(s!==d1) s.classList.add('pg-hide'); });
    [...d1.children].forEach(e=>{
      if(p.kind==='d1'){ if(e.matches('section.sec.d2')) e.classList.add('pg-hide'); }
      else if(e!==p.el) e.classList.add('pg-hide');
    });
  }
  const first=k===0;
  head.classList.toggle('pg-hide',!first);
  const num=c.title.match(/^(\d+)\./);
  top.innerHTML=`<button type="button" class="pg-crumb" data-pg="0">${esc(num?num[1]+'장':'')}${num?' · ':''}${esc(c.title.replace(/^\d+\.\s*/,''))}</button>${p.kind==='d2'?`<span class="pg-sep">›</span><span class="pg-par">${esc(p.ptitle)}</span>`:''}<span class="pg-cnt num">${k+1} / ${PAGES.length}</span>`;
  top.classList.toggle('pg-hide',first);
  top.querySelector('[data-pg]').onclick=()=>showPage(0);
  // nav
  const pv=PAGES[k-1], nx=PAGES[k+1];
  const pc=BOOK.chapters[cur-1], nc=BOOK.chapters[cur+1];
  const nav=$('#pgnav');
  nav.innerHTML=`<button type="button" class="prev" ${pv||pc?'':'disabled'}><small>${pv?'이전':'이전 장'}</small><b>${esc(pv?pv.title:(pc?pc.title:''))}</b></button>
    <button type="button" class="next" ${nx||nc?'':'disabled'}><small>${nx?`다음 · ${k+2}/${PAGES.length}`:'다음 장'}</small><b>${esc(nx?nx.title:(nc?nc.title:''))}</b></button>`;
  nav.querySelector('.prev').onclick=()=>pagePrev();
  nav.querySelector('.next').onclick=()=>pageNext();
  // toc highlight
  toc.querySelectorAll('.subtoc a').forEach(a=>a.classList.toggle('on',a.dataset.go===p.id||(p.kind==='d2'&&false)));
  const on=toc.querySelector('.subtoc a.on');
  if(on&&innerWidth>=1080){ const r=$('#rail'); const ar=on.getBoundingClientRect(), rr=r.getBoundingClientRect(); if(ar.top<rr.top+60||ar.bottom>rr.bottom-20) r.scrollTop+=ar.top-rr.top-rr.height/3; }
  const target=scrollId?document.getElementById(scrollId):null;
  if(target) requestAnimationFrame(()=>target.scrollIntoView({block:'start'})); else window.scrollTo({top:0});
  if(push) setHash(p.id);
  store.set('ds-sum-last',{i:cur,sec:p.id,t:c.title});
}
function pageNext(){ if(PG<PAGES.length-1) showPage(PG+1); else if(BOOK.chapters[cur+1]) openChapter(cur+1); }
function pagePrev(){ if(PG>0) showPage(PG-1); else if(BOOK.chapters[cur-1]) openChapter(cur-1,'__last'); }
addEventListener('keydown',e=>{
  if(chap.hidden||!$('#dlg').hidden||e.altKey||e.ctrlKey||e.metaKey) return;
  if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  if(e.key==='ArrowRight'){ e.preventDefault(); pageNext(); } else if(e.key==='ArrowLeft'){ e.preventDefault(); pagePrev(); }
});

/* code language on/off (off = folded) */
const LANGS=Object.assign({py:false,cpp:true},store.get('ds-langs')||{});
function paintLangs(){ document.querySelectorAll('#langs [data-lang]').forEach(b=>{ const on=!!LANGS[b.dataset.lang]; b.classList.toggle('on',on); b.setAttribute('aria-pressed',on); }); }
function setLang(l,on){ LANGS[l]=on; store.set('ds-langs',LANGS); paintLangs(); document.querySelectorAll(`details.pyfold[data-lang="${l}"]`).forEach(d=>d.open=on); toast(`${l==='py'?'Python':'C++'} 코드 ${on?'펼침':'접음'}`); }
$('#langs').onclick=e=>{ const b=e.target.closest('[data-lang]'); if(b) setLang(b.dataset.lang,!LANGS[b.dataset.lang]); }; paintLangs();
function enhance(root){
  if(window.hljs){ root.querySelectorAll('pre code').forEach(el=>{ if(!el.classList.contains('language-plaintext')) try{hljs.highlightElement(el)}catch(e){} }); }
  root.querySelectorAll('.cp').forEach(b=>b.onclick=async()=>{
    const code=b.closest('figure').querySelector('code').innerText;
    try{ await navigator.clipboard.writeText(code); toast('코드를 복사했습니다'); }
    catch(e){ const r=document.createRange(); r.selectNodeContents(b.closest('figure').querySelector('code')); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast('선택했습니다. Ctrl+C로 복사하세요'); }
  });
  typeset(root);
  root.querySelectorAll('figure.code').forEach(fig=>{
    const c=fig.querySelector('code'); if(!c||fig.closest('details.pyfold')) return;
    const lang=/language-python/.test(c.className)?'py':/language-(cpp|c)\b/.test(c.className)?'cpp':null; if(!lang) return;
    const n=c.textContent.replace(/\s+$/,'').split('\n').length;
    const d=document.createElement('details'); d.className='pyfold'; d.dataset.lang=lang;
    d.innerHTML=`<summary><span class="pf-tag">${lang==='py'?'Python':'C++'}</span>${fig.classList.contains('extra')?'<span class="pf-x">추가 구현</span>':''}<span class="pf-n">${n}줄</span></summary>`;
    fig.before(d); d.appendChild(fig); d.open=!!LANGS[lang];
  });
  if(typeof DSViz!=='undefined') DSViz.mountAll(root);
  if(typeof Drill!=='undefined') Drill.mountAll(root);
}
function typeset(root){
  const els=[...root.querySelectorAll('[data-tex]:not(.ok)')]; if(!els.length) return;
  const run=()=>{ for(const el of els){ try{ const svg=MathJax.tex2svg(el.dataset.tex,{display:el.classList.contains('mx-d')}); el.replaceChildren(svg); el.classList.add('ok'); }catch(e){} } };
  if(window.MathJax&&MathJax.tex2svg) run();
  else { const t=setInterval(()=>{ if(window.MathJax&&MathJax.startup&&MathJax.startup.promise&&MathJax.tex2svg){ clearInterval(t); MathJax.startup.promise.then(run); } },200); setTimeout(()=>clearInterval(t),20000); }
}

function setupSpy(){
  if(spy) spy.disconnect();
  const links=new Map([...toc.querySelectorAll('.subtoc a')].map(a=>[a.dataset.go,a]));
  const secs=[...chap.querySelectorAll('section.sec.d1, section.sec.d2')];
  let last=null;
  spy=new IntersectionObserver(es=>{
    es.forEach(e=>{ if(e.isIntersecting){ const a=links.get(e.target.id); if(a&&a!==last){ last&&last.classList.remove('on'); a.classList.add('on'); last=a; if(innerWidth>=1080){ const r=$('#rail'); const ar=a.getBoundingClientRect(), rr=r.getBoundingClientRect(); if(ar.top<rr.top+60||ar.bottom>rr.bottom-20) r.scrollTop+=ar.top-rr.top-rr.height/3; } try{ const l=store.get('ds-sum-last'); if(l&&l.i===cur){ l.sec=e.target.id; store.set('ds-sum-last',l);} }catch(_){} } } });
  },{rootMargin:'-70px 0px -70% 0px'});
  secs.forEach(s=>spy.observe(s));
}

/* clicks: toc, cards, page mentions */
document.addEventListener('click',e=>{
  const ch=e.target.closest('[data-chi]'); if(ch){ e.preventDefault(); openChapter(+ch.dataset.chi); return; }
  const g=e.target.closest('[data-go]');
  if(g){ e.preventDefault(); go(g.dataset.go); return; }
  if(e.target.closest('[data-home]')){ e.preventDefault(); showHome(true); setDrawer(false); }
});
async function go(id){
  if(!BOOK) await loadBook(); if(!SECMAP) SECMAP=secIndex();
  const ci=SECMAP[id]; if(ci===undefined) return;
  if(ci===cur){ setDrawer(false); const k=pageFor(id); showPage(k, PAGES[k]&&id!==PAGES[k].id?id:null); }
  else openChapter(ci,id);
}

/* resume */
function renderResume(){
  const el=$('#resume'); if(!el) return; const l=store.get('ds-sum-last');
  if(l&&typeof l.i==='number'&&META.titles[l.i]){ el.hidden=false; el.querySelector('.v').textContent=META.titles[l.i]; el.onclick=()=>openChapter(l.i,l.sec); }
  else el.hidden=true;
}

/* progress + top button */
addEventListener('scroll',()=>{ const h=document.documentElement; const left=h.scrollHeight-h.clientHeight-h.scrollTop; $('#totop').hidden=h.scrollTop<900||left<240; },{passive:true});
/* mobile: shortcut links inside drawer, swipe to turn pages */
(()=>{ const box=$('#railLinks'); if(box) document.querySelectorAll('.topbar .extlink').forEach(a=>{ const c=a.cloneNode(true); c.className=''; c.textContent=c.textContent.replace(/\s*↗$/,''); box.appendChild(c); });
  let sx=0, sy=0, st=0, ok=false;
  const skip=el=>el.closest('pre,table,.mx-d,[data-viz],input,textarea,button,details.drill,.tbl,.scroll-x,svg,canvas');
  chap.addEventListener('touchstart',e=>{ if(e.touches.length!==1||skip(e.target)){ ok=false; return; } ok=true; sx=e.touches[0].clientX; sy=e.touches[0].clientY; st=Date.now(); },{passive:true});
  chap.addEventListener('touchend',e=>{ if(!ok||!PAGES.length||chap.hidden) return; ok=false; const t=e.changedTouches[0]; const dx=t.clientX-sx, dy=t.clientY-sy;
    if(Date.now()-st<600 && Math.abs(dx)>80 && Math.abs(dx)>Math.abs(dy)*2.2){ if(getSelection&&String(getSelection()).length) return; dx<0?pageNext():pagePrev(); } },{passive:true});
})();
$('#totop').onclick=()=>window.scrollTo({top:0});

/* search */
const dlg=$('#dlg'), q=$('#q'), res=$('#res'); let hits=[], sel=0, docs=null;
function openSearch(){ dlg.hidden=false; q.focus(); q.select(); loadBook().then(()=>{ if(!docs) docs=BOOK.chapters.flatMap(c=>c.sections.map(s=>({c:c.i,ct:c.title,id:s.id,t:s.title,p:s.path,x:s.text,lt:s.title.toLowerCase(),lx:s.text.toLowerCase()}))); if(q.value) search(); }); }
function closeSearch(){ dlg.hidden=true; }
$('#openSearch').onclick=openSearch; $('#closeSearch').onclick=closeSearch;
dlg.addEventListener('click',e=>{ if(e.target===dlg) closeSearch(); });
addEventListener('keydown',e=>{
  if(e.key==='/'&&dlg.hidden&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){ e.preventDefault(); openSearch(); }
  else if(e.key==='Escape'){ if(!dlg.hidden) closeSearch(); else setDrawer(false); }
});
q.addEventListener('input',()=>search());
q.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){e.preventDefault(); sel=Math.min(hits.length-1,sel+1); paintSel();}
  else if(e.key==='ArrowUp'){e.preventDefault(); sel=Math.max(0,sel-1); paintSel();}
  else if(e.key==='Enter'&&hits[sel]){ pick(hits[sel]); }
});
function paintSel(){ res.querySelectorAll('.hit').forEach((h,i)=>h.classList.toggle('sel',i===sel)); const s=res.querySelector('.hit.sel'); s&&s.scrollIntoView({block:'nearest'}); }
function mark(s,terms){ let h=esc(s); terms.forEach(t=>{ if(!t) return; const re=new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'); h=h.replace(re,m=>`<mark>${m}</mark>`); }); return h; }
function search(){
  if(!docs) return; const v=q.value.trim().toLowerCase(); sel=0;
  if(!v){ res.innerHTML='<div class="hint">요약 238개 항목에서 제목과 본문, 코드까지 찾습니다.</div>'; hits=[]; return; }
  const terms=v.split(/\s+/).filter(Boolean);
  hits=[];
  for(const d of docs){ let sc=0, ok=true; for(const t of terms){ const inT=d.lt.includes(t), inX=d.lx.includes(t); if(!inT&&!inX){ok=false;break;} sc+=inT?10:1; } if(ok){ if(d.lt===v) sc+=20; hits.push([sc,d]); } }
  hits.sort((a,b)=>b[0]-a[0]); const total=hits.length; hits=hits.slice(0,60).map(h=>h[1]);
  if(!hits.length){ res.innerHTML=`<div class="hint">“${esc(q.value)}”와 맞는 절이 없습니다. 다른 낱말로 찾아보세요.</div>`; return; }
  res.innerHTML=`<div class="count">${total}개 절${total>60?' · 상위 60개':''}</div>`+hits.map((d,i)=>{
    const t0=terms[0]; const k=d.lx.indexOf(t0); let snip='';
    if(k>=0){ const a=Math.max(0,k-40); snip=(a>0?'…':'')+d.x.slice(a,a+150); } else snip=d.x.slice(0,150);
    const path=[d.ct.replace(/^(\d+)\.\s*/,'$1장 · ')].concat(d.p||[]).join(' › ');
    return `<button type="button" class="hit${i===0?' sel':''}" data-k="${i}"><div class="hp">${esc(path)}</div><div class="ht">${mark(d.t,terms)}</div>${snip?`<div class="hs">${mark(snip,terms)}</div>`:''}</button>`;
  }).join('');
  res.querySelectorAll('.hit').forEach(b=>b.onclick=()=>pick(hits[+b.dataset.k]));
}
function pick(d){ closeSearch(); openChapter(d.c,d.id); }

/* boot */
renderResume();
(async()=>{
  const h=(location.hash||'').slice(1);
  if(h&&h!=='home'){
    await loadBook(); SECMAP=secIndex();
    if(SECMAP[h]!==undefined) openChapter(SECMAP[h],h,false);
  } else { loadBook().catch(()=>{}); }
})();
</script>
